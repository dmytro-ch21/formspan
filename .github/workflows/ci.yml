name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered by base branch. It used to be `branches: [main]`,
  # which silently gave **stacked PRs no CI at all** — a PR based on another
  # feature branch matched nothing and ran zero checks, while still showing a
  # clean "no checks failed" state that reads exactly like passing.
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    # timeout-minutes on every job: GitHub's default is SIX HOURS, so anything
    # that hangs rather than fails burns a runner for an afternoon before
    # anybody sees it. Measured on a recent green run, the slowest job here is
    # ~1.8 min, so 15 is roughly eight times the worst and twenty-four times
    # under the default. This bounds the JOB; F12's `-timeout 3m` bounds a Go
    # package and jest's `testTimeout` bounds a mobile test — three different
    # granularities, and only the outermost one catches a hang in setup,
    # install or a runner that wedges. Measured: a 25s block at MODULE scope in
    # a jest file runs to completion and the test reports PASS — `testTimeout`
    # never sees it, because no test is running yet. That class is invisible
    # until something bounds the job.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vola
          POSTGRES_PASSWORD: vola_test
          POSTGRES_DB: vola_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vola"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vola:vola_test@localhost:5432/vola_test?sslmode=disable
      TEST_DATABASE_URL: postgres://vola:vola_test@localhost:5432/vola_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Run migrations
        run: go run ./cmd/migrate up

      - name: Test
        # -p 1: packages share ONE database, and several tests assert global
        # counts (SELECT count(*) FROM techniques). Run in parallel, another
        # package's fixtures are inside those counts. Latent on main and
        # reproducible the moment a second package seeds library rows —
        # measured 3 failures in 6 concurrent runs, 0 with -p 1.
        #
        # -timeout 3m: Go's default is 10 MINUTES per package, and a test that
        # hangs rather than fails burns all of it. Measured, not hypothetical —
        # F11 deleted a deferred `tx.Rollback` and the leaked connection kept
        # `pgxpool.Close` waiting forever, so the package could not exit even
        # after its assertions had already named the cause. Slowest package here
        # is ~2s locally and ~45s under the parallel-session contention
        # CLAUDE.md documents, so 3m is roughly four times the worst seen and
        # still bounds a hang at a third of the default.
        run: go test -p 1 -timeout 3m ./...

      - name: Build Docker image
        run: docker build -f Dockerfile -t vola-api:ci .

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint OpenAPI spec
        run: pnpm run lint:openapi

      - name: Lint
        run: pnpm run lint:web

      - name: Typecheck
        run: pnpm run typecheck:web

      - name: Test
        run: pnpm run test:web

      - name: Build
        run: pnpm run build:web

  admin:
    name: Admin (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:admin

      - name: Typecheck
        run: pnpm run typecheck:admin

      - name: Test
        run: pnpm run test:admin

      # apps/web and apps/admin hold deliberate copies of the brand components.
      # A comment saying "change both" held for exactly one commit, so the
      # invariant is enforced here instead. Lives in the admin job because that
      # is where the second copy was introduced; it compares both files.
      - name: Brand copies have not drifted
        run: pnpm run check:brand-copies

      - name: Build
        run: pnpm run build:admin

  scripts:
    name: Scripts (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `fetch-depth: 0`, and it has to be. `check-tasks-integrity.py` compares
      # against the MERGE BASE with `origin/main`, and a merge base needs shared
      # history: a shallow checkout plus a `--depth=1` fetch of main gives two
      # commits with no common ancestor, so `git merge-base` finds nothing.
      #
      # That was tried and CI caught it — the first version fetched main at
      # depth 1 and the step failed with "cannot read docs/TASKS.md at the merge
      # base". Which is the designed behaviour working: the script FAILS rather
      # than skips when the baseline is unreachable, so a misconfigured fetch
      # turns the build red instead of quietly disarming the check. Weakening
      # either half — this depth, or that refusal — puts it back.
      #
      # Full history for one file is the price. This is the cheapest job in the
      # matrix (no toolchain, no install), so it is the right one to pay it in.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No actions/setup-python on purpose. The check is stdlib-only and
      # version-agnostic, the runner image ships python3 already, and every
      # extra action is one more thing to download before any of this repo's
      # code runs — the failure mode that took out three jobs on 2026-08-06
      # ("Failed to resolve action download info").
      - name: Python version
        run: python3 --version

      # docs/TASKS.md is the one load-bearing file every other check is blind
      # to — it is prose to lint, typecheck and every test suite. A task
      # silently reverting from [x] to [ ], a duplicated id, or a dropped line
      # all pass everything else and merge. All three nearly landed in one
      # evening on 2026-08-19, on branches that were green: two from rebase
      # resolutions taking a side wholesale, and one from a CLEAN AUTO-MERGE
      # that produced no conflict to notice.
      - name: Task list integrity
        run: python3 scripts/check-tasks-integrity.py

      # The grip vocabulary is duplicated in Go, mobile and web because there
      # is no shared package to put it in. This is what makes that survivable:
      # drift fails here rather than reaching an athlete as a 400 they cannot
      # explain, or as a grip the picker silently refuses to offer.
      - name: Grip vocabulary parity
        run: python3 scripts/check-grip-parity.py

      # The evidence-based rate bands are duplicated between anthropometry.ts,
      # which judges an observed rate, and nutrition/target.go, which derives a
      # calorie target from the same band. Neither can be deleted: the mobile
      # copy has to work with no signal, the Go copy has to aggregate training
      # the phone does not hold. Drift is worse than the grip case because both
      # halves stay plausible — the app would report "on target" against a
      # number the target itself never used.
      - name: Rate band parity
        run: python3 scripts/check-rate-parity.py

      # The dictation eval corpus (N33/N34) is hand-authored, and a hand-authored
      # expectation is exactly as capable of being wrong as the model it grades.
      # An expected tag naming a technique id that does not exist — or writing a
      # category the technique does not derive — scores a CORRECT model as wrong,
      # permanently, and nothing else in the repo would notice.
      - name: Dictation eval corpus
        run: python3 scripts/check-dictation-evals.py

      # Until this job existed, NOTHING in this repo read a .py file: no CI
      # step, no `verify` link, no pyproject/ruff config anywhere. The content
      # pipeline is Python, and the script that imports the whole catalog is
      # run rarely and at exactly the moment being wrong is expensive.
      - name: Syntax
        run: python3 scripts/check-python-syntax.py

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:mobile

      - name: Typecheck
        run: pnpm run typecheck:mobile

      - name: Test
        run: pnpm run test:mobile
