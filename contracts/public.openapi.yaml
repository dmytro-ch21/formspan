openapi: 3.0.3
info:
  title: VOLA Public API
  version: "1.0.0"
  description: >
    Public API for the VOLA mobile and web clients. See
    docs/architecture/api-conventions.md for the conventions this spec
    follows (versioning, error shape, auth, status codes).
servers:
  - url: http://localhost:8080/v1
    description: Local development

security:
  - ClerkBearerAuth: []

components:
  securitySchemes:
    ClerkBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk-issued session token, verified server-side via Clerk's JWKS.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_input
                - unauthorized
                - forbidden
                - not_found
                - already_exists
                - internal
            message:
              type: string

    Healthz:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: api

    Me:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          example: user_3H8rAWz7wri5uEKGajnj4pLqWXz

    Sex:
      type: string
      nullable: true
      enum: [male, female]

    Profile:
      type: object
      required:
        - user_id
        - display_name
        - date_of_birth
        - sex
        - bjj_enabled
        - strength_enabled
        - nutrition_enabled
        - running_enabled
        - created_at
        - updated_at
      properties:
        user_id:
          type: string
        display_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex:
          $ref: "#/components/schemas/Sex"
        bjj_enabled:
          type: boolean
        strength_enabled:
          type: boolean
        nutrition_enabled:
          type: boolean
        running_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProfileCreate:
      type: object
      properties:
        display_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex:
          $ref: "#/components/schemas/Sex"

    ProfileUpdate:
      type: object
      description: Partial update — omitted fields are left unchanged.
      properties:
        display_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex:
          $ref: "#/components/schemas/Sex"
        bjj_enabled:
          type: boolean
        strength_enabled:
          type: boolean
        nutrition_enabled:
          type: boolean
        running_enabled:
          type: boolean

    Flag:
      type: object
      description: >
        A server-controlled, global on/off switch — distinct from
        profile's per-user module toggles. Read-only for now; toggled
        via direct SQL until there's a write endpoint.
      required: [key, enabled, description, updated_at]
      properties:
        key:
          type: string
          example: new_recommendation_engine
        enabled:
          type: boolean
        description:
          type: string
        updated_at:
          type: string
          format: date-time

    FlagList:
      type: object
      required: [flags]
      properties:
        flags:
          type: array
          items:
            $ref: "#/components/schemas/Flag"

    Media:
      type: object
      description: >
        One asset belonging to a catalog entry. `storage_key` is the path
        within the bucket; `url` is assembled from it at read time using the
        API's MEDIA_BASE_URL, so the bucket and CDN hostname are never stored
        per row. `url` is empty when no media origin is configured (local dev
        and CI) — clients should treat an empty url as "no image available"
        rather than attempting to load it.
      required: [kind, storage_key, url, content_type, width, height, position]
      properties:
        kind:
          type: string
          enum: [thumbnail, demo, start, end, demo_video]
        storage_key:
          type: string
          example: exercises/barbell-back-squat/start.webp
        url:
          type: string
          example: https://media.vola.app/exercises/barbell-back-squat/start.webp
        content_type:
          type: string
          example: image/webp
        width:
          type: integer
          nullable: true
          description: Intrinsic width, so a client can reserve layout space before load.
        height:
          type: integer
          nullable: true
        position:
          type: integer

    Exercise:
      type: object
      description: >
        One entry in the global exercise catalog. Operator-authored
        reference content shared by every user — there is no owner, so
        nothing here is user-scoped. Seeded from version-controlled JSON
        rather than written through the API.
      required:
        [id, name, sport, movement_pattern, primary_muscles,
         secondary_muscles, equipment, load_type, is_unilateral,
         instructions, media, created_at, updated_at]
      properties:
        id:
          type: string
          description: Stable slug, safe to store as a reference.
          example: barbell-back-squat
        name:
          type: string
          example: Barbell Back Squat
        sport:
          type: string
          example: strength
        movement_pattern:
          type: string
          description: >
            What the movement is structurally. This is the level the
            cross-sport rules reason at — "heavy hinge and squat work
            yesterday" is what makes hard sparring today worth flagging.
            Muscle lists alone are too granular to write rules against.
          example: squat
        primary_muscles:
          type: array
          items: { type: string }
          example: [quadriceps, glutes]
        secondary_muscles:
          type: array
          items: { type: string }
        equipment:
          type: array
          items: { type: string }
          example: [barbell, squat_rack]
        load_type:
          type: string
          enum: [weight_reps, reps, time, distance, distance_time]
          description: >
            Which measurements a session of this exercise records, and
            therefore which inputs a client should render. Carried as data
            so logging stays one screen instead of a form per exercise
            type, and so adding an exercise never needs an app release.
        is_unilateral:
          type: boolean
          description: >
            Affects volume maths — 8 reps per side is not 8 reps.
        instructions:
          type: string
        media:
          type: array
          description: >
            Ordered semantically (thumbnail, demo, start, end, demo_video) rather
            than alphabetically, so a start/end pair reads in movement order.
            Always an array, never null.
          items:
            $ref: "#/components/schemas/Media"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ExerciseList:
      type: object
      required: [exercises]
      properties:
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"

    Activity:
      type: object
      description: >
        One entry in the unified activity envelope — id is client-generated
        (offline logging + idempotent sync), request_id/trace_id are
        stamped server-side from the request that created it, for
        correlating against the backend's structured logs.
      required:
        - id
        - user_id
        - kind
        - occurred_at
        - notes
        - request_id
        - trace_id
        - created_at
      properties:
        id:
          type: string
          example: a1b2c3d4e5f6a7b8
        user_id:
          type: string
        kind:
          type: string
          example: bjj_session
        occurred_at:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
          description: Freeform, kind-specific fields.
        request_id:
          type: string
        trace_id:
          type: string
        created_at:
          type: string
          format: date-time

    ActivityCreate:
      type: object
      required: [id, kind, occurred_at]
      properties:
        id:
          type: string
          description: Client-generated — the idempotency key for offline sync retries.
        kind:
          type: string
          example: bjj_session
        occurred_at:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        details:
          type: object
          nullable: true

    ActivityList:
      type: object
      required: [activities]
      properties:
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"

    AdminUserSummary:
      type: object
      required: [user_id, display_name, activity_count, last_activity_at]
      properties:
        user_id:
          type: string
        display_name:
          type: string
          nullable: true
        activity_count:
          type: integer
        last_activity_at:
          type: string
          format: date-time
          nullable: true

    AdminUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserSummary"

  responses:
    BadRequest:
      description: Malformed request body or a value that failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, malformed, or expired bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but the caller isn't an admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource doesn't exist for this caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The resource already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /healthz:
    get:
      summary: Liveness check
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"

  /me:
    get:
      summary: Return the authenticated caller's verified identity
      operationId: getMe
      responses:
        "200":
          description: The verified caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /profile:
    get:
      summary: Get the authenticated caller's profile
      operationId: getProfile
      responses:
        "200":
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Create the authenticated caller's profile (onboarding)
      operationId: createProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileCreate"
      responses:
        "201":
          description: The newly created profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    patch:
      summary: Partially update the authenticated caller's profile
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /flags:
    get:
      summary: List all server-controlled feature flags
      operationId: listFeatureFlags
      responses:
        "200":
          description: All feature flags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /activities:
    get:
      summary: List the authenticated caller's own activities
      operationId: listActivities
      responses:
        "200":
          description: The caller's activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: >
        Create an activity for the authenticated caller. Idempotent on
        `id` — retrying a sync with the same id returns the original row,
        not an error.
      operationId: createActivity
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityCreate"
      responses:
        "200":
          description: The created (or, on a retried id, the original) activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exercises:
    get:
      summary: List the global exercise catalog
      operationId: listExercises
      parameters:
        - name: sport
          in: query
          required: false
          schema: { type: string }
          description: Exact-match filter, e.g. `strength` or `bjj`.
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match on the name.
      responses:
        "200":
          description: Matching catalog entries, ordered by sport then name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exercises/{exerciseID}:
    get:
      summary: Get one catalog entry by its slug
      operationId: getExercise
      parameters:
        - name: exerciseID
          in: path
          required: true
          schema: { type: string }
          example: barbell-back-squat
      responses:
        "200":
          description: The exercise.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users:
    get:
      summary: List every user who has completed onboarding (admin-only)
      operationId: adminListUsers
      responses:
        "200":
          description: Known users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{userID}/activities:
    get:
      summary: List a specific user's activities (admin-only)
      operationId: adminListUserActivities
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: That user's activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
