openapi: 3.0.3
info:
  title: VOLA Public API
  version: "1.0.0"
  description: >
    Public API for the VOLA mobile and web clients. See
    docs/architecture/api-conventions.md for the conventions this spec
    follows (versioning, error shape, auth, status codes).


    Two behaviours are applied by response middleware and so are not
    per-operation choices, even though OpenAPI can only express them
    per-operation. Every GET returns a strong `ETag` and honours
    `If-None-Match` with a `304` — both are documented on each GET below.
    Every such response also carries `Cache-Control: private, no-cache` —
    "revalidate before reuse", which is the contract the `ETag` describes.
    A route that opts out sends `Cache-Control: no-store` and no validator
    (`/healthz` does, so a liveness probe is never answered `304`).


    And any response over ~1 KB is gzipped when the client sends
    `Accept-Encoding: gzip`; the `ETag` is computed from the *uncompressed*
    body, so it does not change with the encoding a client asks for.
servers:
  - url: http://localhost:8080/v1
    description: Local development

security:
  - ClerkBearerAuth: []

components:
  securitySchemes:
    ClerkBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk-issued session token, verified server-side via Clerk's JWKS.

  schemas:
    NutritionMacros:
      type: object
      description: >
        What a quantity of food contains.


        **kcal is authoritative.** Clients must not re-derive it from the macros:
        real labels do not reconcile against 4/4/9 (rounding, fibre, sugar
        alcohols, and Atwater's own approximations put them 5-10% apart), so
        recomputing it discards the number the manufacturer measured.


        `fibre_g` is nullable and the four above it are not, because that
        difference is real: zero fat is a measurement, but a label that does not
        state fibre is not claiming there is none, and averaging unstated as zero
        drags every fibre figure down.


        **The five label macros added by N52 are all nullable, and null is the
        common case rather than an edge case.** Absence is a fact about what the
        source stated, never about the food — clients must render `n/a` and must
        never substitute `0`, which would be a claim nobody made. Two of them are
        null by nature of the sources: `added_sugar_g` is null for every
        USDA-seeded generic food (SR Legacy does not carry it) and
        `cholesterol_mg` is null for most scanned products (Open Food Facts
        carried it on neither product measured while this was built).


        **`sodium_mg` is MILLIGRAMS**, the US label and USDA convention, and the
        unit is in the field name deliberately. Open Food Facts reports the same
        quantity in GRAMS and it is converted server-side at that boundary; a
        client that treats this as grams is out by 1000x on the one figure an
        athlete managing blood pressure actually reads.


        **Salt is deliberately not carried.** Measured on two real products it is
        exactly `sodium x 2.5`, so a client that needs it derives it. Two numbers
        that can disagree is worse than one and a formula.
      required: [kcal, protein_g, carb_g, fat_g]
      properties:
        kcal: { type: number }
        protein_g: { type: number }
        carb_g: { type: number }
        fat_g: { type: number }
        fibre_g: { type: number, nullable: true }
        saturated_fat_g: { type: number, nullable: true }
        sugar_g: { type: number, nullable: true }
        added_sugar_g:
          type: number
          nullable: true
          description: >
            Null for every seeded generic food — USDA SR Legacy does not carry
            it. Populated from Open Food Facts for scanned products.
        sodium_mg:
          type: number
          nullable: true
          description: MILLIGRAMS. See the note above on the unit.
        cholesterol_mg:
          type: number
          nullable: true
          description: >
            MILLIGRAMS. Usually null for scanned products; populated for
            USDA-seeded foods.

    MealEstimate:
      type: object
      description: >
        A draft, not an entry. Nothing has been written; the athlete corrects
        these rows and confirms them.
      required: [items, note, meal_name, model, source]
      properties:
        items:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/EstimatedItem" }
        note:
          type: string
          description: >
            What the model wants the athlete to know about the estimate as a
            whole — typically what it could not see. Empty is normal.
        meal_name:
          type: string
          description: >
            A short, recognisable name for the meal AS A WHOLE — "Chipotle
            chicken bowl", not a concatenation of its items — so a client can
            offer to combine every item into one logged entry under it
            (N472). A SUGGESTION, not a final value: every other AI-authored
            field on this type arrives editable, and this is no different.
            Empty when there is only one item, or nothing coherent to name —
            never invented to fill the field. Also empty on the reuse path
            (`match` set below), which is always exactly one item.
        model:
          type: string
          description: Which model produced this, so a later quality question has an answer.
        source:
          type: string
          enum: [text, photo]
        match:
          allOf:
            - $ref: "#/components/schemas/SavedFoodMatch"
          description: >
            Present ONLY when this draft was not generated — it came from a
            food the athlete had already saved. Absent means a model produced
            it. **The presence of this object is the discriminator**, and a
            client must render the two differently: reusing a stored item and
            inventing a new one are not the same claim, and presenting them
            identically is what N114 was reported for.


            When it is present, `model` is empty (nothing produced this),
            `note` is empty, and every item's `portion_confidence` is `high`
            with an empty `assumption` — the quantity is the athlete's own
            serving definition rather than a model's reading of a plate.


            **No estimate allowance was spent.** `quota` is the live figure,
            unchanged by this call.

    SavedFoodMatch:
      type: object
      description: >
        Why a draft was answered from storage rather than generated, in enough
        detail to be checked from the response alone.


        **The rule is exact, not fuzzy.** The description and the stored name
        are each lowercased, trimmed, and their internal whitespace runs
        collapsed; a match is string equality of the two results and nothing
        else. So "Pork Shashlik" matches a saved `Pork  shashlik`, and "Pork
        Shashlik (spicy)" matches nothing — brackets, punctuation, digits and
        plurals are all left alone, because they are usually the only thing
        distinguishing two foods an athlete keeps apart. A regeneration costs
        an allowance slice; a wrong substitution puts another meal's numbers in
        somebody's log, so the rule falls to the recoverable side.


        A photo is never answered from storage, and `reuse: false` on the
        request skips the lookup entirely.
      required: [food_id, name, rule, normalized, food_source, saved_at]
      properties:
        food_id:
          type: string
          format: uuid
          description: >
            The saved row this came from. Log the entry with it as
            `source_food_id` so the reuse joins the quick-add recents.
        name:
          type: string
          description: The STORED name, verbatim — not the query, and not a normalised form.
        rule:
          type: string
          enum: [exact_name]
          description: >
            Which rule fired. One value today; a client must treat an unseen
            one as "matched somehow" rather than assuming this one.
        normalized:
          type: string
          description: The string both sides were compared as, so a surprising match is checkable.
          example: pork shashlik
        food_source:
          type: string
          enum: [user, seed, usda, off, ai]
          description: >
            How the STORED row was itself produced — `ai` for one saved from an
            earlier draft, `user` for one the athlete typed. Different things to
            trust, so they stay tellable apart.
        saved_at:
          type: string
          format: date-time
          description: When the stored row last changed, so a screen can say how old these numbers are.

    EstimatedItem:
      type: object
      description: >
        One component the athlete would correct separately. A sandwich is
        usually one item, not five.
      required:
        [name, serving_label, servings, kcal, protein_g, carb_g, fat_g,
         fibre_g, portion_confidence, assumption]
      properties:
        name: { type: string, example: Scrambled eggs }
        serving_label: { type: string, example: 1 medium egg }
        servings: { type: number, example: 2 }
        kcal: { type: number }
        protein_g: { type: number }
        carb_g: { type: number }
        fat_g: { type: number }
        fibre_g:
          type: number
          nullable: true
          description: Null is "not stated", never zero — the same contract the rest of this module holds.
        portion_confidence:
          type: string
          enum: [high, medium, low]
          description: >
            How sure the model is about the QUANTITY — never about what the
            food is. A confidently identified food at an unclear portion is
            `low`, which is the common case for a photo.
        assumption:
          type: string
          description: >
            The judgement the model had to make to give a number at all —
            "assumed a medium egg". Empty when there was nothing to assume.
            This is what tells the athlete which field to correct.

    EstimateQuota:
      type: object
      description: >
        The athlete's estimate usage over a rolling 24 hours.


        **`limit: 0` means UNKNOWN, not "no estimates allowed".** The cap is a
        server constant and is never zero, so a zero can only mean the usage
        read failed — which happens on a REUSED draft, where the answer cost
        nothing and is worth serving anyway rather than failing. A client must
        not read `remaining: 0` as at-cap when `limit` is 0; check `limit > 0`
        before rendering or acting on a counter. Without this, a transient
        database blip on a free request would grey out the estimate button.


        **One budget covers both paths** — a photograph and a description draw on the same
        allowance.


        **`source` was removed.** The cap used to be per path (20 text, 5
        photo), sized against an assumed ~50x cost difference. Measured on the
        shipped model a photo costs ~1.2–1.5x a description of the SAME meal,
        while the number of items in the meal moves the bill ~5x — so the split
        rationed the wrong variable, and an athlete could be stopped from
        photographing a sixth meal while still free to type a twentieth. A
        client must not render "3 of 25 photos": that states something false
        about what they may do next.
      required: [used, limit, remaining, resets_at]
      properties:
        used: { type: integer }
        limit: { type: integer, description: "25 estimates a day, any mix of descriptions and photographs." }
        remaining:
          type: integer
          description: >
            Clamped at zero — never negative, even if the caps are lowered in a
            deploy.
        resets_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the oldest call in the window ages out, which is when one more
            becomes available. Null when nothing is used.

    NutritionEntry:
      allOf:
        - $ref: "#/components/schemas/NutritionMacros"
        - type: object
          description: >
            One item eaten on one day. Macros are ABSOLUTE for the quantity
            logged, already multiplied by `servings`.
          required: [id, user_id, eaten_on, meal, name, servings, serving_label, notes, created_at, updated_at]
          properties:
            id: { type: string, format: uuid, description: Client-generated. It is the idempotency key for an offline push. }
            user_id: { type: string }
            eaten_on:
              type: string
              format: date
              description: >
                The athlete's LOCAL calendar day, never derived from a UTC
                timestamp — west of Greenwich a 22:00 snack would land on
                tomorrow and the remaining figure would be wrong on two days.
            meal: { type: string, enum: [breakfast, lunch, dinner, snack] }
            name: { type: string }
            servings:
              type: number
              description: How many of `serving_label` were eaten — 1.5 x "100 g".
            serving_label: { type: string }
            source_food_id:
              type: string
              format: uuid
              nullable: true
              description: >
                Provenance only, for "log this again". Nothing reads nutrition
                back through it, and it becomes null if the food is deleted.
            category:
              type: string
              nullable: true
              minLength: 1
              maxLength: 40
              description: >
                A COPY, taken from the catalog food this entry was logged from
                (if any) at the moment it was logged — never a live join,
                exactly like every macro on this object. Correcting the
                catalog row's category later must not repaint an entry already
                logged from it. Null for an entry with no category source — an
                athlete's own saved food, an AI draft, or a barcode scan carry
                none today, and the client's category-derived glyph (N58)
                degrades a null category to a neutral one rather than
                guessing from the name.
            notes: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    NutritionEntryInput:
      allOf:
        - $ref: "#/components/schemas/NutritionMacros"
        - type: object
          required: [eaten_on, meal, name, servings, serving_label]
          properties:
            eaten_on: { type: string, format: date }
            meal: { type: string, enum: [breakfast, lunch, dinner, snack] }
            name: { type: string, minLength: 1, maxLength: 120 }
            servings: { type: number, exclusiveMinimum: true, minimum: 0 }
            serving_label: { type: string, minLength: 1, maxLength: 40 }
            source_food_id: { type: string, format: uuid, nullable: true }
            category:
              type: string
              nullable: true
              minLength: 1
              maxLength: 40
              description: >
                Copied by the CLIENT from the catalog food this entry was
                built from, if any. The server stores it as sent and never
                derives it — see `NutritionEntry.category`.
            notes: { type: string, maxLength: 500 }

    NutritionRecipeItem:
      allOf:
        - $ref: "#/components/schemas/NutritionMacros"
        - type: object
          description: >
            One component of a recipe. Its numbers are copied here, exactly like
            an entry's: correcting a saved ingredient must not rewrite a recipe
            built last month.
          required: [name, quantity, serving_label]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            quantity: { type: number, exclusiveMinimum: true, minimum: 0 }
            serving_label: { type: string, minLength: 1, maxLength: 40 }
            source_food_id: { type: string, format: uuid, nullable: true }

    CatalogFood:
      type: object
      description: >
        One row of the shared food catalog. Distinct from `NutritionFood`, which
        is an athlete's own saved food: this has no owner, a slug id rather than
        a client-generated UUID, and a `source` recording who owns the CONTENT
        (`seed` = deploy-managed, `admin` = a human edited it and a deploy will
        no longer touch it).


        Macros are per one serving, and every seeded row's serving is `100 g`,
        which is the basis USDA states its values on.
      required:
        [id, name, brand, category, aliases, serving_label, kcal, protein_g,
         carb_g, fat_g, market, source]
      properties:
        id: { type: string, example: chicken-breast }
        name: { type: string, maxLength: 120 }
        brand: { type: string, maxLength: 80 }
        category:
          type: string
          description: >
            Coarse food group. Also what the coverage endpoint counts, so an
            empty search can say what the catalog holds instead of leaving its
            shape to be guessed.
          example: poultry
        aliases:
          type: array
          description: >
            Other names for THIS food — "aubergine" on the eggplant row. Kept as
            an array rather than a joined string so a search term cannot match
            across the boundary between two unrelated aliases.
          items: { type: string }
        serving_label: { type: string, example: "100 g" }
        serving_grams:
          type: number
          nullable: true
          description: >
            Null when a serving has no honest gram weight. Inventing one would
            make every gram-based total quietly fictional.
        natural_serving_label:
          type: string
          nullable: true
          example: "1 can 8.4 fl oz"
          description: >
            This food's OWN most representative measure (N448) — additive to
            and deliberately separate from `serving_label`/`serving_grams`
            above, which stay "the amount every macro on this object
            represents" (always "100 g") and are untouched by this pair, the
            same separation `BarcodeFood.packet_serving_label` (N117) makes
            for a scanned packet. A client uses this only to pick a better
            STARTING amount than "100 g" for its "how much" field — Red Bull
            opens to "1 can 8.4 fl oz" / ~110 kcal instead of "100 g" / ~43
            kcal — while every amount, including that one, is still computed
            as `kcal_per_100g * (grams / 100)`. Derived from `portions[0]`
            (USDA's own most-representative entry) and present on BOTH search
            results and `GET .../{id}`, even though `portions` itself is
            absent from search results — see `portions` below. Null for the
            268 of 12,651 catalog rows with no USDA portion data — never a
            fabricated serving standing in for one USDA never stated.
        natural_serving_grams:
          type: number
          nullable: true
          example: 258
          description: Paired with `natural_serving_label` above; both null or both present.
        kcal: { type: number }
        protein_g: { type: number }
        carb_g: { type: number }
        fat_g: { type: number }
        fibre_g:
          type: number
          nullable: true
          description: >
            Null is NOT zero. A source that does not state fibre is not claiming
            there is none, and averaging unstated as zero drags every figure
            down.
        saturated_fat_g: { type: number, nullable: true }
        sugar_g: { type: number, nullable: true }
        added_sugar_g:
          type: number
          nullable: true
          description: >
            Null for every seeded generic food — USDA SR Legacy does not carry
            it. Populated from Open Food Facts for scanned products.
        sodium_mg:
          type: number
          nullable: true
          description: >
            MILLIGRAMS, the US label and USDA convention. Open Food Facts
            reports the same quantity in GRAMS and it is converted server-side;
            a client treating this as grams is out by 1000x on the one figure an
            athlete managing blood pressure reads. Salt is not carried — it is
            exactly `sodium x 2.5` and therefore derivable.
        cholesterol_mg:
          type: number
          nullable: true
          description: >
            MILLIGRAMS. Usually null for scanned products (Open Food Facts
            carried it on neither product measured); populated for USDA-seeded
            foods.
        market:
          type: string
          description: >
            Which region's food supply this row describes. Present so that "we
            do not stock this food" and "we do not cover your region" can stay
            different answers.
          example: us
        rank_tier:
          type: integer
          description: >
            Search precedence, lowest first. 0 is the hand-curated set — foods a
            human named, gave aliases to, and resolved to one specific USDA row.
            1 is the bulk USDA import (SR Legacy and FNDDS). It is the primary
            sort key of a catalog search, and it exists because 803 of the
            catalog's 12,651 rows contain the word "chicken".


            NOT an enum, and clients must NOT close over the values above. The
            server owns this vocabulary and will extend it — Foundation Foods,
            branded products and console-authored rows are each a plausible
            future tier. **Treat an unrecognised value as bulk, never as
            curated**: guessing in the confident direction is the trap N41 hit
            on `source` and N51 hit on `outcome`.
          example: 0
        portions:
          type: array
          description: >
            Household ways this food is measured — "1 large" = 50 g on an egg,
            "1 cup" = 158 g on cooked rice. From USDA `foodPortions`; 98% of the
            catalog has at least one, 2.4 on average.


            **Returned by `GET /v1/nutrition/catalog/{id}` only, and ABSENT from
            search results.** A 25-row search page would carry ~60 portions for a
            choice the athlete has not made yet. Clients must not expect this
            field on a list response. `natural_serving_label`/
            `natural_serving_grams` above ARE present on search results — they
            are `portions[0]` alone, cheap enough to include on a list page,
            without paying for the rest of the array (N448).


            100 g is deliberately NOT in this array — it is always available from
            `serving_grams`, so a client always has at least one way to measure a
            food even when this is empty.
          items:
            type: object
            required: [seq, label, grams]
            properties:
              seq:
                type: integer
                description: >
                  USDA's own `sequenceNumber`, and the display order. They list
                  the most representative portion first; re-sorting client-side
                  replaces their editorial judgement with a guess.
              label:
                type: string
                description: The phrase a person would say — "1 cup", "1 medium".
                example: 1 large
              grams:
                type: number
                description: >
                  What the portion weighs. Always present and always > 0 — a
                  portion whose weight is unknown is dropped at import rather
                  than served with a null, because it could not be logged
                  against a calorie target.
                example: 50
        source: { type: string, enum: [seed, admin] }
        external_id:
          type: string
          nullable: true
          description: The upstream row these numbers came from, so any figure can be checked.
        external_source:
          type: string
          nullable: true
          enum: [usda, off]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BarcodeFood:
      type: object
      description: >
        A food resolved from a barcode. A SEPARATE schema from `CatalogFood`,
        not a subset of it, and deliberately so: `CatalogFood.source` is
        `seed|admin` and both values mean "content we own", so an Open Food
        Facts row rendered as a `CatalogFood` would assert on the wire that
        ODbL data is deploy-authored. A client copying that into
        `nutrition_foods.source` — whose vocabulary also contains `seed` —
        would mislabel it permanently. This type has no `source` and no
        `market`, so it cannot.


        Values are per 100 g.
      required: [name, brand, serving_label, kcal, protein_g, carb_g, fat_g]
      properties:
        name: { type: string, maxLength: 120 }
        brand: { type: string, maxLength: 80 }
        serving_label: { type: string, example: "100 g" }
        serving_grams: { type: number, nullable: true }
        packet_serving_label:
          type: string
          nullable: true
          maxLength: 40
          example: "2 pieces (25 g)"
          description: >
            The PACKET's own printed serving (N117) — additive to and
            deliberately separate from `serving_label`/`serving_grams` above,
            which stay "the amount every macro on this object represents"
            (always "100 g") and are untouched by this pair. A client uses
            this only to pick a better STARTING amount than "100 g" for its
            "how much" field — e.g. a Kinder bar's own box states "2 pieces
            (25g)" — while every amount, including that one, is still computed
            as `kcal_per_100g * (grams / 100)`, same arithmetic as any other
            gram figure. Null when Open Food Facts states no serving in grams
            (most products) — never a fabricated one, and never derived from a
            non-gram unit (a can's `354.9 mL` is not `354.9 g`).
        packet_serving_grams:
          type: number
          nullable: true
          example: 25
          description: The packet's own serving, in grams. Paired with `packet_serving_label` above; both null or both present.
        kcal: { type: number }
        protein_g: { type: number }
        carb_g: { type: number }
        fat_g: { type: number }
        fibre_g:
          type: number
          nullable: true
          description: Null is not zero — an unstated figure is not a claim of none.
        saturated_fat_g: { type: number, nullable: true }
        sugar_g: { type: number, nullable: true }
        added_sugar_g:
          type: number
          nullable: true
          description: >
            Open Food Facts carries this for many packaged products, unlike the
            USDA-seeded catalog where it is always null.
        sodium_mg:
          type: number
          nullable: true
          description: >
            MILLIGRAMS. **The provider reports GRAMS and the server converts**,
            so a client must not re-scale this. Salt is not carried — measured
            at exactly `sodium x 2.5`, so derive it if a region needs it.
        cholesterol_mg:
          type: number
          nullable: true
          description: >
            MILLIGRAMS. Usually null: Open Food Facts carried it on neither
            product measured while this was built. That is the ordinary case,
            not a fault.
        external_id:
          type: string
          nullable: true
          description: The provider's own identifier for the product.

    CatalogCoverage:
      type: object
      description: >
        What the catalog actually holds. Exists because an empty search result
        is uninterpretable without it.
      required: [foods, markets, categories, barcode]
      properties:
        foods: { type: integer }
        markets:
          type: array
          items: { type: string }
        categories:
          type: array
          items:
            type: object
            required: [category, foods]
            properties:
              category: { type: string }
              foods: { type: integer }
        barcode:
          type: object
          required: [enabled, provider, cached]
          properties:
            enabled:
              type: boolean
              description: >
                False when no barcode provider is configured. A scanning client
                needs this to tell "this build cannot look packets up" from
                "this packet is unknown".
            provider: { type: string, example: openfoodfacts }
            cached:
              type: integer
              description: How many barcodes this deploy has already resolved.

    NutritionFood:
      allOf:
        - $ref: "#/components/schemas/NutritionMacros"
        - type: object
          description: >
            A saved food, or a recipe. Macros are PER ONE SERVING; for a recipe
            they are derived from `items` divided by `yield_servings` at write
            time and stored, so a food picker never has to join.
          required: [id, user_id, kind, name, brand, serving_label, source, items, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            user_id: { type: string }
            kind: { type: string, enum: [food, recipe] }
            name: { type: string }
            brand: { type: string }
            serving_label:
              type: string
              description: What one serving IS, as the athlete would say it — "100 g", "1 scoop (30 g)", "1 egg".
            serving_grams:
              type: number
              nullable: true
              description: >
                Nullable on purpose: an egg has no honest gram weight, and
                inventing one would make every gram-based total quietly
                fictional.
            yield_servings:
              type: number
              nullable: true
              description: Recipes only — "this makes 6 portions". Null for a plain food.
            items:
              type: array
              description: A recipe's components. Empty for a plain food.
              items: { $ref: "#/components/schemas/NutritionRecipeItem" }
            source:
              type: string
              enum: [user, seed, usda, off, ai]
              description: >
                Where the row came from. A client may set `user` or `ai` and
                nothing else — see `NutritionFoodInput.source`.
            external_id: { type: string, nullable: true }
            barcode: { type: string, nullable: true }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    NutritionFoodInput:
      type: object
      description: >
        For `kind: food`, the macros are REQUIRED and are the figures for one
        serving. For `kind: recipe`, send `items` and `yield_servings` instead —
        the per-serving macros are derived from them and any sent are ignored.


        The macro fields are therefore declared here rather than inherited from
        `NutritionMacros`: inheriting them would make them required on a recipe
        too, and required-but-ignored is a contradiction a generated client
        cannot satisfy.
      required: [name, serving_label]
      properties:
        kind: { type: string, enum: [food, recipe], default: food }
        name: { type: string, minLength: 1, maxLength: 120 }
        brand: { type: string, maxLength: 80 }
        serving_label: { type: string, minLength: 1, maxLength: 40 }
        serving_grams: { type: number, nullable: true }
        kcal: { type: number, description: Required for a food; ignored for a recipe. }
        protein_g: { type: number, description: Required for a food; ignored for a recipe. }
        carb_g: { type: number, description: Required for a food; ignored for a recipe. }
        fat_g: { type: number, description: Required for a food; ignored for a recipe. }
        fibre_g: { type: number, nullable: true }
        yield_servings: { type: number, nullable: true }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/NutritionRecipeItem" }
        barcode: { type: string, nullable: true }
        source:
          type: string
          enum: [user, ai]
          description: >
            How this row was produced. **Only `user` and `ai` may be sent**;
            anything else is a `400` rather than a silent coercion. `usda` and
            `off` are written by the importers that fetch them and by nothing
            else — Open Food Facts data is ODbL, and a client able to write or
            strip that label would undo the separation the value exists for.


            `ai` means a food saved from a draft the athlete confirmed rather
            than one anybody measured. It has to stay permanently tellable apart
            from a measured row: a model cannot reliably say which of its own
            numbers to distrust, so nothing downstream could weight them
            differently once the distinction is lost.


            **OMITTING IT ON AN UPDATE KEEPS WHAT IS STORED** — it does not
            reset the row to `user`. That is deliberate: correcting a food's
            macros must not silently relabel an AI-drafted row as one the
            athlete measured. On a NEW row, omitting it means `user`.

    NutritionDay:
      allOf:
        - $ref: "#/components/schemas/NutritionMacros"
        - type: object
          description: One day's summed intake, against the target that was live that day.
          required: [eaten_on, entries]
          properties:
            eaten_on: { type: string, format: date }
            entries: { type: integer }
            target_kcal:
              type: integer
              nullable: true
              description: >
                The target live on THAT day, resolved per day rather than once
                for the window — and sent per day rather than as a weekly total
                the client divides, so training-day cycling stays a server
                change later rather than a client rewrite.
            target_protein_g: { type: integer, nullable: true }

    NutritionTargetBasis:
      type: object
      description: >
        The arithmetic that produced a derived target, frozen at the moment it
        was accepted. Every field is one line of the explanation a UI renders.
      properties:
        rmr_kcal: { type: integer }
        rmr_precision: { type: string, enum: [none, coarse, estimated] }
        weight_kg: { type: number }
        weight_measured_on: { type: string, format: date }
        activity: { type: string, enum: [sedentary, light, active] }
        activity_factor: { type: number, description: NEAT only — training is added separately. }
        neat_kcal: { type: integer }
        training_kcal_per_day: { type: integer }
        training_days_covered: { type: integer }
        training_sessions:
          type: integer
          description: Reported so a thin history is visible rather than silently flattering.
        tdee_kcal: { type: integer }
        phase_kind: { type: string }
        target_rate_pct_per_week:
          type: number
          description: Signed — negative for loss.
        target_rate_kg_per_week: { type: number }
        kcal_per_kg:
          type: number
          description: >
            7700, Wishnofsky's figure. An approximation that overestimates
            long-run loss because it ignores adaptive thermogenesis — which is
            why a weekly adjustment against observed weight change exists.
        energy_delta_kcal: { type: integer }
        clamped:
          type: boolean
          description: True when a rail bound, so a UI can say "we stopped here".
        clamp_reason: { type: string }
        relaxed: { type: string, description: "Which macro rule gave way, if any." }
        protein_g_per_kg: { type: number }
        fat_g_per_kg: { type: number }
        projection:
          type: object
          nullable: true
          description: >
            **"Does this look right?"** — when the phase's goal weight arrives at
            this phase's own rate, and whether that is before its deadline.


            **Null is the ordinary case** and means there is nothing to say: no
            goal weight, or no live phase. A client must render **nothing** for
            null rather than an all-clear — "we did not check" and "it checks
            out" are different answers and only one of them is reassuring.


            Computed server-side so both clients agree by construction. It is
            the INVERSE of the making-weight rate: that asks what rate a fixed
            deadline demands and clamps at the safe ceiling, this asks when the
            rate you were given actually arrives, which is the right question
            when the deadline is the soft thing.
          allOf:
            - $ref: "#/components/schemas/NutritionProjection"

    NutritionProjection:
      type: object
      required: [target_weight_kg, kg_to_go, reached_on, weeks_to_go, already, unreachable, meets_deadline]
      properties:
        target_weight_kg: { type: number }
        kg_to_go:
          type: number
          description: >
            UNSIGNED — how far there is left to travel, in whichever direction
            the phase is going.
        reached_on:
          type: string
          description: >
            The day the goal weight arrives at this rate, `YYYY-MM-DD`. **Empty
            when `unreachable`** — deliberately not a date, because a computed
            date in the past reads as an answer rather than a contradiction.
        weeks_to_go:
          type: number
          description: >
            The same figure before it became a date. A span is what an athlete
            reasons with ("that is five months"); a date is what they diary.
        already:
          type: boolean
          description: >
            The goal weight is already met, within 0.1 kg — a scale does not
            resolve better than that, so exactness would leave somebody
            permanently "0.02 kg away". The plan is not wrong, it is finished.
        unreachable:
          type: boolean
          description: >
            The rate never closes the gap: it is zero, or it points away from
            the goal. The real case is a bulk with a goal weight BELOW current —
            two settings that each look fine on their own screen.
        unreachable_reason:
          type: string
          description: Present when `unreachable`; says what to change.
        deadline_on:
          type: string
          description: The phase's target date, when it set one.
        meets_deadline:
          type: boolean
          nullable: true
          description: >
            **Null when there is no deadline to meet** — absent, not false,
            because "no deadline" and "misses it" must not render alike.
        shortfall_kg:
          type: number
          description: >
            How much would still be left on the deadline day. This is the number
            that says HOW wrong the plan is, where the date says only that it is.
        days_late:
          type: integer
          description: How far past the deadline the goal actually arrives.

    NutritionSuggestion:
      type: object
      required: [kcal, protein_g, carb_g, fat_g, fibre_g, basis]
      properties:
        kcal: { type: integer }
        protein_g: { type: integer }
        carb_g: { type: integer }
        fat_g: { type: integer }
        fibre_g: { type: integer }
        basis: { $ref: "#/components/schemas/NutritionTargetBasis" }

    NutritionTarget:
      type: object
      description: What the athlete is eating to, from a date onward.
      required: [user_id, effective_on, kcal, protein_g, carb_g, fat_g, source, created_at, updated_at]
      properties:
        user_id: { type: string }
        effective_on:
          type: string
          format: date
          description: >
            The date is the identity — setting a target twice for one day is one
            row, and a past day stays judged against the target that was live
            then.
        kcal: { type: integer }
        protein_g: { type: integer }
        carb_g: { type: integer }
        fat_g: { type: integer }
        fibre_g: { type: integer, nullable: true }
        source:
          type: string
          enum: [derived, manual, adjustment]
          description: >
            `derived` came from the wizard and carries a basis; `manual` was
            typed and has none to show; `adjustment` is a weekly proposal the
            athlete accepted.
        basis: { $ref: "#/components/schemas/NutritionTargetBasis" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NutritionTargetInput:
      type: object
      required: [kcal, protein_g, carb_g, fat_g]
      properties:
        kcal: { type: integer, minimum: 800, maximum: 8000 }
        protein_g: { type: integer, minimum: 0, maximum: 500 }
        carb_g: { type: integer, minimum: 0, maximum: 1200 }
        fat_g: { type: integer, minimum: 0, maximum: 400 }
        fibre_g: { type: integer, nullable: true, minimum: 0, maximum: 120 }
        source: { type: string, enum: [derived, manual, adjustment], default: manual }
        basis: { $ref: "#/components/schemas/NutritionTargetBasis" }

    BodyCheckin:
      type: object
      description: >
        One day's measurements. Weight is kilograms and girths are centimetres —
        always, whatever the athlete's display units say. Storing a converted
        value would make every historical row ambiguous the moment somebody
        changed the setting.
      required: [user_id, measured_on, measured_side, notes, created_at, updated_at]
      properties:
        user_id: { type: string }
        measured_on: { type: string, format: date }
        weight_kg: { type: number, nullable: true }
        neck_cm: { type: number, nullable: true }
        shoulders_cm: { type: number, nullable: true }
        chest_cm: { type: number, nullable: true }
        waist_cm: { type: number, nullable: true }
        hips_cm: { type: number, nullable: true }
        thigh_cm: { type: number, nullable: true }
        calf_cm: { type: number, nullable: true }
        upper_arm_cm: { type: number, nullable: true }
        forearm_cm: { type: number, nullable: true }
        measured_side:
          type: string
          enum: [left, right]
          description: >
            Which side the limb girths were taken on — one value for the row,
            not one per site. The rule that matters is consistency, and an
            athlete measuring a left thigh and a right arm has two series that
            cannot be compared to anything.
        photo_url:
          type: string
          description: >
            A short-lived presigned link, minted per response. Absent when there
            is no photo or the environment has no object storage. Never store
            it — it expires.
        notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BodyCheckinInput:
      type: object
      description: >
        Every field optional and independently so, but at least one measurement
        is required — an empty check-in creates a day the trend then has to skip
        over. An omitted field means "not measured" and leaves any stored value
        alone.
      properties:
        weight_kg: { type: number, nullable: true }
        neck_cm: { type: number, nullable: true }
        shoulders_cm: { type: number, nullable: true }
        chest_cm: { type: number, nullable: true }
        waist_cm: { type: number, nullable: true }
        hips_cm: { type: number, nullable: true }
        thigh_cm: { type: number, nullable: true }
        calf_cm: { type: number, nullable: true }
        upper_arm_cm: { type: number, nullable: true }
        forearm_cm: { type: number, nullable: true }
        measured_side: { type: string, enum: [left, right] }
        notes: { type: string }

    BodyPhase:
      type: object
      required: [id, user_id, kind, started_on, notes, created_at, updated_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        kind:
          type: string
          enum: [cut, lean_bulk, recomposition, maintenance, making_weight]
        started_on: { type: string, format: date }
        target_on: { type: string, format: date, nullable: true }
        target_weight_kg: { type: number, nullable: true }
        ended_on:
          type: string
          format: date
          nullable: true
          description: Null while this is the live phase. At most one per athlete.
        notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BodyPhaseInput:
      type: object
      required: [id, kind, started_on]
      properties:
        id:
          type: string
          description: Client-generated, so a retry is not a second phase.
        kind:
          type: string
          enum: [cut, lean_bulk, recomposition, maintenance, making_weight]
        started_on: { type: string, format: date }
        target_on: { type: string, format: date, nullable: true }
        target_weight_kg: { type: number, nullable: true }
        notes: { type: string }

    Theme:
      type: object
      required: [week_start, title, notes, created_at, updated_at]
      properties:
        week_start:
          type: string
          format: date
          description: The Monday of the week this theme covers.
        title: { type: string, maxLength: 80 }
        notes: { type: string, maxLength: 500 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ContestMatchInput:
      type: object
      required: [result]
      description: >
        One bout, as sent. There is deliberately **no `position` field**: the
        server numbers matches from the order they appear in the array, so array
        order IS bracket order and "lost in the final" is expressed by putting
        that match last. A `position` sent anyway is ignored.


        There is no `id` either, and it is not an omission — matches are
        replaced wholesale on every write, so a row's identity does not survive
        an edit. Position is the stable handle within an entry.
      properties:
        result:
          type: string
          enum: [won, lost]
          description: >
            A draw is not in the vocabulary — IBJJF brackets do not draw. The
            column has no CHECK constraint, so adding one is a code change
            rather than a migration.
        method:
          type: string
          enum: ["", submission, points, advantage, penalty, decision, dq, walkover]
          description: >
            How the match was decided. Empty means not recorded, which is normal
            for an entry logged from memory. This is what a counter column could
            never answer: "lost on advantages" and "lost by armbar" are
            different findings.
        technique_id:
          type: string
          nullable: true
          description: >
            The submission that ended it, when there was one and the athlete
            knows it. **Only accepted when `method` is `submission`** — naming a
            technique on a match decided on points is a contradiction, and it is
            refused rather than silently dropped.


            Retiring a technique from the shared library sets this to null
            rather than deleting the match: a record of having hit something
            outlives the library entry for it.
        opponent:
          type: string
          maxLength: 80
          description: Free text. Opponents are not entities in this product.
        note: { type: string, maxLength: 280 }

    ContestMatch:
      allOf:
        - $ref: "#/components/schemas/ContestMatchInput"
        - type: object
          required: [position, method, technique_id, opponent, note]
          properties:
            position:
              type: integer
              minimum: 1
              description: >
                Order within the bracket, 1-based, assigned by the server. This
                is what makes the uniqueness of a position unviolatable from
                outside — it is never taken from the request.

    ContestInput:
      type: object
      required: [sport, name]
      description: >
        One ENTRY, not one event. Gi and no-gi at the same tournament are two
        contests; adult and master are two contests. They share a name and a
        date and nothing else.
      properties:
        sport:
          type: string
          description: >
            Any discipline that can be a sport. The resource is not BJJ-specific
            — it has to hold a powerlifting meet and a 10k, which is why the
            contract uses the neutral word while a client may say "tournament".
        name: { type: string, maxLength: 120 }
        organisation:
          type: string
          maxLength: 80
          description: IBJJF, ADCC, USAPL, parkrun. Empty is normal.
        held_on:
          type: string
          format: date
          nullable: true
          description: >
            Nullable on the same reasoning as a promotion date: refusing an
            undated entry would lose the fact in order to protect the metadata.
            Someone who remembers placing third in 2019 but not the month should
            still be able to record it — it simply cannot sit on a timeline.
        format:
          type: string
          enum: ["", points, submission_only]
          description: >
            How the matches were scored. NOT called `ruleset`: that word already
            means IBJJF rule legality in the technique library. Empty is normal
            for a sport with no such distinction.
        gi:
          type: boolean
          nullable: true
          description: >
            Three-state. Null is "didn't say", which is a different fact from gi
            or no-gi and has to stay tellable.
        division_belt: { type: string, maxLength: 40 }
        division_age: { type: string, maxLength: 40 }
        division_weight:
          type: string
          maxLength: 40
          description: >
            The division as three independent free-text parts rather than one
            string, so "how did I do at brown belt" is answerable without
            parsing prose. Empty is normal for a sport with no belts, no age
            brackets or no weight classes.
        placement:
          type: integer
          minimum: 1
          nullable: true
          description: >
            1 means you won it. Null is **not** "did not place" — it is "not
            recorded", the ordinary state for a bracket that pays no places. A
            sentinel like 0 or 99 would make every future ordering and average
            wrong in a different way.
        entrants:
          type: integer
          minimum: 1
          nullable: true
          description: >
            How big the field was, which is what gives a placement its meaning:
            third of four and third of sixty-four are not the same result.
            `placement` may not exceed it.
        note: { type: string, maxLength: 500 }
        matches:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/ContestMatchInput" }
          description: >
            The bracket, in order. Omitting the field entirely is an ordinary
            entry: a placement alone is a complete thing to remember.

    Contest:
      allOf:
        - $ref: "#/components/schemas/ContestInput"
        - type: object
          required: [id, matches, created_at, updated_at]
          properties:
            id: { type: string }
            # Restated so a RESPONSE match carries `position`, which a request
            # one does not. Both branches apply, and ContestMatch is
            # ContestMatchInput plus that field, so the intersection is exactly
            # ContestMatch.
            matches:
              type: array
              items: { $ref: "#/components/schemas/ContestMatch" }
              description: Always present; `[]` for an entry recorded as a placement alone.
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    Accomplishment:
      type: object
      required:
        # Every field is always present in the response — none is omitempty —
        # so the contract states that rather than understating it. The
        # evidence fields are nullable, and WHICH are non-null follows from
        # `kind`; switch on that rather than sniffing.
        [kind, basis, achieved_on, contest_id, contest_name, placement, entrants,
         session_id, technique_id, technique_name]
      description: >
        One thing the athlete achieved, with the evidence that earned it.


        **Everything here is derived on read and stored nowhere.** Correcting a
        contest result or deleting a session RETRACTS the award — a badge for a
        match you did not have, surviving because it was cached, is worse than
        no badge. There is deliberately no write verb of any kind, not even an
        admin one: an accomplishment that could be granted would stop being
        evidence of anything.


        Which evidence fields are populated follows from `kind`; switch on that
        rather than sniffing for non-null fields.
      properties:
        kind:
          type: string
          enum:
            - first_scored
            - first_drilled_scored
            - first_competition
            - first_match_won
            - first_submission_win
            - first_podium
            - first_gold
          description: >
            Every kind is a **first** — a thing that happened once, that a row
            proves, and that most athletes reach at most once ever. That rule is
            what keeps out anything firing constantly for whoever trains a
            certain way, and anything self-declared.


            `first_drilled_scored` is the technique funnel completing: a
            technique drilled in an EARLIER session, later landed live. Strictly
            earlier — drilling and hitting something inside one class is an
            ordinary afternoon.
        basis:
          type: string
          enum: [measured, reported]
          description: >
            What kind of evidence stands behind it, mirroring
            `backend/internal/modules/session/basis.go`. Competition awards are
            **measured** — a bracket, a referee, a placement nobody can talk
            themselves into. Mat awards are **reported**: the athlete logged
            that they hit it, and nobody checked.


            Both are worth marking and they are not the same claim, which is why
            the distinction travels with each award instead of being flattened
            into one gold-star list. Note the list is chronological and is never
            ranked or scored — a ranking would let a reported award be judged
            against a measured one, which that file's first reading rule
            forbids.
        achieved_on:
          type: string
          format: date
          nullable: true
          description: >
            Null is ordinary, not a defect: a contest may be recorded with no
            date, because refusing an undated entry would lose the fact to
            protect the metadata. Such an award still happened and must still be
            rendered — it simply cannot sit on a timeline, and it sorts last
            rather than first.
        contest_id: { type: string, nullable: true }
        contest_name: { type: string, nullable: true }
        placement: { type: integer, nullable: true }
        entrants:
          type: integer
          nullable: true
          description: >
            Travels with `placement` wherever it is known — third of four and
            third of sixty-four are not the same result.
        session_id: { type: string, nullable: true }
        technique_id: { type: string, nullable: true }
        technique_name:
          type: string
          nullable: true
          description: >
            Resolved server-side. Null when the tag named no technique ("got the
            sweep" without saying which is evidence the schema accepts), and
            also when the technique has since been retired from the library —
            that foreign key is ON DELETE SET NULL precisely so an athlete's
            record outlives the catalog entry.

    BjjRank:
      type: object
      required: [belt, stripes, degree]
      properties:
        belt:
          type: string
          enum: [white, blue, purple, brown, black]
          description: >
            Adult IBJJF belts only. Kids and coral/red belts are not yet
            represented; the column has no CHECK constraint so adding them is
            a code change rather than a migration.
        stripes: { type: integer, minimum: 0, maximum: 4 }
        degree:
          type: integer
          minimum: 0
          maximum: 6
          description: >
            Black-belt degrees. 0 on every other belt, and only accepted as
            non-zero on black.

    BjjPromotionInput:
      allOf:
        - $ref: "#/components/schemas/BjjRank"
        - type: object
          properties:
            promoted_on:
              type: string
              format: date
              nullable: true
              description: >
                Nullable on purpose. Plenty of athletes do not remember when
                they were promoted, and refusing the promotion to protect the
                date would lose the fact. An undated promotion still
                establishes rank; it just cannot contribute to time-at-belt.
            academy:
              type: string
              description: Free text, per promotion. Not a shared entity.
            instructor: { type: string }
            note: { type: string }

    BjjPromotion:
      allOf:
        - $ref: "#/components/schemas/BjjPromotionInput"
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id:
              type: string
              description: >
                Server-minted, unlike session and workout ids. Those are
                client-generated so an offline push can retry idempotently;
                a promotion has no offline outbox behind it.
            photo_url:
              type: string
              description: >
                A short-lived presigned link, minted per response — same
                pattern as `BodyCheckin.photo_url`. Absent when there is no
                photo attached, or the environment has no object storage
                configured. Never store it; it expires.
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    BjjStanding:
      type: object
      required: [promotions]
      properties:
        current:
          allOf:
            - $ref: "#/components/schemas/BjjRank"
          type: object
          nullable: true
          description: >
            The highest recorded rank, or null when nothing is recorded.
            Derived, never stored.
        time_at_current_days:
          type: integer
          nullable: true
          description: >
            Days since the promotion that set the current rank. Null when that
            promotion has no date — "unknown" and "today" are different
            answers, so this is not 0.
        promotions:
          type: array
          items: { $ref: "#/components/schemas/BjjPromotion" }

    BjjSessionTag:
      type: object
      required: [category, event]
      description: >
        One piece of evidence from a session. Never a self-assessment —
        "attempted twice from closed guard, hit once" is a fact that stays
        true; a 1-5 rating is a number with no provenance that goes stale.
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        category:
          type: string
          enum: [submission, sweep, pass, escape, takedown, control]
          description: >
            Drawn from the technique library's own category vocabulary, and
            limited to the ones with a genuine symmetric opposite — you can
            hit a sweep or be swept; "transition" has no other side.
        event:
          type: string
          enum: [drilled, attempted, scored, conceded, defended]
          description: >
            The outcome direction. `drilled → attempted → scored` is the
            technique funnel, whose drop-offs are the actionable numbers;
            `conceded` is the symmetric half and answers "where do I keep
            getting stuck", which a success-only schema never could.

            The four live events are a 2x2 of who initiated and whether it
            landed: `scored` / `attempted` for the athlete's own attacks,
            `conceded` / `defended` for the opponent's. `defended` completes
            it — before it existed, defensive success was the one outcome the
            schema could not record, and could only be inferred from absence.
        position:
          type: string
          description: >
            Position family ("Half Guard", "Mount"), matching the library's
            own filter granularity. Empty is a normal fast-path outcome, not
            an error.
        technique_id:
          type: string
          nullable: true
          description: >
            The specific technique when the athlete named one. Null is
            ordinary — "got swept from half guard" is real evidence and must
            not require naming the sweep.
        count:
          type: integer
          minimum: 1
          default: 1
          description: >
            Reflection is recalled in counts. Three armbars is one tag with
            count 3, not three tags.
        label:
          type: string
          default: ""
          maxLength: 200
          description: >
            N119/#508: what the athlete said when it did NOT resolve to a
            catalog technique — a mangled dictation ("pool guards"), or a
            phrase typed by hand that the library has no entry for. Empty is
            the ordinary case (`technique_id` resolved, or nothing was named
            at all). Mutually exclusive with `technique_id`: a tag carrying
            both is rejected as invalid input, since a resolved tag with a
            leftover label is stale data, not a fact worth keeping.

            NEVER written to the technique catalog on any path — that stays
            admin-authored-only (see the `techniques` endpoints), so a
            mangled dictation can never become a permanent, shared catalog
            entry through this field.

    BjjReflectionDraft:
      type: object
      required:
        [kind, gi, rounds, round_minutes, session_rpe, note, body_note,
         tags, unresolved, notices, empty, model]
      description: >
        A draft, not a session. Nothing has been written; the athlete corrects
        this in the reflection wizard and the confirmed version goes back
        through PUT /v1/bjj/sessions/{sessionID}.


        Absence is the normal case, not a degraded one. A null scalar and an
        empty `kind` both mean "the athlete did not say", and a blank field
        costs one tap where a wrong one that looks right gets confirmed
        without being read.
      properties:
        kind:
          type: string
          enum: ["", class, drilling, positional, rolling]
          description: Empty means the athlete did not say which it was.
        gi: { type: boolean, nullable: true }
        rounds: { type: integer, nullable: true, minimum: 1 }
        round_minutes: { type: integer, nullable: true, minimum: 1 }
        session_rpe: { type: integer, nullable: true, minimum: 1, maximum: 10 }
        note:
          type: string
          description: >
            What was said that is not a tag — how it felt, what the coach
            said. Never a summary of the tags.
        body_note:
          type: string
          description: Pain, injury or soreness only.
        tags:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/BjjDraftTag" }
          description: >
            Shaped exactly like `BjjSessionTag` minus its id, so a confirmed
            draft is PUT back without translation. Every entry is guaranteed
            to satisfy the session endpoint's own validation.
        unresolved:
          type: array
          items: { $ref: "#/components/schemas/BjjUnresolvedPhrase" }
        notices:
          type: array
          items: { $ref: "#/components/schemas/BjjDraftNotice" }
        empty:
          type: boolean
          description: >
            True when the model returned a well-formed answer with nothing in
            it: no tags, no unresolved phrases and no stated scalars. Show
            this as "nothing was picked up", never as a draft.


            It is a REPORTED OUTCOME rather than an error, because the same
            shape is the correct answer to a sentence with no session in it.
            But it is also the shape a model produces when it goes quiet on
            input it finds awkward — measured once, on an injected instruction,
            where the whole sentence came back in `note` and a real technique
            the athlete had reported was dropped. `note` may therefore be long
            while `empty` is true; length is not extraction.
        model:
          type: string
          description: Which model produced this, so a later quality question has an answer.

    BjjDraftTag:
      type: object
      required: [category, event, position, technique_id, count]
      description: >
        One thing that happened, as the model heard it.
      properties:
        category:
          type: string
          enum: [submission, sweep, pass, escape, takedown, control]
          description: >
            DERIVED from the library entry whenever `technique_id` is set,
            never taken from the model's answer — a category that disagreed
            with the library would split one technique's evidence across two
            rows of the funnel with nothing reporting an error.
        event:
          type: string
          enum: [drilled, attempted, scored, conceded, defended]
        position:
          type: string
          description: >
            Position family, or empty when the athlete did not say. Derived
            from the library entry when `technique_id` is set.
        technique_id:
          type: string
          nullable: true
          description: >
            Set only when the athlete's words identify ONE catalog entry, and
            validated against the library server-side. An id the library does
            not have is never passed through and never mapped onto a
            neighbour: it moves to `unresolved` with a `notice`. Null is the
            ordinary outcome — "armbar" on its own could be a dozen entries.
        count:
          type: integer
          minimum: 1
          description: >
            Floored to 1 when the number does not appear in what the athlete
            said, with a `not_spoken` notice. An invented ROW is visible to
            somebody correcting a draft; an invented NUMBER is not, and no
            confidence score can flag one.

    BjjUnresolvedPhrase:
      type: object
      required: [phrase, category, event]
      description: >
        Something the athlete named that does not pick out one technique, for
        them to resolve with the ordinary picker. Not a failure — a guess here
        would be pre-ticked, plausible, and one tap from permanent.
      properties:
        phrase: { type: string, example: butterfly }
        category:
          type: string
          enum: [submission, sweep, pass, escape, takedown, control]
        event:
          type: string
          enum: [drilled, attempted, scored, conceded, defended]

    BjjDraftNotice:
      type: object
      required: [field, was, reason]
      description: >
        One change the server made to the model's answer. Reported rather than
        applied silently, so a client can say what happened — "we could not
        find that number in what you said" — instead of showing a field that
        is mysteriously blank.
      properties:
        field:
          type: string
          description: >
            Path into THIS response — "rounds", "tags[2].count". A `tags[N]`
            index always resolves against the `tags` array as returned, never
            against the model's own answer: notices belonging to a tag that was
            cut by the 40-tag limit are dropped with it, since an explanation of
            a change to something absent has nothing to explain.
          example: tags[2].count
        was:
          type: string
          description: What the model said, rendered as text.
        reason:
          type: string
          enum: [unknown_technique, not_spoken, unknown_value, count_below_one, hedged_count, too_many_tags]
          description: >
            Part of the contract; branch on this rather than on any message.
            `hedged_count` is distinct from `not_spoken`/`count_below_one`:
            those two only ever fire when the model got a count wrong (invented
            or malformed a number); `hedged_count` fires on the model behaving
            CORRECTLY — the athlete gave an indefinite quantity ("a couple",
            "maybe three or four") and the model left `count` at 1 rather than
            inventing one value from a range, self-reporting that judgement so
            a client can still ask rather than show a silently confident 1
            (N121/#510).

    BjjDraftQuota:
      type: object
      required: [used, limit, remaining, resets_at]
      description: Usage of the drafting endpoint, over a rolling 24 hours.
      properties:
        used: { type: integer }
        limit: { type: integer, description: "10 per athlete per rolling day." }
        remaining:
          type: integer
          description: Clamped at zero — never negative, even if the cap is lowered in a deploy.
        resets_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the oldest call in the window ages out, which is when one
            more becomes available. Null when nothing is used.

    BjjSessionDetail:
      type: object
      required: [session_id, kind, tags]
      description: >
        The BJJ half of a session. The session itself is an ordinary
        `sessions` row created through POST /v1/sessions — this carries only
        what a mat session has and a barbell session does not, exactly as
        PUT /v1/sessions/{id}/sets carries what a strength session has.
      properties:
        session_id: { type: string, readOnly: true }
        kind:
          type: string
          enum: [class, drilling, positional, rolling]
          description: >
            Different training rather than different intensities of the same
            training: an hour of drilling and an hour of hard rounds cost the
            body different amounts and produce different evidence.
        gi:
          type: boolean
          nullable: true
          description: Null means "didn't say", which is not the same as no-gi.
        rounds:
          type: integer
          nullable: true
          minimum: 1
        round_minutes:
          type: integer
          nullable: true
          minimum: 1
        session_rpe:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          description: >
            The internal-load half of sRPE x duration — the mechanism that
            puts a round of rolling and a set of squats in the same unit.
        academy: { type: string }
        note: { type: string }
        body_note:
          type: string
          description: Body/injury flag, feeding the recommendation safety floors.
        tags:
          type: array
          items: { $ref: "#/components/schemas/BjjSessionTag" }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    RunningRoutePoint:
      type: object
      required: [lat, lng, recorded_at]
      description: One recorded point along a run's GPS track.
      properties:
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        elevation_m:
          type: number
          format: double
          nullable: true
          description: >
            Null when the device did not report one — common indoors, on an
            older phone, or on a thinned-out imported track. Not defaulted to
            0, which would assert sea level for a run that simply didn't say.
        recorded_at: { type: string, format: date-time }

    RunningSplit:
      type: object
      required: [distance_m, duration_seconds]
      description: >
        One distance-based split — "this kilometre took 5:12" — rather than a
        time-based one, matching how every running app and every runner
        already thinks about a split.
      properties:
        distance_m: { type: number, format: double, minimum: 0, exclusiveMinimum: true }
        duration_seconds: { type: integer, minimum: 0, exclusiveMinimum: true }

    RunningSessionDetail:
      type: object
      required: [session_id, source]
      description: >
        The running half of a session. The session itself is an ordinary
        `sessions` row created through POST /v1/sessions — this carries only
        what a run has and a lift or a mat session do not: the GPS track,
        splits, elevation and pace. Mirrors BjjSessionDetail's relationship to
        a BJJ session exactly.


        `distance_m` and `duration_seconds` here are the run's own numbers for
        this module's detail screen; they are not what the personal-record
        pipeline reads for `longest_time`/`furthest_distance` — that reads the
        session's own `session_sets` row, same as any other exercise. The two
        are populated from the same client-side numbers and are not
        reconciled against each other.
      properties:
        session_id: { type: string, readOnly: true }
        route_points:
          type: array
          items: { $ref: "#/components/schemas/RunningRoutePoint" }
          description: >
            The GPS track, in recording order. Empty for a manual entry or an
            imported summary with no track — a real run, not an error.
        splits:
          type: array
          items: { $ref: "#/components/schemas/RunningSplit" }
        elevation_gain_m:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: Total climb in metres. Null for a manual entry or a flat route.
        avg_pace_sec_per_km:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: >
            Seconds per kilometre, averaged over the whole run. Not recomputed
            server-side from distance/duration — a client with a real track
            may have a better number (excluding paused time), and this module
            must not silently override it with a coarser one.
        distance_m:
          type: number
          format: double
          nullable: true
          minimum: 0
        duration_seconds:
          type: integer
          nullable: true
          minimum: 0
        source:
          type: string
          enum: [phone_gps, healthkit, manual]
          description: >
            Where the track and numbers came from. `manual` has no track at
            all — hand-entered distance and duration for a run the phone
            wasn't along for.
        healthkit_uuid:
          type: string
          nullable: true
          description: >
            The `HKWorkout.uuid` a HealthKit-imported run came from (N465).
            Null for every source other than `healthkit`. Carries a unique
            index per user — re-sending the same UUID under a DIFFERENT
            session_id than the one that already holds it is refused with
            `already_exists`. This refuses the duplicate DETAIL row only; it
            is the backstop for a reinstalled app or a second device (the
            ordinary same-device repeat import never reaches this endpoint
            at all, since the mobile app checks its own local ledger
            first) — the client that receives this error deletes the
            session it just created rather than leaving an orphaned,
            detail-less duplicate behind, which is what makes "no duplicate
            run" hold end to end rather than just at this one row.
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    RunningDistanceRecord:
      type: object
      description: >
        A personal-best pace for a standard race distance (5k, 10k, half
        marathon, marathon), achieved as a contiguous stretch of splits
        within a run rather than necessarily the whole run — L12/#778. A
        deliberately separate concept from `PersonalRecord`: the evidence
        here is a WINDOW inside one session's own splits (`start_split`/
        `end_split`), not a single logged row, so it does not fit
        `PersonalRecord`'s shape and is served from its own endpoint instead
        of `GET /v1/records`.
      required:
        [standard_distance, distance_m, value_seconds, session_id,
         start_split, end_split, actual_distance_m, actual_duration_seconds,
         achieved_at, is_recent]
      properties:
        standard_distance:
          type: string
          enum: [5k, 10k, half_marathon, marathon]
        distance_m:
          type: number
          format: double
          description: The standard distance's own length in metres (5000, 10000, 21097.5 or 42195).
        value_seconds:
          type: number
          format: double
          description: >
            The winning window's average pace projected onto the standard
            distance EXACTLY (pace × distance_m) — the number a "PR"
            comparison ranks on. Not the same as `actual_duration_seconds`,
            whose window rarely lands on the standard distance exactly; see
            `actual_distance_m`.
        session_id: { type: string }
        start_split:
          type: integer
          description: >
            Index (0-based) into that session's own `RunningSessionDetail.splits`
            where the matched window begins, inclusive.
        end_split:
          type: integer
          description: Index (0-based, inclusive) where the matched window ends.
        actual_distance_m:
          type: number
          format: double
          description: >
            The matched window's real total distance — within ±1% of
            `distance_m` by construction, never exactly equal to it, since a
            match is only as fine-grained as the splits actually recorded.
        actual_duration_seconds:
          type: number
          format: double
          description: The matched window's real elapsed time, unnormalized.
        achieved_at:
          type: string
          format: date-time
          description: The session's own start time, not when the detail row was saved or edited.
        is_recent:
          type: boolean
          description: Set within the last 14 days, matching `PersonalRecord.is_recent`'s own window.

    BiometricSample:
      type: object
      required:
        [id, metric_type, source, source_platform, value, unit, measured_at]
      description: >
        One raw reading from a platform health store (HealthKit / Health
        Connect) or typed in manually — N476/#821,
        docs/decisions/health-integration-design.md §6.3. Not scoped to a
        session: a session's heart-rate enrichment (SessionMetrics below) is
        derived by reading whatever samples fall in that session's own
        started_at/ended_at window, not written against a session directly.
      properties:
        id:
          type: string
          description: >
            Client-generated, matching activities' idempotency pattern — a
            sync retry re-sends the same id and converges rather than
            duplicating.
        metric_type:
          type: string
          enum:
            [heart_rate, active_energy, resting_heart_rate, hrv_sdnn,
             hrv_rmssd, sleep_duration, body_mass, vo2_max]
          description: >
            hrv_sdnn and hrv_rmssd are deliberately separate values rather
            than one `hrv` type with a unit column — Apple's SDNN and
            everyone else's rMSSD must never be compared (design doc §5.4).
            vo2_max (N477/#822 iOS, N478/#823 Android) is a device-written
            daily-ish estimate, read but never computed by this API and
            never fed into a session's own metrics (design doc §3) — it is
            read and stored as a profile-level trend only, not joined to
            any one session.
        source:
          type: string
          enum: [apple_watch, oura, whoop, garmin, manual, android_wearable]
          description: >
            android_wearable (N478) is a Health Connect sample whose writing
            app isn't one of the named vendors above — Samsung Health chief
            among them, since Health Connect exposes no stable per-vendor
            identifier this API could otherwise match against.
        source_platform:
          type: string
          enum: [healthkit, health_connect, manual]
        value:
          type: number
          format: double
        unit:
          type: string
          example: bpm
        measured_at:
          type: string
          format: date-time
          description: >
            When the reading was taken — for an interval reading (e.g.
            sleep_duration) this is the interval's START.
        period_end:
          type: string
          format: date-time
          nullable: true
          description: >
            Null for an instantaneous reading (heart_rate, body_mass — most
            rows). Set for one covering an interval, and never before
            measured_at.
        created_at: { type: string, format: date-time, readOnly: true }

    SessionMetrics:
      type: object
      required: [session_id, time_in_zones, hr_source, sample_count, computed_at, rule_version]
      description: >
        Per-session derived enrichment — average/peak heart rate, a
        five-zone breakdown, and one Edwards' TRIMP load number — computed
        on demand from whatever `heart_rate` BiometricSamples fall in the
        session's own time window (design doc §2's "window read"). Absence
        of this object for a session is a NORMAL state (design doc §6.4),
        not an error: enrichment is not blocking, and a session's watch may
        not have synced its samples yet.
      properties:
        session_id: { type: string, readOnly: true }
        avg_hr_bpm:
          type: integer
          nullable: true
          description: Null together with max_hr_bpm and trimp whenever sample_count is 0.
        max_hr_bpm:
          type: integer
          nullable: true
        active_kcal:
          type: integer
          nullable: true
          description: Sum of whatever active_energy samples fall in the window. Null when none were found.
        trimp:
          type: number
          format: double
          nullable: true
          description: >
            Edwards' zone-weighted training impulse — Σ(minutes in zone ×
            zone weight 1-5). Null whenever no HRmax was available to
            classify zones by, even with real samples present — see
            time_in_zones.
        hr_max_bpm:
          type: number
          format: double
          nullable: true
          description: >
            The HRmax value that actually produced this row's trimp/
            time_in_zones (design doc §3) — null together with them on the
            same "couldn't classify" gate, AND on any row computed before
            this field existed (N483/#833; see the 000090 migration — no
            backfill, since no client surface existed yet to have written a
            real row). A recompute overwrites this in place along with the
            rest of the row; there is no history of earlier values.
        hr_max_source:
          type: string
          enum: [estimated, observed]
          nullable: true
          description: >
            Whether hr_max_bpm was the `220 − age` estimate or an observed
            maximum from the athlete's own history — design doc §3: "never
            silently switch between them... which HRmax produced a given
            session's zones belongs in session_metrics alongside hr_source."
            Null under the identical conditions as hr_max_bpm.
        time_in_zones:
          type: object
          description: >
            Minutes spent in each of Edwards' five heart-rate zones, keyed
            "1".."5". An empty object when zones could not be computed
            (no HRmax, or no samples) — never null, so a client can iterate
            without a null check.
          additionalProperties:
            type: number
            format: double
        hr_source:
          type: string
          enum: [workout, window, none]
          description: >
            REQUIRED honesty field (design doc §6.3) — how confidently this
            row is grounded in real evidence. `window` is a plain time-window
            read (the primary path today); `workout` means the samples are
            known to come from a platform workout object matched to this
            session (no caller of this API can produce this yet — the match
            is client-side and nothing client-side reads/writes this API);
            `none` means no heart-rate samples were found at all, which is
            forced regardless of what a caller claims whenever sample_count
            is 0 — never silently defaulted to a value implying more
            confidence than the data has.
        sample_count:
          type: integer
          description: How many heart_rate samples this row was computed from.
        computed_at: { type: string, format: date-time, readOnly: true }
        rule_version:
          type: integer
          description: >
            The TRIMP/zone formula version this row was computed under —
            bumps whenever the formula or zone boundaries change, so a
            client can tell a stale computation apart from a fresh one.

    SessionLoad:
      type: object
      required: [session_id, sport, started_at, trimp]
      description: >
        One session's contribution to the cross-session training-load trend
        — N489/#850. A narrow projection of SessionMetrics joined with the
        owning session's sport/started_at; trimp is never null here — a
        session with no computed metrics, or with hr_source 'none' (no HR
        evidence at all), is excluded from the list entirely rather than
        reported as zero load.
      properties:
        session_id: { type: string, readOnly: true }
        sport:
          type: string
          enum: [strength, running, bjj]
          description: >
            TRIMP is computed identically regardless of sport (trimp.go), so
            this list is genuinely cross-sport — a client draws one trend
            from it rather than three.
        started_at: { type: string, format: date-time }
        trimp:
          type: number
          format: double

    ExerciseHR:
      type: object
      required: [exercise_id, avg_hr_bpm, max_hr_bpm, sample_count]
      description: >
        One exercise's heart-rate readout within a single session — N490/#851,
        extending SessionMetrics' whole-session numbers to the granularity a
        strength athlete actually asked for ("what was my heart rate on
        squats, versus lateral raises"). Computed live from whichever
        `session_sets.performed_at` values exist for that exercise — see
        `GET /biometric/sessions/{sessionID}/exercise-hr`'s own description
        for the join-granularity decision (per exercise, not per set) and why.


        Never reported at 0 for a genuinely absent reading: an exercise with
        no completed set carrying a real `performed_at`, or whose derived
        window contains zero heart_rate samples, is excluded from the list
        entirely — the same "absent, not zero" stance `SessionMetrics.trimp`
        already takes.
      properties:
        exercise_id: { type: string, readOnly: true }
        avg_hr_bpm: { type: integer }
        max_hr_bpm: { type: integer }
        sample_count:
          type: integer
          description: >
            How many heart_rate samples this exercise's window was computed
            from — often small, since an exercise's own window is a few
            minutes at most. A client should read a low count as low
            confidence rather than hide the row outright, the same honesty
            role `SessionMetrics.sample_count` already plays at the whole-
            session level.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_input
                - invalid_grip
                - unauthorized
                - forbidden
                - not_found
                - already_exists
                - rate_limited
                - unavailable
                - internal
              description: >
                `unavailable` accompanies `503` **and `504`**, and means the
                request was fine and the server could not answer it — an
                upstream lookup that timed out, refused, or is not configured on
                this deploy. The two statuses split that on WHOSE clock ran out:
                `503` is the upstream declining or absent, `504` is this service
                giving up waiting on one that was still working. The code is
                shared because the client's move is the same either way.
                **What is not shared is the cost** — a `503`/`unavailable` on
                `/nutrition/estimate` promises the athlete's daily allowance is
                untouched, and a `504` makes no such promise, because the
                provider was reached and its tokens were probably bought. It is
                deliberately NOT `not_found`: "this barcode is not in the
                database" and "I could not reach the database" look identical to
                a client that only sees an empty result, and they are opposite
                instructions. It is not `internal` either — `internal` means
                this server is broken, `unavailable` means something it depends
                on is.


                `invalid_grip` is a narrower `invalid_input`, split out because
                it is the one rejection a client can settle by itself: a set
                names a grip this server does not know, so the client drops the
                grip and retries rather than stranding the session. It exists as
                a CODE because messages are explicitly not part of this
                contract — a client that matched on the wording would break the
                day somebody reworded it.
            message:
              type: string

    Healthz:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: api

    Me:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          example: user_3H8rAWz7wri5uEKGajnj4pLqWXz

    Sex:
      type: string
      nullable: true
      enum: [male, female]

    ShareCard:
      type: object
      description: >
        One waiting share. Carries a handle and a label, never a user id and
        never the resource's contents — the recipient has not accepted it yet,
        so they are owed a description, not the thing itself.
      required: [id, resource_type, resource_label, from, created_at]
      properties:
        id: { type: string }
        resource_type:
          type: string
          description: >
            What kind of thing this is — "sequence", "workout",
            "nutrition_entry", "nutrition_food" or "nutrition_day" today,
            more later. DELIBERATELY NOT AN ENUM: the set is whatever the running
            build has registered, so a client that hard-codes it starts
            rejecting kinds a newer server can legitimately send. Render an
            unknown value rather than failing on it.

            It is WIRE FORMAT, stored in the row and sent by clients, so a value
            that ships can never be renamed without orphaning stored shares.
          example: workout
        resource_label:
          type: string
          description: >
            What the thing was called WHEN IT WAS SENT. A snapshot, not a live
            read: this is a message, and what a message said does not change.
            The copy taken on accept IS live, so a sender who renames in
            between produces a card and a copy that disagree — the copy is
            right, and the card is the record of what was said.
        from:
          type: string
          description: The sender's handle, resolved live so a rename propagates.
        created_at: { type: string, format: date-time }

    SentShareCard:
      type: object
      description: >
        One share the caller is WAITING ON. The same shape as ShareCard with
        the counterpart named for what it is — `to`, not `from`.
      required: [id, resource_type, resource_label, to, created_at]
      properties:
        id:
          type: string
          description: The same id DELETE /v1/shares/{id} takes, to cancel it.
        resource_type: { type: string }
        resource_label: { type: string }
        to:
          type: string
          description: The recipient's handle, resolved live so a rename propagates.
        created_at: { type: string, format: date-time }

    AcceptedShare:
      type: object
      description: >
        The RECIPIENT'S OWN new copy — never the sender's id, which the
        recipient has no permission to open.
      required: [resource_type, resource_id]
      properties:
        resource_type: { type: string }
        resource_id: { type: string }

    FeedItem:
      type: object
      description: >
        One finished session, as somebody else's feed shows it. Deliberately
        NOT a Session with fields removed — that shape would invite the missing
        ones back.
      required:
        - id
        - from
        - display_name
        - sport
        - name
        - started_at
        - ended_at
        - working_sets
        - tonnage_kg
        - detail
        - more
      properties:
        id:
          type: string
          description: >
            The session's id, and a KEY rather than a handle to fetch with — no
            endpoint accepts it from anybody but its owner. It is here because
            a client needs a stable list key.
        from:
          type: string
          description: >
            The owner's HANDLE, never their user id — the rule the whole social
            API follows in both directions. Resolved live, so a rename
            propagates.
        display_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          description: >
            A short-lived presigned URL to the owner's uploaded avatar —
            already resized server-side, never the original (N205, mirroring
            PublicProfile.avatar_url exactly). Omitted (absent from the
            response body, not null) when the owner has no avatar; the
            monogram is the fallback in every client.
        sport:
          type: string
        name:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: Never null — unfinished sessions are excluded entirely.
        working_sets:
          type: integer
          description: >
            How many SETS were performed — warm-ups and uncompleted sets
            contribute nothing, and neither does a drop.


            This deliberately no longer matches the volume rule. A drop is part
            of the set it came off (225x3 stripped to 185x8 is one approach to
            the bar), so it adds no set — while its reps and weight DO count
            toward `tonnage_kg`, because the load was moved. Counting it as a
            set told the athlete they did four where the session screen's own
            row numbers said three.
        tonnage_kg:
          type: number
          description: >
            `reps × weight_kg × load_factor` over the same sets, under the one
            tonnage rule — implements folded in, drops counted. See
            `Set.weight_kg`.
        detail:
          type: array
          description: >
            What was actually done — up to five exercises or techniques. EMPTY
            unless the OWNER has `share_training_details` on, and empty rather
            than null so "opted out" and "an empty session" render identically;
            distinguishing them would advertise who has the switch off.

            Same wire shape as `SessionCardDetail` because one client component
            renders both, with one deliberate difference: a feed row never
            carries `conceded`. What was done TO you is the half of a roll worth
            reviewing on your own card and is not published to friends.
          items: { $ref: "#/components/schemas/FeedItemDetail" }
        more:
          type: integer
          description: >
            How many names `detail` left out, so a card can say "+4 more". Zero
            whenever `detail` is empty.

    FeedItemDetail:
      type: object
      description: >
        One line of what was done. Structurally identical to
        `SessionCardDetail`; separate because the two endpoints may not diverge
        silently and a shared ref would hide it when they do. A backend test
        marshals both and compares.
      required: [name]
      properties:
        name: { type: string }
        figure:
          type: string
          description: >
            Strength only — the top working set, e.g. "140 kg × 5". The weight
            is **per implement**, like every load this API publishes: a pair of
            30 kg dumbbells reads "30 kg × 5". See `Set.weight_kg`.
        outcome:
          type: string
          description: >
            BJJ only — `scored`, `attempted` or `drilled`. Never `conceded`:
            see `detail` above.
        count:
          type: integer
          description: BJJ only, present when more than one.

    SessionCard:
      type: object
      description: >
        The numbers a finished session's share card shows and the client cannot
        compute for itself. Everything here is DERIVED on read — there is no
        card table and no score column — so editing a set changes the card next
        time it is opened rather than leaving a stale figure behind.
      required: [calories, score, detail, more]
      properties:
        calories:
          type: object
          nullable: true
          description: >
            Null when there is no bodyweight on record at or before the
            session. That is a refusal, not a gap: weight is the dominant input
            and a 55 kg and a 105 kg athlete doing identical work differ by
            nearly half, so there is no honest default. Clients ask for a
            check-in rather than showing a guess.
          allOf: [{ $ref: "#/components/schemas/SessionCalories" }]
        score:
          type: object
          nullable: true
          description: >
            Null below eight prior sessions of the same sport. A percentile
            against three is noise wearing a number.
          allOf: [{ $ref: "#/components/schemas/SessionScore" }]
        detail:
          type: array
          description: >
            Exercises for strength, techniques for BJJ, capped server-side.
            Trimming on the client would ship a whole session's list to render
            five rows of it.
          items: { $ref: "#/components/schemas/SessionCardDetail" }
        more:
          type: integer
          description: How many rows `detail` omitted, for a "+4 more" line.

    SessionCalories:
      type: object
      required: [kcal, precision]
      properties:
        kcal:
          type: integer
          description: >
            NET kilocalories — the extra over resting, not the gross figure
            that includes what you would burn lying still. Deliberately far
            below what consumer trackers report: an hour of ordinary lifting is
            around 185, not 400–600. Always rendered with a "≈".
        precision:
          type: string
          enum: [estimated, coarse]
          description: >
            `estimated` when weight, height, age and sex are all known and the
            resting rate comes from Mifflin–St Jeor. `coarse` with weight
            alone, falling back to the conventional 1-MET baseline, which runs
            20–30% high for many people. Two different claims, so clients
            should not render them identically.

    SessionScore:
      type: object
      required: [value, basis, compared]
      properties:
        value:
          type: integer
          minimum: 0
          maximum: 100
          description: >
            The share of your own recent sessions of this sport that this one
            beat. Never a comparison with other people. Half of all sessions
            fall below 50 by construction — the number is meant to be able to
            disappoint.
        basis:
          type: string
          enum: [effort, volume]
          description: >
            `effort` is RPE × duration (what the session cost); `volume` is the
            fallback when effort tracking is off (how big it was). The meaning
            of the number changes with it, so it travels with it.
        compared:
          type: integer
          description: How many prior sessions it was ranked against.

    SessionCardDetail:
      type: object
      required: [name]
      properties:
        name: { type: string }
        figure:
          type: string
          description: >
            Strength only — the top working set, e.g. "140 kg × 5". The weight
            is **per implement**, like every load this API publishes: a pair of
            30 kg dumbbells reads "30 kg × 5". See `Set.weight_kg`.
        outcome:
          type: string
          description: >
            BJJ only — `scored`, `attempted`, `drilled`, `conceded`. The
            difference between drilling a technique and hitting it live is the
            reason anyone logs BJJ, so the card carries it.
        count:
          type: integer
          description: BJJ only, present when more than one.

    FriendCard:
      type: object
      description: >
        One person as the social lists show them — the same public fields as
        PublicProfile plus the relationship timestamp. Never a user id: the
        social API addresses everyone by handle, in both directions.
      required: [username, display_name, since]
      properties:
        username: { type: string }
        display_name: { type: string, nullable: true }
        avatar_url:
          type: string
          description: >
            A short-lived presigned URL to this person's uploaded avatar —
            already resized server-side, never the original (N205, mirroring
            PublicProfile.avatar_url exactly). Omitted (absent from the
            response body, not null) when they have no avatar; the monogram
            is the fallback in every client.
        since:
          type: string
          format: date-time
          description: Accepted-at on the friends list; requested-at on request lists.

    FriendRequests:
      type: object
      description: >
        Both directions of pending, split because they mean different actions —
        incoming rows carry accept/decline, outgoing rows carry only cancel.
      required: [incoming, outgoing]
      properties:
        incoming:
          type: array
          items: { $ref: "#/components/schemas/FriendCard" }
        outgoing:
          type: array
          items: { $ref: "#/components/schemas/FriendCard" }

    PublicProfile:
      type: object
      description: >
        What one athlete may see of another — the username-lookup response,
        and deliberately a separate schema from Profile: this is the first
        endpoint that shows an account to someone who does not own it, and a
        schema that never had date_of_birth or sex cannot leak them.
      required: [username, display_name]
      properties:
        username:
          type: string
        display_name:
          type: string
          nullable: true
          description: The human name beside the handle, or null if never set.
        avatar_url:
          type: string
          description: >
            A short-lived presigned URL to the athlete's uploaded avatar —
            already resized server-side, never the original. Omitted
            (absent from the response body, not null) when no avatar is
            set; the monogram is the fallback in every client.

    Profile:
      type: object
      required:
        - user_id
        - username
        - display_name
        - date_of_birth
        - sex
        - unit_system
        - track_effort
        - share_training_with_friends
        - share_training_details
        - activity_level
        - created_at
        - updated_at
      properties:
        user_id:
          type: string
        username:
          type: string
          nullable: true
          pattern: "^[a-z][a-z0-9_]{2,29}$"
          description: >
            The unique, claimable handle — the lookup key the sharing design
            is built on. Null until claimed; claiming is opt-in until sharing
            ships.


            Lowercase only, 3-30 characters of a-z 0-9 _, starting with a
            letter. Uniqueness is case-insensitive at the database (an index
            on lower(username)), so the lowercase rule is canonical form, not
            the collision boundary. Reserved words (admin, vola, me, settings,
            …) are refused server-side; the list is Go code, not schema, so it
            can grow without a migration.


            Renaming is allowed and frees the old handle — nothing references
            a username by value; friends and shares key on user_id. CLEARING
            is not supported: nil in a PATCH means "leave unchanged", the
            same contract as every other profile field.
        display_name:
          type: string
          nullable: true
          description: >
            Free prose for SHOWING a person, never for finding one — that is
            the username's job, and neither field can do the other's.
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex:
          $ref: "#/components/schemas/Sex"
        height_cm:
          type: number
          nullable: true
          description: >
            Centimetres. What waist-to-height and the body-fat estimate are
            derived from — neither can be computed without it. On the profile
            rather than on each check-in because it is a fact about the athlete
            that does not move week to week; per check-in it would be asked for
            every time and let rows disagree.
        unit_system:
          type: string
          enum: [metric, imperial]
          description: >
            Display units only. Training data is stored in kilograms and
            metres regardless, so changing this can never alter a recorded
            number — only how it's shown and entered. Storing converted
            values would make every historical row ambiguous, and would break
            the progression rule, which compares weights across sessions.
        food_unit:
          type: string
          nullable: true
          enum: [g, oz]
          description: >
            Display unit for FOOD quantities (N90). **Null is a real state** —
            "not chosen yet", which falls back to deriving from `unit_system`
            (imperial to oz, metric to g) and still follows a later change to
            it. An explicit `g` does not, which is why null is not defaulted
            away.


            Its own field rather than derived from `unit_system`, because
            kitchen scales and US nutrition labels are both in grams: an
            imperial athlete weighing chicken still wants grams.


            Display only — quantities are stored in grams, always, exactly as
            training weights are stored in kilograms. Note PATCH cannot clear
            this back to null.
        track_effort:
          type: boolean
          description: >
            Whether the clients collect RIR and RPE. On by default — the
            progression rule is built on them, and silently withholding its
            only input would make the app look broken rather than simple.
        share_training_with_friends:
          type: boolean
          description: >
            THE ONLY THING THAT MAKES AN ATHLETE'S TRAINING READABLE BY ANOTHER
            ATHLETE. Every other read of a session is scoped to its owner
            without exception; sharing moves copies on an explicit
            send-and-accept precisely so it never has to answer this.


            Off by default, and no update may turn it on implicitly — a PATCH
            that omits the key leaves it alone, like every other field here.


            Read LIVE at query time rather than stamped onto each session, so
            turning it off retracts everything at once. The consequence is that
            turning it ON is retroactive: accepted friends see finished
            sessions from before the switch. Clients must say so.
        share_training_details:
          type: boolean
          description: >
            How MUCH of a shared session travels once the switch above has let
            it travel at all: the numbers alone, or the exercise/technique list
            with them. Two switches because they disclose different things —
            the numbers say you trained hard, the detail says what you are
            working on.


            Off by default, and SUBORDINATE: it does nothing while
            share_training_with_friends is off, because the detail is only ever
            attached to rows that switch already returned.


            Read LIVE too, so turning it off strips the detail from every past
            row immediately — and turning it ON is retroactive in the same way.
        activity_level:
          type: string
          enum: [sedentary, light, active]
          nullable: true
          description: >
            Daily movement OUTSIDE logged training — the NEAT term in the
            calorie derivation. The vocabulary stops at `active` (an
            on-your-feet job) on purpose: textbook multipliers run to 1.9 with
            exercise already folded in, and adding logged sessions on top of one
            of those counts every mat class twice.


            Null means the athlete has never chosen, which is a DIFFERENT fact
            from having chosen `light`. A derivation with null assumes `light`
            and reports `activity_chosen: false`, so a client can render the
            assumption as an assumption instead of showing a filled control for
            a decision nobody made. Kept nullable for exactly that reason rather
            than defaulted in the column.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        avatar_url:
          type: string
          description: >
            A short-lived presigned URL to the athlete's own uploaded
            avatar. Omitted (absent, not null) when none is set — see
            POST/DELETE /profile/avatar.

    ProfileCreate:
      type: object
      properties:
        display_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex:
          $ref: "#/components/schemas/Sex"
        height_cm:
          type: number
          nullable: true
          description: >
            Centimetres. What waist-to-height and the body-fat estimate are
            derived from — neither can be computed without it. On the profile
            rather than on each check-in because it is a fact about the athlete
            that does not move week to week; per check-in it would be asked for
            every time and let rows disagree.

    ProfileUpdate:
      type: object
      description: Partial update — omitted fields are left unchanged.
      properties:
        username:
          type: string
          nullable: true
          pattern: "^[a-z][a-z0-9_]{2,29}$"
          description: >
            Claim or rename the caller's handle. An explicit `null` is
            accepted and means "leave unchanged", exactly like omitting the
            key — clearing a claimed handle is not supported. 409 `already_exists` when it
            belongs to someone else — which does confirm the handle exists,
            an enumeration surface accepted when usernames were chosen over
            invite codes. Re-sending your own current handle is idempotent.
        display_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex:
          $ref: "#/components/schemas/Sex"
        height_cm:
          type: number
          nullable: true
          description: >
            Centimetres. What waist-to-height and the body-fat estimate are
            derived from — neither can be computed without it. On the profile
            rather than on each check-in because it is a fact about the athlete
            that does not move week to week; per check-in it would be asked for
            every time and let rows disagree.
        unit_system:
          type: string
          enum: [metric, imperial]
          description: >
            Display units only. Training data is stored in kilograms and
            metres regardless, so changing this can never alter a recorded
            number — only how it's shown and entered. Storing converted
            values would make every historical row ambiguous, and would break
            the progression rule, which compares weights across sessions.
        food_unit:
          type: string
          nullable: true
          enum: [g, oz]
          description: >
            Display unit for FOOD quantities (N90). **Null is a real state** —
            "not chosen yet", which falls back to deriving from `unit_system`
            (imperial to oz, metric to g) and still follows a later change to
            it. An explicit `g` does not, which is why null is not defaulted
            away.


            Its own field rather than derived from `unit_system`, because
            kitchen scales and US nutrition labels are both in grams: an
            imperial athlete weighing chicken still wants grams.


            Display only — quantities are stored in grams, always, exactly as
            training weights are stored in kilograms. Note PATCH cannot clear
            this back to null.
        track_effort:
          type: boolean
          description: >
            Whether the clients collect RIR and RPE. On by default — the
            progression rule is built on them, and silently withholding its
            only input would make the app look broken rather than simple.
        share_training_with_friends:
          type: boolean
          description: >
            Opt in or out of the friends' feed. Absent means "leave alone" — a
            client that does not know about this field can never change it,
            which is what keeps an older build from publishing somebody's
            training by omission.
        share_training_details:
          type: boolean
          description: >
            Opt in or out of publishing the exercise/technique list alongside
            the numbers. Absent means "leave alone", for the same reason.
        activity_level:
          type: string
          enum: [sedentary, light, active]
          nullable: true
          description: >
            The athlete's daily-movement choice. Absent — or an explicit
            `null` — means "leave unchanged", the same contract as every other
            field here, so a client that has never heard of this field cannot
            clear it. Going back to "never chosen" is therefore not expressible
            through this path; nothing needs it, and the target screens PATCH
            this one key on its own.


            An out-of-vocabulary value is a 400 rather than a silent fall back
            to the default: substituting `light` for a typo would return a 200
            naming a level the caller never asked for, and the client would
            cache it as the athlete's own choice.

    Flag:
      type: object
      description: >
        A server-controlled, global on/off switch — distinct from
        profile's per-user module toggles. Read-only for now; toggled
        via direct SQL until there's a write endpoint.
      required: [key, enabled, description, updated_at]
      properties:
        key:
          type: string
          example: new_recommendation_engine
        enabled:
          type: boolean
        description:
          type: string
        updated_at:
          type: string
          format: date-time

    ModuleList:
      type: object
      required: [modules]
      properties:
        modules:
          type: array
          items:
            $ref: "#/components/schemas/Module"

    Module:
      type: object
      required: [key, label, is_sport, default_on, enabled, capabilities]
      properties:
        key:
          type: string
          description: Stable identifier. Also the `sport` value when `is_sport` is true.
          example: bjj
        label:
          type: string
          description: >
            Display name. Carries the acronym — deriving it by capitalising the
            key yields "Bjj", which is why every client previously grew its own
            special case for exactly one value.
          example: BJJ
        is_sport:
          type: boolean
          description: >
            Whether this discipline can appear as a `sport` on an exercise,
            workout or session. False for nutrition, which is a module with no
            catalog, no session and no row — a toggle only.
        default_on:
          type: boolean
          description: What a user gets before expressing any preference.
        enabled:
          type: boolean
          description: This caller's setting, falling back to `default_on`.
        capabilities:
          $ref: "#/components/schemas/ModuleCapabilities"

    ModuleCapabilities:
      type: object
      required: [catalog, record_kinds]
      description: >
        What a discipline supports. Separate from `enabled` on purpose: "is BJJ
        on?" and "does BJJ have 1RM records?" are different questions, and
        collapsing them gives a BJJ-only athlete a Records screen whose record
        kinds are all lift- or run-shaped.


        These do NOT decide whether a metric is shown. Clients choose
        volume-vs-time from the data present, so an athlete who spent a month on
        the mat sees time rather than a flat zero volume line even with strength
        enabled.
      properties:
        catalog:
          type: string
          description: Content kind the Library shows — `exercises`, `techniques`, or empty.
          example: techniques
        facets:
          type: array
          nullable: true
          items:
            type: string
          description: >
            Extra filter axes beyond the catalog's own — BJJ has `position`
            and `belt`, strength has `muscle` and `movement`. These are axes a
            client renders controls for, NOT query parameters: every facet is
            filtered client-side from fields already present on the catalog
            rows, so none of them appears in a request.
        has_goals:
          type: boolean
          description: Gates the powerlifting/hypertrophy/endurance picker. Strength only.
        has_progression:
          type: boolean
          description: Gates the double-progression UI.
        record_kinds:
          type: array
          items:
            type: string
          description: >
            Personal-best kinds that mean anything here. Empty for BJJ — a
            discipline with none should not be offered a Records screen.

    FlagList:
      type: object
      required: [flags]
      properties:
        flags:
          type: array
          items:
            $ref: "#/components/schemas/Flag"

    Technique:
      type: object
      description: >
        One entry in the BJJ technique library. Deliberately not an Exercise:
        a technique isn't measured (you never log "3 sets of armbar"), and it
        lives in a graph — it comes from a position and is answered by
        counters. Reference content, identical for every user.
      required:
        [id, name, aliases, category, position, position_detail, gi_no_gi,
         typical_belt, description, when_to_use, setup_from,
         common_next_moves, common_counters, video_reference, source_notes,
         ibjjf_ruleset_id, created_at, updated_at]
      properties:
        id: { type: string, example: armbar-from-closed-guard }
        name: { type: string }
        aliases:
          type: array
          items: { type: string }
        category:
          type: string
          description: >
            Submission, Sweep, Pass, Escape, Takedown, Control/Pin, Transition,
            Guard Retention, Other. The colloquial label — what a coach says out
            loud. See `function` for the queryable axis.
          example: Submission
        function:
          type: string
          enum: [advance, reverse, escape, control, finish]
          description: >
            What the technique DOES, independent of where it happens. The five
            verbs of the taxonomy: advance (takedowns, passes, back takes),
            reverse (sweeps), escape (pin escapes, submission defence, guard
            retention), control (pins, rides, grip and frame systems), finish
            (submissions).

            Use this rather than `category` to ask "every way to X from here".
            `category` is colloquial and fuses two axes — "Takedown" means
            advance-at-standing and "Pass" means advance-at-guard-top — so
            "every way to advance" spans three categories while this is one
            value.

            ABSENT on a handful of movement fundamentals (breakfalls, grappling
            stance) which are library content rather than techniques and have no
            verb. Treat missing as "not applicable", not as an error.
          example: finish
        position:
          type: string
          description: Where it happens.
          example: Guard - Bottom
        position_detail: { type: string }
        gi_no_gi:
          type: string
          enum: [Both, "Gi Only", "No-Gi Only"]
        typical_belt:
          type: string
          example: White
          description: >
            The belt at which this is recommended to start — never a gate.
            An athlete below that belt is not doing anything out of order by
            drilling it. It sits beside IBJJF legality and the two answer
            different questions: you may drill a technique long before you
            are allowed to compete it. Present it subordinate to `ibjjf`,
            never as a gate.
        description:
          type: string
          description: The mechanics — how the technique is performed.
        when_to_use:
          type: string
          description: >
            The decision — when the mechanics apply, and what has to be true
            first. Distinct from `description` on purpose; merging them
            produces a paragraph that answers neither question well.
        to_position:
          type: string
          description: >
            Where the technique LEAVES you. Closes the half of the graph
            `position` and `function` cannot express — where it starts and
            what it does, but not where it ends.


            SPARSE ON PURPOSE, and absent far more often than present. It is
            authored rather than derived: name parsing reached 42% over the
            466 rows then held (mostly submissions, whose destination is the
            end of the exchange), and inverting `setup_from` infers a real
            position change for only 47 of the 542 rows the column was
            authored over — of the 184 with followers, 137 have every
            follower in the SAME position, because that edge links
            control-to-attack WITHIN a position.
            Populated where the destination is both knowable and useful
            (passes, sweeps, back takes, takedowns).


            ABSENT means NOT RECORDED, never "goes nowhere". A technique that
            genuinely leaves you where you started carries its own `position`
            value here, so "stays put" is a recorded fact rather than an
            absence. Do not infer a self-loop from a missing key.
          example: Side Control - Top
        setup_from:
          type: array
          description: >
            Graph edge — positions or techniques this is set up from. About 84%
            of entries name a real technique in the library.
          items: { type: string }
        common_next_moves:
          type: array
          description: >
            Graph edge — what commonly follows. Only ~29% of entries name a
            technique in the library; the rest is prose like "establish grips
            or inside ties". A client may link the ones that resolve but MUST
            render the others as plain text — a dead link is worse than text.
          items: { type: string }
        common_counters:
          type: array
          description: >
            Graph edge — what answers this technique. Only ~6% resolve to a
            library entry; treat as prose.
          items: { type: string }
        video_reference:
          type: string
          description: >
            Empty for every technique in the current library. Render nothing
            when blank rather than an empty section implying a missing video.
        source_notes: { type: string }
        ibjjf_ruleset_id:
          type: string
          description: >
            References an IBJJFRuleset. Empty if the technique predates the
            rulesets; treat that as "legality unknown", not "legal".
        ibjjf:
          allOf: [{ $ref: "#/components/schemas/IBJJFRuleset" }]
          description: >
            Resolved on the detail endpoint only, so a technique detail is one
            request. Absent from list responses — fetch /techniques/rulesets
            once and resolve `ibjjf_ruleset_id` locally.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TechniqueSummary:
      type: object
      description: >
        The list row. Carries what is needed to render, filter and search the
        library and nothing else — the prose fields are most of the library's
        bytes and a list needs none of them. Full rows would ship ~587 KB to
        draw a scrolling list of 542; this is ~197 KB — re-measured
        2026-08-06 after the curriculum gap-fill (previously ~485/~175 over
        466; originally written as ~70 KB and left to drift 2.3x).
        Gzipped it is ~22 KB, though the API does not currently compress.

        Aliases ARE included: the client searches locally, and "kesa gatame"
        must find "Scarf Hold".


        `setup_from` is included too, which is what makes the library a
        GRAPH rather than 542 isolated entries. It names what a technique
        comes from; a client inverts it once over this list to get the far
        more useful direction — what FOLLOWS from here. Detail-only, that
        would cost one request per technique to walk a single hop. It adds
        ~24 KB (+14%) versus the field being absent entirely.
      required:
        [id, name, aliases, category, position, position_detail, gi_no_gi,
         typical_belt, ibjjf_ruleset_id, setup_from]
      properties:
        id: { type: string }
        name: { type: string }
        aliases:
          type: array
          items: { type: string }
        category: { type: string }
        function:
          type: string
          enum: [advance, reverse, escape, control, finish]
          description: >
            What the technique DOES, independent of where it happens. The five
            verbs of the taxonomy: advance (takedowns, passes, back takes),
            reverse (sweeps), escape (pin escapes, submission defence, guard
            retention), control (pins, rides, grip and frame systems), finish
            (submissions).

            Use this rather than `category` to ask "every way to X from here".
            `category` is colloquial and fuses two axes — "Takedown" means
            advance-at-standing and "Pass" means advance-at-guard-top — so
            "every way to advance" spans three categories while this is one
            value.

            ABSENT on a handful of movement fundamentals (breakfalls, grappling
            stance) which are library content rather than techniques and have no
            verb. Treat missing as "not applicable", not as an error.
          example: finish
        position: { type: string }
        position_detail: { type: string }
        gi_no_gi:
          type: string
          enum: [Both, "Gi Only", "No-Gi Only"]
        typical_belt: { type: string }
        source:
          type: string
          enum: [seed, admin]
          description: >
            Where this technique came from: `seed` means the deploy owns it (the
            embedded JSON rewrites it on every release), `admin` means it was
            authored in the console and the database owns it. Read-only — the
            server sets it, so a client cannot promote its own row out of the
            deploy's reach or demote a seeded one into it. Note a PATCH through
            `/admin/*` moves a row from `seed` to `admin` as a side effect: that
            is what stops the next release reverting the edit.
        status:
          type: string
          enum: [draft, published]
          description: >
            Whether athletes can see it. `published` is in the public catalog;
            `draft` is visible only through `/admin/*` — not in
            `GET /techniques` and not findable through the library.


            **A draft technique CAN still be referenced by id** — tagged into a
            BJJ session, a focus list, a curriculum or a sequence. Those four
            write paths validate against the foreign key, which does not know
            about `status`. The exercise catalog does not have this gap: its two
            write paths (workout items, session sets) check for `published`
            explicitly. Closing it here means adding that check in four modules
            and is not yet done — stated rather than implied, because an earlier
            version of this description claimed drafts were "not taggable" and
            nothing enforced it.


            **Present only on `/admin/*` responses**, and for a stronger reason
            than `source`: a technique read the public way is published by
            definition, because the API filters drafts out entirely.


            The console CREATES as `draft`. Editing a published technique leaves
            it published — a typo fix should reach athletes rather than withdraw
            the technique. Publishing is `POST /admin/techniques/{id}/publish`
            and is ONE-WAY; see that operation for why.


            **Present only on `/admin/*` responses.** It is ABSENT from
            `GET /techniques/{techniqueID}`, which does not select the column —
            so do not derive ownership from it there. Its absence means "this
            endpoint does not report provenance", never "not admin-authored".
            Use membership of `GET /admin/techniques` instead.
        ibjjf_ruleset_id: { type: string }
        to_position:
          type: string
          description: >
            Where the technique LEAVES you. Declared here as well as on the
            detail schema because the LIST is where a graph consumer reads it
            — walking the transition map from 542 detail calls is not a thing
            anyone would do.


            SPARSE ON PURPOSE (170 of 542) and hand-authored: name parsing
            reached 42% over the 466 rows then held, and inverting
            `setup_from` infers a real position change for only 47 of the 542
            it was authored over, because that edge links control-to-attack
            WITHIN a position.


            ABSENT means NOT RECORDED, never "goes nowhere" — a technique
            that genuinely leaves you where you started carries its own
            `position` value here. Do not infer a self-loop from a missing
            key.
          example: Side Control - Top
        setup_from:
          type: array
          items: { type: string }
          description: >
            What this technique is commonly set up from, by NAME (matching
            `name` or an entry in `aliases`), not by id. ~84% resolve to a
            library entry; the rest name a concept the library has no node
            for yet — "Underhook", "Crossface" — so a client should count
            what it could not resolve rather than silently dropping it.
          example: [De La Riva Guard Control]

    IBJJFRuleset:
      type: object
      description: >
        One IBJJF competition ruling, shared by every technique it applies to.
        25 of these cover all 542 techniques — normalised because `age_scope`
        has one distinct value library-wide and the most common `notes` string
        repeats 359 times at ~200 characters.
      required:
        [id, age_scope, rule_class, gi_allowed_belts, gi_note,
         no_gi_allowed_belts, no_gi_note, is_restricted, notes, sources]
      properties:
        id: { type: string, example: brown-black-only-adult }
        age_scope: { type: string, example: "Adult (18+) — Gi and No-Gi separated" }
        rule_class: { type: string, example: "Brown/Black only — Adult" }
        gi_allowed_belts:
          type: array
          description: >
            EMPTY MEANS "this division does not apply" — a no-gi-only technique
            has no gi belts — NOT "allowed at no belt". The reason is in
            `gi_note`.
          items: { type: string }
        gi_note: { type: string, example: "N/A — no-gi-specific" }
        no_gi_allowed_belts:
          type: array
          items: { type: string }
        no_gi_note: { type: string }
        is_restricted:
          type: boolean
          description: >
            Whether this is a GENUINE restriction rather than the shape of
            IBJJF's divisions. Adult no-gi has no white belt division, so a
            no-gi list of "Blue, Purple, Brown, Black" is the BASELINE.
            Do NOT re-derive this by comparing belt lists — that marks 468
            ordinary techniques (pummelling, sit-outs) as restricted when the
            true number is 27. Use this field; it is computed at import.
        notes: { type: string }
        sources:
          type: array
          items: { type: string, format: uri }

    TechniqueList:
      type: object
      required: [techniques]
      properties:
        techniques:
          type: array
          items: { $ref: "#/components/schemas/TechniqueSummary" }

    IBJJFRulesetList:
      type: object
      required: [rulesets]
      properties:
        rulesets:
          type: array
          items: { $ref: "#/components/schemas/IBJJFRuleset" }

    Position:
      type: object
      description: >
        One entry in the BJJ position glossary — the nodes of the graph the
        technique library forms. Techniques are the edges between positions;
        this is what the positions themselves are, written for someone who has
        never trained. Eleven curated entries, read-only, the same for every user.
      required:
        [
          id,
          name,
          aliases,
          family,
          detail_includes,
          detail_excludes,
          order_index,
          description,
          priorities,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          description: Hand-authored and stable, unlike an IBJJFRuleset's content-addressed id.
          example: closed-guard
        name: { type: string, example: Closed Guard }
        aliases:
          type: array
          items: { type: string }
          description: What else the position is called — "full guard", "closed".
        family:
          type: string
          description: >
            The join key back to the library, and the FIRST of two filters —
            never sufficient alone. Match it against a TechniqueSummary's
            `position` BY PREFIX (`position === family ||
            position.startsWith(family + " - ")`) — the technique rows carry
            side-qualified values like "Guard - Bottom", so an equality check
            finds almost nothing. NOTE "Back", not "Back Control", for
            back_control.

            Then narrow with `detail_includes`/`detail_excludes`. Stopping here
            puts closed and open guard on the same 161 techniques.
          enum:
            [
              Standing,
              Guard,
              Half Guard,
              Side Control,
              Mount,
              North-South,
              Back,
              Turtle,
              Leg Entanglement,
            ]
          example: Guard
        detail_includes:
          type: array
          items: { type: string }
          description: >
            Narrows the family match using a TechniqueSummary's
            `position_detail`. When non-empty, ONLY techniques whose
            `position_detail` appears here belong to this position. Empty on
            most entries, meaning "the whole family".
          example: [Closed Guard, Rubber Guard]
        detail_excludes:
          type: array
          items: { type: string }
          description: >
            The opposite operation, applied after `detail_includes`: techniques
            whose `position_detail` appears here are dropped.

            A client MUST apply BOTH, or the two guard entries collapse back
            into one list. `family` cannot separate closed guard from open
            guard — the technique rows record only "Guard - Bottom" — so
            without these, Open Guard lists closed-guard techniques directly
            beneath a description saying the ankles are not locked. Closed
            guard whitelists the two details it wants; open guard blacklists
            the same two, because "everything else in the family" spans 26
            values that grow with the library.
          example: [Closed Guard, Rubber Guard]
        order_index:
          type: integer
          description: >
            Pedagogical reading order, not alphabetical — standing, then the
            guards, then the pins roughly as a beginner meets them. Already
            applied by the list endpoint; re-sorting by name undoes the point.
          example: 10
        description:
          type: string
          description: What the position is, and how you end up in it.
        priorities:
          type: string
          description: >
            What each player is trying to do while there. Covers both sides of
            the position in one field, separated by a blank line — every
            position is someone's good news and someone else's problem.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PositionList:
      type: object
      required: [positions, round_map]
      properties:
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
        round_map: { $ref: "#/components/schemas/RoundMap" }

    RoundMap:
      type: object
      description: >
        The teaching diagram of a round: what the positions are, how you move
        between them, and which way is up. Authored rather than derived — the
        library does carry a real position graph in `to_position`, but only
        170 of 542 techniques record one. Measured against the catalog: the
        mount-to-back edge does not exist, the side-control-to-mount edge rests
        on a single technique, and not one Escape-category technique records
        where it leaves you — so the whole loop back from the bad places is
        missing. A drawn map with holes reads as "you cannot get there" rather
        than "nobody wrote this down", which is worse than no map. The structure
        is authored; every node points at a real position and resolves to real
        techniques.
      required: [title, intro, bands, nodes, edges]
      properties:
        title: { type: string }
        intro:
          type: string
          description: The paragraph a beginner reads before the diagram means anything.
        bands:
          type: array
          description: >
            The reading key for the tier ladder — which stretch counts as
            ahead, even and behind. Ordered from the top down, and a node
            belongs to the FIRST band whose `min_tier` it clears, so they
            partition the nodes and a gap between two bands cannot exist.
            Authored rather than derived from the sign of `tier`, so the
            wording lives in one place instead of being restated by every
            client that draws the ladder.
          items: { $ref: "#/components/schemas/RoundMapBand" }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/RoundMapNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/RoundMapEdge" }

    RoundMapBand:
      type: object
      required: [min_tier, label, note]
      properties:
        min_tier:
          type: integer
          description: >
            Inclusive. The lowest band sits far below the lowest node rather
            than exactly on it, so adding a worse position later cannot fall
            out of every band.
          example: 1
        label: { type: string, example: You are ahead }
        note: { type: string }

    RoundMapNode:
      type: object
      description: >
        One place you can be. Nodes are SIDED and the glossary is not — it
        describes closed guard once, for both players, which is right for a
        glossary and useless for a route, since "sweep" and "get swept" would
        be the same arrow. So a node carries both keys, and two nodes may share
        a `position_id`: being mounted and mounting are one position and
        opposite places to be.
      required: [id, label, position_id, position, detail_includes, detail_excludes, tier, note]
      properties:
        id: { type: string, example: mount-top }
        label: { type: string, example: Mount }
        position_id:
          type: string
          description: The glossary entry behind this node.
          example: mount
        position:
          type: string
          description: >
            The sided value to filter the library by, matching
            `Technique.position` EXACTLY (not a prefix).
          example: Mount - Top
        detail_includes:
          type: array
          items: { type: string }
          description: >
            Narrow within `position` using `Technique.position_detail`, exactly
            as a glossary entry narrows within its `family`. Needed because the
            library has no knee-on-belly `position` value at all — those
            techniques sit under "Side Control - Top" carrying the detail — so
            without it two nodes resolve to one list. A whitelist; empty means
            the whole position.
        detail_excludes:
          type: array
          items: { type: string }
          description: >
            A blacklist. Never set alongside `detail_includes`, which already
            excludes everything not on it.
        tier:
          type: integer
          description: >
            What the position is worth FROM YOUR SIDE — 5 on their back, -3
            with your own back taken, 0 standing. Ordering, not arithmetic: the
            gap between two tiers means nothing and several nodes share one. It
            is the whole hierarchy in one integer, which is what lets a narrow
            screen render the map as a ladder without the edges at all.
          example: 4
        note: { type: string }

    RoundMapEdge:
      type: object
      required: [from, to, label, kind]
      properties:
        from: { type: string, example: side-control-top }
        to: { type: string, example: mount-top }
        label: { type: string, example: Transition }
        kind:
          type: string
          enum: [route, recover, concede]
          description: >
            `route` is you advancing, `recover` is you getting out of a bad
            place, `concede` is you losing ground. Three rather than two
            because a map with no concede edges leaves every bad position with
            nothing pointing at it, which draws as unreachable — and "how did I
            end up here" is the question a beginner looking at one is usually
            asking.

    WorkoutItem:
      type: object
      description: >
        One entry in a workout's ordered contents. Every target is optional
        because which ones apply is decided by the exercise's own load_type —
        a plank has no reps, a run has no weight. `position` is assigned from
        array order on write, never trusted from the client.
      required: [exercise_id, position, notes]
      properties:
        exercise_id: { type: string, example: barbell-bench-press }
        position: { type: integer }
        target_sets: { type: integer, nullable: true }
        target_reps: { type: integer, nullable: true }
        target_weight_kg:
          type: number
          nullable: true
          description: >
            **Per implement**, the same reading as the `weight_kg` it will be
            logged as — what to put on ONE dumbbell, not the pair. A template
            authored in total kilograms would double every dumbbell session's
            tonnage the moment it was performed. See `Set.weight_kg`.
        target_seconds: { type: integer, nullable: true }
        target_distance_m: { type: integer, nullable: true }
        notes: { type: string }
        protocol:
          $ref: "#/components/schemas/ItemProtocol"

    SetPrescription:
      type: object
      description: >
        One planned set within a per-item protocol (`ItemProtocol.sets`) —
        finer-grained than the item's own single target_sets/target_reps/
        target_weight_kg, which can only describe one uniform set. A
        top-set/backoff scheme has no single set of numbers that describes
        both.
      required: [role]
      properties:
        role:
          type: string
          enum: [warmup, working, top_set, backoff, amrap]
        load_kg: { type: number, nullable: true }
        rep_range_min: { type: integer, nullable: true }
        rep_range_max: { type: integer, nullable: true }
        effort_rir_min:
          type: integer
          nullable: true
          description: Reps in reserve this set should finish with at minimum.
        effort_rir_max: { type: integer, nullable: true }
        rest_seconds: { type: integer, nullable: true }
        optional:
          type: boolean
          description: >
            True for a set the athlete may skip without the session reading
            as incomplete (an "if time allows" backoff, say).

    ItemProtocol:
      type: object
      description: >
        A workout item's own progression configuration (N494/#864, phase 2
        of #753 — see docs/decisions/history.md). Every field is optional:
        an absent/null ItemProtocol, or one whose fields are all empty,
        means "nothing configured here" — the progression engine's
        priority order (program prescription → athlete's own configuration
        → exercise-profile default → abstain) then falls through to the
        next level rather than treating that as an error. A profile default
        is a DEFAULT, never an authority — any field configured here always
        wins over one.
      properties:
        progression_strategy:
          type: string
          nullable: true
          enum:
            [double_progression, linear, top_set_backoff,
             difficulty_progression, program_controlled]
        rep_range_min: { type: integer, nullable: true }
        rep_range_max: { type: integer, nullable: true }
        target_sets: { type: integer, nullable: true }
        target_rir:
          type: integer
          nullable: true
          description: Mirrors Set.rir's own type — the same unit a logged set records effort in.
        target_rpe: { type: number, nullable: true }
        rep_count_mode:
          type: string
          nullable: true
          enum: [total, per_side]
          description: >
            Whether reps are counted across the whole set (a barbell squat)
            or per side (a walking lunge, a single-arm row).
        equipment_increment:
          type: number
          nullable: true
          description: >
            In kilograms, matching target_weight_kg elsewhere on this item —
            clients convert for display. The literal smallest loadable jump
            this item's own equipment supports, used instead of a
            movement-pattern guess when present.
        exercise_profile:
          type: string
          nullable: true
          enum:
            [primary_compound, secondary_compound_lunge, isolation_accessory,
             calf_high_rep_accessory, bodyweight_difficulty_progression,
             timed_distance]
          description: >
            Tags which profile this item should inherit DEFAULTS from,
            without spelling out every field. Any other field also set
            explicitly on this same object still wins over the tagged
            profile's own default for that one question.
        sets:
          type: array
          items: { $ref: "#/components/schemas/SetPrescription" }

    Workout:
      type: object
      description: >
        A workout *template* — deliberately distinct from a logged session
        (see Activity). Keeping them separate is what preserves the gap
        between planned and actual, which is the adherence signal.
        One discipline per workout; mixing is not supported.
      required:
        [id, owner_user_id, name, sport, goal, notes, visibility, items,
         created_at, updated_at]
      properties:
        id:
          type: string
          description: Client-generated, so a workout can be created offline and synced idempotently.
        owner_user_id:
          type: string
          nullable: true
          description: Null for a VOLA-authored official template.
        name: { type: string, example: Push Day A }
        sport:
          type: string
          enum: [strength, running, bjj]
        goal:
          type: string
          nullable: true
          enum: [general, powerlifting, hypertrophy, endurance]
          description: >
            The training style, which is *not* a sport — powerlifting,
            hypertrophy and endurance are all done with the same barbell
            squat, so this belongs to the workout, not the exercise. Only
            meaningful for strength.
        notes: { type: string }
        visibility:
          type: string
          enum: [private, public]
          description: Defaults to private — sharing is always a deliberate act.
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkoutItem" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkoutList:
      type: object
      required: [workouts]
      properties:
        workouts:
          type: array
          items: { $ref: "#/components/schemas/Workout" }

    Plan:
      type: object
      description: >
        One intended session on one day — the third leg of a distinction the
        API already half-drew. A Workout is the template (what a session looks
        like), a Session is what happened, and a Plan is what was *meant* to
        happen and when. A template has no date and a session is the actual,
        so neither can say what Tuesday was for.

        A plan is an intention. This resource has no completion status and
        never gains one — the server does not join plans to sessions, and
        nothing writes "done" onto a plan. A planned day can be trained twice,
        ignored, or trained with something else, and all three are ordinary.
        Adherence is a query over both resources, computed by a client when
        asked; how a client chooses to match the two is its own decision and
        is not part of this contract.
      required: [id, user_id, day, sport, workout_id, class_plan_id, time_of_day_minutes, notes, created_at, updated_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        day:
          type: string
          format: date
          description: >
            A calendar date, `YYYY-MM-DD` — never a timestamp. "Tuesday's
            session" is a claim about the athlete's own calendar, and an
            instant would slide the plan across a day boundary the moment they
            travel. A timestamp here is rejected rather than truncated.
          example: "2026-08-04"
        sport:
          type: string
          enum: [strength, running, bjj]
        time_of_day_minutes:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1439
          description: >
            When on `day` this is planned for, as minutes since LOCAL
            midnight — wall-clock, with no timezone attached, e.g. `1140` for
            7:00 PM. The athlete's own local time on the day in question,
            never converted through any zone (matching `day` itself), and
            never a Postgres/RFC3339 timestamp — the identical representation
            `daily_trackers.cutoff_minutes` already uses for the same category
            of value (a bare clock reading with no zone), chosen for the
            identical reason: nothing here knows what zone the athlete is in
            when they read it back, so a zoned type would invite a naive
            comparison against `now()` in UTC.

            `null` means no time was given — a real, permanent state, not a
            default of midnight. Every plan that existed before this field was
            added has this value, and it renders as "day only" forever rather
            than a guessed time.
          example: 1140
        workout_id:
          type: string
          nullable: true
          description: >
            The template this day is planned around, or null when the day is
            planned as a bare discipline — "Tuesday is BJJ" is a complete plan,
            and mat sessions have no template at all.

            Becomes null if the template is later deleted: the plan degrades to
            its discipline rather than disappearing.

            Mutually exclusive with `class_plan_id` — a plan may reference a
            workout template or a class plan, never both.
        class_plan_id:
          type: string
          nullable: true
          description: >
            The coach's class plan this day is scheduled from — a scheduled
            BJJ class rather than a scheduled strength/running session. Null
            when the day names no class plan.

            Becomes null if the class plan is later deleted: the plan degrades
            to its discipline rather than disappearing, matching `workout_id`.

            Mutually exclusive with `workout_id`.
        notes: { type: string, maxLength: 500 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PlanList:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items: { $ref: "#/components/schemas/Plan" }

    LoggedSet:
      type: object
      description: >
        One set actually performed. Every measure is optional because which
        ones apply is decided by the exercise's own load_type — a plank has
        no reps, a run has no weight.

        `rir` and `rpe` are two views of the same quantity (RPE 8 is roughly
        2 RIR). Both are stored because lifters are fluent in one or the
        other and rarely both, and asking for a conversion just after a hard
        set is the wrong moment for arithmetic.


        DROP SETS. A drop is its own row with its own weight_kg and reps —
        225x3 then 185x8 is two rows, the second with set_type=drop.


        A set's drops are the CONSECUTIVE drop rows immediately following it,
        all of the same exercise. Contiguity is the rule, not "the nearest
        preceding non-drop row": given [bench working, squat drop, bench drop],
        the squat drop breaks the run and the bench drop is orphaned rather than
        attached. That state is a client bug either way, but clients implement
        this from here, so two of them must not render it differently.


        There is no parent id. The server replaces a session's sets wholesale on
        every save, so row ids are regenerated and any stored parent reference
        would dangle on the first edit. Order is the relationship, and position
        is already total and unique per session.
      required: [exercise_id, position, set_type, notes]
      properties:
        exercise_id: { type: string, example: barbell-back-squat }
        assisted_reps:
          type: integer
          nullable: true
          minimum: 0
          example: 3
          description: >
            How many of `reps` somebody else helped with — a spotter, a band, an
            assisted-pull-up machine. Must be between 0 and `reps` inclusive,
            and `reps` must be present.


            `reps` still holds the FULL count, assisted included, so every
            existing figure reads the same number it always did. The one worth
            training against is `reps - assisted_reps`: "225 for 5 then 3 with a
            spotter" is 8 reps of work and 5 of capability, and the athlete's
            target is to need the help for one or two rather than three.


            NULL is UNRECORDED and 0 is "none of them" — different claims, and
            both legal. Nobody should have to type 0 on every set, and treating
            absent as 0 would assert that every set logged before this field
            existed was performed unaided. Absent reads as all-solo.


            A spotted set is still ONE set. It is not split into an unassisted
            row and an assisted one — one approach to the bar, one rest period,
            one entry in the working-set count.
        grip:
          type: string
          nullable: true
          enum: [regular, neutral, reverse, angled, mixed, hook]
          example: neutral
          description: >
            How the implement was held for this set: `regular` (overhand,
            pronated), `neutral` (palms facing), `reverse` (underhand,
            supinated), `angled` (the canted position an EZ-bar or multi-grip
            handle forces), `mixed` (one hand over, one under) or `hook`
            (thumb trapped under the fingers).


            **A property of the SET, not of the exercise.** A catalog row per
            grip would multiply the 762-row catalog into something near 3,000 and
            still not express what athletes do — switch on the last set because
            the first three hurt — while splitting one exercise's history in
            two, so the progression rule and the personal records would each see
            half the sets.


            **NULL is UNRECORDED, and that is not `regular`.** Every set logged
            before this field existed chose no grip, and reading silence as
            overhand would have the app assert training that never happened.
            Clients show nothing rather than a default.


            Nothing is derived from it — it is recorded and displayed, never
            summed — so it appears only on this schema and not in any figure.


            **Which values a client OFFERS depends on the movement, and the
            server does not enforce that pairing.** Pushes, pulls and isolation
            work get the first four; hinges get regular/neutral/mixed/hook;
            carries and olympic lifts get regular/neutral/hook. `mixed` is
            offered on hinges alone — you do not mix-grip a snatch. Hinges and
            olympic lifts include `neutral` because the catalog puts hex-bar
            deadlifts and kettlebell swings in the first and kettlebell cleans
            and snatches in the second.


            The subset is a question-quality rule, not a constraint: this API
            accepts any value in the enum for any exercise, because refusing an
            unusual-but-real pairing (a hook-gripped shrug) would invent a false
            negative. Only the vocabulary is enforced, and an unknown value is
            rejected with the dedicated code `invalid_grip` rather than
            `invalid_input`, so a client can drop the grip and retry rather than
            surfacing an error a human cannot act on.


            **`mixed` records no side.** One hand is over and one is under, and
            lifters alternate which — but nothing consumes that, and asking
            between sets collects a careless answer. Adding `mixed_left`/
            `mixed_right` later is cheap by the same `invalid_grip` mechanism.
        load_factor:
          type: integer
          example: 2
          description: >
            How many implements of `weight_kg` were moved: 1 for a barbell, a
            machine, or a single kettlebell held in two hands; 2 for a PAIR of
            dumbbells. Total load is `weight_kg x load_factor`.


            RESPONSE ONLY — assigned from the exercise's `implements`, which is
            a property of the movement. A client sending it is asserting
            something about a catalog row it does not own, so writes ignore it.


            Was derived from `load_mode` and `is_unilateral` together until
            migration 000057; see `implements` on the Exercise schema for why
            that could not express a movement with two implements and one limb.


            Absent means 1. Older clients and sets logged before this existed
            carry no factor, and reading that as zero would erase their volume
            rather than under-reporting the dumbbell ones.
        position:
          type: integer
          description: Assigned from array order on write, never trusted from the client.
        set_type:
          type: string
          enum: [warmup, working, backoff, drop, amrap, failure]
          description: >
            Warm-ups count toward neither working sets nor tonnage — counting
            them would make a light day look like a hard one.
        reps: { type: integer, nullable: true }
        weight_kg:
          type: number
          nullable: true
          description: >
            **WHAT IS STAMPED ON THE IMPLEMENT — not the total moved.** For a
            barbell or a machine those are the same number. For a PAIR of
            dumbbells this is ONE of them, and the total is
            `weight_kg × load_factor`.


            This is the unit the athlete is asked for at every capture surface
            ("Weight is per hand — what one hand holds, not the pair"), so it is
            the unit stored, and **every load figure this API publishes is in it
            too**: `top_weight_kg`, the `heaviest_weight` record, both 1RM
            estimates and their evidence, and the weights a suggestion or a
            workout item targets. A client renders any of them as logged.


            **`tonnage_kg` is the ONE exception**, because it is the only figure
            that asks how much work was moved rather than how heavy the lift
            was. It, and only it, multiplies by `load_factor`.


            So the two readings a client needs, stated once:


            | quantity | rule |
            |---|---|
            | any load | `weight_kg`, as logged |
            | tonnage | `reps × weight_kg × load_factor` |


            Worked example — a pair of 30 kg dumbbells, 5 reps, 2 RIR: the
            tonnage is `5 × 30 × 2` = **300 kg** and the estimated 1RM is
            `30 × 36/(37−7)` = **36 kg**. Both come off this one field, and
            neither is wrong.
        seconds: { type: integer, nullable: true }
        distance_m: { type: integer, nullable: true }
        rir:
          type: integer
          nullable: true
          minimum: 0
          maximum: 20
          description: Reps in reserve. 0 is meaningful — nothing left in the tank.
        rpe:
          type: number
          nullable: true
          minimum: 1
          maximum: 10
          description: Rate of perceived exertion, half steps allowed.
        notes: { type: string }
        completed:
          type: boolean
          description: >
            Whether this set was actually performed. The volume summary
            counts only completed sets, so a session's numbers climb as it
            is performed rather than starting at the plan's total. A set
            built from a template starts false.

            Defaults to `false` when omitted on write — a set the client
            didn't explicitly mark done is treated as planned, not
            performed.
        performed_at:
          type: string
          format: date-time
          nullable: true
          description: >
            The real moment this set was actually completed — N490/#851 —
            stamped by the client the instant it ticks the set done, never
            derived from when the session happened to be saved.


            That distinction matters because `created_at` cannot serve it:
            this API replaces a session's whole set list on every save
            (`PUT .../sets`), so a stored `created_at` always reads as "the
            last time this session was saved", identical across every set in
            it — worthless for anything that needs to know WHEN a set
            happened relative to another.


            NULL is UNRECORDED, and stays that way for a great many rows —
            every set logged before this field existed, and any set entered
            as a reflection well after training rather than ticked live. A
            reader deriving a per-exercise heart-rate window
            (`GET .../exercise-hr`) simply excludes a set with no
            `performed_at`, the same "absent, not zero" stance this API
            already takes on `SessionMetrics`' own figures.

    Session:
      type: object
      description: >
        A training session that actually happened, and the sets in it —
        deliberately distinct from a Workout, which is the *plan*. Keeping
        them apart is what preserves the gap between prescribed and actual.
        A session may follow a template or be entirely freeform.
      required:
        [id, user_id, workout_id, sport, name, intent, started_at, ended_at,
         notes, sets, created_at, updated_at]
      properties:
        id:
          type: string
          description: Client-generated, so a session survives an offline start and syncs idempotently.
        user_id: { type: string }
        workout_id:
          type: string
          nullable: true
          description: >
            The template followed, if any. Null for a freeform session, and
            also null once a followed template is deleted — history outlives
            the plan it came from.
        sport: { type: string, enum: [strength, running, bjj] }
        name: { type: string, example: Push Day A }
        intent:
          type: string
          enum: [normal, light, deload]
          default: normal
          description: >
            What the athlete meant this session to be (N474) — decided by
            them, never inferred from what they actually lifted. `light` and
            `deload` sessions are still real training: their sets count fully
            toward volume, history and exercise stats. The ONE thing intent
            changes is `GET /v1/sessions/suggestions` — a `light`/`deload`
            session is skipped when that endpoint finds its evidence session,
            so a deliberately lighter day never becomes the next suggestion's
            baseline. `normal` is the default and the common case; every
            session created before this field existed is `normal`.
        started_at:
          type: string
          format: date-time
          description: Client-supplied — logging can happen well after the fact.
        ended_at:
          type: string
          format: date-time
          nullable: true
          description: Null while the session is still in progress.
        notes: { type: string }
        sets:
          type: array
          items: { $ref: "#/components/schemas/LoggedSet" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RepRange:
      type: object
      description: The rep window a lift progresses inside before load moves.
      required: [low, high]
      properties:
        low: { type: integer, example: 6 }
        high: { type: integer, example: 10 }

    Suggestion:
      type: object
      description: >
        What to load today for one exercise, and for how many reps, derived
        from what the caller actually did in their last few sessions.

        The scheme is **double progression, autoregulated by reported effort**:
        work inside a rep range, adding reps at the same load until every
        working set reaches the top of the range with reserve to spare, then
        add load and drop back to the bottom. Effort gates both halves — a set
        taken to failure is not evidence of room — and three sessions stuck at
        one load triggers a deload rather than another repeat.

        Deterministic and explainable by construction — no model, no hidden
        weighting. This is why RIR and RPE are collected at all: weight alone
        can't say whether a set was easy, since a lifter who grinds out five
        reps and one who leaves three in reserve log the identical row. When
        no effort was recorded the honest answer is "repeat it", not a guess.

        The evidence travels with every suggestion, including when the answer
        is to repeat — a number the athlete can check beats one they have to
        trust. Note that `last_weight_kg`, `last_reps`, `last_rir` and
        `last_rpe` all describe the **same single top set** and are only
        meaningful together; `last_min_reps` / `last_max_reps` are the spread
        across every working set and belong to the session, not to any one set.

        Branch on `code`; `reason` is prose and is not part of the contract.


        `in_session_signal` is a SEPARATE, additive note — see its own
        description and N191. Everything else on this object stays a pure
        function of the caller's history; it never changes because of
        `in_session_signal` being present.


        **N496/#866 (phase 4 of #753) — why this object is not a "recommendation
        products bolted together" violation.** #753 §4 forbids combining
        distinct recommendation KINDS into one card/response: "next-session
        load/reps, a warm-up ramp, an in-session adjustment, and weekly program
        balance/exercise-selection advice" — its own example being that "add
        hamstring work" cannot be concluded from one workout and must never
        share a confidence framing with a same-exercise rep/load suggestion.
        This object carries three of those four kinds — the standing
        prescription (`code`/`reason`/`target_weight_kg`/`target_reps`/the
        evidence fields), `in_session_signal` (N191) and `warmup` (N495/#865)
        — as **sibling fields on one response**, which is deliberate, reviewed
        under this ticket, and judged NOT to be the failure #753 describes,
        for a reason specific to these three and not a license to add a
        fourth:


        All three answer questions of the SAME evidence class — this caller's
        own logged sets, from this session or its own recent history, nothing
        wider. None needs the weekly program or a muscle taxonomy the way
        "add hamstring work" does, so none carries a confidence claim the
        other two would contradict. Each is independently typed and
        documented (`WarmupStep`, `InSessionSignal`, and the prescription
        fields themselves), each states its own evidence in its own `reason`,
        and each is explicitly documented as ADDITIVE — `in_session_signal`
        and `warmup` are read-only annotations that never rewrite
        `target_weight_kg`/`target_reps`, so a client reading only the
        prescription sees exactly the object it always has. Sharing one
        response body is a **latency** decision, not a confidence-hiding one:
        the warm-up ramp has to be visible before the first set of an
        exercise, one-handed, standing at the rack, and a second round trip
        mid-workout was rejected on exactly that basis in N495 — see
        `docs/decisions/history.md`.


        The `weekly program balance/exercise-selection` kind #753 actually
        warns about — "add hamstring work" and anything like it — **does not
        exist anywhere in this codebase.** Nothing here reads across sessions
        to recommend a change to the program itself, and nothing on this
        object represents one. **If that kind is ever built, it MUST ship as
        its own product** — its own schema, and very likely its own endpoint
        — never as a field here, however small: its evidence (the whole
        week's program, a validated muscle taxonomy) and its confidence class
        are categorically different from the three above, which is the actual
        thing #753 §4 is protecting against. A future PR adding a field like
        `program_suggestion` to this object should be read as reintroducing
        the bug this note exists to prevent, not as a reasonable extension of
        it.
      required: [exercise_id, code, reason, target_weight_kg, target_reps,
                 rep_range, last_performed_at, last_weight_kg, last_reps,
                 last_rir, last_rpe, last_min_reps, last_max_reps,
                 working_sets, sessions_at_load, hit_target_effort,
                 estimated_1rm_kg, best_1rm_kg, in_session_signal]
      properties:
        exercise_id: { type: string, example: back-squat }
        target_weight_kg:
          type: number
          nullable: true
          description: >
            What to load, **per implement** — the number to put on ONE dumbbell,
            not the pair, matching the unit `weight_kg` is logged in so a client
            can prefill the input with it unchanged. See `Set.weight_kg`.


            Equal to `last_weight_kg` whenever the answer is to
            repeat, about 10% below it on a deload; null when there's nothing
            to say (no history, or not measured in weight).


            Always lands on a loadable 1.25 kg step, and an increase is capped
            at 5% of what's on the bar — a fixed 2.5 kg is 1.8% of a 140 kg
            bench and 6% of a 40 kg one, and the second is a stall waiting to
            happen.
        target_reps:
          type: integer
          nullable: true
          description: >
            How many reps to aim for, always inside `rep_range` — clamped even
            on the "repeat what you did" codes, since the range belongs to the
            *current* workout's goal while the history may come from a block
            with a different one.


            This moves in most sessions and the load doesn't, so a client that
            fills in the weight but ignores this drops the half of the
            recommendation that actually changes.
        rep_range:
          allOf:
            - $ref: "#/components/schemas/RepRange"
          description: >
            Set by the `goal` query parameter, not by the exercise: the same
            squat is a 3-rep lift in a powerlifting block and a 10-rep lift in
            a hypertrophy one.
        last_performed_at:
          type: string
          format: date-time
          nullable: true
          description: When the most recent session containing it started.
        last_weight_kg:
          type: number
          nullable: true
          description: >
            The top set's load, **as logged — per implement**, so it renders
            beside `target_weight_kg` in the same unit the athlete will type
            back in. See `Set.weight_kg`.
        last_reps:
          type: integer
          nullable: true
          description: >
            The top set's own reps — the FULL count, assisted included, so it
            matches what the athlete logged and sees in their history.
        last_assisted_reps:
          type: integer
          nullable: true
          description: >
            How many of `last_reps` had help. Absent means none recorded.


            `last_reps - last_assisted_reps` is what was done unaided, and it is
            what the rep-range progression is measured against — counting
            spotted reps toward a range would let a spotter walk the athlete up
            to a load the evidence does not support. The estimated 1RM uses the
            same number, and DISCARDS `last_rir`/`last_rpe` when there is
            assistance: an effort rating on an assisted set describes the whole
            set, so adding it to the solo reps would re-inflate the estimate.


            Both numbers are sent so a client can render "8 (5 alone)" without
            inferring either.
        last_rir: { type: integer, nullable: true, description: The top set's reserve. }
        last_rpe: { type: number, nullable: true, description: The top set's RPE. }
        last_min_reps:
          type: integer
          nullable: true
          description: >
            Fewest reps on any working set last session. **This is what gates
            progression**, not the best set: a session opening at 10 and ending
            at 6 is not a 10-rep session, and adding load to it is how a lifter
            stalls inside a fortnight.
        last_max_reps: { type: integer, nullable: true }
        working_sets:
          type: integer
          description: >
            How many sets were performed last session — warm-ups, uncompleted
            sets and DROPS all excluded, matching every other set count in the
            API. A drop is part of the set it came off, so it adds none.
        sessions_at_load:
          type: integer
          description: >
            Consecutive recent sessions at this same weight **without gaining a
            rep** — the stall signal.


            Both halves matter. Climbing 6 → 7 → 8 at a fixed weight *is* the
            first phase of double progression, so counting those as a stall
            would deload a lifter who is doing exactly what they were told.
            And consecutive, because a load returned to after a deload is a
            fresh attempt rather than a continuing plateau.
        hit_target_effort:
          type: boolean
          description: Every working set finished at or above 2 reps in reserve.
        estimated_1rm_kg:
          type: number
          nullable: true
          description: >
            One-rep max implied by the last top set, **with effort folded in**
            — a set of 5 with 3 RIR is evidence of an 8-rep max, not a 5-rep
            one, and ignoring that would read stopping short as a strength
            loss. Brzycki (`w × 36/(37−r)`), which returns the weight itself at
            one rep rather than inflating a true single.


            **`w` is `weight_kg` AS LOGGED — per implement, `load_factor` NOT
            applied**, and this is the one place the difference is worth
            spelling out because the same screen also shows a tonnage that DOES
            apply it. A 1RM is what a lifter quotes, and nobody quotes a
            dumbbell press as the pair: a set of 5 with 2 RIR at 30 kg per hand
            estimates **36 kg**, not 72. See `Set.weight_kg` for the full rule.


            **`r` is EFFECTIVE reps, not logged reps** — stated in symbols so it
            need not be inferred from the examples:


            - `rir` present: `r = reps + rir`. RIR **wins** whenever both it and
              `rpe` are given; it is the directly observed quantity where RPE
              has to be converted.
            - `rpe` only: `r = reps + max(0, 10 − min(rpe, 10))`. Kept
              **fractional, never rounded** — the scale is used in half steps,
              and rounding makes 8.5 and 8 give the same answer.
            - neither: `r = reps`, which under-states a submaximal set. The
              honest direction to be wrong in.
            - assisted sets are the exception, and it inverts the rule: `r` is
              the SOLO count and effort is **discarded**, because an RIR on an
              assisted set describes the set including the help. See
              `last_assisted_reps`.


            `r > 12` returns null rather than a fiction, and `r ≤ 1` returns `w`
            unchanged — a true single is its own maximum.


            Null when the set can't support an estimate: no weight recorded,
            or more than 12 effective reps, past which every rep-max curve is
            fiction.
        best_1rm_kg:
          type: number
          nullable: true
          description: >
            The highest estimate anywhere in the caller's history for this
            exercise, so the current one reads as progress rather than as a
            bare number. Not simply the heaviest set — 5×100 estimates above a
            110 single.


            Per implement, on the same rule as `estimated_1rm_kg` above.
        code:
          type: string
          enum: [add_reps, add_load, deload, hold, no_history, not_applicable,
                 repeat_hard, repeat_unknown_effort, repeat_stale,
                 effort_conflict, abstain, no_recent_normal_session]
          description: >
            The four progression outcomes:


            `add_reps` — reserve left but the range isn't finished, so the
            reps move and the load holds. Where most sessions land.
            `add_load` — every working set reached the top of the range with
            reserve to spare, the one condition that earns weight. Adds the
            movement's increment (5 kg squat/hinge/olympic, 2.5 kg
            push/pull/lunge, 1.25 kg isolation), capped at 5% of the bar.
            `deload` — three consecutive sessions at one load with no rep
            gained. Drops ~10% and rebuilds from the top of the range. Climbing
            reps at a fixed weight is not a stall; it is the scheme working.
            `hold` — at least one set was close to the limit; repeat until
            every set is comfortable.


            And the cases where the rule declines to advance:


            `repeat_hard` — a set at or near failure, meaning fewer than one
            rep left in reserve (RIR 0, or RPE above 9). Not evidence of room,
            whatever the reps said.
            `repeat_unknown_effort` — no RIR or RPE recorded anywhere in the
            session, so nothing says it was easy.
            `repeat_stale` — last performed over 28 days ago, which outranks
            effort: an old easy set is evidence about someone who has since
            detrained. `no_history` — never logged. `not_applicable` — not
            measured in weight.


            Behind `new_recommendation_engine` only (N473/#812) — see the
            endpoint description above:


            `effort_conflict` — a set logged both a RIR and a RPE and they
            imply materially different reserve (an "RPE 8 / 0 RIR"-style
            contradiction). `target_weight_kg`/`target_reps` are both null:
            the engine is declining to guess which reading is right rather
            than letting RIR silently win.
            `abstain` — the evidence is ambiguous rather than simply absent
            (`repeat_unknown_effort` above already covers "no effort recorded
            at all"): effort was recorded on some but not every straight
            working set at the anchor weight, or finished history exists but
            never produced a usable straight-set cohort at all.
            `target_weight_kg`/`target_reps` are both null here too — an
            honest "can't tell" carries no guessed number.


            `no_recent_normal_session` (N474) — history exists, but every
            reachable session was tagged `light`/`deload` on `Session.intent`
            — there is genuinely no normal-intensity evidence to build a
            suggestion from. Distinct from `no_history`, which means nothing
            was ever logged: this means something WAS logged, repeatedly, and
            none of it counts as evidence of capacity. `target_weight_kg` and
            `target_reps` are both null on this code, same as `no_history`.
        reason:
          type: string
          description: Human-readable, cites the evidence. Never pattern-match on it.
          example: Every set hit 10 with something left. Add weight and drop back to 6 reps.
        in_session_signal:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/InSessionSignal"
          description: >
            Set when today's own already-logged working sets for this
            exercise (see `today_sets` on the request) diverge meaningfully
            from `target_weight_kg` above — see N191.


            Null covers three cases alike: nothing logged for this exercise
            yet today, no numeric prescription to compare against
            (`no_history`/`not_applicable`/`no_recent_normal_session`), or
            today agrees closely enough with the plan that flagging it would
            be noise. A client that ignores this field sees exactly the
            recommendation it always has — this never rewrites
            `target_weight_kg` or `target_reps`.
        warmup:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/WarmupStep" }
          description: >
            N495/#865 (phase 3 of #753) — a generated warm-up ramp, present
            ONLY when `new_recommendation_engine` is enabled for the caller
            AND `target_weight_kg` above is non-null. Absent (or an empty
            list is never sent; this is omitted entirely) whenever the
            working target is unknown — #753's own rule, "no automatic
            warm-up when the working target is unknown" — and always absent
            under the legacy engine, matching every other v2-only field on
            this object.


            Every step is a PERCENTAGE of `target_weight_kg`, never an
            absolute weight — this is a configurable starting policy, not
            one fixed universal ramp, so the same shape of response scales
            to a 60 kg press and a 200 kg squat alike.

    WarmupStep:
      type: object
      description: >
        One rung of a generated warm-up ramp (N495/#865) — see `Suggestion.warmup`.
      required: [label, percent_of_work, weight_kg, rep_min, rep_max]
      properties:
        label:
          type: string
          description: >
            A human-readable name for this rung ("technique", "light",
            "moderate", "heavy"). Never parsed — branch on position in the
            array if you need to, not on this string.
          example: moderate
        percent_of_work:
          type: number
          description: >
            The fraction of `target_weight_kg` this rung is loaded at
            (e.g. `0.725` for 72.5%).
        weight_kg:
          type: number
          description: >
            `target_weight_kg * percent_of_work`, already rounded to the
            athlete's real equipment increment/unit system — the same
            rounding `target_weight_kg` itself already received.
        rep_min:
          type: integer
        rep_max:
          type: integer
          description: >
            Reps decrease as `percent_of_work` increases across the ramp —
            a heavier rung never carries a wider rep window than a lighter
            one before it.

    InSessionSignal:
      type: object
      description: >
        The note layered on top of a history-derived `Suggestion` when
        today's own working sets disagree with it — see N191. Carries its own
        `code`/`reason` for the same "argue with the number" reason
        `Suggestion` does.
      required: [code, reason, average_weight_kg, working_sets]
      properties:
        code:
          type: string
          enum: [in_session_above, in_session_below]
          description: >
            `in_session_above` — today's own working sets, so far, average
            meaningfully heavier than `target_weight_kg`.
            `in_session_below` — the mirror case, meaningfully lighter.
        reason:
          type: string
          description: Human-readable. Never pattern-match on it.
          example: >-
            Today's own 2 sets so far are meaningfully heavier than the plan
            above, which is still built from last time. The number here
            hasn't changed — that's your call to make if today's the real one.
        average_weight_kg:
          type: number
          description: The mean weight across the working sets this is built from.
        working_sets:
          type: integer
          description: How many of today's own working sets went into the average.

    SuggestionList:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/Suggestion" }

    Volume:
      type: object
      description: >
        The derived working-volume summary, computed server-side so both
        clients report identical numbers rather than each rolling their own
        arithmetic. Warm-up and uncompleted sets are excluded from the
        WORKING fields throughout.


        TWO RULES, differing by one clause. `working_sets` counts what the
        athlete would call a set, and a DROP is not one — 225x3 stripped to
        185x8 is one approach to the bar, so it is one set with a drop off it.
        `total_reps` and `tonnage_kg` DO include that drop, because the reps
        were performed and the load was moved.


        N495/#865 (phase 3 of #753): a completed warm-up set's own reps and
        tonnage are not discarded — they land on `warmup_sets`/`warmup_reps`/
        `warmup_tonnage_kg` below, tracked SEPARATELY so auditing preparatory
        fatigue has a real number, without ever inflating the working totals
        above. A set moves from the warm-up fields to the working ones only
        when the athlete explicitly edits its own `set_type` — never
        automatically, and never as a side effect of any suggestion or flag.
      required: [working_sets, total_reps, tonnage_kg, hardest_rpe, exercise_ids,
                 warmup_sets, warmup_reps, warmup_tonnage_kg]
      properties:
        working_sets: { type: integer }
        total_reps: { type: integer }
        tonnage_kg:
          type: number
          description: >
            Sum of `reps × weight_kg × load_factor` over completed, non-warm-up
            sets — **total work moved**, so a pair of dumbbells counts twice.


            The factor is the reason this is not simply `reps × weight_kg`:
            `weight_kg` is per implement (see `Set.weight_kg`), and this is the
            one published figure that converts it to a total. Every OTHER load
            this API returns — top set, records, 1RM — stays per implement.
        hardest_rpe:
          type: number
          description: >
            Highest RPE over the *completed working* sets; 0 when none
            carried one. A hard warm-up single shouldn't set the session's
            headline difficulty, and neither should a set that was planned
            but never performed.
        exercise_ids:
          type: array
          items: { type: string }
        warmup_sets:
          type: integer
          description: >
            Completed warm-up sets — the warm-up-side mirror of
            `working_sets`, counted separately rather than folded in.
        warmup_reps:
          type: integer
          description: The warm-up-side mirror of `total_reps`.
        warmup_tonnage_kg:
          type: number
          description: The warm-up-side mirror of `tonnage_kg`.

    SessionPage:
      type: object
      description: >
        One page of sessions plus the size of the whole matching set. `total`
        is counted with the identical predicate in the same request, so a
        "21-40 of 137" reading can never disagree with the rows beside it.
      required: [sessions, total, limit, offset]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/Session" }
        total:
          type: integer
          description: >
            Sessions matching the filter, ignoring limit/offset. Counted with
            the same predicate in the same request. Not the same snapshot —
            a session written between the count and the page can move it by
            one.
        limit: { type: integer }
        offset: { type: integer }

    PinnedExercises:
      type: object
      required: [exercise_ids]
      properties:
        exercise_ids:
          type: array
          maxItems: 12
          items: { type: string }
          description: Ordered by the athlete's own preference, not alphabetically.

    PersonalRecord:
      type: object
      description: >
        One best, and the set that produced it. The evidence travels with the
        number for the same reason it does on a suggestion — a record you can
        open and check beats one you have to trust, and it makes a wrong
        record self-diagnosing.
      required:
        [kind, value, reps, weight_kg, seconds, distance_m, rir, rpe,
         achieved_at, session_id, is_recent]
      properties:
        kind:
          type: string
          enum: [heaviest_weight, estimated_1rm, most_reps, longest_time, furthest_distance]
        value:
          type: number
          description: >
            In storage units — kilograms, reps, seconds or metres, according
            to `kind` — so a client formats it the way it formats everything
            else.


            For the two weight kinds (`heaviest_weight`, `estimated_1rm`) that
            is kilograms **per implement, `load_factor` not applied**, like
            every other load this API publishes. A pair of 30 kg dumbbells sets
            a `heaviest_weight` of 30, never 60 — records are claims about a
            lift, and only `tonnage_kg` asks about total work. See
            `Set.weight_kg`.
        reps: { type: integer, nullable: true }
        weight_kg:
          type: number
          nullable: true
          description: >
            The evidence set's load, per implement — the same reading as
            `value`, so the two are directly comparable. Recomputing an
            `estimated_1rm` from it uses the documented rule rather than bare
            Brzycki on `reps`: that count is the FULL one, and the estimate
            derives from the solo count with effort folded in (see
            `assisted_reps`).
        seconds: { type: integer, nullable: true }
        distance_m: { type: integer, nullable: true }
        rir: { type: integer, nullable: true }
        rpe: { type: number, nullable: true }
        assisted_reps:
          type: integer
          nullable: true
          description: >
            How many of `reps` had help. `reps` is the FULL count on every record
            kind, so a record's evidence matches what the athlete logged — render
            "12 (8 alone)" rather than making the client infer either number.


            The rep PR is nevertheless RANKED on the unaided count: twelve reps
            with four assisted loses to a clean nine, because a PR is a claim
            about what you did yourself.
        achieved_at: { type: string, format: date-time }
        session_id: { type: string }
        is_recent:
          type: boolean
          description: Set within the last two weeks — the only reason to treat one record differently from another.

    LoadHistory:
      type: object
      required: [exercise_id, load_type, points]
      properties:
        exercise_id: { type: string }
        load_type:
          type: string
          description: >
            From the catalog, not the caller — it decides which fields below
            are meaningful.
        points:
          type: array
          items: { $ref: "#/components/schemas/LoadPoint" }
    LoadPoint:
      type: object
      required: [session_id, started_at, tonnage_kg, sets, reps]
      properties:
        session_id: { type: string }
        started_at: { type: string, format: date-time }
        top_weight_kg:
          type: number
          nullable: true
          description: >
            Heaviest working set, **as logged — per implement, `load_factor`
            not applied**. Null for bodyweight, timed or distance work.


            A pair of 30 kg dumbbells reports 30 here while the same set's
            `tonnage_kg` counts 60 per rep. That is deliberate and is the whole
            of `Set.weight_kg`: a top set is a load, and a load is quoted as
            what one hand holds.
        best_1rm_kg:
          type: number
          nullable: true
          description: >
            Brzycki with effort folded in, via the same `EstimateSetOneRM`
            `/records` uses — so an assisted set is estimated from the reps
            done unaided and the two surfaces cannot publish different bests
            for one set. Null when no set supports one, including when every
            rep of the only candidate was assisted.


            Per implement, like every load this API publishes. **This object is
            the one that carries both readings at once** — `best_1rm_kg` does
            not apply `load_factor` and `tonnage_kg` below does — so a client
            rendering them together is showing two correct numbers computed
            from the same column two ways. See `Set.weight_kg`.
        best_1rm_reps:
          type: integer
          nullable: true
          description: >
            The set behind the estimate — a modelled number with no evidence
            cannot be checked. This is the FULL rep count, with
            `best_1rm_assisted_reps` alongside, matching how `/records` reports
            evidence; the estimate itself derives from the solo count, so the
            two only reconcile when both are shown.
        best_1rm_weight_kg:
          type: number
          nullable: true
          description: >
            The weight the estimate was taken from, in the SAME per-implement
            unit as the estimate. Doubling it first for a pair of dumbbells
            gives twice the published number.


            **Recomputing `best_1rm_kg` takes the documented rule, not bare
            Brzycki on `best_1rm_reps`** — that count is the FULL one, and the
            estimate uses the solo count with effort folded in. See
            `best_1rm_reps` and `best_1rm_rir`, which carry the two corrections.
        best_1rm_assisted_reps: { type: integer, nullable: true }
        best_1rm_rir:
          type: integer
          nullable: true
          description: >
            The effort the estimate used, so the evidence recomputes to the
            published number — 5 x 100 at 2 RIR is 120.0, and the same evidence
            without it comes back 112.5. Null for an assisted set, where
            effort is discarded by construction rather than missing.
        best_1rm_rpe: { type: number, nullable: true }
        tonnage_kg:
          type: number
          description: This exercise's share of the session, under the one tonnage rule — implements folded in, drops counted, warm-ups excluded.
        sets:
          type: integer
          description: Counted the way sets are counted everywhere else, so a drop is not a second set here.
        reps: { type: integer }
    ExerciseRecords:
      type: object
      required: [exercise_id, records]
      properties:
        exercise_id: { type: string }
        records:
          type: array
          description: >
            Only the kinds this exercise can hold and has. An absent kind means
            no such record yet, not zero. Heaviest weight and estimated 1RM
            frequently cite *different sets* — 5×100 estimates above a 110
            single — which is why both are returned.
          items: { $ref: "#/components/schemas/PersonalRecord" }

    HistoryTotals:
      type: object
      description: A period's training in one line.
      required:
        [sessions, working_sets, total_reps, tonnage_kg, duration_seconds,
         exercises, active_days]
      properties:
        sessions: { type: integer }
        working_sets: { type: integer }
        total_reps: { type: integer }
        tonnage_kg:
          type: number
          description: >
            Sum of `reps × weight_kg × load_factor` over completed, non-warm-up
            sets, under the one tonnage rule — implements folded in, drops
            counted, warm-ups excluded. See `Set.weight_kg`.
        duration_seconds:
          type: integer
          description: Total logged duration. Sessions still in progress contribute 0.
        exercises:
          type: integer
          description: >
            Distinct exercises across the whole period — benching on Monday
            and Thursday is one. Cannot be derived by summing the days.
        active_days:
          type: integer
          description: >
            Days on which anything was logged, in the caller's `tz`. Two
            sessions in one day is one active day.

    HistoryDay:
      type: object
      description: One calendar day's training, in the caller's timezone.
      required:
        [date, sessions, working_sets, total_reps, tonnage_kg,
         duration_seconds, sports]
      properties:
        date: { type: string, format: date }
        sessions: { type: integer }
        working_sets: { type: integer }
        total_reps: { type: integer }
        tonnage_kg:
          type: number
          description: >
            That day's `reps × weight_kg × load_factor`, the same rule as
            `HistoryTotals.tonnage_kg`. See `Set.weight_kg`.
        duration_seconds: { type: integer }
        sports:
          type: array
          items: { type: string, enum: [strength, running, bjj] }

    SportCount:
      type: object
      required: [sport, sessions]
      properties:
        sport: { type: string, enum: [strength, running, bjj] }
        sessions: { type: integer }

    History:
      type: object
      required: [from, to, totals, previous, days, sports]
      properties:
        from: { type: string, format: date }
        to:
          type: string
          format: date
          description: The last day included, echoing what was asked for.
        totals: { $ref: "#/components/schemas/HistoryTotals" }
        previous:
          allOf:
            - $ref: "#/components/schemas/HistoryTotals"
            - description: >
                The window of the same length immediately before this one, so
                a total can be read as up or down. Honours the sport filter.
        days:
          type: array
          description: >
            Only days that had training, ascending. Days with none are absent
            rather than zero-filled — the range already says they exist.
          items: { $ref: "#/components/schemas/HistoryDay" }
        sports:
          type: array
          description: Every sport in range, ignoring the sport filter, so the chips show what switching would find.
          items: { $ref: "#/components/schemas/SportCount" }

    SessionWithVolume:
      type: object
      required: [session, volume]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        volume: { $ref: "#/components/schemas/Volume" }

    Media:
      type: object
      description: >
        One asset belonging to a catalog entry. `storage_key` is the path
        within the bucket; `url` is assembled from it at read time using the
        API's MEDIA_BASE_URL, so the bucket and CDN hostname are never stored
        per row. `url` is empty when no media origin is configured (local dev
        and CI) — clients should treat an empty url as "no image available"
        rather than attempting to load it.

        `url` carries a `?v=` cache-busting parameter derived from when the
        asset last changed. **Treat `url` as opaque and use it verbatim** —
        do not reconstruct it from `storage_key`, and do not strip the query
        string. Storage keys are stable, so a rebuilt URL would be the same
        string forever and every cache in the path would keep serving a
        replaced image indefinitely. A changed `url` for an unchanged
        `storage_key` means the picture was replaced and should be refetched.
      required: [kind, storage_key, url, content_type, width, height, position, is_default]
      properties:
        kind:
          type: string
          enum: [thumbnail, demo, start, end, demo_video]
        storage_key:
          type: string
          example: exercises/barbell-back-squat/start.webp
        url:
          type: string
          description: >
            Opaque, versioned URL. Use as-is; the `?v=` is what makes a
            replaced image reach clients rather than being masked by caches.
          example: https://media.vola.app/exercises/barbell-back-squat/start.webp?v=1785499200
        content_type:
          type: string
          example: image/webp
        width:
          type: integer
          nullable: true
          description: Intrinsic width, so a client can reserve layout space before load.
        height:
          type: integer
          nullable: true
        position:
          type: integer
        is_default:
          type: boolean
          description: >
            True when this is a sport-level placeholder standing in for an
            exercise with no photo of its own. Exposed rather than hidden so
            clients can present it differently and so catalog media coverage
            stays measurable — a placeholder indistinguishable from real
            content makes the gap invisible and therefore permanent.

    Exercise:
      type: object
      description: >
        One entry in the global exercise catalog. Operator-authored
        reference content shared by every user — there is no owner, so
        nothing here is user-scoped. Seeded from version-controlled JSON
        rather than written through the API.
      # `load_mode` is required because clients now render copy off it — the
      # weight field says "per hand" on a per_side movement — and a field that
      # merely happens to be present is one a later change can drop without
      # anything failing. The column is NOT NULL with a CHECK and the Go field
      # has no omitempty, so this documents what the server already guarantees
      # rather than asking it for something new.
      required:
        [id, name, sport, movement_pattern, primary_muscles,
         secondary_muscles, equipment, load_type, load_mode, implements, is_unilateral,
         instructions, media, movement_pattern_detail, offered_grips, created_at, updated_at]
      properties:
        id:
          type: string
          description: Stable slug, safe to store as a reference.
          example: barbell-back-squat
        name:
          type: string
          example: Barbell Back Squat
        sport:
          type: string
          example: strength
        movement_pattern:
          type: string
          description: >
            What the movement is structurally. This is the level the
            cross-sport rules reason at — "heavy hinge and squat work
            yesterday" is what makes hard sparring today worth flagging.
            Muscle lists alone are too granular to write rules against.
          example: squat
        movement_pattern_detail:
          type: string
          description: >
            The source catalog's own, far more granular pattern (75 distinct
            values, e.g. "Scapular Elevation"). For display and filtering;
            rules read `movement_pattern`.
          example: Hip Adduction
        source:
          type: string
          enum: [seed, admin]
          description: >
            Where this exercise came from: `seed` means the deploy owns it (the
            embedded JSON rewrites it on every release), `admin` means it was
            authored in the console and the database owns it. Read-only — the
            server sets it. Note a PATCH through `/admin/*` moves a row from
            `seed` to `admin` as a side effect: that is what stops the next
            release reverting the edit.


            **Present only on `/admin/*` responses.** Absent from `GET
            /exercises` and `GET /exercises/{exerciseID}`, which do not select
            the column — so its absence means "this endpoint does not report
            provenance", never "not admin-authored". Use membership of
            `GET /admin/exercises` instead.
        status:
          type: string
          enum: [draft, published]
          description: >
            Whether athletes can see it. `published` is in the public catalog;
            `draft` is visible only through `/admin/*` — not in
            `GET /exercises`, and not addable to a workout or a session: both
            write paths validate against published rows only, so a draft id is
            rejected as an unknown exercise.


            **Present only on `/admin/*` responses**, and for a stronger reason
            than `source`: an exercise read the public way is published by
            definition, because the API filters drafts out entirely.


            The console CREATES as `draft`. Editing a published exercise leaves
            it published. Publishing is
            `POST /admin/exercises/{exerciseID}/publish` and is ONE-WAY.
        primary_muscles:
          type: array
          items: { type: string }
          example: [quadriceps, glutes]
        secondary_muscles:
          type: array
          items: { type: string }
        equipment:
          type: array
          items: { type: string }
          example: [barbell, squat_rack]
        load_type:
          type: string
          enum: [weight_reps, reps, time, distance, distance_time]
          description: >
            Which measurements a session of this exercise records, and
            therefore which inputs a client should render. Carried as data
            so logging stays one screen instead of a form per exercise
            type, and so adding an exercise never needs an app release.
        is_unilateral:
          type: boolean
          description: >
            How many LIMBS work at a time — one, when true. Drives the "8 reps
            here means 8 each side" hint, and nothing else.


            **It no longer decides a set's `load_factor`**, and the sentence
            that said so was retired with migration 000057. Reading this as
            "one implement moves" is precisely the conflation that broke the
            lunge family: a dumbbell walking lunge is two implements and one
            leg. The factor is `implements`.
        offered_grips:
          type: array
          items:
            type: string
            enum: [regular, neutral, reverse, angled, mixed, hook]
          description: >
            Which grips a client should OFFER for this movement, derived from
            `movement_pattern` and never stored.


            Served so the rule lives in one place (N16). It was previously
            reimplemented in both apps against a Go copy nothing called, with a
            parity script standing in for a shared TypeScript package.


            **Advisory, not a constraint.** The server does not refuse a grip
            outside this list — `PUT /v1/sessions/{sessionID}/sets` checks the
            vocabulary and stops there, deliberately, because a hook-gripped
            shrug is real and nobody's business to refuse. That is what makes a
            stale client safe: it over- or under-offers, and never 400s.


            **An empty array is not the same as an absent field.** `[]` is the
            server saying grip is meaningless here (a squat) and a client shows
            no picker; absent means the row predates this field, where a client
            falls back rather than concluding the picker should vanish.


            `required`, because THIS server always sends it — on every path,
            public and admin. The absent case is about a row a client cached
            before the field existed, not about a response. A squat therefore
            serializes `[]`, never `null`, and both scanners are pinned to it
            (`TestEveryScannerServesTheGrips`): the first version derived it in
            one of the two and shipped `null` from every `/v1/admin/exercises*`
            response.
        implements:
          type: integer
          enum: [1, 2]
          example: 2
          description: >
            How many implements of `weight_kg` move in one rep: 1 for a barbell,
            a machine, or a single dumbbell; 2 for a PAIR. Logged weight is
            multiplied by this to give tonnage.


            **Not the same question as `is_unilateral`**, and separating them is
            why this field exists. The factor used to be derived as
            `load_mode = 'per_side' AND NOT is_unilateral`, which read "one LIMB
            at a time" as though it meant "one IMPLEMENT". A dumbbell walking
            lunge is two implements and one leg, so that derivation had to be
            wrong about either the tonnage or the reps hint — and the catalog
            was internally inconsistent about which, by equipment.


            Absent or unrecognised reads as 1, failing to the side that
            under-reports rather than inventing weight nobody lifted.
        load_mode:
          type: string
          enum: [total, per_side]
          description: >
            How to read a logged `weight_kg` for this movement. `total` — the
            number is the whole load: a barbell, a machine, or ONE implement
            held in two hands (a goblet squat, a two-handed swing). `per_side` —
            it is one of a pair, so the total doubles.


            A property of the movement, never of a single set, which is why it
            lives here.


            Always present on a response — it is in this schema's `required`
            list, because clients render copy off it ("per hand" on the weight
            field) and a field that merely happens to be sent is one a later
            change can drop with nothing failing. Where absence IS still
            possible — the seed file, and revision snapshots written before the
            column existed — it reads as `total`, the safe side: it
            under-reports rather than inventing weight nobody lifted.
        instructions:
          type: string
        note:
          type: string
          description: >
            An optional line explaining why this exercise's catalog values are
            what they are — admin-authored, and meant to be shown wherever the
            exercise is read.


            Deliberately NOT in `required`, unlike `instructions`. Absent is the
            normal case: 5 of 762 seeded rows carry one, and the field is
            omitted entirely when empty. A client must therefore render nothing
            at all rather than an empty section — absent and empty mean the same
            thing here, so there is no third state to handle.


            Distinct from `instructions`, which says how to PERFORM the
            movement. This says how it is RECORDED, and why. It exists because
            human rulings fixed several `implements` values that the exercise
            names could not settle, and a ruling that is not explained where the
            athlete reads it goes on looking like a mistake — `Single-Leg
            Kettlebell Romanian Deadlift` counts one implement while its
            dumbbell twin counts two, on purpose.
          example: >-
            One bell here, against two for the dumbbell version — that
            difference is deliberate, not an oversight.
        media:
          type: array
          description: >
            Ordered semantically (thumbnail, demo, start, end, demo_video) rather
            than alphabetically, so a start/end pair reads in movement order.
            Always an array, never null. An exercise with no media of its own
            gets its sport's placeholder, flagged `is_default`.
          items:
            $ref: "#/components/schemas/Media"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ExerciseList:
      type: object
      required: [exercises]
      properties:
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"

    Activity:
      type: object
      description: >
        One entry in the unified activity envelope — id is client-generated
        (offline logging + idempotent sync), request_id/trace_id are
        stamped server-side from the request that created it, for
        correlating against the backend's structured logs.
      required:
        - id
        - user_id
        - kind
        - occurred_at
        - notes
        - request_id
        - trace_id
        - created_at
      properties:
        id:
          type: string
          example: a1b2c3d4e5f6a7b8
        user_id:
          type: string
        kind:
          type: string
          example: bjj_session
        occurred_at:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
          description: Freeform, kind-specific fields.
        request_id:
          type: string
        trace_id:
          type: string
        created_at:
          type: string
          format: date-time

    ActivityCreate:
      type: object
      required: [id, kind, occurred_at]
      properties:
        id:
          type: string
          description: Client-generated — the idempotency key for offline sync retries.
        kind:
          type: string
          example: bjj_session
        occurred_at:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        details:
          type: object
          nullable: true

    ActivityList:
      type: object
      required: [activities]
      properties:
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"

    AdminUserSummary:
      type: object
      description: >
        One account, as the admin console lists it. The counts come from
        `sessions` and `session_sets` — rows that already exist, so no new
        write path was added to produce them. Note "active" here means logged
        training, not opened the app: no read leaves a trace, so a daily
        browser who never logs is indistinguishable from a churned account.
        The previous `activity_count`/`last_activity_at` were removed: they
        read a table with no writer and were 0/null for every user.
      required:
        [user_id, display_name, session_count, last_session_at, set_count, modules, created_at, has_avatar]
      properties:
        user_id:
          type: string
        display_name:
          type: string
          nullable: true
          description: Null when the user never completed onboarding.
        has_avatar:
          type: boolean
          description: >
            Whether this account has an uploaded avatar (N12) — no URL here,
            just the fact that decides whether "Remove avatar" is a real
            button on this account's page. An operator who needs to actually
            see the image looks at the account in the app.
        session_count:
          type: integer
          description: Sessions logged, all time.
        last_session_at:
          type: string
          format: date-time
          nullable: true
        set_count:
          type: integer
          description: >
            Sets logged, all time — distinguishes someone who started two
            sessions and abandoned them from someone who trained twice.
        modules:
          type: array
          description: >
            Labels of the disciplines this user has enabled, resolved through
            the discipline registry: a user with no stored row for a module
            reads as that module's default rather than as "off".
          items:
            type: string
        created_at:
          type: string
          format: date-time
          nullable: true

    AdminSessionSummary:
      type: object
      description: >
        One session as the admin console shows it — deliberately without its
        sets. The question is "what did they do and did it finish", which
        needs a count, not every weight.
      required: [id, sport, name, started_at, ended_at, set_count]
      properties:
        id:
          type: string
        sport:
          type: string
        name:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
          description: Null means still in progress.
        set_count:
          type: integer

    AdminUserDetail:
      type: object
      required: [user, recent_sessions]
      properties:
        user:
          $ref: "#/components/schemas/AdminUserSummary"
        recent_sessions:
          type: array
          description: Newest first, capped at 50.
          items:
            $ref: "#/components/schemas/AdminSessionSummary"

    ClientErrorReport:
      type: object
      description: >
        A problem the client hit. The user is attributed from the token, so
        there is deliberately no user field here — a client that could name the
        user could file noise against someone else, and could not be trusted
        when reporting its own trouble.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [client_error, sync_blocked]
          description: >
            `sync_blocked` is the serious one: the client has given up pushing
            something, so the training exists only on that device.
        message:
          type: string
          maxLength: 500
          description: Human context. Bounded so the endpoint can't be used as storage.
        error_code:
          type: string
          maxLength: 64
        details:
          type: object
          additionalProperties: true
          description: >
            Shape-specific context — the entity id and attempt count for a
            blocked sync, say. Free-form so a new kind of report doesn't need a
            new column.


            The buffered client reporter puts its honesty counters here:
            `occurrences` (how many times a coalesced event really happened),
            `suppressed` (occurrences the per-fingerprint cap hid) and
            `lost_events` (whole events dropped from a full ring or lost in a
            failed flush). Every one of those is a way of NOT sending
            something, so each is reported rather than left as silence — a
            bounded reporter and a broken one are otherwise indistinguishable.


            Detail keys are allowlisted CLIENT-side before they leave the
            device. This is health and training data and a crash report is sent
            without the athlete initiating it, so nothing an athlete wrote, ate
            or photographed is carried here.

    ClientErrorBatch:
      type: object
      description: >
        Several reports in one request. What the buffered reporter sends: it
        coalesces repeat occurrences into one event with a count rather than
        queueing every occurrence, so a two-hour offline stretch produces one
        small batch on reconnect instead of a flood.
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/ClientErrorReport"

    HealthEvent:
      type: object
      description: >
        One notable thing that happened. Request fields are null for
        client-reported events, which have no request — absence rather than a
        zero that would read as a measurement.
      required: [id, occurred_at, source, kind]
      properties:
        id:
          type: integer
          format: int64
        occurred_at:
          type: string
          format: date-time
        source:
          type: string
          enum: [api, client]
          description: >
            `api` is the server observing itself — measured. `client` is an app
            reporting what the server cannot see — claimed. Kept distinct
            because their trustworthiness differs.
        kind:
          type: string
          enum: [server_error, slow_request, client_error, sync_blocked]
        user_id:
          type: string
          nullable: true
          description: Null for unauthenticated failures, which genuinely have no user.
        method: { type: string, nullable: true }
        path: { type: string, nullable: true }
        status: { type: integer, nullable: true }
        duration_ms: { type: integer, nullable: true }
        error_code: { type: string }
        message: { type: string }
        request_id:
          type: string
          description: Pivot from this row to the full request in the log stream.
        trace_id: { type: string }
        details:
          type: object
          additionalProperties: true
          nullable: true

    HealthSummary:
      type: object
      required: [since, total, by_kind, affected_users, slowest_paths_ms]
      properties:
        since: { type: string, format: date-time }
        total: { type: integer }
        by_kind:
          type: object
          additionalProperties: { type: integer }
        affected_users:
          type: integer
          description: >
            Distinct people, not events. Twenty rows from one athlete on a bad
            connection is a very different morning from twenty athletes hitting
            one broken endpoint, and a raw total cannot tell them apart.
        slowest_paths_ms:
          type: object
          additionalProperties: { type: integer }
          description: Worst observed latency per route, so a slow endpoint is named.

    HealthReport:
      type: object
      required: [summary, events]
      properties:
        summary:
          $ref: "#/components/schemas/HealthSummary"
        events:
          type: array
          items:
            $ref: "#/components/schemas/HealthEvent"

    AdminUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserSummary"

    Proficiency:
      type: object
      description: >
        One technique's accumulated evidence. Deliberately NOT a score — the
        design rules out self-assessment, so this is the facts (drilled twelve
        times, went for it three times, landed twice) and a reader forms the
        judgement.
      required: [technique_id, name, position, category, drilled, attempted, scored, conceded, defended, sessions, last_seen]
      properties:
        technique_id: { type: string, example: americana-mount }
        name: { type: string, description: "From the shared library; falls back to the id.", example: Americana from Mount }
        position: { type: string, example: Mount - Top }
        category: { type: string, example: Submission }
        drilled: { type: integer, description: "Reps practised, not live." }
        attempted:
          type: integer
          description: >
            Went for it live and it did NOT land. Disjoint from `scored`, so
            `attempted + scored` is how often it was tried.
        scored: { type: integer, description: Landed it live. }
        conceded:
          type: integer
          description: >
            This technique done TO the athlete. No client can author one today;
            reported rather than dropped because the API accepts one.
        defended:
          type: integer
          description: >
            Them going for it and the athlete stopping them — the mirror of
            `attempted`, and what a roadmap's defensive criterion counts.
        sessions:
          type: integer
          description: >
            How many separate sessions contributed — the honesty check on every
            count above. Twelve reps in one class is not twelve reps over six
            weeks.
        last_seen: { type: string, format: date-time }

    ProficiencySummary:
      type: object
      description: >
        The headline funnel, folded from the same rows in `techniques` so the
        two cannot disagree. These are COUNTS OF TECHNIQUES, not of reps.
      required: [techniques, drilled, tried_live, landed]
      properties:
        techniques: { type: integer, description: Distinct techniques with any evidence. }
        drilled: { type: integer, description: How many were ever drilled. }
        tried_live: { type: integer, description: How many were ever taken into a live round. }
        landed: { type: integer, description: How many ever worked live. }

    PositionStat:
      type: object
      description: >
        One position's accumulated evidence, both directions. The four live
        counts are pairwise disjoint: `attempted` is "went for it and it did
        NOT land" and `defended` is "they went for it and the athlete stopped
        them", so exchanges the athlete initiated are `scored + attempted` and
        exchanges done to them are `conceded + defended`.
      required: [position, scored, attempted, conceded, defended, drilled, sessions, last_seen]
      properties:
        position:
          type: string
          description: >
            Reported verbatim rather than mapped to a known vocabulary, so a
            value this build does not recognise still appears instead of
            vanishing into an "other" bucket.
          example: Half Guard - Bottom
        scored: { type: integer, description: The athlete finished from here. }
        attempted:
          type: integer
          description: Went for it here and it did not land. Disjoint from `scored`.
        conceded: { type: integer, description: They finished the athlete here. }
        defended:
          type: integer
          description: The athlete stopped them finishing here. Disjoint from `conceded`.
        drilled:
          type: integer
          description: >
            Reps practised, not live. Kept separate because it is not evidence
            about a round, and excluded from this endpoint's ordering.
        sessions:
          type: integer
          description: >
            How many separate sessions contributed — the honesty check on every
            count above. Twelve exchanges in one bad night is not the evidence
            twelve across six weeks is.
        last_seen:
          type: string
          format: date-time
          description: >
            The most recent session in which this position appeared AT ALL,
            drilling included — taken from the session's `started_at`, not from
            when the reflection was written, so an offline row synced a week
            late does not misreport training recency. Note this can therefore be
            fresher than the last LIVE exchange, while the ordering above
            deliberately ignores drilling.

    PositionsSummary:
      type: object
      description: >
        The small amount of interpretation this endpoint is willing to do.
        Deliberately NOT a recommendation: concessions from a position are
        equally consistent with a hole in the athlete's game and with them
        starting every round there on purpose, and nothing in this data
        separates the two.
      required: [positions, min_live]
      properties:
        positions:
          type: integer
          description: >
            Positions with any live evidence at all, AMONG THE RETURNED ROWS.
            The distinction only bites past the row cap: `position` is free text
            on write (`Tag.Validate` checks category, event, count and
            technique_id, never the position), so a drifted client could invent
            enough distinct positions to make the cap bind — and then this
            counts what was shown rather than what exists. Unreachable for any
            client using the app's own vocabulary.
        min_live:
          type: integer
          description: >
            Below this many live exchanges a position should be shown but not
            drawn a conclusion from. Sent rather than hard-coded in the client
            so the two cannot disagree about what "enough evidence" means.
          example: 5

    Focus:
      type: object
      description: >
        One technique the athlete is deliberately working on. The list is short
        by design (at most 5) and turns over every few weeks.
      required: [technique_id, name, position, category, started_on, curriculum_ids]
      properties:
        technique_id: { type: string, example: armbar-from-guard }
        name: { type: string, example: Armbar from Guard }
        position: { type: string, example: Guard - Bottom }
        category: { type: string, example: Submission }
        started_on:
          type: string
          format: date
          description: >
            When this technique JOINED the list. Preserved across re-saves, so
            reordering or adding an entry does not reset it — it is what makes
            "you have been on this five weeks, consider rotating" answerable.
        curriculum_ids:
          type: array
          items: { type: string }
          example: ["c_a1b2c3"]
          description: >
            Which curricula currently claim this row (empty for a hand-picked
            or pre-provenance entry — never null). This is what lets a client
            tell "applying this roadmap would register a new claim" apart from
            "applying it would change nothing", which a plain list-membership
            comparison cannot: a second roadmap whose techniques are already
            all in focus changes no `technique_id`, but still needs its own
            row in `bjj_focus_sources` or a later deactivation of the FIRST
            roadmap takes the technique away while this one is still working
            it (N100).

    CurriculumCriteria:
      type: object
      description: >
        What mastering one technique takes. Every threshold is measured SINCE
        THE ATHLETE ENROLLED, never over all time — over all time the hit rate
        includes the months during which they could not do the technique, so it
        measures the learning phase it exists to exclude.


        There is deliberately no way to mark a technique mastered by hand: it is
        earned from the record or it is not claimed. Note that the evidence is
        still self-reported, so these make fabrication tedious rather than
        impossible.
      properties:
        target_scored:
          type: integer
          nullable: true
          example: 25
          description: >
            Times landed live. Null on a defence-only criterion — "not get
            caught in guard pull N times" has no offensive half.
        target_defended:
          type: integer
          nullable: true
          example: 8
          description: >
            Times the athlete stopped the opponent's. Roughly a THIRD of
            `target_scored`, and not because defence matters less: you do not
            choose when a technique is attempted on you, so the evidence
            arrives about 3.2x more slowly (modelled, not measured). Symmetric
            targets leave a roadmap stuck at three-quarters complete.
        target_sessions:
          type: integer
          nullable: true
          example: 12
          description: >
            Distinct sessions the evidence must span — the guard against one big
            open mat against a tired partner. Counts LIVE sessions only;
            drilling never satisfies it.
        min_hit_rate:
          type: number
          format: float
          nullable: true
          example: 0.35
          description: >
            `scored / (attempted + scored)`, and the reason the word "mastered"
            is defensible: a volume threshold alone is satisfied by 25-from-30
            and 25-from-400 alike, and only the first is skill. Requires
            `target_scored`.
        target_drilled_sessions:
          type: integer
          nullable: true
          example: 6
          description: >
            Distinct sessions this must be DRILLED in — the criterion for the
            movement fundamentals a beginner will never score with (a
            breakfall, a shrimp). Sessions rather than volume, because forty
            reps in one class is one class. The ONE criterion drilled evidence
            counts toward; every other threshold still excludes practice. A
            criterion needs at least one of `target_scored`, `target_defended`
            and this.

    CurriculumProgress:
      type: object
      description: >
        The caller's evidence against one item's criteria, recomputed on every
        read and stored nowhere. Absent when the caller is not enrolled — there
        is no window to measure them over — and when the item has no criteria.
      required: [scored, defended, sessions, attempts, drilled_sessions, mastered]
      properties:
        scored: { type: integer, example: 26 }
        defended: { type: integer, example: 9 }
        sessions: { type: integer, example: 13 }
        attempts:
          type: integer
          example: 66
          description: scored + attempted — how often they went for it.
        hit_rate:
          type: number
          format: float
          nullable: true
          example: 0.394
          description: >
            Null when `attempts` is zero. Zero from zero is not a rate, and
            rendering it as 0% would report a failure the athlete has not had.
        drilled_sessions:
          type: integer
          example: 4
          description: >
            Distinct sessions in which this was drilled — what
            `target_drilled_sessions` measures, reported even where no
            criterion reads it so a client can show practice alongside live
            use.
        mastered: { type: boolean }

    SequenceStep:
      type: object
      description: >
        One move in the chain, and where it leaves you.


        `name`, `position`, `category` and `function` are RESOLVED from the
        shared library on every read, never stored on the step — so a renamed
        technique reads correctly everywhere. They are absent from
        `SequenceWrite` for the same reason: accepting them would let a client
        store a name that disagrees with the catalog.
      required: [technique_id, name, position, category, order, notes]
      properties:
        technique_id: { type: string }
        name: { type: string, description: From the library. }
        position: { type: string, description: From the library. }
        category: { type: string, description: From the library. }
        function:
          type: string
          description: >
            What the technique does — advance | reverse | escape | control |
            finish. Absent for the movement fundamentals, which genuinely have
            none. Load-bearing for rendering: it is what distinguishes a step
            that ENDS the exchange from one whose destination was simply never
            recorded.
        order: { type: integer, description: Zero-based. Assigned by the server from array order. }
        ends_at_position_id:
          type: string
          nullable: true
          description: >
            Where this step leaves you, and therefore where the next one starts.


            Null means NOT RECORDED **or** ENDS THE EXCHANGE. The ambiguity is
            deliberate — a submission finishes the chain and leaves you in no
            position at all, and `function` already tells the two apart, so a
            second field would encode one fact twice and could disagree.


            Authored, not derived from the library's own `to_position`: that is
            populated for 170 of 542 techniques, so deriving the chain would
            render most sequences with holes.
        ends_at_position_name:
          type: string
          description: Resolved from the position glossary. Absent when the id is null.
        notes:
          type: string
          description: The athlete's own note. The only part of a step that is theirs.

    Sequence:
      type: object
      description: >
        A chain: what a class actually taught, in the order it flows.


        Distinct from a Curriculum, though both are ordered technique lists. A
        curriculum's order is PEDAGOGICAL — learn this before that, over months.
        A sequence's is CAUSAL: this move puts you where the next one starts,
        and reordering it produces something that does not work on the mat.
        Sequences carry no criteria and no progress; a chain is not a thing you
        complete.


        Sequences are LINEAR. A class ending "…and if he defends, armbar OR
        kimura" is two sequences sharing a prefix, not one with a branch.
      required:
        [id, editable, official, name, description, created_at, updated_at,
         step_count]
      properties:
        id: { type: string }
        editable:
          type: boolean
          description: >
            Whether the CALLER may change this. Resolved server-side so a client
            never compares user ids to decide whether to show an edit
            affordance — that shape is how client-side authorization gets
            written by accident.

            It says nothing about who WROTE this. Today `!editable` happens to
            mean VOLA's, because sequence visibility has no public arm — you
            see your own and VOLA's, nothing else. Do not label a chain
            "reference" off it; use `official`, which stays correct if a public
            arm ever lands. `!editable` meaning "VOLA's" is exactly what put a
            stranger's curriculum under a VOLA heading before `official` existed
            there too.
        official:
          type: boolean
          description: >
            VOLA authored this — `owner_user_id IS NULL`, resolved server-side.
            The positive fact, so a client never infers authorship from the
            absence of permission.

            Nothing seeds an ownerless sequence yet, so this is currently false
            for every row. It is served now so that the day reference chains
            land, the clients are already asking the right question.
        name: { type: string }
        description: { type: string }
        start_position_id:
          type: string
          nullable: true
          description: >
            Where the chain begins, as a curated position id. Null is legal — a
            chain whose start nobody named is still a chain.
        start_position_name: { type: string, description: Resolved. Absent when the id is null. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        step_count:
          type: integer
          description: Present on BOTH the list and the single read, so a card can say "4 steps" without fetching them.
        steps:
          type: array
          description: >
            Omitted on list responses. Present on a single read whenever the
            chain has any steps — and ABSENT rather than `[]` when it has none,
            which is Go's `omitempty` and not worth fighting the encoder over.
            Read `step_count` to tell "no steps" from "not sent"; it is present
            on every response either way.
          items:
            $ref: "#/components/schemas/SequenceStep"

    SequenceStepWrite:
      type: object
      required: [technique_id]
      properties:
        technique_id: { type: string }
        ends_at_position_id: { type: string, nullable: true }
        notes: { type: string }

    SequenceWrite:
      type: object
      description: >
        Ownership is not a field: a sequence is always the caller's, and a
        request that could name an owner is a request that could name somebody
        else.


        `id` is optional and POST-only. The phone supplies one so that an
        offline capture's sync retry is idempotent; web omits it and the server
        picks. Re-POSTing an id you already own returns the STORED sequence
        unchanged — it does not overwrite it, so a late retry cannot revert an
        edit made in between. An id owned by somebody else is a 409.


        On PATCH every field is optional. `steps` OMITTED leaves the chain
        alone; `steps` present (including `[]`) REPLACES it wholesale — order is
        the content, so per-step patching would let two clients interleave into
        a chain neither authored. `start_position_id` distinguishes omitted
        (leave it) from explicit `null` (clear it).
      properties:
        id:
          type: string
          minLength: 8
          maxLength: 64
          description: >
            Client-generated, POST only, optional. Ignored on PATCH.
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        start_position_id: { type: string, nullable: true }
        steps:
          type: array
          maxItems: 20
          description: >
            Capped at 20. Real chains are 3-6 steps; something 40 long is a
            curriculum wearing the wrong shape. A repeated technique is LEGAL,
            unlike curriculum items — sweep, get passed, sweep again is ordinary
            grappling and a chain that records it is more accurate.
          items:
            $ref: "#/components/schemas/SequenceStepWrite"

    ClassPlanBlock:
      type: object
      description: >
        One scheduled segment of a class — warmup, a technique drill, live
        rounds, or a free-text note.


        `technique_name` and `technique_position` are RESOLVED from the
        shared library on every read, never stored on the block, so a
        renamed technique reads correctly everywhere. They are absent from
        `ClassPlanBlockWrite` for the same reason `SequenceStep`'s
        equivalents are: accepting them would let a client store a name that
        disagrees with the catalog.
      required: [order, type, duration_minutes, notes]
      properties:
        order: { type: integer, description: Zero-based. Assigned by the server from array order. }
        type:
          type: string
          enum: [warmup, technique_drill, live_rounds, notes]
        duration_minutes: { type: integer, minimum: 1, maximum: 180 }
        technique_id:
          type: string
          nullable: true
          description: >
            Set only on a `technique_drill` block, and then exactly one of
            `technique_id`/`free_text` — never both, never neither. Absent
            (null) on every other block type.
        free_text:
          type: string
          nullable: true
          description: >
            The other half of the `technique_drill` XOR — a drill with no
            catalog entry ("coach's own variant"). Absent (null) on every
            other block type.
        technique_name:
          type: string
          description: From the library. Absent unless `technique_id` is set.
        technique_position:
          type: string
          description: From the library. Absent unless `technique_id` is set.
        notes:
          type: string
          description: >
            The coach's own note. For a `notes` block this IS the block's
            content; for every other type it is supplementary detail.

    ClassPlan:
      type: object
      description: >
        A coach's schedule for one class: an ordered list of blocks with a
        duration each, private to the coach who wrote it.


        Distinct from `Sequence` and `CurriculumItem`, though all three point
        into the technique catalog. A sequence's order is CAUSAL and a
        curriculum's is PEDAGOGICAL; a class plan's is a SCHEDULE — ten
        minutes of this, then fifteen of that. Only `technique_drill` blocks
        reference the catalog at all.


        No sharing and no VOLA-authored rows exist for this resource, unlike
        `Sequence` — every class plan has an owner, and every id a caller can
        read is one they also own.
      required:
        [id, name, description, created_at, updated_at, block_count,
         total_duration_minutes]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        block_count:
          type: integer
          description: Present on BOTH the list and the single read, so a card can say "6 blocks" without fetching them.
        total_duration_minutes:
          type: integer
          description: >
            The sum of every block's duration. Present on both the list and
            the single read, so a card can say "45 min" without fetching the
            blocks.
        blocks:
          type: array
          description: >
            Omitted on list responses. Present on a single read whenever the
            plan has any blocks, and absent (not `[]`) when it has none —
            read `block_count` to tell the two apart, since it is present on
            every response either way.
          items:
            $ref: "#/components/schemas/ClassPlanBlock"

    ClassPlanBlockWrite:
      type: object
      required: [type, duration_minutes]
      properties:
        type:
          type: string
          enum: [warmup, technique_drill, live_rounds, notes]
        duration_minutes: { type: integer, minimum: 1, maximum: 180 }
        technique_id:
          type: string
          nullable: true
          description: >
            `technique_drill` blocks only — exactly one of `technique_id`/
            `free_text` must be set, and setting either on any other block
            type is a 400.
        free_text:
          type: string
          nullable: true
          maxLength: 500
        notes: { type: string, maxLength: 1000 }

    ClassPlanWrite:
      type: object
      description: >
        Ownership is not a field: a class plan is always the caller's, and a
        request that could name an owner is a request that could name
        somebody else.


        `id` is optional and POST-only. The phone supplies one so an offline
        capture's sync retry is idempotent; web omits it and the server
        picks. Re-POSTing an id you already own returns the STORED plan
        unchanged — it does not overwrite it, so a late retry cannot revert
        an edit made in between. An id owned by somebody else is a 409.


        On PATCH every field is optional. `blocks` OMITTED leaves the
        schedule alone; `blocks` present (including `[]`) REPLACES it
        wholesale — order is the content, so per-block patching would let
        two clients interleave into a schedule neither authored.
      properties:
        id:
          type: string
          minLength: 8
          maxLength: 64
          description: Client-generated, POST only, optional. Ignored on PATCH.
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        blocks:
          type: array
          maxItems: 40
          description: >
            Capped at 40. A real class is a handful of blocks over 45-90
            minutes; something that size would already be unreadable as a
            single class.
          items:
            $ref: "#/components/schemas/ClassPlanBlockWrite"

    CurriculumPhase:
      type: object
      description: >
        One named section of a curriculum — "Survive the bad places first" —
        with the phase's objective and performance expectations in the
        description. Items point at a phase via their `phase` index. Purely
        structure: a phase has no criteria and no progress of its own, because
        the progress rule already counts the criteria-bearing items inside it.
      required: [order, title, description]
      properties:
        order: { type: integer, example: 0 }
        title: { type: string, example: Mount — escape first }
        description: { type: string }

    CurriculumItem:
      type: object
      description: >
        One entry. A `technique` item points into the shared library and may
        carry mastery criteria; a `concept` item is authored text — "position
        before submission", a graduation standard — and NEVER carries criteria,
        because no evidence stream could measure one and nothing here is
        completable by hand. Concepts therefore never count toward progress
        either; the progress rule (countable = carries criteria) already
        excludes them.
      required: [id, kind, name, position, category, order, phase, notes]
      properties:
        id:
          type: integer
          format: int64
          description: >
            The item's stable identity (curriculum_items.id) — additive as of
            N123, and the id `PUT/DELETE
            /curricula/{curriculumID}/items/{itemID}/read` names.
        kind: { type: string, enum: [technique, concept] }
        technique_id:
          type: string
          example: arm-drag
          description: Absent on concept items, which point at nothing.
        title:
          type: string
          description: >
            The concept's own heading. Absent on technique items — their name
            is the library's, and storing one here could disagree with it.
        name: { type: string, example: Arm Drag, description: "From the library; empty on concepts." }
        position: { type: string, example: Guard - Bottom, description: "From the library; empty on concepts." }
        category: { type: string, example: Sweep, description: "From the library; empty on concepts." }
        order: { type: integer, example: 0 }
        phase:
          type: integer
          nullable: true
          description: >
            Index into the curriculum's `phases` array, or null for an
            unphased item — every curriculum predating phases is entirely
            unphased, and that is a legal shape, not a broken one.
        notes: { type: string }
        criteria:
          allOf:
            - $ref: "#/components/schemas/CurriculumCriteria"
          type: object
          nullable: true
          description: >
            Null means this item is reading rather than a roadmap step. Progress
            counts only items that carry criteria.
        progress:
          allOf:
            - $ref: "#/components/schemas/CurriculumProgress"
          type: object
          nullable: true
          description: >
            Null when the caller is not enrolled, or when the item has no
            criteria.
        read_at:
          type: string
          format: date-time
          nullable: true
          description: >
            N123. When the caller marked this CONCEPT read and understood —
            their own claim, never a derived one. Always null on a
            `technique` item (refused at the database level by
            `curriculum_item_reads_concept_only_trg`) and null on an unread
            concept.


            A DIFFERENT KIND OF THING from `progress`/`criteria`, on purpose:
            `progress.mastered` is computed from logged evidence and cannot be
            set by a client; `read_at` is nothing BUT set by a client, through
            its own subresource
            (`PUT/DELETE /curricula/{curriculumID}/items/{itemID}/read`),
            never through the same control that touches criteria or progress.
            A concept marked read must never be presentable as evidence of
            mastery — that is this ticket's whole acceptance criterion, and
            keeping the two fields, the two endpoints and the two UI controls
            separate is how it holds.

    Curriculum:
      type: object
      description: >
        An ordered set of techniques to learn. A curriculum whose items carry
        completion criteria is a ROADMAP; the nullability is the only
        distinction, so one engine serves both.


        Deliberately NOT a suggestion source: following one says what you intend
        to learn, while the suggestion tiers say what your logs report about how
        it is going.
      required:
        [id, editable, official, name, description, visibility, enrolled,
         item_count, countable_items, mastered_items, concept_items,
         read_concepts, created_at, updated_at]
      properties:
        id: { type: string }
        editable:
          type: boolean
          description: >
            Whether the CALLER may edit this. Resolved server-side rather than
            by handing the client an owner id to compare, which is the shape
            that produces client-side authorization.

            NOT a provenance signal. It is false for a VOLA curriculum AND for
            every other athlete's public one, so a client filtering on
            `!editable` shows a stranger's list as VOLA's — see `official`.
        official:
          type: boolean
          description: >
            Whether VOLA authored this, rather than an athlete. Use this, never
            `!editable`, to decide whether something may be presented as VOLA
            content: `belt` and `track` are unvalidated hints, so an athlete
            publishing a public curriculum chooses which section and which belt
            word it would otherwise appear under.
        name: { type: string, example: Blue belt basics }
        description: { type: string }
        belt:
          type: string
          nullable: true
          example: blue
          description: >
            Which belt's fundamentals this is, or null for an athlete's own
            list. A HINT FOR ORDERING, never a gate — working white-belt
            fundamentals at purple is not a mistake.
        track:
          type: string
          nullable: true
          example: belt
          description: >
            Which browse section this belongs to — "belt", "foundations", and
            whatever comes next. Same contract as `belt`: a grouping hint,
            never a gate, and null for an athlete's own list, which lives
            under "mine" rather than in any section.
        visibility: { type: string, enum: [private, public] }
        enrolled: { type: boolean }
        started_on:
          type: string
          format: date
          nullable: true
          description: >
            When the caller took this on, and the anchor every criterion is
            measured from. Null unless enrolled. Picking a curriculum back up
            after archiving keeps the original date.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        item_count:
          type: integer
          description: >
            How many items are in it — techniques AND concepts. Present on the
            LIST as well as the single read, so a card can say "12 items"
            without fetching them.
        countable_items:
          type: integer
          description: >
            How many items carry criteria — i.e. whether this is a roadmap at
            all. THE PROGRESS RULE, shipped rather than left for each client to
            invent: progress counts only criteria-bearing items, so a ten-item
            curriculum with three roadmap steps is three items' worth of
            progress and not three tenths. Dividing by `item_count` is the
            silent wrong answer. Present on the list AND the single read.
        mastered_items:
          type: integer
          description: >
            How many countable items the caller's record currently clears.
            "Currently" is load-bearing — mastery is derived, not stored, so
            this can go DOWN.


            **Zero on the list response.** It needs the per-curriculum evidence
            aggregate, which is deliberately not run once per row — so a list
            card drawing a progress bar from it is rendering a placeholder as
            fact. That shipped once, in reverse: a card read `countable_items`
            when it too was absent, and told every athlete their roadmap was a
            reading list.
        concept_items:
          type: integer
          description: >
            N123. How many items are `kind: concept` — the CONCEPT-side twin
            of `countable_items`, computed the same additive way and never
            folded into it. Cheap and content-only, like `countable_items`, so
            present on the list response as well as a single read.
        read_concepts:
          type: integer
          description: >
            N123. How many of `concept_items` the caller has marked read and
            understood. The CONCEPT-side twin of `mastered_items` — **and
            deliberately NEVER combined with `mastered_items` or
            `countable_items` into one percentage**: whether read concepts
            should count toward a belt's completion is a decision made in the
            open, and the one taken is "no" — a client renders this as its own
            adjacent figure, e.g. "8 of 11 milestones · 22 of 48 concepts
            read", so a roadmap that is mostly concepts stops reading as
            permanently stuck at 0% without the two kinds of claim (derived
            mastery vs. an athlete's own attestation) ever sharing one number.


            **Zero on the list response**, for the same reason
            `mastered_items` is: it needs the caller's own per-item state, and
            computing it once per row of a 200-row cross-user list is a cost
            paid to draw a number nobody reads off a browse screen. Real only
            on a single read (and on `/curricula/working`).
        phases:
          type: array
          description: >
            Present on a single read, absent from the list response — the same
            lazy contract as `items`. Empty for a flat curriculum.
          items:
            $ref: "#/components/schemas/CurriculumPhase"
        items:
          type: array
          description: Present on a single read, absent from the list response.
          items:
            $ref: "#/components/schemas/CurriculumItem"

    CurriculumWrite:
      type: object
      description: >
        Every field optional so PATCH can be partial; POST requires `name`.
        Omitting `items` leaves the content — items AND phases, which travel
        as one unit because an item names its phase by index — alone, `[]`
        empties it, and a list replaces it wholesale. Sending `phases` without
        `items` is a 400 rather than a silent no-op.


        `id`, `editable`, `enrolled` and all progress are absent by design: the
        id is the server's, and the rest are facts about the caller rather than
        about the curriculum.
      properties:
        name: { type: string }
        description: { type: string }
        belt:
          type: string
          nullable: true
          description: >
            On PATCH, an explicit `null` CLEARS the belt while omitting the
            field leaves it alone — the two are different requests.
        track:
          type: string
          nullable: true
          description: Same PATCH semantics as `belt` — `null` clears, omission leaves alone.
        visibility: { type: string, enum: [private, public] }
        phases:
          type: array
          maxItems: 20
          items:
            type: object
            required: [title]
            properties:
              title: { type: string }
              description: { type: string }
        items:
          type: array
          maxItems: 150
          items:
            type: object
            description: >
              `kind` defaults to `technique`, which needs `technique_id` and
              refuses `title` and takes any of the criteria fields; a
              `concept` needs `title`, and refuses `technique_id` and every
              criterion. A criterion needs at least one of `target_scored`,
              `target_defended` and `target_drilled_sessions`.
            properties:
              kind: { type: string, enum: [technique, concept] }
              technique_id: { type: string }
              title: { type: string }
              phase:
                type: integer
                nullable: true
                description: Index into the request's `phases` array, or null.
              notes: { type: string }
              target_scored: { type: integer, nullable: true }
              target_defended: { type: integer, nullable: true }
              target_sessions: { type: integer, nullable: true }
              min_hit_rate: { type: number, format: float, nullable: true }
              target_drilled_sessions: { type: integer, nullable: true }

    ExerciseWrite:
      type: object
      description: >
        The admin-writable surface. `id`, `source` and `media` are absent by
        design: the id is derived from the name and permanent, `source` is the
        server's, and media has no upload path — leaving it out is what
        guarantees an edit cannot clear media a deploy added.


        Every field is optional so PATCH can be partial. POST requires `name`,
        and the write is rejected unless `sport`, `movement_pattern` and
        `load_type` end up valid.
      properties:
        name: { type: string, maxLength: 200 }
        sport:
          type: string
          description: Must be a sport in the discipline registry — see GET /modules.
        movement_pattern:
          type: string
          description: Must be one of GET /admin/exercises/vocabularies.
        movement_pattern_detail: { type: string }
        primary_muscles: { type: array, items: { type: string } }
        secondary_muscles: { type: array, items: { type: string } }
        equipment: { type: array, items: { type: string } }
        load_type:
          type: string
          enum: [weight_reps, reps, time, distance, distance_time]
        implements:
          type: integer
          enum: [1, 2]
          description: >
            How many implements of the logged weight move in one rep — the
            tonnage factor. 1 for a barbell, a machine or a single dumbbell; 2
            for a pair.


            Distinct from `is_unilateral`, which is how many LIMBS work. A
            dumbbell walking lunge is two implements and one leg; the factor
            used to be derived from those two flags together and could not say
            that, so the catalog was internally inconsistent by equipment. See
            migration 000057.


            Omitting it on a POST defaults to 1. Omitting it on a PATCH leaves
            the stored value alone. Any value but 1 or 2 is a 400.
        load_mode:
          type: string
          enum: [total, per_side]
          description: >
            Which number the athlete types. `per_side` means ONE implement of a
            pair, so a dumbbell exercise left at `total` silently reports half
            its real tonnage — which is what every console-authored dumbbell
            exercise did before this field existed here.


            Omitting it on a POST defaults to `total`, the column's own
            default. Omitting it on a PATCH leaves the stored value alone, like
            every other field. Sending an unrecognised value is a 400 — NOT a
            fallback to `total`, which would restore the halving bug through a
            typo. That is deliberately stricter than the seeder, which
            normalises so one bad row cannot fail a deploy.


            **`""` is unrecognised too**, and is the exception to this
            endpoint's "a field sent as empty is cleared" rule. There is nothing
            to clear to: an empty value would have to mean `total`, which is a
            halved exercise rather than an absent fact. An empty placeholder
            option or a `?? ''` in a client produces `""` without anyone
            intending it, which is exactly why it is refused rather than
            interpreted.
        is_unilateral: { type: boolean }
        instructions: { type: string }
        note:
          type: string
          maxLength: 500
          description: >
            The optional explanation of why this exercise's values are what they
            are. See `Exercise.note`.


            Omitting it on a PATCH leaves the stored value alone, like every
            other field here — so an edit that never mentions the note cannot
            wipe one. Sending it as `""` DOES clear it, which is this
            endpoint's ordinary "a field sent as empty is cleared" rule and is
            the right one here: an explanation that has stopped being true has
            to be removable. `load_mode` is the exception to that rule, not the
            pattern.


            Bounded at 500 characters because it renders in full, inline, on a
            phone with no "read more". Anything longer has become instructions
            and belongs in that field, which is unbounded because it has a
            section of its own.

    TechniqueWrite:
      type: object
      description: >
        The admin-writable surface. `id` and `source` are absent on purpose —
        the id is derived from the name at creation and immutable after, and
        the source is the server's.
      required: [name, category, position, gi_no_gi]
      properties:
        name: { type: string, example: São Paulo Pass }
        aliases: { type: array, items: { type: string } }
        category: { type: string, example: Pass }
        position:
          type: string
          description: Must be one of GET /admin/techniques/positions.
          example: Half Guard - Top
        position_detail: { type: string }
        gi_no_gi: { type: string, enum: [Both, Gi Only, No-Gi Only] }
        typical_belt: { type: string }
        description: { type: string }
        setup_from: { type: array, items: { type: string } }
        common_counters: { type: array, items: { type: string } }
        when_to_use: { type: string }
        common_next_moves: { type: array, items: { type: string } }
        video_reference: { type: string }
        source_notes: { type: string }
        ibjjf_ruleset_id: { type: string }
        function:
          type: string
          enum: [advance, reverse, escape, control, finish, ""]
        to_position:
          type: string
          description: Must be one of GET /admin/techniques/positions, or empty.

    DailyTracker:
      type: object
      description: >
        One athlete's daily tracker. Water, coffee and "creatine, 5 g, once a
        day" are all this object with different values — there is no per-tracker
        type, and nothing branches on `preset`.


        Amounts are stored in `unit`, always, whatever the athlete's display
        preference says — the same rule weights follow by being kilograms on the
        wire and pounds on the screen.
      required:
        [id, user_id, preset, name, icon, color_key, unit, increment,
         render_style, sort_order, count_noun, provisioned, created_at, updated_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        preset:
          type: string
          description: >
            The seeded preset this row came from, or empty for one the athlete
            authored. A provisioning key only: a preset row is an ordinary
            tracker, fully editable and archivable like any other.
        name: { type: string }
        icon: { type: string, description: "An emoji, or empty." }
        color_key:
          type: string
          description: >
            A key into the client palette, never a hex. A free colour can fail
            contrast on the card and nothing could check it at authoring time,
            so the client offers a validated set and stores the name of one. An
            unrecognised key renders as the client default.
        unit:
          type: string
          enum: ["", ml, g, mg, cup, dose, count]
          description: The canonical unit amounts are recorded in.
        increment:
          type: number
          description: How much one tap adds, in `unit`.
        target:
          type: number
          nullable: true
          description: >
            The daily target, in `unit`. **Null is a real state**, meaning the
            athlete wants a count with no goal — not a missing value. Crossing a
            target is never blocked.
        render_style:
          type: string
          enum: [auto, glyphs, bar, dose]
          description: >
            `auto` lets the client pick from the target and increment: a glyph
            row up to twelve, a bar beyond that, one large glyph for a single
            dose. A stored value overrides it.
        sort_order: { type: integer }
        count_noun:
          type: string
          maxLength: 24
          description: >
            The singular word for one tap — "cup", "capsule", "scoop" — or empty
            for a tracker that just counts and reads "4 of 8".


            **Authored, never derived.** The noun belongs to the substance and
            the unit cannot carry it: 5 g of creatine is a dose, 5 g of fibre is
            a serving, 30 g of protein is a scoop, and all three are `g`. A
            client may suggest one from the unit while authoring; what is stored
            is what the athlete said. Must not contain control characters or
            start or end with a space — it is pluralised and concatenated into
            the card copy and into the VoiceOver label.
        cutoff_minutes:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1439
          description: >
            Minutes since local midnight — a plain clock time, e.g. `960` for
            16:00. **Null is a real state**, meaning no cutoff is configured —
            distinct from `0`, which is midnight. Generic like `target`:
            nothing about the column says caffeine, and it is what the client
            derives its "last at 15:40 — past your 16:00 cutoff" line from,
            compared against the day's last entry (N431).
        provisioned:
          type: boolean
          description: >
            Whether VOLA would re-create this tracker if it were deleted — true
            only for a preset every athlete is given automatically.


            **Derived server-side, and on the wire because a client cannot
            compute it.** A client knows a tracker's `preset` key but not which
            keys provisioning covers, and inferring "has a preset key" is wrong
            the moment a preset ships opt-in: coffee is not provisioned, does
            not come back, and deletes like any other tracker. A client that
            guesses will tell an athlete something false about their own data.


            The only thing it governs: `DELETE …?purge=true` refuses a
            provisioned tracker (the delete would silently undo itself on the
            next list), so a client should offer archiving instead of a delete
            control that cannot work. It is not a permission and grants nothing.
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Set by DELETE. Archived trackers are excluded from the list and keep
            every entry they ever recorded.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DailyTrackerInput:
      type: object
      description: >
        A new athlete-authored tracker. `preset` is not accepted — presets are
        assigned by the server, and a caller who could claim one would collide
        with provisioning and make somebody's water card unreachable.
      required: [id, name, color_key, increment]
      properties:
        id:
          type: string
          description: >
            Client-generated, so a retry after a lost response is idempotent
            rather than a second tracker.
        name: { type: string, maxLength: 60 }
        icon: { type: string, maxLength: 16 }
        color_key: { type: string }
        unit: { type: string, enum: ["", ml, g, mg, cup, dose, count] }
        increment: { type: number }
        target: { type: number, nullable: true }
        render_style: { type: string, enum: [auto, glyphs, bar, dose] }
        sort_order: { type: integer }
        count_noun: { type: string, maxLength: 24 }
        cutoff_minutes: { type: integer, nullable: true, minimum: 0, maximum: 1439 }

    TrackerPreset:
      type: object
      description: >
        A tracker the athlete can turn on, as the server ships it. Field for
        field the defaults `POST /tracker-presets/{presetKey}` would provision —
        exposed so a client can show what tapping it will produce rather than
        creating something the athlete has not seen.


        There is deliberately no "already added" flag: the client already holds
        the athlete's trackers and can tell, the answer would be stale by the
        time they tapped, and adding one they already have is idempotent anyway.
      required: [preset, name, icon, color_key, unit, increment, render_style, count_noun]
      properties:
        preset:
          type: string
          description: The key to POST back. Stable; this is what identifies it.
        name: { type: string }
        icon: { type: string }
        color_key: { type: string }
        unit: { type: string, enum: ["", ml, g, mg, cup, dose, count] }
        increment: { type: number }
        target: { type: number, nullable: true }
        render_style: { type: string, enum: [auto, glyphs, bar, dose] }
        count_noun: { type: string }
        cutoff_minutes: { type: integer, nullable: true, minimum: 0, maximum: 1439 }

    DailyTrackerPatch:
      type: object
      description: >
        A PARTIAL update. **A field absent from the body is not written**, and
        that is the contract, not an implementation detail: the phone's target
        screen sends `{"target": 2500}` and must not thereby blank the name,
        icon, colour or unit.


        `target` distinguishes three states, which is why it is the one nullable
        field here: absent means leave it alone, `null` means the athlete wants
        no target, and a number sets one. Every other field is non-nullable —
        sending `null` for one is rejected rather than silently coerced.
      properties:
        name: { type: string, maxLength: 60 }
        icon: { type: string, maxLength: 16 }
        color_key: { type: string }
        unit: { type: string, enum: ["", ml, g, mg, cup, dose, count] }
        increment: { type: number }
        target: { type: number, nullable: true }
        render_style: { type: string, enum: [auto, glyphs, bar, dose] }
        sort_order: { type: integer }
        cutoff_minutes: { type: integer, nullable: true, minimum: 0, maximum: 1439 }
        count_noun: { type: string, maxLength: 24 }

    TrackerEntry:
      type: object
      description: One tap.
      required: [id, tracker_id, user_id, logged_on, logged_at, amount, created_at]
      properties:
        id: { type: string }
        tracker_id: { type: string }
        user_id: { type: string }
        logged_on:
          type: string
          format: date
          description: >
            The athlete's LOCAL calendar day, supplied by the client and never
            derived from `logged_at`. West of Greenwich a 23:58 glass of water
            belongs to the day that is ending, and a UTC-derived date files it
            under tomorrow.
        logged_at:
          type: string
          format: date-time
          description: >
            The moment, for "last at 16:40". Defaulted to the server's now when
            omitted — unlike `logged_on`, which cannot be defaulted because the
            server does not know the athlete's timezone.
        amount:
          type: number
          description: >
            The tracker's increment AS IT WAS when this was logged, so changing
            the increment later does not rewrite last week.
        created_at: { type: string, format: date-time }

    TrackerEntryInput:
      type: object
      required: [logged_on, amount]
      properties:
        logged_on: { type: string, format: date }
        logged_at: { type: string, format: date-time }
        amount: { type: number }

  headers:
    ETag:
      description: >
        Strong validator for this exact response body (a truncated SHA-256,
        base64url). Send it back as `If-None-Match` on the next request to get
        a 304 instead of the payload. Applied by response middleware, so it is
        present on every 200 from a GET, not just the ones listed here.
      schema: { type: string }
      example: '"9tK3xQwZ2sN4fRvB1cLmYg"'

  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >
        An `ETag` from a previous response. If it still matches, the server
        answers `304 Not Modified` with no body. Accepts a comma-separated
        list and `*`.
      schema: { type: string }

  responses:
    RateLimited:
      description: >
        Too many requests. Carries a `Retry-After` header in whole seconds,
        rounded UP so that obeying it exactly succeeds.


        **Applies to EVERY authenticated endpoint**, not only the ones that
        name it below. The default budget is attached to authentication itself
        rather than per route, so a route cannot be added without it; listing
        it on all sixty would be noise, and listing it on none would leave the
        two deliberately-tight limits undocumented. The two that name it are
        the writes that put something in another person's inbox, and they are
        an order of magnitude stricter than the default.


        The response never says WHICH limit was hit — that is in the server
        log, where it can be tuned from, and not in the reply, where it is
        free reconnaissance.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotModified:
      description: >
        The representation is unchanged since the `ETag` in `If-None-Match`.
        No body, and deliberately no `Content-Length` or `Content-Type`.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"

    BadRequest:
      description: Malformed request body or a value that failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, malformed, or expired bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but the caller isn't an admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource doesn't exist for this caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The resource already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /healthz:
    get:
      summary: Liveness check
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: >
            The API is up. Deliberately NOT conditional: it sends
            `Cache-Control: no-store` and no `ETag`, so a liveness probe is
            always answered with a fresh 200 rather than a 304.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"

  /me:
    get:
      summary: Return the authenticated caller's verified identity
      operationId: getMe
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The verified caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications:
    get:
      summary: What is waiting for you
      operationId: getPendingCounts
      description: >
        Counts of things other people have sent that the caller has not
        answered, keyed by source.


        **DERIVED, not stored.** There is no notifications table: everything
        that arrives already exists as a pending row — a friend request, a
        share — and that row IS the notification. A stored copy would be a
        second truth that can disagree with the first. For the same reason
        there is no read/unread state: ANSWERING is what clears a count, which
        is the only definition that cannot go out of sync. The consequence is
        deliberate — you cannot dismiss a friend request by looking at it,
        because it is still waiting for you.


        **Counts, not a feed.** The items behind these numbers already have
        screens that render them with the right verbs attached. A feed would be
        a third rendering whose only affordance is "go to one of the other
        two".


        Every key the server knows is always present, at zero when nothing is
        waiting. A MISSING key means the build has no such source, which is a
        different thing from "nothing waiting" — clients must not treat them
        alike. Counts are capped at 100 — the cap meaning "this many or more", every
        lower value exact — since a badge cannot usefully render more; the cap also stops one athlete making another's most-polled
        endpoint expensive.


        This endpoint FAILS rather than omitting a source it could not count.
        A zero that means "could not check" reads as "nothing is waiting for
        you", which is the one answer a badge must never give wrongly.
      responses:
        "200":
          description: Pending counts, keyed by source.
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending:
                    type: object
                    additionalProperties:
                      type: integer
                      minimum: 0
                      # Must agree with friend.maxBadgeCount and
                      # share.maxBadgeCount, which say the same thing in Go.
                      # The CAP ITSELF means "this many or more"; every value
                      # below it is exact. That is what lets a client render
                      # "99+" without presenting a capped number as fact.
                      maximum: 100
                    description: >
                      Keys are wire format and clients switch on them.
                      Currently `friend_requests` (INCOMING only — an outgoing
                      request is pending but is not waiting on you) and
                      `shares` (the inbox, never the sent list).
                    example:
                      friend_requests: 2
                      shares: 0
        "401": { $ref: "#/components/responses/Unauthorized" }

  /shares:
    post:
      summary: Send a friend a copy of something
      operationId: createShare
      description: >
        ONE endpoint for every shareable type, rather than a share verb per
        resource. A per-resource `/sequences/{id}/share` would be the fourth
        private implementation of one idea by the time plans and workouts
        arrived, and each would have re-derived the friendship check.


        Shares reach FRIENDS ONLY. Not-a-friend, no-such-handle, a request
        still pending, an unreal resource id, and a resource that is not yours
        to send are ALL the same 404 — each distinct answer would turn this
        into an oracle over other people's accounts or libraries.


        Sending does not copy anything. The recipient's accept is what copies,
        and what it copies is the resource as it stands AT THAT MOMENT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_username, resource_type, resource_id]
              properties:
                to_username: { type: string }
                resource_type:
                  type: string
                  description: >
                    Must be a type this build can copy — "sequence",
                    "workout", "nutrition_entry" (one logged food),
                    "nutrition_food" (an already-saved food or meal/recipe)
                    or "nutrition_day" (a whole day's entries — never the
                    sender's target or body weight) today. Anything else is
                    400 `invalid_input`, rejected BEFORE the handle is
                    resolved, so a bogus type cannot be used to probe
                    whether an account exists.
                  example: workout
                resource_id: { type: string }
      responses:
        "204": { description: Sent — it now sits pending in their inbox. }
        "400":
          description: A missing field, or a resource_type nothing can copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "409":
          description: >
            You already sent them this exact thing and they have not answered.
            Uniqueness is on PENDING rows only, so re-sending after they accept
            is allowed — that is how an author sends an updated version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /shares/inbox:
    get:
      summary: What is waiting for you
      operationId: listShareInbox
      responses:
        "200":
          description: >
            Pending shares addressed to the caller, newest first, capped at 200
            and NOT paginated. Past that the oldest become invisible while still
            holding their slot in the pending-uniqueness index, so a re-send of
            one 409s against a card the recipient cannot see. Acceptable at
            launch scale; pagination is the fix when it stops being.
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares:
                    type: array
                    items: { $ref: "#/components/schemas/ShareCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /shares/sent:
    get:
      summary: What you are waiting on
      operationId: listSentShares
      description: >
        The caller's own PENDING shares, newest first — what they have sent
        that nobody has answered yet, and the list they cancel from.


        **Pending only, and that is a privacy decision rather than a scope
        cut.** Declining a share deletes it, so if accepting left a visible row
        here then a row that VANISHED would mean "they declined" — which is
        exactly the inference decline-is-delete exists to prevent. Accepted and
        declined therefore look identical from the sender's side: the row is
        simply gone. This endpoint answers "what have they not answered yet",
        and deliberately never answers "what did they say". Same rule, and the
        same reason, as the outgoing half of GET /v1/friends/requests.


        Capped at 200 and not paginated, matching the inbox.
      responses:
        "200":
          description: The caller's unanswered outgoing shares, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares:
                    type: array
                    items: { $ref: "#/components/schemas/SentShareCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /shares/{id}:
    delete:
      summary: Decline a share, or take one back
      operationId: dismissShare
      description: >
        One verb for both, as with friend requests, because both are "this,
        gone" and the caller's UI knows which it offered. Declining DELETES
        rather than storing a rejection: a stored decline would either tell the
        sender their thing was refused — friction the app has no business
        manufacturing — or force the API to lie about why nothing happened.


        **ASYMMETRIC, and the asymmetry is a privacy control rather than a
        permission model.** The RECIPIENT may remove a share in any status —
        declining a pending one, or clearing an accepted one, which costs them
        nothing since the copy is already theirs. The SENDER may only remove a
        PENDING one, and gets the ordinary 404 for anything else.


        Without that restriction this endpoint is a perfect accept-vs-decline
        oracle: accepting leaves the row and declining deletes it, so a
        status-blind delete answers 204 for one and 404 for the other. Record
        the ids from GET /v1/shares/sent, wait for them to leave it, then
        delete each — one request per share, deterministic. That defeats the
        exact property the sent list's pending-only design exists to protect.
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            No such share; the caller is neither end of it; or the caller is
            the SENDER and the share is no longer pending. All one answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /shares/{id}/accept:
    post:
      summary: Accept a share, which is what makes the copy
      operationId: acceptShare
      description: >
        The copy and the share's status change commit in ONE transaction, so
        there is no accepted share without a copy and no way to accept twice
        and get two.


        Only the RECIPIENT may accept; a sender accepting their own share gets
        the same 404 as a share that never existed.
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      responses:
        "200":
          description: Copied. The id returned is the caller's own new copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedShare" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: >
            The sender deleted the thing before you accepted it, or it is no
            longer theirs to pass on. 410 rather than 404 because you genuinely
            were sent something — resource_id is polymorphic and can carry no
            foreign key, so this is the case the schema cannot prevent. Carries
            the `not_found` code, the enum being closed.


            A deleted source CLEARS the dead share. The other 410 — a
            resource_type this build cannot copy, reachable only across a
            rollback — deliberately does not: that resource may be perfectly
            intact and merely unreachable from this binary, and deleting on
            account of a deploy would be irreversible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /feed:
    get:
      summary: What your training partners have been doing
      description: >
        Finished sessions belonging to the caller's accepted friends, newest
        FINISHED first.


        THE FIRST ATHLETE-TO-ATHLETE READ OF TRAINING DATA IN THIS API. Every
        other session read is scoped to its owner; sharing moves copies on an
        explicit send-and-accept so that it never has to decide who may see
        what. This decides, and does so under three conditions that all have
        to hold: the owner is an ACCEPTED friend, the owner has turned
        `share_training_with_friends` on (off by default), and the session is
        FINISHED.


        **The feed reaches back a limited, rolling window and no further —
        read `window_days` off the response rather than assuming a number.**
        (N13, #379: this description used to hardcode "3 days", one of three
        independent copies of that figure across mobile and this file, none
        of which could notice the other two going stale. `window_days` is
        now the one source of truth all of them read.) The window is a
        rolling DURATION against `ended_at`, not a count of calendar days —
        there is no timezone in the comparison, so it cannot acquire one. It
        applies to BOTH the page and `total`, so the count never promises
        rows the list will not return.


        Nothing is deleted, and this is not retention: the owner's own history,
        calendar and session list are complete and untouched. The feed answers
        "what are my training partners doing", and a session from last Tuesday
        does not answer it. A client should say so at the end of the list, or a
        feed that stops reads as one that broke.


        MOBILE ONLY by product decision — the web app sees shared content and
        manages friends; a feed is a phone thing. Nothing prevents a web client
        calling this, but nothing should.


        A row is the smallest thing that makes a card. No sets, no notes, no
        RPE, no exercise ids: it says THAT somebody trained and roughly how
        much, not what their programme is. Enlarging it is a privacy decision
        rather than a feature.


        The one enlargement is `detail`, and it took a SECOND opt-in —
        `share_training_details`, also off by default — because the numbers and
        the programme are different disclosures. It stays inside the limits
        above: names and figures the owner chose to publish, still no sets, no
        notes, no RPE and no ids, and never a `conceded` outcome.


        There is deliberately no `GET /feed/{id}`. The row is the whole of what
        a friend may see, so a per-item endpoint would be a second and wider
        path to the same data.
      operationId: listFeed
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: A page of feed items, newest finished first.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset, window_days]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FeedItem" }
                  total:
                    type: integer
                    description: >
                      Counted under the SAME access rule as the list. A total
                      larger than what the list would return promises pages
                      that do not exist, and reports how much training a friend
                      has done that the reader may not see.
                  limit: { type: integer }
                  offset: { type: integer }
                  window_days:
                    type: integer
                    description: >
                      How far back the feed reaches, in days (N13, #379). The
                      one place a client reads this number — never hardcode
                      it in copy, here or on the client: this field is what
                      keeps "showing the last N days" from going stale the
                      day the window changes.
        "400":
          description: limit or offset is not a non-negative integer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sessions/{sessionID}/card:
    get:
      summary: The share card's numbers for one finished session
      operationId: getSessionCard
      description: >
        One endpoint rather than three, because the card renders once and
        either has its numbers or does not — three round trips would give it
        three chances to half-arrive, and a card that pops a score in a second
        after the calories is worse than one that waits.


        Nested under the session because it is a projection of that session and
        has no life without it.
      parameters:
      - name: sessionID
        in: path
        required: true
        schema: { type: string }
      responses:
        "200":
          description: The card's derived numbers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            No finished session of yours with that id — absent, somebody
            else's, and still-running are one answer. An unfinished session has
            no duration, so every number would be a claim about a session still
            in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /friends:
    get:
      summary: The caller's accepted friends
      operationId: listFriends
      responses:
        "200":
          description: Accepted connections, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [friends]
                properties:
                  friends:
                    type: array
                    items: { $ref: "#/components/schemas/FriendCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /friends/{username}:
    delete:
      summary: Remove whatever links the caller and this handle
      operationId: removeFriend
      description: >
        One verb for three meanings — declining an incoming request,
        cancelling an outgoing one, or unfriending — because all three are
        "this relationship, gone", and the caller's UI knows which it offered.
        Decline DELETES rather than storing a declined state: a stored decline
        either blocks re-requests forever or forces the API to lie to the
        sender. The honest cost (a declined sender may ask again) is a
        recorded moderation residual.
      parameters:
      - name: username
        in: path
        required: true
        schema: { type: string }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            No relationship between the caller and that handle — including
            when the handle itself does not exist, indistinguishably.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /friends/requests:
    get:
      summary: Open requests, both directions
      operationId: listFriendRequests
      responses:
        "200":
          description: Pending rows involving the caller, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendRequests" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Ask someone to be your friend
      operationId: sendFriendRequest
      description: >
        Addressed by handle. The caller must have claimed a username first —
        the request sits in someone's inbox AS a handle, and an unnamed
        requester would render as nothing.


        One 409 covers "already friends" AND "pending in either direction":
        splitting them would tell a sender things about the other side's
        choices that are not theirs to know. A crossing request (they asked
        you while you asked them) is the same 409 — the pair is stored
        canonically, so no state exists where both sit in each other's
        inboxes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        "204": { description: Sent — it now sits pending in their inbox. }
        "400":
          description: No body username, a self-request, or the caller has no handle yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "409":
          description: Already connected, or a request is pending in either direction.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /friends/requests/{username}/accept:
    post:
      summary: Accept a pending request from this handle
      operationId: acceptFriendRequest
      description: >
        Only the RECIPIENT can accept. A sender trying to accept their own
        request gets the same 404 as "no such request" — a distinct answer
        would confirm the request still exists.
      parameters:
      - name: username
        in: path
        required: true
        schema: { type: string }
      responses:
        "204": { description: You are now friends. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{username}:
    get:
      summary: Look up an athlete by username
      operationId: lookupUser
      description: >
        Exact-match resolution of a handle to its public card — the search
        half of the social scope. The input is case-normalised, so
        `/v1/users/Dmytro` finds `dmytro`.


        NOT prefix search, deliberately: you type the handle a friend told
        you. Handle existence disclosure was accepted with the username
        design, but prefix search would widen it from "confirm one handle"
        to "enumerate cheaply", and nothing in the friend-request flow needs
        it. Authentication is required for the same reason — lookup runs at
        signed-in speed, not anonymous-scraper speed.


        Absent, malformed and reserved handles all answer the SAME 404:
        none of the three can be a person, and distinct answers would teach
        a prober the format and the reserved list one probe at a time.
      parameters:
      - name: username
        in: path
        required: true
        schema: { type: string }
      responses:
        "200":
          description: The public card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profile:
    get:
      summary: Get the authenticated caller's profile
      operationId: getProfile
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Create the authenticated caller's profile (onboarding)
      operationId: createProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileCreate"
      responses:
        "201":
          description: The newly created profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    patch:
      summary: Partially update the authenticated caller's profile
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The requested username belongs to another account. The code is
            `already_exists`; the message says which fact ("that username is
            taken") — distinct from the create-time 409, which means the
            profile itself already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /profile/avatar:
    post:
      summary: Upload or replace the authenticated caller's avatar
      operationId: uploadAvatar
      description: >
        Upload and replace are the same request: the stored object's key is
        deterministic per account, so a second upload simply overwrites the
        first. The image is **resized server-side** and the original is
        discarded — only the resized copy is ever written to storage or
        served to another athlete (N12).


        A failed upload never leaves a half-set avatar: the object write
        happens before the account is marked as having one, so a failed
        replace leaves the PREVIOUS avatar in place, and a failed first
        upload leaves the monogram showing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
                  description: >
                    JPEG or PNG, sniffed from the bytes rather than the
                    part's declared Content-Type. Resized server-side to fit
                    within 512x512 (never upscaled) and re-encoded to JPEG.
      responses:
        "200":
          description: The caller's profile, with the new avatar_url set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Not a readable JPEG/PNG, or no avatar part sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Object storage is not configured on this environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Remove the authenticated caller's avatar
      operationId: removeAvatar
      description: >
        The account's own removal. Clears has_avatar on the account first,
        then best-effort deletes the stored object — so a delete that fails
        on the storage side still leaves the athlete-facing state correct
        (the monogram is back) rather than reporting success while the
        object secretly remains reachable.
      responses:
        "204": { description: Removed. The monogram is the fallback now. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Object storage is not configured on this environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /profile/exercise-units:
    get:
      summary: The caller's per-exercise unit overrides
      operationId: listExerciseUnits
      description: >
        A map of exercise id to unit system. A **missing key means "use the
        profile default"** — there is deliberately no third state, so
        clearing an override removes the key rather than storing a sentinel.

        Exists because a lifter who thinks in kilograms still faces a leg
        press marked in pounds, and converting in your head at the moment
        you're recording a number is exactly what this avoids.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Overrides only; exercises using the default are absent.
          content:
            application/json:
              schema:
                type: object
                required: [exercise_units]
                properties:
                  exercise_units:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [metric, imperial]
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profile/exercise-units/{exerciseID}:
    put:
      summary: Set or clear one exercise's unit override
      operationId: setExerciseUnit
      parameters:
        - name: exerciseID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                unit_system:
                  type: string
                  nullable: true
                  enum: [metric, imperial]
                  description: Null clears the override, falling back to the profile default.
      responses:
        "204": { description: "Stored, or cleared." }
        "400":
          description: An unknown exercise, or a unit outside metric/imperial.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /modules:
    get:
      summary: The discipline registry, merged with the caller's own toggles
      description: >
        Every discipline VOLA supports, in display order, each with its
        capabilities and whether this user has it enabled. The catalog and the
        user's choices arrive together because a client needs both before it can
        render navigation — splitting them would mean two requests before the
        nav bar can draw.


        A discipline the caller has never toggled reports its registry default,
        so adding a discipline requires no backfill.
      operationId: listModules
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: All modules with the caller's enablement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleList"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Toggle one or more modules for the caller
      description: >
        A sparse map — `{"bjj": false}` toggles one module and leaves the rest
        untouched, so two clients editing different toggles cannot clobber each
        other. Returns the full merged set, since the caller's next render needs
        all of it anyway.
      operationId: setModules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: boolean
              minProperties: 1
              example:
                bjj: false
      responses:
        "200":
          description: The full module set after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /flags:
    get:
      summary: List all server-controlled feature flags
      operationId: listFeatureFlags
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: All feature flags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagList"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /activities:
    get:
      summary: List the authenticated caller's own activities
      operationId: listActivities
      description: >
        The caller's own activity log, newest first. Capped at 500; there is no
        pagination, so older entries are simply not returned.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The caller's activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: >
        Create an activity for the authenticated caller. Idempotent on
        `id` — retrying a sync with the same id returns the original row,
        not an error.
      operationId: createActivity
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityCreate"
      responses:
        "200":
          description: The created (or, on a retried id, the original) activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exercises:
    get:
      summary: List the global exercise catalog
      operationId: listExercises
      description: >
        **Published exercises only.** Drafts — console content not yet finished
        — are excluded here and from `GET /exercises/{exerciseID}`, which
        returns `404` for one. There is no parameter to include them.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: sport
          in: query
          required: false
          schema: { type: string }
          description: Exact-match filter, e.g. `strength` or `running`.
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: >
            Finds an exercise by the words an athlete would use, not by
            substring. Every typed word must appear somewhere in the name — in
            any order, punctuation and simple plurals ignored — and a small set
            of lifting synonyms lets one word reach another: "bench" finds a
            press, "overhead" finds a shoulder press.


            Results are ordered by how close the whole name is to the whole
            query, so a row that happens to contain every typed word does not
            outrank the movement actually meant.


            A query of only punctuation (`%`, `_`, `\`) matches NOTHING. It is
            not a wildcard and it is not "no filter".
      responses:
        "200":
          description: >
            Matching catalog entries. Ordered by sport, then by closeness to the
            query when one was given, then by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseList"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exercises/identify:
    post:
      summary: Identify a gym machine from a photograph
      operationId: identifyExercise
      description: >
        Returns a **ranked shortlist of candidate exercises** for a photo of a
        gym machine. It never selects, logs or writes anything — the athlete
        taps one.


        **More than one candidate is deliberate.** The failure that costs an
        athlete something here is a confidently wrong answer, not a missing one,
        and nothing on the server can tell a correct match from a plausible
        wrong one. The athlete is standing in front of the machine and can; a
        shortlist makes a near-miss one extra tap instead of an invisible error.
        Clients should present these as choices and must not auto-select the
        first.


        **`confidence` is reported, not acted on.** It is not calibrated to "am
        I right" — the model has never seen this catalog — and at best means
        "how clearly can I see a machine". Useful for prompting a retake; never
        a threshold.


        The model answers from a closed shortlist of the catalog's machine
        exercises, and every returned id is re-checked against that shortlist
        server-side. An id that was not offered is dropped rather than mapped to
        a neighbour, and a response whose reported `equipment` contradicts its
        own candidates is refused outright.


        **Capped at 20 per athlete per rolling 24 hours**, persisted, so the
        limit survives a restart. Refused calls count too — a refusal is a
        billed answer, and a quota counting only successes would let a client
        loop on a photo the model keeps declining and pay for every attempt. See
        the 429 below for how this differs from the shared burst limit.


        **A call the provider never answered does NOT count.** A refused
        connection, a DNS failure, a revoked key or an upstream error status
        spends no tokens, so it spends none of the 20 — an outage would
        otherwise empty the allowance during exactly the unfamiliar-gym session
        this feature exists for, and the quota is persisted, so unlike the burst
        limiter it does not recover on restart. Those arrive as `503` with the
        code `unavailable`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: >
                    The photo, at most 5 MB. The media type is SNIFFED from the
                    bytes, not read from the part's declared `Content-Type`;
                    JPEG, PNG, GIF and WebP are accepted. Multipart is the only
                    transport — there is no text path here, so base64 in JSON
                    would inflate the payload for nothing.
      responses:
        "200":
          description: A draft shortlist. Nothing has been logged.
          content:
            application/json:
              schema:
                type: object
                required: [identification]
                properties:
                  identification:
                    type: object
                    required: [equipment, candidates, model]
                    properties:
                      equipment:
                        type: string
                        description: >
                          The equipment family, e.g. `cable-stack`. **Never
                          empty on a 200, and every candidate uses it** — a
                          response naming no equipment, or one whose candidates
                          disagree with it, is refused as incoherent rather than
                          returned. The earlier wording promised only "at least
                          one candidate", which was both weaker than the code
                          now is and untrue on the empty path.
                        example: cable-stack
                      candidates:
                        type: array
                        description: >
                          Ranked, most likely first. Never empty on a 200, and
                          every entry uses the `equipment` above. Candidates
                          that disagree with it are dropped server-side before
                          the cap is applied, so a mostly-coherent answer still
                          returns its good candidates rather than nothing.
                        maxItems: 4
                        items:
                          type: object
                          required: [exercise_id, name, confidence]
                          properties:
                            exercise_id:
                              type: string
                              description: A published catalog exercise.
                              example: seated-cable-row
                            name:
                              type: string
                              description: >
                                Taken from the catalog, never from the model, so
                                it always matches what every other screen calls
                                this exercise.
                              example: Seated Cable Row
                            confidence:
                              type: number
                              minimum: 0
                              maximum: 1
                              example: 0.82
                      model:
                        type: string
                        description: >
                          The model id the provider reports having used, which
                          is not always the one requested — an alias resolves to
                          a dated snapshot.
                        example: gpt-5.6-luna
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: >
            The photo was read and no machine on the shortlist matched — a
            person, a room, a free weight, or simply unclear. **Not a client
            error to fix:** the remedy is a better photo, not a different
            request, which is why this is 422 rather than 400. Deterministic for
            the same image, so do not retry it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: >
            Two different limits answer with this status, and a client should
            treat them the same way — read `Retry-After` and say when.


            **A daily quota**, persisted per athlete: 20 identifications in a
            rolling 24 hours. The message names the cap and says roughly when
            the next one frees up, as a RELATIVE duration rather than an
            instant, because a timestamp is the wrong wall-clock time for
            everyone outside UTC. The reset is derived from the oldest call
            still inside the window.


            **A burst rate limit**, in-memory and shared with every other
            authenticated route. It bounds how fast calls can be made; the quota
            bounds how many there are in a day. Both exist because neither
            substitutes for the other: without the limiter a client bug spends
            the whole day's allowance in one second, and without the quota the
            day has no ceiling at all — the limiter resets on every deploy.


            Consistent with `components/responses/RateLimited`, the response
            does not say which limit was hit; that is in the server log, where
            it can be tuned from, rather than in the reply where it is free
            reconnaissance.
          headers:
            Retry-After:
              description: >
                Whole seconds, never below 1, and ROUNDED UP so that waiting
                exactly this long succeeds — the same promise
                `components/responses/RateLimited` and the other metered
                endpoints make. Both limits behind this status answer with it.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >
            The quota could not be read. Deliberately a refusal rather than a
            pass: failing open here would turn a database blip into an unmetered
            spending window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            The provider never answered — a refused connection, a DNS failure,
            a revoked key, an upstream error status — or it answered with
            something unusable, or this deploy has no API key configured.


            **Read the `code` to tell them apart, and only the code** — the
            message is not part of this contract. `unavailable` means the
            provider never answered: nothing was spent and **this call did not
            use one of the athlete's 20**, so a client may say so and may retry
            the identical request once service returns. `internal` means the
            call completed and was charged, or that this deploy has no key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /exercises/{exerciseID}:
    get:
      summary: Get one catalog entry by its slug
      operationId: getExercise
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: exerciseID
          in: path
          required: true
          schema: { type: string }
          example: barbell-back-squat
      responses:
        "200":
          description: The exercise.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /techniques:
    get:
      summary: List the BJJ technique library
      operationId: listTechniques
      description: >
        **Published techniques only.** Drafts — console content not yet finished
        — are excluded here and from `GET /techniques/{techniqueID}`, which
        returns `404` for one. There is no parameter to include them: a draft
        that becomes visible by passing a query string is not a draft.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: position
          in: query
          schema: { type: string }
          example: Guard - Bottom
        - name: category
          in: query
          schema: { type: string }
          example: Submission
        - name: gi
          in: query
          schema: { type: string, enum: [Both, "Gi Only", "No-Gi Only"] }
          description: >
            Asking for gi or no-gi also returns techniques marked `Both` —
            a filter that excluded them would hide most of the library.
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
          description: Case-insensitive substring of the name **or any alias** — "scarf hold" finds "Kesa-Gatame Escape".
      responses:
        "200":
          description: Matching techniques, ordered by position then category then name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechniqueList" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: Invalid filter value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /techniques/rulesets:
    get:
      summary: List IBJJF rulesets
      operationId: listIBJJFRulesets
      description: >
        All 25 IBJJF rulesets. Fetch once and cache: this is what turns a
        TechniqueSummary's `ibjjf_ruleset_id` into a legality badge without a
        request per row. They change with the IBJJF rulebook, not with the
        library.
      tags: [Techniques]
      security: [{ ClerkBearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Every ruleset, ordered by id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IBJJFRulesetList" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /techniques/positions:
    get:
      summary: List the BJJ position glossary
      operationId: listPositions
      description: >
        All eleven positions, already in pedagogical reading order, plus
        `round_map` — the teaching diagram whose nodes are these positions.
        Fetch once and cache, like the rulesets; the map rides along rather
        than getting its own endpoint so a client cannot hold a map and a
        glossary from different versions. There is no per-position technique endpoint on
        purpose: a client that already holds the library resolves "techniques
        from here" locally, by prefix-matching each summary's `position`
        against this entry's `family` AND then applying
        `detail_includes`/`detail_excludes` against its `position_detail`.
        Both steps are required — see those fields.
      tags: [Techniques]
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Every position, ordered by order_index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PositionList" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /techniques/positions/{positionID}:
    get:
      summary: Get one position
      operationId: getPosition
      tags: [Techniques]
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: positionID
          in: path
          required: true
          schema: { type: string }
          example: closed-guard
      responses:
        "200":
          description: The position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Position" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /techniques/{techniqueID}:
    get:
      summary: Get one technique
      operationId: getTechnique
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: techniqueID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The technique.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Technique" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bjj/standing:
    get:
      summary: The athlete's BJJ rank and promotion history
      description: >
        `current` is DERIVED from `promotions`, not stored — the highest rank
        recorded, which is well defined even when promotions were entered out
        of order or without dates. It is null when nothing has been recorded:
        a new account has no belt, and defaulting to white would put a rank on
        someone who has never trained.
      operationId: getBjjStanding
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Rank and history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BjjStanding" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bjj/promotions:
    post:
      summary: Record a promotion
      operationId: createBjjPromotion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BjjPromotionInput" }
      responses:
        "201":
          description: The recorded promotion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BjjPromotion" }
        "400":
          description: >
            Unknown belt, stripes outside 0-4, degree outside 0-6, a degree on
            a belt other than black, or `promoted_on` not in `YYYY-MM-DD`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bjj/promotions/{promotionID}:
    parameters:
      - name: promotionID
        in: path
        required: true
        schema: { type: string }
    patch:
      summary: Correct a recorded promotion
      description: >
        Replaces every field. A promotion belonging to another account
        answers 404, not 403 — the same non-disclosure the admin routes use.
      operationId: updateBjjPromotion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BjjPromotionInput" }
      responses:
        "200":
          description: The updated promotion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BjjPromotion" }
        "400":
          description: >
            Invalid rank, or `promoted_on` not in `YYYY-MM-DD`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Remove a recorded promotion
      description: >
        Removing the promotion that set the current rank lowers it, because
        rank is derived from what remains. Any attached photo's object is
        deleted too, best-effort — see createBjjPromotionPhotoUpload.
      operationId: deleteBjjPromotion
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bjj/promotions/{promotionID}/photo:
    post:
      operationId: createBjjPromotionPhotoUpload
      summary: A short-lived URL to upload a promotion photo to
      description: >
        Returns a presigned PUT, the same shape as
        createBodyCheckinPhotoUpload. **The bytes never pass through this
        API.**


        **The storage key is derived from the authenticated caller and the
        promotion id in the path, never accepted from the client.** That is
        the whole security property: a caller cannot obtain a signature over
        somebody else's object.


        Unlike a check-in's date-derived key, a promotion's key is
        id-derived and stable for the life of the row — the promotion must
        already exist (create it first via `POST /bjj/promotions`), and
        replacing the photo overwrites the same object rather than minting a
        new key. An id that does not exist, or belongs to another account,
        answers 404.


        These objects are private, read through a short-lived presigned URL
        minted per response and returned as `photo_url` on the promotion; a
        stored URL would simply expire.


        `503` when the environment has no object storage configured, which is
        a supported state rather than a fault — local development and CI
        have no bucket.
      tags: [BJJ]
      parameters:
        - name: promotionID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Upload the JPEG to `upload_url` with the given content type.
          content:
            application/json:
              schema:
                type: object
                required: [upload_url, content_type, max_bytes, expires_in, promotion]
                properties:
                  upload_url: { type: string }
                  content_type: { type: string, example: image/jpeg }
                  max_bytes: { type: integer, description: What the client must downscale below. }
                  expires_in: { type: integer, description: Seconds the signature is valid for. }
                  promotion: { $ref: "#/components/schemas/BjjPromotion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Object storage is not configured on this environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sequences:
    get:
      summary: Sequences the caller can see
      operationId: listSequences
      description: >
        The caller's own, plus any VOLA-authored reference chains, newest first
        and capped at 200.


        There is NO public arm here, unlike `/curricula`: sequences are never
        published. Sharing copies a chain to the recipient rather than widening
        who may read this one, so a recipient's edits and the author's diverge
        from the moment it lands. Steps are omitted — read one to get them.
      responses:
        "200":
          description: The visible sequences.
          content:
            application/json:
              schema:
                type: object
                required: [sequences]
                properties:
                  sequences:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sequence"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a sequence
      operationId: createSequence
      description: >
        Always owned by the caller.


        `id` is OPTIONAL. Omit it and the server generates one — the web
        builder's path. Supply one and it is used, which is what lets the phone
        capture a chain offline and retry the push idempotently: the changing
        room after class is a dead-spot, and without a stable id every retry
        would create another chain.


        Re-POSTing an id you already own returns the STORED sequence unchanged
        rather than overwriting it, so a late retry cannot revert an edit made
        in between. An id owned by anyone else is a 409 and discloses nothing
        about that row. That 409 does confirm the id EXISTS, which is the
        accepted cost of client-chosen ids here and in `/v1/workouts`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SequenceWrite"
      responses:
        "201":
          description: The created sequence, with its steps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sequence"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >
            A client-supplied `id` that belongs to another athlete. The same
            owner re-sending their own id is an idempotent retry and succeeds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: >
            Body over 256 KB. This module caps the body before parsing because
            the step limit can only be checked once the whole request is in
            memory; other modules let the decoder answer 400 instead, so a
            client should treat this as a 400 variant rather than a convention.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sequences/{sequenceID}:
    parameters:
    - name: sequenceID
      in: path
      required: true
      schema: { type: string }
    get:
      summary: One sequence, with its steps
      operationId: getSequence
      description: >
        404 for a sequence that does not exist AND for one belonging to somebody
        else — identically, and deliberately. Distinguishing them tells a caller
        that an id they guessed is real.
      responses:
        "200":
          description: The sequence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sequence"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update a sequence
      operationId: updateSequence
      description: >
        Partial. See `SequenceWrite` for how omitted, null and empty differ —
        the distinction between leaving a chain alone and clearing it lives
        there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SequenceWrite"
      responses:
        "200":
          description: The updated sequence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sequence"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            A VOLA-authored reference chain, which the caller can read and may
            not change. Only ever reachable from a write — every read answers
            404 for anything invisible, so this leaks nothing the caller did not
            already have.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a sequence
      operationId: deleteSequence
      description: Steps go with it. 404 for anything the caller does not own.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sequences/{sequenceID}/copy:
    post:
      summary: Copy a sequence into your own library
      operationId: copySequence
      description: >
        Duplicates a sequence you can SEE into one you OWN, with its steps, and
        returns the new sequence.

        This is what makes a VOLA reference chain usable rather than only
        readable: those are visible to everyone and editable by nobody, so
        without it the only thing to do with one is look at it.

        **Visibility is the gate, not ownership** — you may copy anything you
        may read, including your own chains. Ownership of the RESULT is
        unconditional: the copy is a new row owned outright, so editing it
        cannot touch the original and a deploy refreshing a seeded chain cannot
        reach into the copy.

        POST rather than PUT, and deliberately not idempotent: calling it twice
        gives you two copies, which is the honest reading of "copy this again".

        No request body. The only inputs are the id and the caller; a body would
        invite a name or a visibility, both of which you change afterwards on a
        sequence that is now plainly yours.
      tags: [Sequences]
      parameters:
        - name: sequenceID
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: The new sequence, with its steps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sequence" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            No such sequence, OR one you cannot see. The two are deliberately
            the same answer — distinguishing them would confirm that an id
            belongs to somebody.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /classplans:
    get:
      summary: Class plans the caller owns
      operationId: listClassPlans
      description: >
        The caller's own plans only, newest first and capped at 200. There is
        no public/VOLA-authored arm — every class plan is private to the
        coach who wrote it. Blocks are omitted; read one to get them.
      tags: [Class Plans]
      responses:
        "200":
          description: The caller's class plans.
          content:
            application/json:
              schema:
                type: object
                required: [class_plans]
                properties:
                  class_plans:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClassPlan"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a class plan
      operationId: createClassPlan
      description: >
        Always owned by the caller.


        `id` is OPTIONAL. Omit it and the server generates one — the web
        path. Supply one and it is used, which is what lets the phone
        capture a plan offline (jotted down between classes) and retry the
        push idempotently.


        Re-POSTing an id you already own returns the STORED plan unchanged
        rather than overwriting it, so a late retry cannot revert an edit
        made in between. An id owned by anyone else is a 409 and discloses
        nothing about that row beyond its existence — the accepted cost of
        client-chosen ids here and in `/v1/sequences`.
      tags: [Class Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassPlanWrite"
      responses:
        "201":
          description: The created class plan, with its blocks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >
            A client-supplied `id` that belongs to another caller. The same
            owner re-sending their own id is an idempotent retry and
            succeeds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: >
            Body over 256 KB. This module caps the body before parsing, the
            same way `/v1/sequences` does, because the block-count limit can
            only be checked once the whole request is already in memory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /classplans/{classPlanID}:
    parameters:
    - name: classPlanID
      in: path
      required: true
      schema: { type: string }
    get:
      summary: One class plan, with its blocks
      operationId: getClassPlan
      description: >
        404 for a plan that does not exist AND for one belonging to somebody
        else — identically, and deliberately. Distinguishing them tells a
        caller that an id they guessed is real. This domain has no
        VOLA-authored row at all, so unlike `/sequences` there is no
        "readable but not yours" case — every foreign id is a 404.
      tags: [Class Plans]
      responses:
        "200":
          description: The class plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassPlan"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update a class plan
      operationId: updateClassPlan
      description: >
        Partial. See `ClassPlanWrite` for how omitted and empty `blocks`
        differ — the distinction between leaving a schedule alone and
        clearing it lives there.


        404, not 403, for a plan belonging to somebody else: unlike
        `/sequences/{sequenceID}`, there is no ownerless row a caller could
        legitimately read but not write, so "not yours" and "does not exist"
        are the same answer on every path this resource has.
      tags: [Class Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassPlanWrite"
      responses:
        "200":
          description: The updated class plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassPlan"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a class plan
      operationId: deleteClassPlan
      description: Blocks go with it. 404 for anything the caller does not own.
      tags: [Class Plans]
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /curricula:
    get:
      summary: Curricula the caller can see
      operationId: listCurricula
      description: >
        The caller's own plus every public one, with `enrolled` and `editable`
        resolved for them.


        Capped at 200 and ordered the caller's OWN rows first, then enrolled,
        then belt, then name, then id. The ordering matters under the cap: this
        list spans every user's public curricula, so leading with `enrolled`
        alone would let strangers' syllabuses evict the caller's own private
        ones. Sorting belts white-to-black belongs to the client, which knows
        the athlete's rank. Items are omitted — read one to get them.
      responses:
        "200":
          description: The visible curricula.
          content:
            application/json:
              schema:
                type: object
                required: [curricula]
                properties:
                  curricula:
                    type: array
                    items:
                      $ref: "#/components/schemas/Curriculum"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a curriculum
      operationId: createCurriculum
      parameters:
      - name: tz
        in: query
        required: false
        schema: { type: string }
        description: >
          The caller's IANA timezone, e.g. `Europe/Berlin`. Absent means UTC.


          **Not cosmetic.** Progress is measured from the enrollment date, and
          both ends of that comparison used to resolve in the server's zone —
          UTC in every deployed environment. Enrolling at 22:00 in New York
          stamped tomorrow, so the athlete was told their progress counted from
          a date that had not happened and that evening's training fell outside
          the window. Same `?tz=` convention as `/v1/sessions/history`.
      description: >
        Always owned by the caller and private unless `visibility` says
        otherwise. The id is server-generated: unlike a workout there is no
        offline-creation case, and a client-chosen id lets a caller probe for
        existing ones by watching which inserts conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumWrite"
      responses:
        "201":
          description: The created curriculum, with its items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curriculum"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /curricula/working:
    get:
      summary: The roadmaps you are actively on, with progress
      operationId: listWorkingCurricula
      parameters:
        - name: tz
          in: query
          required: false
          schema: { type: string }
          description: The caller's IANA timezone. Absent means UTC.
      description: >
        What Today and You read: active enrollments, each with its items and
        real progress.


        A separate read rather than a flag on the list because the two are
        bounded by different things. The list spans every public curriculum and
        is capped at 200, so computing mastery there means the per-curriculum
        evidence aggregate once per row — to draw numbers nobody reads off a
        browse screen. This is bounded by how many syllabuses one athlete has
        taken on, and unlike the list its `mastered_items` is real.


        Archived enrollments are excluded: "what am I working" is present tense.
      responses:
        "200":
          description: Active roadmaps, most recently started first.
          content:
            application/json:
              schema:
                type: object
                required: [curricula]
                properties:
                  curricula:
                    type: array
                    items:
                      $ref: "#/components/schemas/Curriculum"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /curricula/{curriculumID}:
    parameters:
      - name: curriculumID
        in: path
        required: true
        schema: { type: string }
      - name: tz
        in: query
        required: false
        schema: { type: string }
        description: >
          The caller's IANA timezone, e.g. `Europe/Berlin`. Absent means UTC.


          **Not cosmetic.** Progress is measured from the enrollment date, and
          both ends of that comparison used to resolve in the server's zone —
          UTC in every deployed environment. Enrolling at 22:00 in New York
          stamped tomorrow, so the athlete was told their progress counted from
          a date that had not happened and that evening's training fell outside
          the window. Same `?tz=` convention as `/v1/sessions/history`.
    get:
      summary: One curriculum, with items and the caller's progress
      operationId: getCurriculum
      description: >
        Progress is present only when the caller is enrolled — browsing shows
        what a syllabus asks of you, working one shows how far along you are.


        Returns 404, never 403, for a private curriculum the caller does not
        own: a 403 would confirm the id exists.
      responses:
        "200":
          description: The curriculum.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curriculum"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Edit a curriculum the caller owns
      operationId: updateCurriculum
      description: >
        403 for a curriculum the caller can see but does not own — including
        every VOLA-authored syllabus, which no user may edit however public it
        is. That leaks nothing, because they can already read it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumWrite"
      responses:
        "200":
          description: The updated curriculum.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curriculum"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a curriculum the caller owns
      operationId: deleteCurriculum
      description: >
        409 when other athletes are working it. Their enrollment is THEIR
        record, not the publisher's, and cascading would let one person erase
        another's history of having worked a syllabus.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /curricula/{curriculumID}/enrollment:
    parameters:
      - name: curriculumID
        in: path
        required: true
        schema: { type: string }
      - name: tz
        in: query
        required: false
        schema: { type: string }
        description: >
          The caller's IANA timezone, e.g. `Europe/Berlin`. Absent means UTC.


          **Not cosmetic.** Progress is measured from the enrollment date, and
          both ends of that comparison used to resolve in the server's zone —
          UTC in every deployed environment. Enrolling at 22:00 in New York
          stamped tomorrow, so the athlete was told their progress counted from
          a date that had not happened and that evening's training fell outside
          the window. Same `?tz=` convention as `/v1/sessions/history`.
    put:
      summary: Start working this curriculum
      operationId: enrollInCurriculum
      description: >
        Idempotent, and it un-archives: picking something back up is not an
        error, and a retry after a dropped response must converge. `started_on`
        is NOT reset — it is when the athlete first took it on, and every
        criterion is measured from it.


        A subresource rather than a field on the curriculum, so the acting user
        is always the caller and no request body can name somebody else. Returns
        404 for a curriculum the caller cannot see; without that check, enrolling
        would be a read oracle for a stranger's private list.
      responses:
        "204":
          description: Enrolled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Put this curriculum down
      operationId: archiveCurriculumEnrollment
      description: >
        Archives rather than deletes. Having worked a syllabus and stopped is a
        fact about the athlete, and a roadmap that vanishes on abandonment
        cannot later say "you did three quarters of this". It does NOT mean
        completed — completion is derived from the evidence.


        It ALSO withdraws this curriculum's claim on the caller's BJJ focus list,
        removing the techniques it put there — and only those. Anything the
        athlete chose by hand stays, as does anything another roadmap they are
        still working also wants. Entries written before focus recorded its
        provenance are left alone, since there is no way to tell which they were.


        Idempotent as a whole: a retry after a failure converges, and the release
        happens before the archive so a repeated call cannot strand focus rows.
      responses:
        "204":
          description: Archived, and its focus techniques released.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /curricula/{curriculumID}/items/{itemID}/read:
    parameters:
      - name: curriculumID
        in: path
        required: true
        schema: { type: string }
      - name: itemID
        in: path
        required: true
        schema: { type: integer, format: int64 }
        description: A `CurriculumItem`'s own `id`.
    put:
      summary: Mark a concept read and understood
      operationId: markCurriculumItemRead
      description: >
        N123. An athlete's own claim to have read and understood a `concept`
        item — never a `technique`, whose progress stays fully derived from
        logged evidence (migration 000034) and is not reachable through this
        or any other hand-set control.


        A subresource, matching `.../enrollment`'s own reasoning: the acting
        user is always the caller, and no request body can name somebody
        else's read.


        Idempotent: marking an already-read item again just moves `read_at`
        forward, the same convergent-retry contract `.../enrollment`'s PUT
        uses for `started_on`.


        404 for an `itemID` that does not exist, does not belong to
        `curriculumID`, or belongs to a curriculum not visible to the caller —
        the same "cannot be used as a read oracle" posture the enrollment
        endpoint takes for a private curriculum's id.


        400, `invalid_input`, for a `technique` item: refused at the DATABASE
        level (a trigger validates the item's `kind` before the row can ever
        be written), not only by this handler, because a technique's progress
        must never be settable by hand — see `CurriculumItem.read_at`'s own
        description for why this is the whole point of the ticket that added
        it.
      responses:
        "204":
          description: Marked read.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Withdraw a "read and understood" mark
      operationId: unmarkCurriculumItemRead
      description: >
        N123. Reversible, per the ticket's own acceptance criterion: marking
        something read by mistake must not be permanent.


        Idempotent and always 204 — an item never marked, one already
        unmarked, and one that does not exist under this curriculum all reach
        the same end state ("this claim does not exist"), and undoing a
        mistaken tap has no use for being told which. Unlike the PUT above,
        this is intentionally reachable even if the curriculum has since gone
        private or the item has been edited out from under it: withdrawing the
        athlete's own claim about their own state should not depend on the
        content around it still being in the same shape.
      responses:
        "204":
          description: Unmarked (or was never marked).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /bjj/focus:
    get:
      summary: The techniques the athlete is currently working on
      operationId: getBjjFocus
      description: >
        Read by the reflection wizard, which surfaces these as one-tap chips in
        the live grid so recording an outcome for one IS the grid row rather
        than a second row beside it. That is why the list exists: it collapses
        two capture paths for the same event into one.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The caller's focus list, in their own order.
          content:
            application/json:
              schema:
                type: object
                required: [focus]
                properties:
                  focus:
                    type: array
                    items:
                      $ref: "#/components/schemas/Focus"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: Replace the focus list
      operationId: setBjjFocus
      description: >
        Replaces the list wholesale, so a retry after a partial failure
        converges rather than duplicating. Array order is the athlete's own
        ranking and is preserved. An empty array clears the list, which is a
        normal thing to do at the end of a block. At most 5 techniques, no
        repeats; every id must exist in the library.


        Each entry also records WHY it is in the list, which is what makes
        leaving a roadmap able to remove its techniques without touching the
        athlete's own. Send `roadmap` when applying a curriculum; omit it for a
        hand edit, and the new entries become the athlete's, which no roadmap can
        ever remove.


        Two different things are recorded, and only one of them is fixed.
        OWNERSHIP — the athlete's, a roadmap's, or unknown for entries predating
        this — is set when an entry first appears and is never rewritten by a
        later save, so a technique picked by hand and later also named by a
        roadmap stays the athlete's and survives that roadmap's deactivation.
        CLAIMS are additive: a roadmap-owned entry accumulates a claim from every
        roadmap that names it, and is removed only when the last of them lets go.
        That is what stops one roadmap's deactivation taking a technique another
        active roadmap is still working. A claim is never added to an entry the
        athlete owns, so naming one costs nothing and protects nothing away.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [technique_ids]
              properties:
                technique_ids:
                  type: array
                  maxItems: 5
                  items: { type: string }
                  example: [armbar-from-guard, triangle-from-guard]
                roadmap:
                  type: object
                  description: >
                    The curriculum this write is applying, when it is one.
                    Absent on a hand edit.


                    `technique_ids` here is a SUBSET of the write's own
                    `technique_ids` — the roadmap's techniques only. Applying a
                    roadmap re-sends whatever the athlete already had alongside
                    it, and naming those here would let deactivating the roadmap
                    delete them. A member not present in the outer list is a 400.
                  required: [curriculum_id, technique_ids]
                  properties:
                    curriculum_id:
                      type: string
                      description: >
                        Must name an existing curriculum. Attribution only ever
                        affects the caller's own focus rows.
                    technique_ids:
                      type: array
                      maxItems: 5
                      items: { type: string }
                      example: [armbar-from-guard]
      responses:
        "200":
          description: >
            The stored list, read back — it carries the library names and each
            entry's started_on, which the client cannot know.
          content:
            application/json:
              schema:
                type: object
                required: [focus]
                properties:
                  focus:
                    type: array
                    items:
                      $ref: "#/components/schemas/Focus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /bjj/proficiency:
    get:
      summary: The technique funnel across every session
      operationId: getBjjProficiency
      description: >
        Per-technique evidence for the caller, most-evidence first. Reads only
        technique-tagged rows: the same real event can also be recorded as an
        untagged category row by the live grid, so a technique-tagged row is
        the specific record and an untagged one the catch-all — summing both
        would count one submission twice. Capped at 800 with no pagination,
        which cannot bind in practice (the library holds 542 techniques).
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The caller's funnel, and the headline folded from it.
          content:
            application/json:
              schema:
                type: object
                required: [techniques, summary]
                properties:
                  techniques:
                    type: array
                    items:
                      $ref: "#/components/schemas/Proficiency"
                  summary:
                    $ref: "#/components/schemas/ProficiencySummary"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /bjj/positions:
    get:
      summary: Where the athlete scores, and where they get stuck
      operationId: getBjjPositions
      description: >
        Per-position evidence for the caller, most live evidence first. Reads
        `position` off every tag the athlete has recorded, in both directions,
        summed across every session.


        `scored` and `conceded` are reported side by side rather than folded
        into a ratio or a rating, for the same reason `Proficiency` refuses to
        be a 1-5: a ratio hides its denominator, and "3 scored, 14 conceded
        from half guard" is a finding where "0.18" is a number nobody can
        argue with. A client may compute a rate for ordering; this reports
        the facts.


        `drilled` is counted but EXCLUDED from the ordering. A position the
        athlete has only ever drilled has told them nothing about a live
        round, so 50 reps of mount must not outrank three concessions from
        back control.


        Unlike `/bjj/proficiency`, this reads BOTH technique-tagged and
        untagged tags, and cannot deduplicate them: an untagged row carries a
        position and is the reflection wizard's fast path, so excluding it would
        drop most of the evidence — but it records a category rather than which
        tagged row it duplicates, so there is nothing to match on. An athlete
        who records one exchange in both places is therefore counted twice here.


        Tags with an empty position are skipped — an unlabelled bucket in a
        position map is noise, not a finding. Capped at 60 rows with no
        pagination; the vocabulary is about nine families, so the cap guards
        against a hand-typed value flooding the list rather than paging real
        data.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The caller's position map, and the context to read it with.
          content:
            application/json:
              schema:
                type: object
                required: [positions, summary]
                properties:
                  positions:
                    type: array
                    items:
                      $ref: "#/components/schemas/PositionStat"
                  summary:
                    $ref: "#/components/schemas/PositionsSummary"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /bjj/reflect/draft:
    post:
      operationId: draftBjjReflection
      summary: Turn a dictated reflection into a draft the athlete confirms
      tags: [BJJ]
      description: >
        Say what happened — "rolled five, hit an armbar from closed guard in
        the second, got passed from half guard twice" — and get back a draft
        that fills the reflection wizard's chips.


        **No session and no tag is written.** The only row this endpoint writes
        is a usage-metering one — a count, a model id and a timestamp, carrying
        none of what was said and none of what came back — which is what the
        quota below is derived from, and why a failed call still counts. The
        athlete corrects the draft and the confirmed version goes through
        PUT /v1/bjj/sessions/{sessionID} like any other reflection. A tag
        written without confirmation is indistinguishable from one the athlete
        recorded, and every derived number in this module — the funnel, the
        position map — is only worth reading because a logged tag is a thing
        that actually happened.


        **Transcription is on-device.** The athlete dictates into the system
        keyboard, so this endpoint receives TEXT and there is no audio vendor
        anywhere in the stack. The sentence itself does leave the device: it is
        forwarded to the model provider and discarded, stored nowhere and never
        logged. A client must say so before sending it.


        **Technique ids are validated against the library, server-side.** An id
        the library does not have is never passed through and never mapped onto
        a plausible neighbour — it becomes an `unresolved` phrase the athlete
        picks from, with a `notice` saying why. A resolved tag's `category` and
        `position` are DERIVED from the library entry rather than taken from
        the model. This is the whole reason a closed vocabulary suits dictation:
        a wrong id is checkable in a way a wrong quantity never is.


        **Numbers are checked against the words.** A scalar that does not appear
        in what the athlete said is dropped to null and a tag `count` is floored
        to 1 — the tag itself is evidence the thing happened at least once, and
        only the repetitions are unverifiable — each with a `not_spoken`
        notice. An invented row is visible to somebody correcting a draft; an
        invented number is not — "rolled five" coming back as six reads exactly
        like a correct draft and is one tap from being confirmed. No confidence
        score can flag that, so this endpoint does not report one.


        **A well-formed empty answer is a 200 carrying `empty: true`**, not an
        error. The same shape is the correct answer to a sentence with no
        session in it, so refusing it would break the honest case to catch the
        dishonest one.


        **Quota: 10 per athlete over a rolling 24 hours**, checked BEFORE the
        model is called. Refused calls count, because a refusal is a billed
        answer and a caller could otherwise loop on a dictation the model keeps
        declining. Because the gate runs before any token is spent, a client
        retrying a refusal SEQUENTIALLY gets a `429` once the allowance is
        used rather than a further billed call. Note the gate is advisory
        under concurrency, as `reflect_quota.go` records — simultaneous
        requests can overshoot by the in-flight count — so this is a bound on
        a retry loop, not an absolute. Exhaustion is `429` with `rate_limited` and a `Retry-After`
        header in seconds; the reset is also stated in the message as a
        relative duration, never as a timestamp.


        **A call the provider never answered does NOT count.** A refused
        connection, a DNS failure, a revoked key or an upstream error status
        spends no tokens, so it spends none of the ten — before this an outage
        emptied the day's allowance one retry at a time and left the athlete
        locked out for up to 24 hours after service returned. Those arrive as
        `503` with the code `unavailable`, which is what separates them from
        every other failure here: `unavailable` means our provider is broken
        and the identical request will work later.
      security:
        - ClerkBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dictation]
              properties:
                dictation:
                  type: string
                  maxLength: 2000
                  description: >
                    What the athlete said, as the keyboard transcribed it.
                    Deliberately not cleaned up first — the disfluency is
                    signal, and so is whatever the transcription made of
                    "omoplata".
                  example: >-
                    Rolled five rounds, hit an armbar from closed guard in the
                    second, got passed from half guard twice.
      responses:
        "200":
          description: A draft. Nothing has been written.
          content:
            application/json:
              schema:
                type: object
                required: [draft, quota]
                properties:
                  draft: { $ref: "#/components/schemas/BjjReflectionDraft" }
                  quota: { $ref: "#/components/schemas/BjjDraftQuota" }
        "400":
          description: >
            An empty or over-long dictation, or an unreadable body — all
            detected before the model is called, so a typo never costs one of
            the ten.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: >
            The request was well formed and the model declined it. Distinct
            from 400 — there is nothing in the request to correct.


            **A refusal is not a verdict on the words, and this description
            said the opposite until N118.** It claimed a refusal was
            deterministic and that retrying the same sentence only spent the
            quota again. Neither provider is called with a temperature, so
            identical input does not imply identical output, and the report
            this was corrected from is a refusal reversing itself on an
            unchanged resend. That claim was inherited from TRUNCATION, which
            maps onto the same condition and genuinely is deterministic.


            So a client MAY retry a 422 — but it is billed, exactly like the
            first attempt, and it counts against the daily ten. One retry is
            defensible; a loop is what the metering below exists to prevent.


            `/nutrition/estimate` and `/exercises/identify` still describe
            their own 422s as deterministic. They run on the same
            temperature-less `llm` platform, so those descriptions are
            probably wrong for the same reason — left alone here because the
            evidence is from this route, and filed rather than assumed.
            This is still the only failure here that both costs a draft and may
            never succeed, which is why it is not `503`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >
            The daily cap is used up. `Retry-After` gives the wait in whole
            seconds; the message repeats it as a relative duration. Neither is
            ever an absolute timestamp — the athlete's timezone is not
            something this endpoint knows.
          headers:
            Retry-After:
              description: >
                Whole seconds until one more draft is available, ROUNDED UP so
                that waiting exactly this long succeeds — same promise the
                estimate endpoint and `components/responses/RateLimited` make.
                Never zero.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >
            The provider is unreachable, answered with something unparseable,
            or drafting is not configured on this deploy (no API key). All
            three are retryable and none is the client's fault; every other bjj
            route is unaffected.


            **Read the `code` to tell them apart, and only the code** — the
            message is not part of this contract. `unavailable` means the
            provider never answered: nothing was spent and **this call did not
            use one of the athlete's ten**, so a client may say so and may
            retry the identical request once service returns. `internal` means
            the call did complete and was charged, or that this deploy has no
            API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /bjj/sessions/{sessionID}:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Store the reflection for a BJJ session
      description: >
        Upserts the BJJ detail for a session the caller has already created
        through POST /v1/sessions, and replaces its tag set wholesale.


        PUT and upsert rather than POST and insert, for the same reason
        replacing a session's sets is a PUT: the client holds the desired
        state and re-sends it, so a retry after a failed push converges
        instead of duplicating. That is what lets the mobile outbox treat a
        BJJ reflection exactly like a set list.


        Ownership is checked explicitly against the session before anything
        is written. Three cases answer identically with 404 and are
        deliberately indistinguishable: no such session, a session belonging
        to somebody else, and a session that is not a BJJ session. Telling
        them apart would confirm which session ids are real.
      operationId: putBjjSessionDetail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BjjSessionDetail" }
      responses:
        "200":
          description: The stored detail.
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail: { $ref: "#/components/schemas/BjjSessionDetail" }
        "400":
          description: >
            Unknown kind, tag category or tag event; session_rpe outside
            1-10; rounds, round_minutes or a tag count below 1; or a
            technique_id naming no technique.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: Read a BJJ session's reflection
      operationId: getBjjSessionDetail
      description: >
        404 when the session has no BJJ detail — which includes a session of
        another sport, and a BJJ session logged as the three-tap floor before
        any reflection was added.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The stored detail.
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail: { $ref: "#/components/schemas/BjjSessionDetail" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /running/sessions/{sessionID}:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Store the detail for a running session
      description: >
        Upserts the running detail for a session the caller has already
        created through POST /v1/sessions, replacing the route and splits
        wholesale. Mirrors PUT /v1/bjj/sessions/{sessionID} exactly, for the
        same reason: the client holds the desired state (the track and
        splits it recorded) and re-sends it, so a retry after a failed push
        converges instead of duplicating.


        Ownership is checked explicitly against the session before anything
        is written. Three cases answer identically with 404 and are
        deliberately indistinguishable: no such session, a session belonging
        to somebody else, and a session that is not a running session.
        Telling them apart would confirm which session ids are real.
      operationId: putRunningSessionDetail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunningSessionDetail" }
      responses:
        "200":
          description: The stored detail.
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail: { $ref: "#/components/schemas/RunningSessionDetail" }
        "400":
          description: >
            Unknown source; a negative distance_m, duration_seconds,
            elevation_gain_m or avg_pace_sec_per_km; a route point with a
            latitude or longitude out of range; or a split with a
            non-positive distance_m or duration_seconds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            healthkit_uuid is already attached to a different session for
            this user (N465) — see RunningSessionDetail.healthkit_uuid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: >
            Body over 4 MiB — told apart from 400 on purpose (N507/#884,
            mirroring N502/#873's identical fix for /biometric/samples): a
            dense multi-hour GPS route can produce a body this large
            honestly, and folding it into 400 "invalid JSON body" gave a
            client author nothing to act on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      summary: Read a running session's detail
      operationId: getRunningSessionDetail
      description: >
        404 when the session has no running detail — which includes a
        session of another sport, and a running session logged with no
        detail yet.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The stored detail.
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail: { $ref: "#/components/schemas/RunningSessionDetail" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /running/records:
    get:
      summary: Distance-normalized personal records the caller holds
      operationId: listRunningDistanceRecords
      description: >
        L12/#778 — a personal-best pace for a standard distance (5k, 10k,
        half marathon, marathon) achieved as a contiguous stretch of splits
        within ANY of the caller's runs, not only a run of that exact
        length. Derived from every running session's splits on every read,
        matching `GET /v1/records`' own stance: a kept record would have to
        be retracted when the session behind it is corrected or deleted, and
        a stale one means congratulating someone for a split they never ran.


        A standard distance with no matching window anywhere in the caller's
        history is simply absent from the list, not zero.
      responses:
        "200":
          description: The caller's own distance-normalized records only, at most one per standard distance.
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items: { $ref: "#/components/schemas/RunningDistanceRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /biometric/samples:
    post:
      summary: Store a batch of raw biometric readings
      operationId: putBiometricSamples
      description: >
        N476/#821. Idempotent — a client-generated `id` already stored is a
        no-op retry, matching activities' sync pattern. A batch where one id
        collides with a DIFFERENT user's existing sample is refused
        WHOLESALE (409), never partially applied, so a retry can safely
        re-send the entire batch. No client reads or writes this endpoint
        yet; it exists for the storage/computation layer two later tickets
        (iOS HR reading, an effectiveness summary) build on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [samples]
              properties:
                samples:
                  type: array
                  maxItems: 10000
                  items: { $ref: "#/components/schemas/BiometricSample" }
      responses:
        "200":
          description: The stored samples (both freshly inserted and idempotent retries).
          content:
            application/json:
              schema:
                type: object
                required: [samples]
                properties:
                  samples:
                    type: array
                    items: { $ref: "#/components/schemas/BiometricSample" }
        "400":
          description: >
            Empty or oversized `samples`; an unknown metric_type, source or
            source_platform; an empty unit; a zero measured_at; or a
            period_end before measured_at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: One or more sample ids already belong to a different user's account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: >
            Body over 4 MiB — told apart from 400 on purpose (N502/#873): a
            dense wearable session or a large first-run backfill can produce a
            batch this large honestly, and the old behavior (folding this into
            400 "invalid JSON body") gave a client author nothing to act on.
            The fix on the client side is to split the batch into smaller
            requests, which `putBiometricSamples` in `apps/mobile/lib/biometric.ts`
            now does unconditionally.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      summary: List the caller's own samples of one metric type in a time range
      operationId: listBiometricSamples
      parameters:
        - name: metric_type
          in: query
          required: true
          schema: { type: string, enum: [heart_rate, active_energy, resting_heart_rate, hrv_sdnn, hrv_rmssd, sleep_duration, body_mass, vo2_max] }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
          description: The [from, to] range must not exceed 400 days.
      responses:
        "200":
          description: >
            Ascending by measured_at, capped at 20,000 rows — the 400-day
            window bounds TIME, not row count, and continuous per-second
            heart_rate sampling can exceed that count well inside the
            window. Narrow `from`/`to` if the cap is hit; results are
            oldest-first so nothing recent is silently dropped in its place.
          content:
            application/json:
              schema:
                type: object
                required: [samples]
                properties:
                  samples:
                    type: array
                    items: { $ref: "#/components/schemas/BiometricSample" }
        "400":
          description: Unknown metric_type; from/to not RFC3339; to before from; or a range over 400 days.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /biometric/sessions/{sessionID}/metrics:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Compute (or recompute) a session's heart-rate metrics
      operationId: computeBiometricSessionMetrics
      description: >
        Derives and stores SessionMetrics for a session the caller owns,
        from whatever `heart_rate` BiometricSamples already fall in that
        session's started_at/ended_at window. Recomputing an existing row
        (e.g. once more samples have synced in — design doc §6.4) updates it
        in place rather than creating a second one.


        Ownership is checked explicitly. Two cases answer identically with
        404 (no such session, a session belonging to somebody else) —
        telling them apart would confirm which session ids are real. A
        session with no `ended_at` yet is different: ownership has already
        been confirmed by then, so it's an ordinary 400 validation failure
        ("a load number needs a finished window"), not a 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hr_max_bpm, hr_max_source, hr_source]
              properties:
                hr_max_bpm:
                  type: number
                  format: double
                  minimum: 100
                  maximum: 250
                  description: The athlete's HRmax — the one unavoidable input to Edwards' TRIMP (design doc §3).
                hr_max_source:
                  type: string
                  enum: [estimated, observed]
                  description: >
                    Whether hr_max_bpm is the `220 − age` estimate or an
                    observed maximum from the athlete's own history (design
                    doc §3, N483/#833). Required alongside hr_max_bpm — a
                    bare number loses the distinction the design doc calls
                    for, and this is what stops a later recompute from
                    silently switching between the two with no record.
                hr_source:
                  type: string
                  enum: [workout, window]
                  description: >
                    The caller's claim about how it gathered the samples
                    behind this computation (design doc §2). `none` is never
                    a legal claim here — it is what the server derives
                    itself from an empty result, never something a caller
                    asks for.
      responses:
        "200":
          description: The computed (and stored) metrics.
          content:
            application/json:
              schema:
                type: object
                required: [metrics]
                properties:
                  metrics: { $ref: "#/components/schemas/SessionMetrics" }
        "400":
          description: >-
            hr_max_bpm out of range; hr_max_source not estimated/observed;
            hr_source not workout/window; or the session has no ended_at yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: Read a session's previously computed heart-rate metrics
      operationId: getBiometricSessionMetrics
      description: >
        404 when nothing has been computed yet for this session — a NORMAL
        state (design doc §6.4: enrichment is not blocking, and a watch may
        not have synced yet), not a fault.
      responses:
        "200":
          description: The stored metrics.
          content:
            application/json:
              schema:
                type: object
                required: [metrics]
                properties:
                  metrics: { $ref: "#/components/schemas/SessionMetrics" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /biometric/sessions/{sessionID}/exercise-hr:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List one avg/max heart-rate readout per exercise within a session
      operationId: listBiometricExerciseHR
      description: >
        N490/#851 — the per-exercise HR breakdown a strength athlete asked
        for on top of N488's whole-session report. Computed LIVE on every
        call, unlike `.../metrics`: nothing here is persisted, so there is
        no separate compute-then-read pair of endpoints for it.


        **Join granularity: per exercise, not per set.** Every
        `session_sets` row sharing one `exercise_id` is grouped into a
        single time window (from its earliest completed set's
        `performed_at`, widened backward to cover that set's own working
        time, through its latest), rather than reading each set's own gap to
        its neighbours — a single set's own window is routinely shorter than
        a real wearable's background sampling interval and would contain
        zero evidence far more often than an exercise's whole block does.
        See `biometric.exerciseHRWindow` (`trimp.go`) for the exact rule and
        the full reasoning, and this ticket's history entry for the
        decision record.


        Requires the session to have ended, for the same reason
        `POST .../metrics` does: an in-progress session's latest exercise has
        an open-ended window.


        An exercise with no completed set carrying a real `performed_at`
        (never ticked live, or logged before N490 shipped), or whose window
        contains zero heart_rate samples, is excluded from the result
        entirely rather than reported as zero — see `ExerciseHR`'s own
        description.
      responses:
        "200":
          description: >
            The caller's own exercises for this session with at least one
            HR sample in their derived window, in the order the athlete
            trained them.
          content:
            application/json:
              schema:
                type: object
                required: [exercises]
                properties:
                  exercises:
                    type: array
                    items: { $ref: "#/components/schemas/ExerciseHR" }
        "400":
          description: The session has no ended_at yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /biometric/sessions/load:
    get:
      summary: List the caller's own sessions with a computed training load in a date range
      operationId: listBiometricSessionLoad
      description: >
        N489/#850 — the Progress-tab cross-session TRIMP trend. One query
        across sessions/session_metrics rather than a per-session fetch loop:
        see biometric.Repository.ListSessionLoad's doc comment for the full
        N+1-vs-batch reasoning. Spans all three sports (strength, running,
        bjj) in one list, since TRIMP is computed identically regardless of
        sport.


        A session with no computed metrics yet, or with hr_source 'none' (no
        heart-rate evidence at all), is excluded from the result — never
        reported as zero load.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
          description: The [from, to] range must not exceed 1200 days.
      responses:
        "200":
          description: >
            The caller's own sessions with a computed trimp, ascending by
            started_at, capped at 5,000 rows — the 1100-day window bounds
            TIME, not row count, the same distinction ListSamples' own 200
            response draws about its 400-day/20,000-row pair. Narrow
            `from`/`to` if the cap is hit; results are oldest-first so
            nothing recent is silently dropped in its place.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/SessionLoad" }
        "400":
          description: from/to not RFC3339, to before from, or a range over 1200 days.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /workouts:
    get:
      summary: List workouts visible to the caller
      operationId: listWorkouts
      description: >
        Workouts visible to the caller — their own plus every public one, which
        is why this list grows with the platform rather than with one athlete's
        history. The caller's own workouts sort first, then by name; capped at
        500, with no pagination, so the cap falls on other people's content.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: scope
          in: query
          description: >
            `public` is the current name. `shared` is still accepted as a
            deprecated alias so an installed mobile build — which updates on the
            App Store's schedule, not ours — does not get a 400 and an empty
            Workouts tab from a rename.
          schema: { type: string, enum: [mine, public, shared] }
        - name: sport
          in: query
          schema: { type: string, enum: [strength, running, bjj] }
        - name: goal
          in: query
          schema: { type: string, enum: [general, powerlifting, hypertrophy, endurance] }
      responses:
        "200":
          description: Workouts the caller owns and/or public ones, each with items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutList" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a workout
      operationId: createWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, sport]
              properties:
                id:
                  type: string
                  description: >
                    Client-generated, and required. Offline clients create a
                    workout locally and push it later, so the id must be the
                    one already stored on the device — a session created from
                    that workout references it, and a server-minted id would
                    orphan it.

                name: { type: string }
                sport: { type: string, enum: [strength, running, bjj] }
                goal: { type: string, enum: [general, powerlifting, hypertrophy, endurance] }
                notes: { type: string }
                visibility: { type: string, enum: [private, public] }
                items:
                  type: array
                  items: { $ref: "#/components/schemas/WorkoutItem" }
      responses:
        "200":
          description: >
            The created workout. Idempotent on `id` for the same owner — a
            retry returns the original rather than erroring.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400":
          description: >
            Invalid input — including an item whose exercise belongs to a
            different sport than the workout, since mixing is not supported.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The id already belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /plans:
    get:
      summary: List planned sessions in a day range
      operationId: listPlans
      description: >
        `from` and `to` are required and inclusive at both ends — the callers
        ask in whole weeks and whole months, and both name their last day.

        Deliberately not defaulted to "this week": a default would make the
        commonest client bug (forgetting the range) look like an empty calendar
        rather than a mistake, and the two are indistinguishable in the
        response.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          example: "2026-08-03"
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          example: "2026-08-09"
      responses:
        "200":
          description: >
            The caller's plans, oldest day first. Within a day, ordered by
            `time_of_day_minutes` ascending with untimed plans last, then
            insertion order for anything that ties (same time, or both
            untimed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanList" }
        "400":
          description: >
            A missing or malformed date, a backwards range, or a range longer
            than 400 days counted inclusively (so 1 Jan to 4 Feb the following
            year is the widest accepted). A `day` carrying a time — a full
            RFC3339 timestamp — is rejected here rather than truncated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Plan a session on a day
      operationId: createPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, day, sport]
              properties:
                id:
                  type: string
                  description: >
                    Client-generated, and required — the same contract sessions
                    and activities use. It is what makes an offline plan
                    syncable idempotently: the device fixes the id before the
                    server sees the row, so a retried push conflicts rather
                    than creating a second plan.
                day: { type: string, format: date, example: "2026-08-04" }
                sport: { type: string, enum: [strength, running, bjj] }
                workout_id:
                  type: string
                  nullable: true
                  description: >
                    Omit or null to plan the day as a bare discipline. Mutually
                    exclusive with `class_plan_id` — sending both is a 400.
                class_plan_id:
                  type: string
                  nullable: true
                  description: >
                    Schedule this day from a coach's class plan instead of a
                    workout template. Mutually exclusive with `workout_id` —
                    sending both is a 400.
                time_of_day_minutes:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 1439
                  description: >
                    Omit or null to plan the day with no specific time — see
                    the `Plan` schema's own description of this field for the
                    representation and its timezone semantics.
                notes: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The created plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400":
          description: >
            A missing id, a `day` that is not a calendar date, an unknown
            sport, an unknown workout, an unknown class plan, both a
            `workout_id` and a `class_plan_id` at once, a
            `time_of_day_minutes` outside 0–1439, or notes over 500
            characters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The id is already in use.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /plans/{planID}:
    patch:
      summary: Change a planned session
      operationId: updatePlan
      description: >
        Partial — omitted fields are left alone. `workout_id`,
        `class_plan_id` and `time_of_day_minutes` are each three-state: omit
        to leave it, send a value to set it, and send an explicit `null` to
        clear it. For `time_of_day_minutes`, clearing means "back to day
        only". Without that distinction, clearing one would be
        indistinguishable from not mentioning it.

        `workout_id` and `class_plan_id` are mutually exclusive on the
        resulting row, not merely within one request body: setting one while
        the other is already present on the plan is a 400, exactly as sending
        both at once is. `time_of_day_minutes` has no such relationship to
        either.
      parameters:
        - name: planID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                day: { type: string, format: date }
                sport: { type: string, enum: [strength, running, bjj] }
                workout_id: { type: string, nullable: true }
                class_plan_id: { type: string, nullable: true }
                time_of_day_minutes:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 1439
                notes: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The updated plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400":
          description: Invalid input.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Remove a planned session
      operationId: deletePlan
      description: >
        Clears the intention only — nothing logged is affected. A plan someone
        else owns is reported as 404 rather than 403: ids are client-generated
        and guessable, so another user's plan must be indistinguishable from
        one that does not exist.
      parameters:
        - name: planID
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workouts/{workoutID}:
    get:
      summary: Get one workout
      operationId: getWorkout
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: workoutID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The workout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Rename a workout (owner only)
      operationId: renameWorkout
      description: >
        Changes the name and nothing else. Its own verb rather than a field on
        PUT /items, because renaming and re-ordering happen at different
        moments — folded together, correcting a typo would mean resending the
        whole item list, and a client that got that list slightly wrong would
        silently rewrite the workout. A blank name is refused rather than
        stored: it renders as a gap in the template list with nothing to
        identify or tap, and every plan pointing at it loses its label too.
      parameters:
        - name: workoutID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: >
                    Counted in CHARACTERS (Unicode code points), not bytes —
                    the domain vocabulary here is Portuguese and Japanese, and
                    a byte cap would refuse a legal name at roughly a third of
                    this limit. Trimmed server-side; empty after trimming is
                    rejected. Says this in `description` rather than a YAML
                    comment because a comment reaches no generator, no SDK and
                    no rendered docs — the sibling session rename already
                    publishes the same facts this way.
                  example: Maestro Push Day
      responses:
        "200":
          description: The renamed workout, items untouched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400":
          description: Missing, blank or over-long name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Visible to you, but not yours to change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a workout (owner only)
      operationId: deleteWorkout
      parameters:
        - name: workoutID
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Visible to you, but not yours to change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workouts/{workoutID}/copy:
    post:
      summary: Copy a workout into your own library
      operationId: copyWorkout
      description: >
        Duplicates a workout you can SEE into one you OWN, with its items, and
        returns the new workout.

        **Visibility is the gate, not ownership**, and here that genuinely
        includes other athletes: workout visibility has a public arm, so a
        community template somebody else published is copyable by design —
        which is what the browse shelf is for. (Sequences differ: theirs has no
        public arm, so the equivalent request 404s.)

        The copy is always **private** regardless of what it was copied from, so
        copying a public template does not republish it under your name. It is
        owned outright, so editing it cannot touch the original and a deploy
        refreshing a seeded plan cannot reach into it.

        Replaces a client-side create-then-replace-items dance, which was two
        calls and could strand an empty workout if the second failed.

        POST and deliberately not idempotent: twice gives you two copies.
      tags: [Workouts]
      parameters:
        - name: workoutID
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: The new workout, with its items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            No such workout, OR one you cannot see. Deliberately the same
            answer — distinguishing them would confirm an id belongs to
            somebody.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /workouts/{workoutID}/items:
    put:
      summary: Replace a workout's ordered contents (owner only)
      operationId: replaceWorkoutItems
      description: >
        Sends the whole list — the natural shape for both "add an exercise"
        and "reorder". Positions are reassigned from array order.
      parameters:
        - name: workoutID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/WorkoutItem" }
      responses:
        "200":
          description: The updated workout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400":
          description: Invalid input, including a sport mismatch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Visible to you, but not yours to change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions:
    get:
      summary: List the caller's sessions, newest first
      operationId: listSessions
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: sport
          in: query
          schema: { type: string, enum: [strength, running, bjj] }
        - name: exercise_id
          in: query
          schema: { type: string }
          description: Only sessions containing this exercise.
        - name: from
          in: query
          schema: { type: string, format: date }
          description: >
            Only sessions started on or after this calendar day, resolved in
            `tz`. Lets the history page list exactly the period its totals
            describe.
        - name: to
          in: query
          schema: { type: string, format: date }
          description: Inclusive of the day named — a session at 19:00 on `to` is returned.
        - name: tz
          in: query
          schema: { type: string, default: UTC }
          description: IANA name used to resolve `from`/`to` to instants. Defaults to UTC.
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
          description: >
            Free text matched case-insensitively anywhere in the session's
            name. LIKE wildcards in the term are escaped, so `50%` searches
            for those characters rather than matching everything.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: >
            Rows to skip. Ordering is a total order (`started_at DESC, id`), so
            paging is deterministic against an unchanging set. It is not stable
            across writes: a session added while you page shifts every later
            row down one, so a row can repeat. Use the date filters to pin a
            range if that matters.
      responses:
        "200":
          description: >
            One page of the caller's own sessions, each with its sets, plus how
            many the filter matched in total. Never anyone else's.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionPage" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: Invalid sport, limit, offset, date, timezone or search term.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Start (or record) a session
      operationId: createSession
      description: >
        Sets may be supplied up front — starting from a template pre-fills
        them with the prescribed numbers — or left empty and added later via
        the sets endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, sport]
              properties:
                id: { type: string }
                workout_id:
                  type: string
                  nullable: true
                  description: >
                    Must be a workout the caller can see (their own, public,
                    or a VOLA template) and of the same sport.
                sport: { type: string, enum: [strength, running, bjj] }
                name: { type: string }
                intent:
                  type: string
                  enum: [normal, light, deload]
                  default: normal
                  description: >
                    What this session is meant to be (N474) — see
                    `Session.intent`. Omitting it is the common case and
                    means `normal`, exactly as it always did before this
                    field existed.
                started_at:
                  type: string
                  format: date-time
                  description: Defaults to now when omitted.
                ended_at: { type: string, format: date-time, nullable: true }
                notes: { type: string }
                sets:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/LoggedSet" }
      responses:
        "200":
          description: >
            The created session and its volume summary. Idempotent on `id`
            for the same user — a retry returns the original rather than
            erroring, which is what makes an offline start safe to resend.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithVolume" }
        "400":
          description: >
            Invalid input — including a set whose exercise belongs to a
            different sport than the session, an out-of-range RIR/RPE, more
            than 500 sets, or a `workout_id` that doesn't exist or isn't
            visible to the caller. Those last two are deliberately the same
            error: workout IDs are client-generated and often guessable, so
            distinguishing them would let a caller enumerate other people's
            private templates.

            A set naming a grip this server does not know is refused with the
            narrower code `invalid_grip`, not `invalid_input`. The sets in the
            body are validated here as well as on `PUT .../sets`, so a client
            that only handles that code on the replace endpoint strands every
            session it created offline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The id already belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /themes:
    get:
      operationId: listThemes
      summary: The caller's weekly training themes, over a window
      description: >
        A theme is one sentence about what a training WEEK is for — "deload",
        "guard retention", "chase the squat".


        **It is deliberately not a second focus list.** `/bjj/focus` holds a
        rolling, athlete-ranked set of three to five techniques and is where
        technique-level intent lives; a theme is week-boxed, coarse, and covers
        whatever the athlete trains. A theme carries no technique ids and no
        exercise ids — prose only — and that restriction is what keeps the two
        from answering the same question differently.


        Both bounds are required. Every caller wants a window, and an unbounded
        list grows forever; spans wider than 800 days are refused.


        Returns weeks whose **Monday** falls in `[from, to]` — a week straddling
        `from` is not included. Both clients align `from` to a rendered Monday,
        so this only bites a caller that passes, say, the first of a month.
      tags: [Themes]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Themes for weeks in the window, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [themes]
                properties:
                  themes:
                    type: array
                    items: { $ref: "#/components/schemas/Theme" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /themes/{weekStart}:
    parameters:
      - name: weekStart
        in: path
        required: true
        description: The Monday of the week, as a calendar date.
        schema: { type: string, format: date }
    get:
      operationId: getTheme
      summary: One week's theme
      tags: [Themes]
      responses:
        "200":
          description: The theme.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Theme" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setTheme
      summary: Set a week's theme
      description: >
        PUT rather than POST because a week holds at most one theme and the
        caller names the week — there is nothing to allocate and no id to return.
        Creating and replacing are the same request.


        `weekStart` **must be a Monday**. A week starting on any other day would
        silently overlap its neighbours, which is the one duplicate the primary
        key cannot catch.
      tags: [Themes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 80 }
                notes: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The theme as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Theme" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: deleteTheme
      summary: Remove a week's theme
      description: >
        A week with no theme is `404`, not `204` — a client should be able to
        tell "there was nothing" from "it is gone".
      tags: [Themes]
      responses:
        "204": { description: Removed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /records/{exerciseID}/history:
    get:
      summary: One exercise's load over time, for the caller
      operationId: getExerciseLoadHistory
      description: >
        One point per session, oldest first — the arc of a single lift.


        Under `/records` rather than `/exercises` deliberately: everything
        below `/records` is the caller's own training data, scoped by the
        token, while `/exercises` is the shared catalog. The path parameter
        names the exercise, never the athlete.


        A session is the unit. A set is noise (five sets of five are one fact
        about strength, not five) and a calendar day merges a morning and an
        evening session into an average neither of them was.


        `best_1rm_kg` is null whenever no set in that session can support an
        estimate — high-rep back-off work legitimately has none, because every
        rep-max formula diverges past about twelve effective reps. It is a gap
        to be drawn as a gap, not a zero.
      parameters:
        - name: exerciseID
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
          description: Inclusive, YYYY-MM-DD, resolved in `tz`.
        - name: to
          in: query
          schema: { type: string, format: date }
          description: Inclusive, YYYY-MM-DD, resolved in `tz`.
        - name: tz
          in: query
          schema: { type: string }
          description: >
            IANA name. Decides which calendar day a bound falls on. Defaults
            to UTC rather than guessing, so a caller that sends none still
            gets consistent days.
      responses:
        "200":
          description: >
            The caller's own history only. At most 400 points; when there are
            more sessions than that the OLDEST are dropped, so the recent end
            of the chart is never silently truncated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoadHistory" }
        "400":
          description: Bad date, bad timezone, or `to` before `from`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such exercise in the catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /records:
    get:
      summary: Personal records the caller holds
      operationId: listRecords
      description: >
        Derived from the log on every read rather than stored. A kept record
        has to be *retracted* when the set behind it is corrected or its
        session deleted — and a stale one means congratulating someone for a
        lift they never made. Computed, a record is by construction exactly
        what the log says.


        Which kinds an exercise can hold follows from its `load_type`, so a
        plank never reports a weight and a run never reports reps. Warm-ups
        and sets never marked done never count.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: exercise_ids
          in: query
          schema: { type: string }
          description: Comma-separated. Overrides `scope`. At most 100.
        - name: scope
          in: query
          schema: { type: string, enum: [all] }
          description: >
            `all` returns every exercise the caller has actually trained,
            most-used first, capped at 200 — the desk view. Omitted, the API
            answers for their pinned shortlist, falling back to the exercises
            they train most so the view is never empty pending setup.
      responses:
        "200":
          description: The caller's own records only.
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items: { $ref: "#/components/schemas/ExerciseRecords" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: Too many exercise_ids.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /records/pinned:
    get:
      summary: The exercises whose records show on the caller's profile
      operationId: getPinnedExercises
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: In the caller's chosen order. Empty means "no explicit choice".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinnedExercises" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Replace the shortlist
      operationId: setPinnedExercises
      description: >
        Replaces the whole ordered list, like session sets — the client edits
        it as one thing, and reordering is most of the editing people do here.
        An empty list clears it and returns to the most-trained default.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinnedExercises" }
      responses:
        "200":
          description: The stored list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinnedExercises" }
        "400":
          description: More than 12 entries, a repeat, a blank, or an unknown exercise.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sessions/history:
    get:
      summary: Training history rolled up per day, with period totals
      operationId: getSessionHistory
      description: >
        The analytical surface behind the web history page: one entry per
        calendar day that had training, totals for the period, and the same
        totals for the window immediately before it so the numbers read as a
        direction rather than a quantity.


        Aggregated server-side on purpose. The working-set rule (completed,
        non-warm-up) lives in one place, and a client summing a truncated
        listing would quietly report the wrong total once history outgrows
        the page size.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          description: Inclusive of the day named. Range must be five years or less.
        - name: sport
          in: query
          schema: { type: string, enum: [strength, running, bjj] }
          description: >
            Narrows the totals *and* the comparison window, so BJJ is
            measured against BJJ. `sports` is always unfiltered.
        - name: tz
          in: query
          schema: { type: string, default: UTC }
          description: >
            IANA name deciding which calendar day a session belongs to.
            Training at 19:00 in New York is 23:00 UTC, so bucketing in UTC
            would file a Tuesday session under Wednesday.
      responses:
        "200":
          description: The caller's own training only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/History" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: Missing or malformed dates, unknown sport or timezone, or a range over five years.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /sessions/suggestions:
    get:
      summary: What to load today, per exercise, from the caller's own history
      operationId: listSessionSuggestions
      description: >
        One request for a whole workout rather than one per exercise. Each
        answer reads the **working sets of the last few sessions** containing
        that exercise — warm-ups excluded, since progressing off a warm-up
        would recommend a weight nobody worked at.

        Whole sessions rather than a single top set, because the rule gates on
        the weakest working set and on whether a load has repeated across
        sessions; neither question can be answered from one row.

        Scoped to the caller: this endpoint reads training history and returns
        only their own.


        `code`/`reason`/`target_weight_kg`/`target_reps` are always derived
        purely from that history — see N191. `today_sets` layers a SEPARATE,
        additive signal (`in_session_signal`) on top when the caller has
        already logged working sets for the same exercise earlier in the
        session making this request; it never changes the prescription
        itself.


        **N496/#866**: this response also carries `warmup` (N495) alongside
        the prescription and `in_session_signal`. See `Suggestion`'s own
        description for why three same-session, same-evidence-class
        recommendation kinds sharing one response is a reviewed decision
        under #753 §4, not the "recommendation products bolted together"
        failure that section forbids — and why a genuinely program-level
        recommendation (#753's own "add hamstring work" example) must never
        follow the same pattern onto this object.


        **Behind the `new_recommendation_engine` feature flag** (operator-
        controlled, seeded disabled — see N473/#812), this endpoint serves a
        corrected engine instead: it compares only a coherent cohort (same
        exercise, same STRAIGHT working-set role, same anchor weight —
        backoffs, drops, AMRAPs and failures are excluded rather than folded
        in), reads only FINISHED sessions as history (the currently-open
        session is never its own history), requires effort data before
        authorizing progression, and can return `effort_conflict` or
        `abstain` where the old engine would guess. Rounding also uses real
        per-unit plate increments (see `unit_system` below) rather than a
        fixed kilogram step. Callers not on the flag see byte-identical
        behaviour to before this existed.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: exercise_ids
          in: query
          required: true
          schema: { type: string }
          description: Comma-separated, max 100.
        - name: goal
          in: query
          required: false
          schema:
            type: string
            example: hypertrophy
          description: >
            One of `general`, `powerlifting`, `hypertrophy`, `endurance`.
            Deliberately typed as a plain string rather than an enum, because
            an enum would make a request validator or generated client reject
            exactly the unrecognised values this endpoint promises to accept.

            The goal of the workout being performed, which picks the rep range
            the recommendation is expressed in: powerlifting 3–5, hypertrophy
            6–10, endurance 12–20, general (and anything unrecognised) 5–8.


            Deliberately not validated — an unknown value falls through to the
            general range rather than failing the request, since a goal the
            server doesn't recognise doesn't make the question invalid, it just
            fails to narrow it.
        - name: today_sets
          in: query
          required: false
          schema: { type: string }
          example: "back-squat:102.5,back-squat:105"
          description: >
            Comma-separated `<exercise_id>:<weight_kg>` pairs, one per
            already-logged WORKING set for that exercise so far in the
            session making this request — see N191.


            Client-supplied rather than looked up from a session id: the
            authoritative copy of "what have I already lifted today" is
            whatever the caller already has locally (mobile writes its own
            SQLite before anything syncs), and this is what lets the signal
            appear before a set has reached the server at all. Only the
            WEIGHT of each set travels — not reps or effort — since weight is
            the one number `in_session_signal` reasons about.


            Malformed entries are dropped rather than failing the request
            (this is advisory data); more than 500 entries is refused.
        - name: unit_system
          in: query
          required: false
          schema:
            type: string
            example: imperial
          description: >
            `imperial` or `metric` — the caller's own unit preference, same
            pattern as `goal`: the client already knows it and passes it
            along rather than this endpoint looking it up. Only consulted
            behind `new_recommendation_engine` (N473/#812), to round
            `target_weight_kg` to a real increment in the unit the athlete
            actually trains in (5/10 lb, matching the existing
            1.25/2.5/5 kg scheme) instead of a kilogram grid that can land on
            an unloadable number once converted — 31.25 kg is a clean 1.25 kg
            step and 68.9 lb once displayed.


            Deliberately not validated, for the same reason `goal` isn't:
            anything other than exactly `imperial` reads as metric, which is
            this endpoint's behaviour without this parameter at all.
        - name: workout_id
          in: query
          required: false
          schema: { type: string }
          description: >
            N494/#864 (phase 2 of #753) — which workout the caller is
            asking about, so a requested exercise's own configured
            `ItemProtocol` (rep range, target sets/effort, progression
            strategy, equipment increment) can be consulted instead of only
            the workout-wide, goal-based range. Only consulted behind
            `new_recommendation_engine`; absent (or naming a workout with
            no configured protocol for the exercise) falls back to exactly
            today's goal-based behaviour.


            Whether a configured protocol is treated as a coach/program
            prescription or the athlete's own explicit configuration is
            decided by ownership of the named workout: one the caller does
            not own (an official VOLA template, or another athlete's
            shared one) is the program level; one they own is their own
            configuration. See the four-level priority order in
            `ItemProtocol`'s own description.


            Not validated as belonging to any of `exercise_ids` — a
            workout that doesn't contain the requested exercise, or that
            the caller cannot see, simply contributes no configuration,
            same as omitting this parameter.
      responses:
        "200":
          description: >
            One entry per requested id, in the order requested. An exercise
            with no history still gets an entry, with `code: no_history`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuggestionList" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: >
            Missing `exercise_ids`, more than 100 of them, or more than 500
            `today_sets` entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sessions/{sessionID}:
    get:
      summary: Get one session with its volume summary
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The session and its derived volume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithVolume" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            No such session, or it belongs to someone else — deliberately
            indistinguishable, since sessions are never shared and a 403
            would confirm that an id exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      summary: Rename a session
      description: >
        Changes the session's name and nothing else. PATCH rather than PUT
        because the body is one field, not the whole session — a PUT would
        imply that omitting `sets` should empty them.


        The name is the only field a client may change after the fact.
        `sport` decides which screen renders the session, the timestamps are
        what training history counts, and sets have their own replace
        endpoint.


        Not-yours and does-not-exist both answer 404, deliberately
        indistinguishable.
      operationId: renameSession
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: >
                    Counted in CHARACTERS, not bytes — the server uses
                    `utf8.RuneCountInString`, so "kesa gatame" and a Japanese
                    or Portuguese name all get the same 120 the contract
                    publishes.


                    Trimmed server-side. Empty after trimming is rejected — a
                    blank name renders as a gap in the history list with
                    nothing to identify or tap.
                  example: Tuesday no-gi open mat
      responses:
        "200":
          description: The renamed session, with its volume summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithVolume" }
        "400":
          description: >
            Name missing, blank after trimming, longer than 120 characters, a
            malformed body, or a body over 8 KB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such session for this caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Delete a session
      operationId: deleteSession
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{sessionID}/schedule:
    patch:
      summary: Correct a session's date
      operationId: rescheduleSession
      description: >
        Changes `started_at` and nothing else. Its own sub-resource, matching
        `/sets` and `/finish`, rather than a field on the bare
        `/sessions/{sessionID}` PATCH — see that endpoint's description for
        why it was long treated as name-only.


        Added for N436: an athlete correcting a BJJ class logged under the
        wrong day had no way to fix it once saved, even though every other
        field of the session (techniques, rounds, gi, notes, RPE) was already
        freely editable. No past/future validation — the server does not
        police what date makes sense for a training log, matching the
        create path's own `started_at`.


        `ended_at` has no equivalent endpoint here: it is resent on every
        `POST /finish` regardless of whether it changed, so a client shifting
        a session's day already has a path to carry the matching shift for
        `ended_at`, and duration derives from the two together.


        Not-yours and does-not-exist both answer 404, deliberately
        indistinguishable, same as the rename endpoint.
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [started_at]
              properties:
                started_at:
                  type: string
                  format: date-time
                  example: "2026-08-27T19:00:00Z"
      responses:
        "200":
          description: The rescheduled session, with its volume summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithVolume" }
        "400":
          description: started_at missing, a malformed body, or a body over 8 KB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such session for this caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sessions/{sessionID}/intent:
    patch:
      summary: Correct a session's intent
      operationId: setSessionIntent
      description: >
        Changes `intent` and nothing else (N474) — its own sub-resource,
        matching `/schedule`, `/sets` and `/finish`, rather than a field on
        the bare `/sessions/{sessionID}` PATCH.


        Reachable both before a session starts (a "Normal · Light · Deload"
        picker at session start is just this call made early) and afterward
        — an athlete who only realises partway through, or scrolling history
        later, that a session wasn't a normal one gets the same correction
        path the rename endpoint already gives a mistyped name.


        Changes nothing about the sets already logged; only which evidence
        pool `GET /v1/sessions/suggestions` reads them from on the NEXT
        suggestion for exercises in this session.


        Not-yours and does-not-exist both answer 404, deliberately
        indistinguishable, same as the rename endpoint.
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent]
              properties:
                intent:
                  type: string
                  enum: [normal, light, deload]
      responses:
        "200":
          description: The updated session, with its volume summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithVolume" }
        "400":
          description: intent missing, not one of the three values, a malformed body, or a body over 8 KB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such session for this caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sessions/{sessionID}/sets:
    put:
      summary: Replace a session's ordered sets
      operationId: replaceSessionSets
      description: >
        Sends the whole list — the natural shape for "log another set" and
        "fix a typo in set 2" alike. Positions are reassigned from array
        order. Clients write through on every edit rather than offering a
        save button, so a session survives the app being killed mid-workout.
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sets]
              properties:
                sets:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/LoggedSet" }
      responses:
        "200":
          description: The updated session and its recomputed volume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithVolume" }
        "400":
          description: >
            Invalid input, including a sport mismatch or an out-of-range
            RIR/RPE. A set naming a grip this server does not know is refused
            with the narrower code `invalid_grip` — the one refusal a client is
            expected to settle itself, by dropping the grip and resending.

            Note the sets are validated before the session is looked up, so a
            request that is BOTH unknown-gripped and aimed at a deleted session
            answers 400 here rather than 404.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{sessionID}/finish:
    post:
      summary: Mark a session finished
      operationId: finishSession
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ended_at:
                  type: string
                  format: date-time
                  description: Defaults to now. An empty body is fine.
      responses:
        "200":
          description: The finished session and its final volume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithVolume" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /client-errors:
    post:
      summary: Report a problem the client hit that the server cannot observe
      operationId: reportClientError
      description: >
        For failures the API has no way to see: a push the device has given up
        retrying, a local write that failed. This is the class of problem that
        loses training data silently — the athlete's session sits on their
        phone, every server-side metric looks healthy, and nobody finds out.


        The user is taken from the verified token, never the body. `kind` is
        restricted to `client_error` and `sync_blocked`: a client cannot claim
        `server_error` or `slow_request`, because the value of the health record
        is that an operator can tell what was *measured* from what was
        *claimed*. Returns `202` — the report is accepted, not stored as a
        resource anyone reads back.


        Accepts EITHER a single report or a batch — `{"events": [...]}`, or a
        bare array. The batch form is what the buffered client reporter sends:
        occurrences of one problem are coalesced into a single event carrying a
        count rather than one request each, so a device in a retry loop costs a
        bounded number of writes instead of one per occurrence. The single form
        is kept forever, because a client that reports its own trouble is the
        client least able to be upgraded first.


        A batch is all-or-nothing: one invalid event refuses the whole request
        rather than silently accepting the rest. Partial acceptance would need a
        per-event result the client cannot act on — it never retries — and "202
        with some of it dropped" is exactly the silent-loss shape this endpoint
        exists to end. At most 50 events per request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # `anyOf`, not `oneOf`. A body carrying both `kind` and a valid
              # `events` array matches the report schema AND the batch schema,
              # which `oneOf` rejects while the handler accepts it as a batch —
              # spec stricter than code is drift in the direction that makes a
              # valid request look invalid. `minItems` on the inline array
              # matches the handler's "no events" refusal; without it the spec
              # accepted `[]` and the handler 400'd. Both found in review.
              anyOf:
                - $ref: "#/components/schemas/ClientErrorReport"
                - $ref: "#/components/schemas/ClientErrorBatch"
                - type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: "#/components/schemas/ClientErrorReport"
      responses:
        "202":
          description: Report accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/health:
    get:
      summary: Recent operational problems, with a summary (admin-only)
      operationId: adminHealth
      description: >
        Answers "is anything wrong, and for whom?" without reading logs. The
        structured logs carry every request but go to stdout, so they are not
        queryable from the admin console and they expire; only notable events
        are persisted, and this is how they are read back.


        Summary and events come together in one response deliberately: the
        summary alone invites "12 errors" with no way to see them, and the list
        alone makes an operator count.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: hours
          in: query
          description: Window to look back over. Defaults to 24, capped at 720.
          schema:
            type: integer
            minimum: 1
        - name: kind
          in: query
          schema:
            type: string
            enum: [server_error, slow_request, client_error, sync_blocked]
        - name: user_id
          in: query
          description: Narrow to one athlete — "is this person having trouble?"
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Summary and the events behind it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/exercises:
    get:
      summary: List the exercises the console can edit
      operationId: listAuthoredExercises
      description: >
        Without `q`: every exercise with `source: "admin"` — what the console
        has authored — unbounded, and exactly what `cmd/exportcontent` reads.


        With `q`: the WHOLE catalog, seeded rows included, matched on NAME by
        the same search the athletes' app uses — every typed word must appear,
        in any order, with lifting synonyms and simple plurals handled — and
        ordered by closeness to the query, then by name. **Capped at 100**,
        with no total in the response,
        so treat a result set of exactly 100 as "first 100".


        The authored branch is deliberately UNBOUNDED: that set grows one row at
        a time and `cmd/exportcontent` reads the same query, so a `LIMIT` there
        would silently truncate the export rather than error. Only the search
        branch is capped.
      parameters:
        - name: q
          in: query
          required: false
          description: >
            Search the whole catalog by name, exactly as the athletes' app
            searches it — an operator answering "I cannot find X" has to be
            able to type what the athlete typed.


            **No longer matched against `id`.** An id is a slug derived from
            the name, so it carries no word the name does not and pasting one
            still finds its row through the name. The exception is a RENAMED
            exercise, whose id keeps the old words: that row is now reachable
            by its current name only. Omit for the admin-authored
            set. Whitespace-only is treated as omitted.
          schema: { type: string }
      responses:
        "200":
          description: >
            Without `q`, the authored exercises ordered by id; with `q`, the
            matching exercises ordered by closeness to the query, then by
            name. `[]` when nothing has been
            authored yet — an empty array, never null. `media` is always empty
            on this response; it is not part of the write path.
          content:
            application/json:
              schema:
                type: object
                required: [exercises]
                properties:
                  exercises:
                    type: array
                    items:
                      $ref: "#/components/schemas/Exercise"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create an exercise from the admin console
      operationId: createExercise
      description: >
        Authoring the catalog without a deploy. The row is written with
        `source: "admin"`, which the seeder cannot touch — so a release never
        reverts it. `cmd/exportcontent` carries admin-authored content back into
        the seed JSON, which is how it reaches another environment.


        The **id is derived from the name** and is not accepted from the client:
        it becomes a foreign key in workout items and logged sets, so it outlives
        every other field and can never be changed. "Zercher Squat" becomes
        `zercher-squat`.


        **Media cannot be authored here.** It lives in its own table with no
        upload path, so an exercise created this way has none — and, because
        `media` is not part of the request, an edit can never clear media a
        later deploy adds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseWrite"
      responses:
        "200":
          description: The stored exercise, including its generated id.
          content:
            application/json:
              schema:
                type: object
                required: [exercise]
                properties:
                  exercise:
                    $ref: "#/components/schemas/Exercise"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            The derived id is taken. Deliberately not an upsert — the id may
            already be a foreign key in somebody's training record, so rewriting
            the exercise behind it changes what their history says they did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/exercises/vocabularies:
    get:
      summary: The closed sets an exercise write must pick from
      operationId: exerciseVocabularies
      description: >
        Served rather than hardcoded in the client, so the editor's dropdowns
        and the validator cannot disagree. `movement_patterns` is the COARSE
        vocabulary the cross-sport rules are written against — an exercise filed
        outside it renders perfectly and is silently invisible to every rule,
        which is the one failure here that looks identical to success.
      responses:
        "200":
          description: The three vocabularies, each sorted.
          content:
            application/json:
              schema:
                type: object
                required: [sports, movement_patterns, load_types]
                properties:
                  sports:
                    type: array
                    items: { type: string }
                  movement_patterns:
                    type: array
                    items: { type: string }
                  load_types:
                    type: array
                    items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/exercises/{exerciseID}/publish:
    post:
      summary: Publish a draft exercise
      operationId: publishExercise
      description: >
        Makes a draft visible to athletes. **One-way — there is no unpublish.**
        Workout items and logged sets reference an exercise by id and none of
        those reads filter on status, correctly, so withdrawing a live one would
        leave them pointing at something the catalog no longer shows. If a
        published exercise is wrong, edit it.


        `404` covers both "no such id" and "already published".
      parameters:
        - name: exerciseID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The published exercise.
          content:
            application/json:
              schema:
                type: object
                required: [exercise]
                properties:
                  exercise:
                    $ref: "#/components/schemas/Exercise"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/exercises/{exerciseID}/revisions:
    get:
      summary: An exercise's revision history
      operationId: listExerciseRevisions
      description: >
        Every console write to this exercise, newest first, each a snapshot of
        the row after that write. **Empty is normal**, not an error: everything
        the deploy seeded has no history, and `cmd/seed` deliberately writes
        none.


        The payload is the CONTENT projection, so `media` on it is ALWAYS `[]` —
        the same convention `GET /admin/exercises` uses, and not a claim that the
        exercise has no pictures. Media lives in its own table, cannot be
        authored in the console, and is never read into a revision or written by
        a restore. Reading a payload's `media` as the media at that revision is
        therefore wrong in both directions: it was not recorded, and restoring
        will not put anything back.
      parameters:
        - name: exerciseID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The history, newest first. `[]` when there is none.
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions:
                    type: array
                    items:
                      type: object
                      required: [revision, actor, action, payload, created_at]
                      properties:
                        revision: { type: integer }
                        actor: { type: string }
                        action:
                          type: string
                          enum: [create, update, publish, restore]
                        payload:
                          $ref: "#/components/schemas/Exercise"
                        created_at: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/exercises/{exerciseID}/revisions/{revision}/restore:
    post:
      summary: Roll an exercise back to an earlier revision
      operationId: restoreExerciseRevision
      description: >
        Copies that revision's CONTENT back and records the restore as a new
        revision. **Appends, never truncates** — the state you rolled back from
        stays in the history, so the rollback is itself undoable. **`status` is
        not restored**, so a content rollback cannot withdraw a live exercise.
      parameters:
        - name: exerciseID
          in: path
          required: true
          schema: { type: string }
        - name: revision
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The exercise after the restore.
          content:
            application/json:
              schema:
                type: object
                required: [exercise]
                properties:
                  exercise:
                    $ref: "#/components/schemas/Exercise"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such exercise, or no such revision of it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/exercises/{exerciseID}:
    patch:
      summary: Edit a console-authored exercise
      operationId: updateExercise
      description: >
        A PARTIAL update: an omitted field keeps its stored value, and a field
        sent as empty is cleared. The id comes from the path and is never moved,
        because renaming must not orphan the training records pointing at it.


        `load_mode` is the ONE exception to empty-clears, because it has no
        empty state to clear to: it is a closed enum backing an arithmetic rule,
        and "cleared" would have to mean `total`, which silently halves a
        per-side exercise. So it can be set and changed, never emptied — an
        explicit `""` is a 400 like any other unrecognised value. Omitting it
        still leaves the stored value alone, as everywhere else here.


        ANY row, seeded or admin-authored, and the write TAKES OWNERSHIP: it
        sets `source` to `admin`, so the next release's re-seed skips it. The
        spreadsheet that used to own the catalog was retired in 2026-08; before
        that this refused a seeded exercise with a 409.
      parameters:
        - name: exerciseID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseWrite"
      responses:
        "200":
          description: The stored exercise.
          content:
            application/json:
              schema:
                type: object
                required: [exercise]
                properties:
                  exercise:
                    $ref: "#/components/schemas/Exercise"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/techniques:
    get:
      summary: List or search the techniques the console can edit
      operationId: listAuthoredTechniques
      description: >
        Without `q`: every technique with `source: "admin"` — what the console
        has authored — ordered by id and **unbounded**, because that set grows
        by hand one row at a time and a console that silently truncated its own
        content would be worse than a slow one. It is also exactly what
        `cmd/exportcontent` reads.


        With `q`: the WHOLE catalog, seeded rows included, matched on name, id
        or alias and ordered by name. Every row is editable since the authoring
        spreadsheet was retired in 2026-08, so a screen that could only list the
        handful it authored could not reach the row an operator came to fix.
        **Capped at 100** — a result set of exactly 100 may be truncated, and
        the response carries no total, so treat it as "first 100".


        This exists because the public `GET /techniques` cannot answer the
        question: its `Summary` carries no `source`, and adding one would put
        the string "seed" on every entry of every client's catalog to serve one
        admin screen.
      parameters:
        - name: q
          in: query
          required: false
          description: >
            Search the whole catalog by name, id or alias. Omit it to get the
            admin-authored set instead. Whitespace-only is treated as omitted.
          schema: { type: string }
      responses:
        "200":
          description: >
            Without `q`, the authored techniques ordered by id; with `q`, the
            matching techniques ordered by name. `[]` when nothing has been
            authored yet — an empty array, never null.
          content:
            application/json:
              schema:
                type: object
                required: [techniques]
                properties:
                  techniques:
                    type: array
                    items:
                      $ref: "#/components/schemas/Technique"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create a technique from the admin console
      operationId: createTechnique
      description: >
        Authoring the catalog without a deploy. The row is written with
        `source: "admin"`, which the seeder cannot touch — so a release never
        reverts it. An export command carries admin-authored content back into
        the seed JSON, which is how it reaches another environment.


        The **id is derived from the name** and is not accepted from the client:
        it becomes a foreign key in athletes' training records, so it outlives
        every other field and can never be changed. "São Paulo Pass" becomes
        `sao-paulo-pass`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechniqueWrite"
      responses:
        "200":
          description: The stored technique, including its generated id.
          content:
            application/json:
              schema:
                type: object
                required: [technique]
                properties:
                  technique:
                    $ref: "#/components/schemas/Technique"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            The derived id is taken. Deliberately not an upsert — the id may
            already be referenced by somebody's training record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/techniques/positions:
    get:
      summary: The position vocabulary a technique may claim
      operationId: listTechniquePositions
      description: >
        Derived from the catalog rather than a constant, so the editor's picker
        and the validator cannot disagree. A position no client recognises is
        the worst data this table can hold: it writes, it renders, and it
        returns an empty list forever with nothing reporting a fault.
      responses:
        "200":
          description: Every distinct position currently in use.
          content:
            application/json:
              schema:
                type: object
                required: [positions]
                properties:
                  positions:
                    type: array
                    items: { type: string }
                    example: [Guard - Bottom, Half Guard - Top, Other]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/techniques/{techniqueID}/revisions:
    get:
      summary: A technique's revision history
      operationId: listTechniqueRevisions
      description: >
        Every console write to this technique, newest first. Each entry is the
        technique as it looked AFTER that write — a snapshot, not a diff — so
        reading the history needs no replay and restoring is a copy.


        **Empty is the normal case**, not an error: a technique the console has
        never touched has no history, which is true of everything the deploy
        seeded. `cmd/seed` deliberately writes no revisions — it runs over the
        whole catalog on every release, and recording that would bury the
        handful of entries an operator actually made.


        `actor` is the Clerk user id taken from the request's own claims at
        write time, never a value a client supplied.
      parameters:
        - name: techniqueID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The history, newest first. `[]` when there is none.
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions:
                    type: array
                    items:
                      type: object
                      required: [revision, actor, action, payload, created_at]
                      properties:
                        revision:
                          type: integer
                          description: Monotonic per technique, from 1.
                        actor: { type: string }
                        action:
                          type: string
                          enum: [create, update, publish, restore]
                        payload:
                          $ref: "#/components/schemas/Technique"
                        created_at: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/techniques/{techniqueID}/revisions/{revision}/restore:
    post:
      summary: Roll a technique back to an earlier revision
      operationId: restoreTechniqueRevision
      description: >
        Copies that revision's CONTENT back over the current row and records the
        restore as a new revision.


        **Appends, never truncates.** The state you rolled back from stays in
        the history, so a restore is itself undoable — a rollback that erased its
        own evidence would not be an audit trail.


        **Content only: `status` is not restored.** Rolling back to a revision
        from before the technique was published would otherwise unpublish it,
        and there is no unpublish. An operator restoring wording would silently
        withdraw the technique from every athlete's library, which is not what
        "undo my last edit" means.


        POST rather than PUT because it is not idempotent: restoring the same
        revision twice produces two history entries, which is the honest record
        of what happened.
      parameters:
        - name: techniqueID
          in: path
          required: true
          schema: { type: string }
        - name: revision
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The technique after the restore.
          content:
            application/json:
              schema:
                type: object
                required: [technique]
                properties:
                  technique:
                    $ref: "#/components/schemas/Technique"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such technique, or no such revision of it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/techniques/{techniqueID}/publish:
    post:
      summary: Publish a draft technique
      operationId: publishTechnique
      description: >
        Makes a draft visible to athletes. **One-way — there is no unpublish.**


        Withdrawing a LIVE technique is a different and much riskier operation
        than finishing a new one: training records tag it by id, curricula list
        it and the focus screen resolves it, and none of those reads filter on
        status — correctly, because an athlete's own history must not develop
        holes when a curator changes their mind. Hiding a live technique from
        the library while all of that still points at it is a half-state nobody
        asked for. If a published technique is wrong, edit it.


        A separate operation rather than a field on `PATCH`, so that a partial
        update of eighteen fields cannot change visibility by accident.


        `404` covers both "no such id" and "already published": the caller is
        working from a stale view either way, and reporting a success it did not
        cause is worse than a refusal it can refresh past.
      parameters:
        - name: techniqueID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The published technique.
          content:
            application/json:
              schema:
                type: object
                required: [technique]
                properties:
                  technique:
                    $ref: "#/components/schemas/Technique"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /body/checkins:
    get:
      operationId: listBodyCheckins
      summary: The caller's body check-ins, over a window
      description: >
        A check-in is what the athlete weighed and measured on one calendar day.


        **Two cadences share one resource.** Body weight is read daily and is
        noisy — it swings on water, glycogen and the previous evening's meal —
        so the honest number is a trend across days rather than any one morning.
        Girths move far more slowly and are taken weekly at most, because below
        that the measurement error is larger than the change. A day therefore
        commonly carries a weight and no girths, and that is not an incomplete
        row.


        Every measure is independently optional for the same reason. Requiring
        the set would turn a ten-second habit into a five-minute one, and the
        habit is the feature.


        Both bounds are required — an unbounded list grows for the life of the
        account and every caller wants a window.
      tags: [Body]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Check-ins in the window, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [checkins]
                properties:
                  checkins:
                    type: array
                    items: { $ref: "#/components/schemas/BodyCheckin" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /body/checkins/{date}:
    put:
      operationId: saveBodyCheckin
      summary: Record or update one day's measurements
      description: >
        **PUT, keyed on the day.** The client names the resource and sending it
        twice is the same as sending it once, which is what makes a check-in
        recorded with no signal safe to retry.


        **An omitted measure means "not measured", never "clear it".** A weekly
        girth check-in sends girths and no weight, and must not erase the weight
        recorded that morning — so absent fields are left alone. The consequence
        is that a value cannot be cleared through this endpoint; deleting the
        day is how a mistyped measurement is removed.


        Notes are the exception and ARE replaced, because an empty note is a
        real edit rather than an absent measurement.
      tags: [Body]
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyCheckinInput" }
      responses:
        "200":
          description: The stored check-in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BodyCheckin" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: deleteBodyCheckin
      summary: Remove one day entirely
      description: >
        The documented way to clear a mistyped measurement, since the save
        deliberately cannot null a field.
      tags: [Body]
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /body/checkins/{date}/photo:
    post:
      operationId: createBodyCheckinPhotoUpload
      summary: A short-lived URL to upload the day's progress photo to
      description: >
        Returns a presigned PUT. **The bytes never pass through this API** —
        proxying them would push multi-megabyte bodies through a process sized
        for JSON and make the API the thing that fails on bad gym wifi.


        **The storage key is derived from the authenticated caller and the date
        in the path, never accepted from the client.** That is the whole
        security property: a caller cannot obtain a signature over somebody
        else's object.


        Unlike the exercise catalog's media, which is public and CDN-cacheable
        on purpose, these objects are private. They are read through a
        short-lived presigned URL minted per response and returned as
        `photo_url` on the check-in; a stored URL would simply expire.


        `503` when the environment has no object storage configured, which is a
        supported state rather than a fault — local development and CI have no
        bucket.
      tags: [Body]
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Upload the JPEG to `upload_url` with the given content type.
          content:
            application/json:
              schema:
                type: object
                required: [upload_url, content_type, max_bytes, expires_in, checkin]
                properties:
                  upload_url: { type: string }
                  content_type: { type: string, example: image/jpeg }
                  max_bytes: { type: integer, description: What the client must downscale below. }
                  expires_in: { type: integer, description: Seconds the signature is valid for. }
                  checkin: { $ref: "#/components/schemas/BodyCheckin" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Object storage is not configured on this environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /body/phases:
    get:
      operationId: listBodyPhases
      summary: The caller's body-composition phases, newest first
      description: >
        A phase is what the athlete is trying to do, between two dates — a cut,
        a lean bulk, a recomposition, maintenance, or making weight for a
        division.


        **Deliberately not the same thing as a workout's `goal`.** That one is
        powerlifting / hypertrophy / endurance and describes how a programme is
        written; these are different axes, and a hypertrophy block runs
        perfectly well inside a cut.


        **A span rather than a field on the profile**, because a target with no
        date has no rate — and a rate is the only thing that can tell somebody
        they are cutting too fast. Spans also keep history: the numbers recorded
        in March are only readable against the phase that was running in March.


        `kinds` travels with the response so a client renders its picker from
        the server's vocabulary rather than a copy that can drift.
      tags: [Body]
      responses:
        "200":
          description: Every phase, and the vocabulary.
          content:
            application/json:
              schema:
                type: object
                required: [phases, kinds]
                properties:
                  phases:
                    type: array
                    items: { $ref: "#/components/schemas/BodyPhase" }
                  kinds:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createBodyPhase
      summary: Start a phase
      description: >
        At most one phase runs at a time, enforced by a partial unique index
        rather than an application check — two concurrent starts are exactly the
        race a check loses, and the athlete would end up measuring against two
        targets. A second live phase is `409`; end the running one first.


        `id` is client-generated so a retry is not a second phase, the same
        contract sessions and workouts use for offline creation.


        `making_weight` requires both `target_on` and `target_weight_kg`:
        without them it is a cut with extra words and the countdown has nothing
        to count.
      tags: [Body]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyPhaseInput" }
      responses:
        "201":
          description: The phase that was started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BodyPhase" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: A phase is already running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /body/phases/{id}/end:
    post:
      operationId: endBodyPhase
      summary: End a running phase
      description: >
        A sub-resource verb rather than a PATCH setting `ended_on`: ending is
        the only mutation a phase has, and a general PATCH would invite editing
        the start date of a span that measurements are already anchored to.


        An empty body means today. Ending an already-ended phase is `404` rather
        than a second write that would move the recorded date.
      tags: [Body]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ended_on: { type: string, format: date }
      responses:
        "200":
          description: The ended phase.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BodyPhase" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/techniques/{techniqueID}:
    patch:
      summary: Edit any technique
      operationId: updateTechnique
      description: >
        ANY row, seeded or admin-authored, and the write TAKES OWNERSHIP: it
        sets `source` to `admin`, which the seeder's own `WHERE source = 'seed'`
        then skips forever after. Without that flip the next release would
        quietly revert the edit, which is why this used to refuse a seeded row
        with a 409 instead — a refusal that made sense while an authoring
        spreadsheet owned most of the catalog and a JSON edit could not stick
        either. That spreadsheet was retired in 2026-08.


        `cmd/exportcontent` carries the row back into `techniques.json`, and
        `-adopt` hands it to the deploy again once that is shipped. The id comes
        from the path and is never moved.
      parameters:
        - name: techniqueID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechniqueWrite"
      responses:
        "200":
          description: The updated technique.
          content:
            application/json:
              schema:
                type: object
                required: [technique]
                properties:
                  technique:
                    $ref: "#/components/schemas/Technique"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"


  /nutrition/entries:
    get:
      operationId: listNutritionEntries
      summary: What the caller ate, over a window of days
      description: >
        `from` and `to` are both required and bound to 31 days. Both rather than
        defaulted, because a client that omits one would silently receive a
        different span than it rendered.


        The response also carries `meals`, the slot vocabulary in DISPLAY order,
        so a client's picker renders from the server's list rather than a
        hardcoded copy that can drift. Sorting it alphabetically gives
        breakfast, dinner, lunch, snack — which reads as a bug to every athlete
        who sees it.
      tags: [Nutrition]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: The entries in that window.
          content:
            application/json:
              schema:
                type: object
                required: [entries, meals]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/NutritionEntry" }
                  meals:
                    type: array
                    items: { type: string, enum: [breakfast, lunch, dinner, snack] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /nutrition/entries/{id}:
    put:
      operationId: saveNutritionEntry
      summary: Record or replace one logged item
      description: >
        **PUT on a client-generated UUID.** The client names the resource, so
        sending it twice is the same as sending it once — which is what makes an
        entry logged with no signal safe to retry from an outbox.


        **Macros are absolute for the quantity logged**, already multiplied by
        `servings`. The server never scales and never converts a unit, which is
        what keeps `serving_label` a descriptive string rather than something to
        parse.


        **`kcal` is authoritative and clients must not re-derive it from the
        macros.** Real labels do not reconcile against 4/4/9 — rounding, fibre,
        sugar alcohols and Atwater's own approximations put them 5-10% apart
        routinely — so there is deliberately no constraint tying them together. A
        client that "fixes" the discrepancy is discarding the number the
        manufacturer measured in favour of an estimate.


        **`source_food_id` is provenance only.** It answers "log this again". No
        response ever reads nutrition back through it: correcting a saved food
        must not rewrite what this entry says you ate.


        A UUID belonging to another athlete returns 404, never 403 — a 403 would
        confirm the row exists to somebody enumerating ids.
      tags: [Nutrition]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NutritionEntryInput" }
      responses:
        "200":
          description: The stored entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteNutritionEntry
      summary: Remove one logged item
      description: >
        **204 whether or not the row was there.** An outbox retrying a delete
        that already landed would otherwise record a permanent failure for a row
        that is correctly gone, and it would sit on the athlete's sync screen
        forever. It is also the non-oracle answer: a foreign UUID and an absent
        one are indistinguishable.
      tags: [Nutrition]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: "Gone, or never there." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /nutrition/estimate:
    post:
      operationId: estimateMeal
      summary: Turn a description or a photo into an editable draft
      description: >
        Describe what you ate — "two eggs, sourdough and butter" — or send a
        photo, and get back a draft the athlete corrects and confirms.


        **This writes nothing.** The response is a draft for the quick-add
        sheet; no `nutrition_entries` row exists until the client PUTs one. A
        model that logged food without confirmation would make its mistakes
        indistinguishable from the athlete's own history, and every derived
        number in this module rests on a logged row being what they said they
        ate.


        **`portion_confidence` is about the QUANTITY, never the
        identification**, and the distinction is the point. Naming a food from
        a photo is reliable; judging how much of it is on the plate is not. A
        misnamed food is obvious to the athlete; a portion wrong by a factor of
        two is invisible and moves the day's remaining figure by hundreds of
        calories. Clients should surface `low` prominently and pre-focus the
        quantity field. `assumption` carries the judgement the model had to
        make to answer at all ("assumed a medium egg"), which is what tells the
        athlete WHICH field to fix.


        **Text first.** The text path costs a fraction of the photo path — no
        image tokens at all — and covers most logging. The camera is the
        fallback for a meal you cannot describe, not the primary path.


        **Photos are not stored.** Bytes are forwarded to the model provider
        and discarded; nothing is persisted. A client must disclose that the
        photo leaves the device before sending it.


        **One quota per athlete over a rolling 24 hours — 25 estimates, any
        mix of descriptions and photographs.**


        It used to be two counters, 20 text and 5 photo, on the reasoning that
        the dearer path must not exhaust the cheap one. Measured live on the
        shipped model, that distinction is not worth a counter: input is a flat
        ~1,340-token floor whatever is sent (the schema and system prompt
        dominate), a photograph adds ~1,272 at the 1080px the app resizes to,
        and **output — which is the bill on a reasoning-billed model — tracks
        the NUMBER OF ITEMS in the meal**, from ~184 tokens for one to ~885 for
        six. A six-item description therefore costs three to four times a
        one-item photograph, while photo-versus-text for the same meal is only
        ~1.2–1.5x — the difference being uncached input, since a photo call
        caches a smaller share of its prompt than a typed one rather than none
        of it.


        Refused calls count, because a refusal is a billed answer and a caller
        could otherwise loop on input the model keeps declining. Exhaustion is
        `429` with `rate_limited`, carrying a `Retry-After` header in seconds;
        the reset is also stated in the message as a relative duration, never
        as a timestamp.


        **A call the provider never answered does NOT count.** A refused
        connection, a DNS failure, a revoked key or an upstream error status
        spends no tokens, so it spends none of the 25 — before this an outage
        emptied the day's allowance one retry at a time and left the athlete
        locked out for up to 24 hours after service returned. Those arrive as
        `503` with the code `unavailable`, distinct from the `502` below, which
        is a provider that DID answer and answered with something unusable.
      tags: [Nutrition]
      security:
        - ClerkBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  maxLength: 600
                  example: two eggs, sourdough and butter
                meal:
                  type: string
                  enum: [breakfast, lunch, dinner, snack]
                  description: >
                    Context for portion sizing only — a breakfast portion of
                    oats and a dinner one differ. It never constrains what the
                    model may return.
                reuse:
                  type: boolean
                  default: true
                  description: >
                    Whether this description may be answered from a food the
                    athlete has already saved. **Omitting it means yes** — every
                    client written before this field existed gets the reuse, by
                    design.


                    Send `false` to force a fresh reading. That is the escape
                    hatch for a saved food whose numbers are wrong; without it
                    the athlete could never ask for the food to be estimated
                    again. A forced generation costs an estimate; a reuse does
                    not.
          multipart/form-data:
            schema:
              type: object
              properties:
                description: { type: string, maxLength: 600 }
                meal: { type: string }
                reuse:
                  type: string
                  description: >
                    `false`, `0`, `no` or `off` turns reuse off; anything else,
                    including omitting the field, leaves it on. An unrecognised
                    value is NOT read as false — a value we do not understand is
                    not a request to change behaviour.


                    Only meaningful on a multipart body carrying no image: a
                    photo is never answered from storage.
                image:
                  type: string
                  format: binary
                  description: >
                    JPEG, PNG, GIF or WebP, at most 5 MB. The media type is
                    sniffed from the bytes, not read from the part's declared
                    Content-Type.
      responses:
        '200':
          description: >
            A draft. Nothing has been written.


            It was either GENERATED — a model was called and one estimate was
            spent — or REUSED from a food the athlete had already saved, in
            which case no model was called, no allowance moved, and
            `estimate.match` explains which stored row answered it and why.
          content:
            application/json:
              schema:
                type: object
                required: [estimate, quota]
                properties:
                  estimate: { $ref: '#/components/schemas/MealEstimate' }
                  quota: { $ref: '#/components/schemas/EstimateQuota' }
        '400':
          description: >
            No input, an over-long description, or an unreadable image — all
            detected before the model is called. Only the request can produce
            this; a bad response from the model is `502`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >
            The request was well formed and the model could not read it as
            food. Distinct from 400 — the client's remedy is a better photo or
            a description, not a corrected field. Distinct from 502 too: a
            refusal is deterministic, so retrying the same input only spends
            the quota again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: >
            The daily cap is used up — one budget across both paths, not one
            per path. `Retry-After` gives the wait in whole seconds; the
            message repeats it as a relative duration. Neither is ever an
            absolute timestamp — the athlete's timezone is not something this
            endpoint knows.
          headers:
            Retry-After:
              description: >
                Whole seconds until one more estimate is available, ROUNDED UP
                so that waiting exactly this long succeeds — consistent with
                `components/responses/RateLimited`. The window is a rolling 24
                hours from the oldest call still counted, so a truncated value
                would land a client back inside it and earn a second 429 for
                obeying the header. Never zero.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: >
            The provider ANSWERED and the answer was unusable — an absurd
            magnitude, a NaN, an item with no name, an empty body. Retryable
            and not the client's fault, which is why it is not reported as
            `400`: the request was validated before a token was spent, so
            there is nothing in it to correct.


            **This one DID cost an estimate.** The provider produced a
            response and billed for it, so the call is metered. A provider that
            never answered at all is `503`/`unavailable` instead, and that one
            costs nothing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: >
            Either the provider never answered — refused connection, DNS
            failure, revoked key, upstream error status — or estimation is not
            configured on this deploy (no key for the selected provider).
            Every other nutrition route is unaffected.


            **A REUSE is served even on a deploy with no key**, because it
            needs no provider — the not-configured case is checked after the
            saved-food lookup, deliberately. So a 503 here always means the
            description did not match anything stored.


            **Read the `code` to tell them apart, and only the code** — the
            message is not part of this contract. `unavailable` means the
            provider never answered: nothing was spent and **this call did not
            use one of the athlete's 25**, so a client may say so and may
            retry the identical request once service returns. `internal` means
            this deploy has no API key, which no retry will fix.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '504':
          description: >
            The provider was still working when THIS SERVICE stopped waiting.
            The deadline is ours — 35 seconds — and it exists so that this
            endpoint always answers with a status.


            **Why that matters more than it sounds.** There used to be no
            deadline anywhere on this path, so a slow provider ran until the
            CLIENT's own request timeout fired instead. A client that times out
            receives no status and no body, and has nothing left to say except
            that it could not reach the server — which is what an athlete was
            shown, on a working connection, while photographing a food label
            (N92). Every other outcome here carries copy the client can render
            as itself; silence is the one that cannot.


            The code is `unavailable`, same as the `503`, because a client's
            correct move is identical: retry the same request later, and there
            is nothing in it to fix. **But unlike the `503`, this one DID cost
            an estimate.** The request reached the provider and the tokens were
            very likely bought; exempting it would also make the daily cap
            trivially avoidable by abandoning every call. So a client must not
            tell the athlete their allowance is untouched here — that promise
            belongs to `503`/`unavailable` alone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nutrition/days:
    get:
      operationId: listNutritionDays
      summary: Per-day totals against the target that was live that day
      description: >
        A read-only roll-up for review screens, bounded to 366 days.


        **Not for the day the client is currently editing.** An offline client
        holds entries the server has never seen, so this figure is not
        stylistically but numerically wrong there, during the exact minute
        somebody is looking at it. Sum the day being edited on the client.


        The target is resolved PER DAY rather than once for the window: a target
        changed mid-window applies from its own date forward, and a single
        figure would misattribute every day before it. It is also why the target
        arrives per day rather than as a weekly total the client divides —
        training-day calorie cycling then stays a server change rather than a
        client rewrite.
      tags: [Nutrition]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: One row per day that has at least one entry.
          content:
            application/json:
              schema:
                type: object
                required: [days]
                properties:
                  days:
                    type: array
                    items: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /nutrition/catalog:
    get:
      operationId: searchFoodCatalog
      summary: Search the shared food catalog
      description: >
        The catalog every athlete searches, as distinct from
        `/nutrition/foods`, which is the caller's OWN saved foods. Both exist
        and neither replaces the other.


        **An empty result is a 200, never a 404, and it always says WHICH kind
        of empty it is.** An athlete who searches "skyr" and gets nothing back
        cannot otherwise tell whether the food is missing, their query was
        unusable, or the catalog failed to load — and those need different
        reactions. `outcome` is the answer, and only `no_match` means "we do not
        have this food":


        - `ok` — there are results.

        - `no_match` — the catalog is loaded, covers the market asked for, and
          does not have this. The only value where offering to add the food by
          hand is the right next step.

        - `query_unusable` — the query held no searchable term at all (`%`,
          `!!!`). Nothing was actually asked, so nothing can be concluded.

        - `catalog_empty` — the catalog holds no rows. This is a server-side
          failure, never the athlete's, and must not be shown as a missing food.

        - `market_not_covered` — nothing is stocked for the market requested.
          Not fixable by rephrasing.


        `coverage` is attached whenever the result is empty, because that is
        exactly when a client needs to know what the catalog contains in order
        to render the nothing it got.


        Matching is per-word and ANDed, so every typed word must appear — in the
        name or in one of the row's aliases. Ranking prefers rows whose name
        LEADS with a typed word, which is what separates "Chicken, ..., breast"
        from "Lunchmeat, chicken breast".
      tags: [Nutrition]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: category
          in: query
          required: false
          schema: { type: string, maxLength: 40 }
        - name: market
          in: query
          required: false
          description: >
            Restricts to one market. Omitted means any market the catalog
            stocks, which is the right default while only one is stocked.
          schema: { type: string, maxLength: 16 }
        - name: limit
          in: query
          required: false
          description: Clamped to 100 rather than rejected.
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: The matching foods, with an outcome explaining the set.
          content:
            application/json:
              schema:
                type: object
                required: [foods, total, outcome]
                properties:
                  foods:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogFood" }
                  total:
                    type: integer
                    description: >
                      How many matched before `limit`, so a client can say
                      "showing 20 of 63" rather than implying it has everything.
                  outcome:
                    type: string
                    enum: [ok, no_match, query_unusable, catalog_empty, market_not_covered]
                  coverage:
                    $ref: "#/components/schemas/CatalogCoverage"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /nutrition/catalog/coverage:
    get:
      operationId: getFoodCatalogCoverage
      summary: What the food catalog actually contains
      description: >
        The availability answer on its own. Asked in two situations: by a client
        rendering an empty state, and by a human checking whether a deploy
        seeded correctly. Counts are live rather than declared, because a stale
        coverage figure is worse than none.
      tags: [Nutrition]
      responses:
        "200":
          description: Live counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogCoverage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /nutrition/catalog/barcode/{barcode}:
    get:
      operationId: lookupFoodByBarcode
      summary: Resolve a scanned barcode to a food
      description: >
        Cache first, then Open Food Facts. A resolution is cached so one
        athlete's scan warms it for everyone; a MISS is never cached, because a
        barcode the provider did not know last week may be known today and
        caching the miss would make "not added upstream yet" permanent.


        **Three outcomes, and keeping them apart is the point of this
        endpoint:**


        - `400 invalid_input` — not a barcode. Fix the input.

        - `404 not_found` — the provider does not have it, or has it with no
          usable numbers. Offer manual entry.

        - `503 unavailable` — we could not ask. Try again shortly.


        A network failure must never surface as `not_found`: that would tell an
        athlete their food does not exist because a DNS lookup blinked. Nor the
        reverse — an unknown packet answered `503` would have a phone retrying
        something that can never succeed. A product the provider holds with no
        name or no energy value is `not_found` too, and so is one whose figures
        are outside the plausible range: returning either would put a nameless
        or absurd food in front of someone as though it had been measured.


        Values are per 100 g, matching the rest of the catalog.
      tags: [Nutrition]
      parameters:
        - name: barcode
          in: path
          required: true
          description: 6 to 14 digits. A string, not a number — leading zeros are significant.
          schema: { type: string, pattern: "^[0-9]{6,14}$" }
      responses:
        "200":
          description: The resolved food.
          content:
            application/json:
              schema:
                type: object
                required: [food, source, provider, cached]
                properties:
                  food: { $ref: "#/components/schemas/BarcodeFood" }
                  source:
                    type: string
                    enum: [catalog, off]
                    description: >
                      Whose data this is. A cached Open Food Facts row is still
                      Open Food Facts data — it does not become `catalog` by
                      having been stored, because ODbL attribution depends on
                      the distinction.
                  provider:
                    type: string
                    description: Who answered, e.g. `openfoodfacts`.
                  cached:
                    type: boolean
                    description: Whether this came from our store rather than a live call.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: >
            The provider could not be reached, or none is configured. NOT the
            same as the food being unknown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /nutrition/catalog/{id}:
    get:
      operationId: getCatalogFood
      summary: One catalog food by its slug
      tags: [Nutrition]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: The food.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogFood" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /nutrition/foods:
    get:
      operationId: listNutritionFoods
      summary: The caller's saved foods and recipes
      description: >
        `q` matches on name, case-insensitively. Recipes carry their `items`;
        a plain food's `items` is an empty array.
      tags: [Nutrition]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The matching foods.
          content:
            application/json:
              schema:
                type: object
                required: [foods]
                properties:
                  foods:
                    type: array
                    items: { $ref: "#/components/schemas/NutritionFood" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /nutrition/foods/{id}:
    put:
      operationId: saveNutritionFood
      summary: Save or replace a food, or a recipe and its components
      description: >
        Create-or-replace on a client-generated UUID, in one transaction.


        **A recipe's macros are DERIVED, not supplied.** Send `items` and
        `yield_servings`; the per-serving figures are computed as sum divided by
        yield and stored on the row, so the food picker never joins. Any macros
        sent on a recipe are ignored.


        **Items are replaced wholesale**, not merged — they are an ordered list
        the client owns in full.


        **`source` is not settable.** Everything written here is `user`; `usda`
        and `off` are set by the importers that fetch them. Letting a client
        claim a provenance would make the licence separation those values exist
        for meaningless.
      tags: [Nutrition]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NutritionFoodInput" }
      responses:
        "200":
          description: The stored food, with a recipe's derived per-serving macros.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionFood" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteNutritionFood
      summary: Remove a saved food
      description: >
        204 whether or not it was there, for the same reason an entry delete is.


        **Entries logged from it are untouched.** They carry their own numbers
        and only lose the provenance link, so deleting a favourite can never
        change what the log says you ate.
      tags: [Nutrition]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: "Gone, or never there." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /nutrition/targets:
    get:
      operationId: listNutritionTargets
      summary: The targets in a window, plus the one live at its start
      description: >
        **The carry-in row is the point.** A target set three months ago means a
        week-long window contains no rows of its own, and without it the client
        would report "no target" for a week the athlete was very much eating to
        one — a bug that only appears for people who have not changed their
        target recently, which is to say the ones doing it right.


        **The window is capped**: `to - from` must be under 366 days, so 365 is
        the widest span served and 366 is an `invalid_input`. Stated because a
        client wanting the longest readable history sits exactly on that limit
        with no slack — `apps/mobile` does — and because the cap is not
        derivable from anything else on this operation.
      tags: [Nutrition]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Targets in the window, plus at most one carry-in row before it.
          content:
            application/json:
              schema:
                type: object
                required: [targets]
                properties:
                  targets:
                    type: array
                    items: { $ref: "#/components/schemas/NutritionTarget" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /nutrition/targets/adjustment:
    get:
      operationId: proposeNutritionTargetAdjustment
      summary: Propose a correction to the live target from observed weight change
      description: >
        **A proposal, never an application, and never a scheduled job.** Nothing
        is written and nothing runs in the background; the rule is evaluated
        when somebody asks. Accepting is an ordinary
        `PUT /nutrition/targets/{date}` with `source: "adjustment"`, using the
        `effective_on` and macros in the proposal. Declining is sending nothing
        — no dismissal is stored, because it would be stale the moment the next
        check-in landed, and the cooldown is already derivable from target
        history.


        **Why it exists.** The derivation uses 7700 kcal/kg, which ignores
        adaptive thermogenesis and therefore drifts optimistic over a phase.
        This corrects from what actually happened to the athlete's weight
        rather than from a better constant.


        **A withheld proposal is a `200` with `adjustment: null`**, and
        `blocked_by` naming why. For most athletes on most days that is the
        correct answer rather than a failure, so it is never an error status.
        The reasons are part of the contract:

        `no_target` (nothing to adjust from — reported alone, since every other
        reason is a statement about a target that does not exist),
        `no_phase` (no live body phase, so no target rate to compare against),
        `too_soon` (fewer than 14 days on the current target: a week after a
        change measures the water shift the change caused),
        `not_logging` (fewer than 10 of the last 14 days reached half the
        target's calories — an adjustment from two logged days is not measuring
        intake),
        `not_weighing` (fewer than 4 weigh-ins in EACH 7-day half; deliberately
        stricter than the 3 the displayed trend needs, because this moves food),
        `on_track` (the observed and target rates differ by less than
        0.25%/week, which is roughly the noise floor of a 7-day trend).


        **The step is capped** at whichever is smaller of 250 kcal and 10% of
        the current target, and never falls below resting rate — the same floor
        the derivation applies, so a target this API is willing to derive is
        never one it immediately proposes raising. A capped
        proposal says so in `basis.capped`, with `basis.raw_delta_kcal` showing
        what the arithmetic asked for — so the explanation reads as "we stopped
        here" rather than as arithmetic whose last line does not follow.


        **It takes effect tomorrow, never today.** Today is mostly eaten; a
        retroactive target would move the day's remaining figure under an
        athlete who has already acted on it.
      tags: [Nutrition]
      parameters:
        - name: on
          in: query
          required: false
          description: The day to judge. Defaults to today, UTC.
          schema: { type: string, format: date }
      responses:
        '200':
          description: >
            A proposal, or null with the reasons it was withheld. Both are
            ordinary outcomes.
          content:
            application/json:
              schema:
                type: object
                required: [adjustment, blocked_by]
                properties:
                  adjustment:
                    nullable: true
                    type: object
                    required: [from_kcal, to_kcal, delta_kcal, protein_g, carb_g, fat_g, fibre_g, effective_on, basis]
                    properties:
                      from_kcal: { type: integer }
                      to_kcal: { type: integer }
                      delta_kcal:
                        type: integer
                        description: >
                          Signed. Negative means eat less — which is what a
                          steady weight on a cut calls for.
                      protein_g: { type: integer }
                      carb_g: { type: integer }
                      fat_g: { type: integer }
                      fibre_g: { type: integer }
                      effective_on:
                        type: string
                        format: date
                        description: Always tomorrow.
                      basis:
                        type: object
                        description: >
                          The arithmetic, rendered as the explanation. kcal is
                          authoritative here as everywhere: macros are rounded
                          to 5 g and will not reconcile against it exactly.
                        properties:
                          observed_kg_per_week: { type: number }
                          observed_pct_per_week: { type: number }
                          target_kg_per_week: { type: number }
                          target_pct_per_week: { type: number }
                          trend_weight_kg: { type: number }
                          earlier_trend_weight_kg: { type: number }
                          weighins_recent_half: { type: integer }
                          weighins_earlier_half: { type: integer }
                          days_logged: { type: integer }
                          days_considered: { type: integer }
                          days_on_current_target: { type: integer }
                          kcal_per_kg: { type: number }
                          raw_delta_kcal: { type: integer }
                          capped: { type: boolean }
                          cap_reason: { type: string }
                          relaxed: { type: string }
                          protein_g_per_kg: { type: number }
                          fat_g_per_kg: { type: number }
                  blocked_by:
                    type: array
                    description: Empty when a proposal is present. Never null.
                    items:
                      type: string
                      enum: [no_target, no_phase, too_soon, not_logging, not_weighing, on_track]
        '400':
          description: '`on` is not a date.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nutrition/targets/suggested:
    get:
      operationId: suggestNutritionTarget
      summary: Derive a calorie and macro target, without storing it
      description: >
        **A proposal, never a decision.** Nothing is written; the athlete accepts
        it with `PUT /nutrition/targets/{date}`, which is what makes the number
        arguable rather than imposed.


        The chain, every step of which is returned in `basis` so the UI can show
        its work: resting rate (Mifflin-St Jeor) + NEAT (an activity factor that
        stops at 1.45 because training is added SEPARATELY, and a textbook 1.55
        would double-count every session) + a 28-day trailing training average =
        maintenance; then the live body phase's own rate band supplies the
        deficit or surplus.


        **An incomplete profile is a 200, not a 400.** `suggestion` is null and
        `missing` names the fields — the request was fine, the profile is
        incomplete, and the client's fix is a form rather than a retry.


        It also refuses when the resting rate would come from the generic
        baseline rather than Mifflin-St Jeor. That baseline runs 20-30% high; on
        a session card it inflates a badge, but in a food target it overfeeds by
        roughly 400 kcal a day and the cut simply never happens. There is no
        caveat an athlete could act on, so it is a refusal.


        **Macro rounding is coarse (5 g, and 10 kcal), so `4P + 4C + 9F` will
        not equal `kcal`.** That is intended. kcal is authoritative.
      tags: [Nutrition]
      parameters:
        - name: on
          in: query
          required: false
          description: The day to derive for. Defaults to today, UTC.
          schema: { type: string, format: date }
        - name: activity
          in: query
          required: false
          description: >
            NEAT only — everything that is NOT logged training. The ladder stops
            at `active` (an on-your-feet job) on purpose.


            **Omit it to derive at whatever the athlete has stored** on
            `profile.activity_level`, falling back to `light` when they have
            never chosen. Sending it OVERRIDES the stored value for this request
            without writing anything, which is what lets a client preview "what
            if I had a desk job" before committing to it — committing is a
            PATCH to /profile.


            The response always echoes back the level it actually used, so the
            control and the number come out of one payload and cannot disagree.
            No default is applied to the parameter itself: an absent parameter
            and `light` are genuinely different requests now.
          schema: { type: string, enum: [sedentary, light, active] }
      responses:
        "200":
          description: A suggestion, or null with the fields that are missing.
          content:
            application/json:
              schema:
                type: object
                required: [suggestion, missing, activities, activity, activity_chosen]
                properties:
                  suggestion:
                    type: object
                    nullable: true
                    description: Null when the profile is incomplete — see `missing`.
                    allOf: [{ $ref: "#/components/schemas/NutritionSuggestion" }]
                  missing:
                    type: array
                    description: Profile fields a derivation needs and did not have. Empty on success.
                    items: { type: string }
                  activities:
                    type: array
                    items: { type: string, enum: [sedentary, light, active] }
                  activity:
                    type: string
                    enum: [sedentary, light, active]
                    description: >
                      The level this derivation actually ran at — the `activity`
                      parameter if one was sent, else the stored
                      `profile.activity_level`, else `light`.


                      Top level rather than inside `suggestion`, and that
                      placement is load-bearing: `basis.activity` carries the
                      same value but `basis` is null for an incomplete profile,
                      and an athlete who cannot be given a number yet still has
                      a level to display and change. Reading it off the basis
                      leaves the control unrenderable in exactly the state the
                      rest of the screen is asking them to fix.
                  activity_chosen:
                    type: boolean
                    description: >
                      Whether `activity` came from the athlete rather than from
                      the default. False means nobody has ever chosen and
                      `light` was assumed.


                      Clients MUST NOT render a chosen-looking control on false:
                      a filled pill attributes a decision to somebody who never
                      made one. Show the assumption, named, and let them confirm
                      or change it.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /nutrition/targets/{date}:
    put:
      operationId: saveNutritionTarget
      summary: Set the target that holds from a date
      description: >
        **The date is the identity**, so setting today's target twice is one
        row, not two — and history stays readable: a day logged in March is
        judged against March's target rather than against whatever the athlete
        is eating to now.


        `basis` should be echoed back verbatim from `/nutrition/targets/suggested`
        when accepting a derived target. It is FROZEN at that moment and never
        recomputed on read, because weight, height and the live phase all move —
        a "live" explanation would be a confident lie about a past decision.
        Omit it for a manually typed target, which has no arithmetic to show.
      tags: [Nutrition]
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NutritionTargetInput" }
      responses:
        "200":
          description: The stored target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionTarget" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: deleteNutritionTarget
      summary: Undo a target set on a date
      description: >
        204 whether or not it was there, so a retry against a row another
        device already removed resolves rather than 404-ing.


        **This is the only way a target filed under the wrong DAY leaves the
        record.** The date is the identity, so a PUT can correct a target's
        numbers and can never move it — clients offering a correction surface
        need both verbs. Removing a row means the previous target takes over
        the span it governed, or, if it was the oldest, that the span has no
        target at all; say which before doing it.


        **The server retains nothing**, so there is no undo endpoint. A client
        that offers undo must hold the removed row and restore it with a PUT —
        and must send back `source` and `basis` as it received them, or the
        restore silently relabels a derived target as one the athlete typed and
        discards an explanation they never chose to lose. `created_at` is
        regenerated either way.
      tags: [Nutrition]
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        "204": { description: "Gone, or never there." }
        # Documented because the handler validates the path date itself rather
        # than letting Postgres raise 22007 as a 500. It was missing here while
        # the endpoint had no callers; the phone is the first.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/users:
    get:
      summary: List every user the API knows about (admin-only)
      description: >
        Users are enumerated from every table that records a user id —
        profiles, sessions and activities — not from `profiles` alone.
        Someone who signed up and trained but never finished onboarding has
        no profile row and would otherwise be invisible to support. Capped at
        500, most-recently-trained first.
      operationId: adminListUsers
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Known users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{userID}:
    get:
      summary: One user's admin view — summary plus recent sessions (admin-only)
      operationId: adminGetUser
      description: >
        Replaces the activities-only user detail. Returns 404 for an id that
        appears in no table, so a mistyped id reads as wrong rather than as an
        empty account.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: That user's summary and recent sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{userID}/activities:
    get:
      summary: List a specific user's activities (admin-only, legacy)
      operationId: adminListUserActivities
      description: >
        No longer what the admin console renders — see GET /admin/users/{userID}.
        Retained as the only read path for `activities` rows written before the
        in-app logging form was removed; nothing writes that table now. Newest
        first, capped at 500, with no pagination.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: That user's activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{userID}/bjj/standing:
    get:
      summary: A specific user's BJJ rank and promotion history (admin-only)
      operationId: adminGetBjjStanding
      description: >
        Same derivation as GET /bjj/standing, over the path user rather than
        the caller. Read-only — the admin console shows rank beside the
        athlete, it does not edit it. An id that matches no promotions answers
        200 with `current: null`, the same as a real account that has never
        recorded one; this endpoint does not distinguish "no such user" from
        "no rank yet".
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: That user's rank and history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BjjStanding"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{userID}/avatar:
    delete:
      summary: Remove a specific user's avatar (admin-only, N12)
      operationId: adminClearAvatar
      description: >
        VOLA's moderation answer for an avatar, as things stand today: no
        in-app report flow exists, so a takedown is initiated however a
        complaint reaches an operator (email, a DM) — the same way every
        other admin action in this console is. Clears has_avatar on the
        target account first, then best-effort deletes the stored object.
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204": { description: Removed. }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Object storage is not configured on this environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /contests:
    get:
      operationId: listContests
      summary: The caller's competitive record
      description: >
        Every entry the athlete has recorded, newest first, with each entry's
        matches nested.


        **Everything here is objective.** A placement, a bracket size and a
        referee's decision are externally verifiable, which makes a contest the
        strongest measured evidence this API carries — nothing in it is
        self-rated, and nothing self-rated may be added. How a session felt
        belongs on the session.


        Undated entries sort last. Capped at 200 entries; an athlete's whole
        competitive career is far below that, and the cap is what keeps the
        response size bounded.
      tags: [Contests]
      responses:
        "200":
          description: The entries, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [contests]
                properties:
                  contests:
                    type: array
                    items: { $ref: "#/components/schemas/Contest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createContest
      summary: Record an entry
      description: >
        The id is minted server-side. Client-supplied ids exist elsewhere in
        this API to make offline retries idempotent; a contest result is entered
        at a desk with a connection and has no outbox behind it, so there is
        nothing for one to buy.


        Consequently there is **no natural unique key**: submitting the same
        form twice writes two identical entries. Entries are deletable, and
        deduplicating them would need a naming authority this product does not
        have.
      tags: [Contests]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContestInput" }
      responses:
        "201":
          description: The entry as stored, with its matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /contests/{contestID}:
    parameters:
      - name: contestID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getContest
      summary: One entry, with its matches
      tags: [Contests]
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateContest
      summary: Replace an entry
      description: >
        PUT rather than PATCH, and the matches are the reason. They travel with
        the entry and replace **wholesale** — so a partial update would have to
        define what sending no matches means, and both answers are traps:
        "leave them alone" makes clearing a bracket impossible, "clear them"
        deletes a record on a request that never mentioned it. PUT has one
        meaning.


        An entry that does not exist and one belonging to another account answer
        identically, so this endpoint never confirms that an id exists.
      tags: [Contests]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContestInput" }
      responses:
        "200":
          description: The entry as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteContest
      summary: Remove an entry
      description: Its matches go with it.
      tags: [Contests]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bjj/accomplishments:
    get:
      operationId: listBjjAccomplishments
      summary: What the athlete has achieved on the mat and in competition
      description: >
        Derived on every read from evidence that already exists — `/contests`
        for the competition half, the BJJ session tag stream for the mat half —
        and stored nowhere.


        Earliest first, undated last. An athlete who has achieved nothing yet
        gets `[]`, which is the ordinary state of a new account.


        **Belt promotions are deliberately absent.** They are already recorded
        and already derived into a current rank by `/bjj/standing`; re-deriving
        them here would put one fact behind two vocabularies.
      tags: [BJJ]
      parameters:
        - name: tz
          in: query
          required: false
          schema: { type: string, default: UTC }
          description: >
            IANA zone deciding which calendar day a session-derived award falls
            on. Optional rather than required because the competition half does
            not need it — those dates are already calendar dates. "Local" is
            refused: over HTTP it would mean the server's zone.
      responses:
        "200":
          description: The accomplishments, earliest first.
          content:
            application/json:
              schema:
                type: object
                required: [accomplishments]
                properties:
                  accomplishments:
                    type: array
                    items: { $ref: "#/components/schemas/Accomplishment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /trackers:
    get:
      operationId: listTrackers
      summary: The athlete's daily trackers
      description: >
        Returns every live tracker, archived ones excluded.


        **This call provisions the default presets**, which makes it a write on
        a read and is worth stating rather than hiding. It is idempotent and
        safe to race — provisioning is keyed on (athlete, preset) — and the
        alternative, a separate "set up my trackers" call, is a step that gets
        skipped and leaves Today empty. An edited target survives it, and a
        tracker the athlete archived is not handed back.
      tags: [Trackers]
      parameters:
        - name: archived
          in: query
          required: false
          description: >
            `true` — and only the exact literal `true` — returns the trackers
            the athlete STOPPED instead of the live ones, newest-archived first.
            Any other value, and the parameter's absence, return the live list.


            Read strictly on purpose: `?archived=0` meaning "yes" would show an
            athlete an empty Today. The archived branch deliberately does not
            provision the default presets — handing somebody a water card while
            they are looking at what they turned off would be a strange answer.
          schema: { type: string, enum: ["true"] }
      responses:
        "200":
          description: The live trackers, in display order.
          content:
            application/json:
              schema:
                type: object
                required: [trackers]
                properties:
                  trackers:
                    type: array
                    items: { $ref: "#/components/schemas/DailyTracker" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createTracker
      summary: Create a tracker
      description: >
        Idempotent on the client-supplied `id`: sending it twice returns the
        original row rather than creating a second. An id that belongs to
        another athlete is reported as a conflict and never returned.


        **There is a cap on how many trackers an athlete may have running at
        once** (eight), because several cards on Today crowd out what Today is
        for. Exceeding it is 409, and the message says so; archiving one makes
        room, and archived trackers do not count against it. The cap never
        refuses an idempotent retry — a create that adds no row is answered with
        the existing tracker, so a lost response cannot become a permanent
        rejection.
      tags: [Trackers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyTrackerInput" }
      responses:
        "201":
          description: The stored tracker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyTracker" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /trackers/entries:
    get:
      operationId: listTrackerEntries
      summary: A window of taps across every tracker
      description: >
        One request serves a whole screen of cards; there is deliberately no
        per-tracker variant, which would be an N+1 on the one screen that
        renders several.


        `from` and `to` are LOCAL calendar days and are both required. They have
        no default because the server does not know the athlete's timezone, so
        any default it picked would be wrong for much of the world for part of
        every day.
      tags: [Trackers]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: The entries, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/TrackerEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /trackers/{trackerID}:
    parameters:
      - name: trackerID
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateTracker
      summary: Change part of a tracker
      description: >
        **Partial, and strictly so: a field the body does not name is not
        written.** The phone's target screen sends `{"target": 2500}` and
        everything else about the tracker is left exactly as it was.


        This is a contract promise rather than an implementation detail because
        the failure it prevents has shipped in this codebase three times — a
        full-row SET clause grew a column and blanked an authored value — and a
        client cannot tell the difference until real data is lost.
      tags: [Trackers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyTrackerPatch" }
      responses:
        "200":
          description: The tracker after the patch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyTracker" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: archiveTracker
      summary: Archive a tracker, or destroy it
      description: >
        **Archives by default; destroys only with `?purge=true`.** Archiving
        takes the tracker off the list and every entry it recorded survives.
        Archiving twice is not an error, and an archived preset is not
        re-provisioned on the next list.


        `?purge=true` is the genuinely destructive path: the tracker and every
        entry it ever held are deleted, and there is no undo. The literal is
        read EXACTLY — `?purge=1`, `?purge=TRUE` and `?purge=false` all archive
        — so a client that gets the spelling wrong loses nothing. A client
        offering this must say what it destroys before asking.


        A tracker provisioned from a preset cannot be destroyed, only archived:
        deleting the row deletes the record that provisioning happened, so the
        next list would hand it straight back and the destroy would silently
        undo itself.
      tags: [Trackers]
      parameters:
        - name: purge
          in: query
          required: false
          description: >
            `true`, exactly, destroys the tracker and all of its entries.
            Anything else archives.
          schema: { type: string, enum: ["true"] }
      responses:
        "204": { description: "Archived, or destroyed." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /trackers/{trackerID}/restore:
    parameters:
      - name: trackerID
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: restoreTracker
      summary: Put an archived tracker back
      description: >
        Un-archives, with every entry it kept while it was stopped. POST rather
        than PATCH because this is a lifecycle transition, not a field write —
        folding it into the partial-update body would put "stop tracking this"
        one typo away from "change my target".


        Restoring one that is already live is a no-op, so a retry after a lost
        response is safe. Subject to the same live-tracker cap as creating one:
        an athlete already at the limit is answered 409, because otherwise
        archiving and restoring would walk straight past it.
      tags: [Trackers]
      responses:
        "204": { description: "Restored, or already live." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tracker-presets:
    get:
      operationId: listTrackerPresets
      summary: Trackers the athlete can turn on
      description: >
        The catalogue of seeded trackers that are NOT provisioned automatically
        — the ones an athlete opts into. Coffee is the first: an unremovable
        daily coffee counter handed to somebody who has just quit is not a
        neutral thing for a nutrition app to do, so it ships off and this is how
        it is reachable.


        Presets every athlete is already given are deliberately absent: they are
        provisioned by `GET /trackers`, and offering a second route onto the
        same row would be confusing. An archived one is restored from the
        archived list instead.
      tags: [Trackers]
      responses:
        "200":
          description: The optional presets. Possibly empty.
          content:
            application/json:
              schema:
                type: object
                required: [presets]
                properties:
                  presets:
                    type: array
                    items: { $ref: "#/components/schemas/TrackerPreset" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tracker-presets/{presetKey}:
    parameters:
      - name: presetKey
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: addTrackerPreset
      summary: Turn a preset on
      description: >
        Provisions the named preset for the caller, or RESTORES it if they
        stopped it earlier — the row still holds the provisioning key, so a
        plain second insert would do nothing and the athlete would tap and see
        no change.


        There is no request body, and that is the security property rather than
        a convenience: every field comes from the server's compiled catalogue
        and the id is derived from the caller's own user id. That is what lets
        this mint an id in the reserved namespace `POST /trackers` refuses.


        Idempotent. An unknown key, or the key of a preset every athlete is
        given by default, is 404. Subject to the live-tracker cap.
      tags: [Trackers]
      responses:
        "200":
          description: The tracker, live.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyTracker" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /trackers/{trackerID}/entries/{entryID}:
    parameters:
      - name: trackerID
        in: path
        required: true
        schema: { type: string }
      - name: entryID
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: logTrackerEntry
      summary: Record one tap
      description: >
        PUT, keyed on the entry id the client generated, so sending it twice is
        the same as sending it once — which is what makes a cup logged in a
        kitchen with no signal safe to retry. The id in the path wins over any
        id in the body.


        Crossing the target is never refused: an athlete who drinks ten of eight
        logs ten.
      tags: [Trackers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackerEntryInput" }
      responses:
        "200":
          description: The stored entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackerEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteTrackerEntry
      summary: Remove one tap
      description: >
        The tap-a-filled-cup correction. Deleting something already gone is not
        an error — a retried delete over a flaky connection is the common case,
        and a 404 on the second attempt would put a failure on the sync screen
        for a correction that landed.
      tags: [Trackers]
      responses:
        "204": { description: "Removed, or already absent." }
        "401": { $ref: "#/components/responses/Unauthorized" }
