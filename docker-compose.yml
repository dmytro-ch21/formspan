services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: formspan
      POSTGRES_PASSWORD: formspan_dev_only
      POSTGRES_DB: formspan
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formspan"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
