# N166 (#543). Weekly, grouped dependency updates, opened by GitHub's own
# Dependabot service — nothing here executes locally or in `verify`; this file
# is read by GitHub's infrastructure, not by this repo's own tooling.
#
# FOUR ecosystems cover the ticket's ask (backend Go, web, mobile, admin), plus
# two more this repo already has real code in — see the notes on each entry.
version: 2

updates:
  # --- backend/ (Go module) ---------------------------------------------
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # Minor/patch bumps land as one weekly PR; a major stays its own PR,
      # since a major Go dependency bump is exactly the kind of change that
      # wants its own review rather than being folded into a batch.
      go-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "area: backend"]

  # --- engine/ (Go module) -----------------------------------------------
  # NOT one of the ticket's literal "four workspaces" — added anyway, and
  # called out here so the addition isn't mistaken for scope creep nobody
  # noticed. `engine/` is a second, separate Go module (deliberately outside
  # `backend/`, see its own go.mod header and CLAUDE.md's module-pattern
  # section) with its own go.sum, built and tested by CI. Measured while
  # building this ticket: it was carrying a real reachable vulnerability
  # (golang.org/x/text v0.29.0, GO-2026-5970) that a backend-only Dependabot
  # config would never have surfaced. See docs/decisions/history.md's N166
  # entry.
  - package-ecosystem: "gomod"
    directory: "/engine"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      go-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "area: backend"]

  # --- apps/web, apps/mobile, apps/admin (one pnpm workspace) ------------
  # ONE entry, not three, and this is a deliberate reading of the repo rather
  # than a shortcut. `pnpm-workspace.yaml` declares `apps/*` as workspace
  # members and there is exactly ONE `pnpm-lock.yaml`, at the repo root —
  # confirmed by `find . -name pnpm-lock.yaml` before writing this file.
  # Dependabot resolves an npm/pnpm workspace from its lockfile, so a
  # `directory` entry has to point at the ROOT that lockfile lives in, not at
  # `apps/web` or `apps/mobile` individually — none of those subdirectories
  # carries its own lockfile for Dependabot to resolve against, so three
  # directory-scoped entries here would not independently resolve; the one
  # root entry already reaches apps/web, apps/mobile and apps/admin's
  # package.json files through the shared workspace.
  #
  # Groups substitute for the "one PR series per app" shape the ticket asked
  # for, since a single ecosystem entry has no per-directory grouping.
  #
  # H21 (#1005) — THIS COMMENT USED TO CLAIM the separation was complete:
  # "mobile (Expo/React Native) dependencies are named distinctly enough from
  # web/admin's (Next.js) that a name-pattern group reaches the same
  # separation the three-directory design was going for." That is false for
  # every package BOTH apps declare, and it shipped a real hazard: #928
  # arrived titled "web-and-admin-dependencies" while bumping `react` inside
  # `apps/mobile` from 19.2.3 to 19.2.8. Expo SDK 57 pins React at 19.2.3, so
  # it failed `check-expo-compat` — the check that exists because of the
  # 2026-08-09 dyld symbol-not-found abort that killed every installed build
  # before any JS ran.
  #
  # The deeper point, and the reason NO grouping change can fix it:
  # **Dependabot groups a DEPENDENCY, not a (dependency, directory) pair.**
  # One npm entry over one pnpm workspace means a `react` update is a SINGLE
  # update that rewrites every package.json declaring react. Mobile's react
  # and web's react are not two updates that could be sorted into two groups;
  # they are one update. Reordering patterns, adding `exclude-patterns`, or
  # moving `react` into `mobile-dependencies` all just relabel that one PR.
  #
  # So the shared, framework-pinned packages are `ignore`d outright below.
  # Package names that belong to exactly ONE app are still separable, and
  # grouping is the right tool for those — hence `@clerk/clerk-expo` moving
  # to the mobile group (matched first; a dependency joins the FIRST group
  # whose patterns match, so definition order is load-bearing here).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # FIRST, deliberately: a dependency joins the first group it matches, so
      # `@clerk/clerk-expo` must be claimed here before `@clerk/*` below sees
      # it. It is a mobile-only package name, so grouping genuinely separates
      # it — unlike react/react-dom, which both apps declare.
      mobile-dependencies:
        patterns:
          - "expo*"
          - "@expo/*"
          - "react-native*"
          - "@react-native*"
          - "@clerk/clerk-expo"
        update-types: ["minor", "patch"]
      web-and-admin-dependencies:
        patterns:
          - "next"
          - "@clerk/*"
          - "tailwindcss"
          - "@tailwindcss/*"
        # Redundant with `mobile-dependencies` being matched first, and kept
        # anyway: it states the intent locally, so reordering the groups
        # cannot silently drag the Expo Clerk package back in here.
        exclude-patterns:
          - "@clerk/clerk-expo"
        update-types: ["minor", "patch"]
      dev-tooling:
        patterns:
          - "eslint*"
          - "@types/*"
          - "typescript"
          - "vitest"
          - "@testing-library/*"
          - "@redocly/*"
        update-types: ["minor", "patch"]
    # H21 (#1005). React is pinned by a FRAMEWORK on both surfaces — Expo SDK
    # 57 pins `apps/mobile` at 19.2.3, Next pins web/admin — and Dependabot
    # cannot bump one without the other (see the long note above). Between
    # "mobile silently drifts off the Expo pin" and "web React is bumped by
    # hand alongside `next`", only the second is safe: the first is the
    # launch-abort class `check-expo-compat` exists to catch.
    #
    # `apps/mobile`'s React moves via `pnpm --dir apps/mobile exec expo
    # install --fix`, never here. `apps/web`/`apps/admin` React moves with
    # their `next` bump, which still arrives in `web-and-admin-dependencies`.
    #
    # Deliberately NOT solved with a `directories:` split, which is the
    # obvious alternative and is unverifiable before it ships: Dependabot
    # reads this file only from the DEFAULT branch, so a split cannot be
    # tested on a PR. If member directories did not resolve against the one
    # root `pnpm-lock.yaml`, npm updates would simply STOP — silently, with
    # no failing check anywhere, which is this repo's own "absence is not
    # evidence" trap aimed at supply-chain hygiene. A weekly red PR is a much
    # better failure than an updater that quietly stopped.
    ignore:
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
    labels: ["dependencies"]

  # --- .github/workflows/ (Actions used by CI, including the ones this
  #     ticket adds: dependency-review, codeql-action, trivy-action) --------
  # Also not one of the literal "four" — added because it is the mechanism
  # that keeps the OTHER additions in this PR (dependency-review-action,
  # codeql-action, trivy-action) from going stale themselves, which is
  # directly in scope for a ticket about supply-chain hygiene. `directory`
  # is always "/" for this ecosystem — GitHub only reads workflows from
  # `.github/workflows/`, wherever the repo root is.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "area: ci"]
