name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: formspan
          POSTGRES_PASSWORD: formspan_test
          POSTGRES_DB: formspan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formspan"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://formspan:formspan_test@localhost:5432/formspan_test?sslmode=disable
      TEST_DATABASE_URL: postgres://formspan:formspan_test@localhost:5432/formspan_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Run migrations
        run: go run ./cmd/migrate up

      - name: Test
        run: go test ./...

      - name: Build Docker image
        run: docker build -f Dockerfile -t formspan-api:ci .

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint OpenAPI spec
        run: pnpm run lint:openapi

      - name: Lint
        run: pnpm run lint:web

      - name: Typecheck
        run: pnpm run typecheck:web

      - name: Build
        run: pnpm run build:web
