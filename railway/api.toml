# Railway service config for `api`. In the Railway dashboard, point this
# service's "Config as code" path at railway/api.toml and set its root
# directory to backend/ (the Dockerfile's COPY paths are relative to that
# directory, not the repo root — keeps the build context to just the Go
# module instead of the whole monorepo).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/bin/api"
# Runs once per deploy, before the new container starts. Only this service
# runs migrations — never worker/admin-api — to avoid concurrent-migration
# conflicts (see docs/architecture/deployment.md).
#
# `seed` follows `migrate` and applies version-controlled reference content
# (the exercise catalog). It must be here rather than left as a local-only
# step: migration 000004 creates an empty `exercises` table, and without a
# seed step the deployed API would serve `{"exercises": []}` forever — a
# valid 200 that no healthcheck or error would ever surface. Idempotent, so
# running it on every deploy is the intended usage, not a workaround.
# A single token on purpose.
#
# The previous value was "/app/bin/migrate up && /app/bin/seed", and seed
# never ran. What is actually *observed*: migrate printed "migrate: up: done"
# and exited 0, and seed produced no output at all. That pins the mechanism,
# because cmd/migrate rejects anything but exactly one argument
# (`len(os.Args) != 2` -> log.Fatal). Had it been handed `&&` and the seed
# path as extra argv it would have died on a usage error and failed the
# deploy loudly. It didn't — so Railway *discarded* everything from `&&`
# onward while parsing, rather than passing it through.
#
# What remains unobserved is the rest of Railway's tokenisation, including
# how it treats quotes — which is exactly why this is one token. A single
# token is parsed identically under every model, so the fix depends on none
# of it. The chain lives in /app/bin/predeploy (see backend/Dockerfile).
preDeployCommand = "/app/bin/predeploy"
healthcheckPath = "/v1/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
