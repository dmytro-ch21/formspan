<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Android adaptive foreground. Transparent, and the mark is 458px because the
       guaranteed-visible region is a 66dp CIRCLE (radius 312.9px on this canvas),
       not a square. Sizing to a square safe zone is the trap: the tick's longest
       arm ends exactly at its own bounding box's top-right corner, so the corner
       that overhangs a circular mask is the fullest point on the shape, not an
       empty one. At 560px that tip sat 376px out and a circle mask amputated it;
       458 lands it at ~307px, inside the circle with a few px of margin so an
       antialiased edge is not resting on the guarantee.
       Mark geometry is the real logo from logos/source/vola-mark-color.svg,
       content box 4645x4185 at (1911,2141), placed at 458px wide and centred. -->
  <g transform="translate(94.57 94.57) scale(0.09860065)">
    <path fill="#D0E950" d="M1911 3801l1625 1128 3020 -2788 -2933 4185 -1712 -2525z"/>
    <path fill="#9CC740" d="M3008 5418l401 -577 -1498 -1040 1097 1617z"/>
    <path fill="#71912F" d="M3536 4929l-528 489 367 -600 161 111z"/>
  </g>
</svg>
