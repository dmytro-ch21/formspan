# Railway service config for `admin`. Root directory should be the repo root
# (this is a pnpm workspace; `admin` can't build standalone without the root
# lockfile), with Railway auto-detecting Node via Nixpacks.
[build]
builder = "NIXPACKS"
# Same two Nixpacks pins as web — see railway/web.toml for the detail.
# `NIXPACKS_INSTALL_CMD` is required on this service too, for the corepack
# incompatibility; the root package.json's `engines.node` handles the Node
# version.
#
# F31/#804: same `npx --yes pnpm@11.17.0 ...` reasoning as railway/web.toml —
# see that file's comment for the full detail on why a bare `pnpm` here gets
# shadowed by Nixpacks' own nix-provisioned pnpm-9_x.
buildCommand = "npx --yes pnpm@11.17.0 install --frozen-lockfile && npx --yes pnpm@11.17.0 run build:admin"

[deploy]
startCommand = "pnpm --filter admin start"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
