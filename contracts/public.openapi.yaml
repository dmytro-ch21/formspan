openapi: 3.0.3
info:
  title: VOLA Public API
  version: "1.0.0"
  description: >
    Public API for the VOLA mobile and web clients. See
    docs/architecture/api-conventions.md for the conventions this spec
    follows (versioning, error shape, auth, status codes).


    Two behaviours are applied by response middleware and so are not
    per-operation choices, even though OpenAPI can only express them
    per-operation. Every GET returns a strong `ETag` and honours
    `If-None-Match` with a `304` — both are documented on each GET below.
    Every such response also carries `Cache-Control: private, no-cache` —
    "revalidate before reuse", which is the contract the `ETag` describes.
    A route that opts out sends `Cache-Control: no-store` and no validator
    (`/healthz` does, so a liveness probe is never answered `304`).


    And any response over ~1 KB is gzipped when the client sends
    `Accept-Encoding: gzip`; the `ETag` is computed from the *uncompressed*
    body, so it does not change with the encoding a client asks for.
servers:
  - url: http://localhost:8080/v1
    description: Local development

security:
  - ClerkBearerAuth: []

components:
  securitySchemes:
    ClerkBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk-issued session token, verified server-side via Clerk's JWKS.

  schemas:
    BjjRank:
      type: object
      required: [belt, stripes, degree]
      properties:
        belt:
          type: string
          enum: [white, blue, purple, brown, black]
          description: >
            Adult IBJJF belts only. Kids and coral/red belts are not yet
            represented; the column has no CHECK constraint so adding them is
            a code change rather than a migration.
        stripes: { type: integer, minimum: 0, maximum: 4 }
        degree:
          type: integer
          minimum: 0
          maximum: 6
          description: >
            Black-belt degrees. 0 on every other belt, and only accepted as
            non-zero on black.

    BjjPromotionInput:
      allOf:
        - $ref: "#/components/schemas/BjjRank"
        - type: object
          properties:
            promoted_on:
              type: string
              format: date
              nullable: true
              description: >
                Nullable on purpose. Plenty of athletes do not remember when
                they were promoted, and refusing the promotion to protect the
                date would lose the fact. An undated promotion still
                establishes rank; it just cannot contribute to time-at-belt.
            academy:
              type: string
              description: Free text, per promotion. Not a shared entity.
            instructor: { type: string }
            note: { type: string }

    BjjPromotion:
      allOf:
        - $ref: "#/components/schemas/BjjPromotionInput"
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id:
              type: string
              description: >
                Server-minted, unlike session and workout ids. Those are
                client-generated so an offline push can retry idempotently;
                a promotion has no offline outbox behind it.
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    BjjStanding:
      type: object
      required: [promotions]
      properties:
        current:
          allOf:
            - $ref: "#/components/schemas/BjjRank"
          type: object
          nullable: true
          description: >
            The highest recorded rank, or null when nothing is recorded.
            Derived, never stored.
        time_at_current_days:
          type: integer
          nullable: true
          description: >
            Days since the promotion that set the current rank. Null when that
            promotion has no date — "unknown" and "today" are different
            answers, so this is not 0.
        promotions:
          type: array
          items: { $ref: "#/components/schemas/BjjPromotion" }

    BjjSessionTag:
      type: object
      required: [category, event]
      description: >
        One piece of evidence from a session. Never a self-assessment —
        "attempted twice from closed guard, hit once" is a fact that stays
        true; a 1-5 rating is a number with no provenance that goes stale.
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        category:
          type: string
          enum: [submission, sweep, pass, escape, takedown, control]
          description: >
            Drawn from the technique library's own category vocabulary, and
            limited to the ones with a genuine symmetric opposite — you can
            hit a sweep or be swept; "transition" has no other side.
        event:
          type: string
          enum: [drilled, attempted, scored, conceded]
          description: >
            The outcome direction. `drilled → attempted → scored` is the
            technique funnel, whose drop-offs are the actionable numbers;
            `conceded` is the symmetric half and answers "where do I keep
            getting stuck", which a success-only schema never could.
        position:
          type: string
          description: >
            Position family ("Half Guard", "Mount"), matching the library's
            own filter granularity. Empty is a normal fast-path outcome, not
            an error.
        technique_id:
          type: string
          nullable: true
          description: >
            The specific technique when the athlete named one. Null is
            ordinary — "got swept from half guard" is real evidence and must
            not require naming the sweep.
        count:
          type: integer
          minimum: 1
          default: 1
          description: >
            Reflection is recalled in counts. Three armbars is one tag with
            count 3, not three tags.

    BjjSessionDetail:
      type: object
      required: [session_id, kind, tags]
      description: >
        The BJJ half of a session. The session itself is an ordinary
        `sessions` row created through POST /v1/sessions — this carries only
        what a mat session has and a barbell session does not, exactly as
        PUT /v1/sessions/{id}/sets carries what a strength session has.
      properties:
        session_id: { type: string, readOnly: true }
        kind:
          type: string
          enum: [class, drilling, positional, rolling]
          description: >
            Different training rather than different intensities of the same
            training: an hour of drilling and an hour of hard rounds cost the
            body different amounts and produce different evidence.
        gi:
          type: boolean
          nullable: true
          description: Null means "didn't say", which is not the same as no-gi.
        rounds:
          type: integer
          nullable: true
          minimum: 1
        round_minutes:
          type: integer
          nullable: true
          minimum: 1
        session_rpe:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          description: >
            The internal-load half of sRPE x duration — the mechanism that
            puts a round of rolling and a set of squats in the same unit.
        academy: { type: string }
        note: { type: string }
        body_note:
          type: string
          description: Body/injury flag, feeding the recommendation safety floors.
        tags:
          type: array
          items: { $ref: "#/components/schemas/BjjSessionTag" }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_input
                - unauthorized
                - forbidden
                - not_found
                - already_exists
                - internal
            message:
              type: string

    Healthz:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: api

    Me:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          example: user_3H8rAWz7wri5uEKGajnj4pLqWXz

    Sex:
      type: string
      nullable: true
      enum: [male, female]

    Profile:
      type: object
      required:
        - user_id
        - display_name
        - date_of_birth
        - sex
        - unit_system
        - track_effort
        - created_at
        - updated_at
      properties:
        user_id:
          type: string
        display_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex:
          $ref: "#/components/schemas/Sex"
        unit_system:
          type: string
          enum: [metric, imperial]
          description: >
            Display units only. Training data is stored in kilograms and
            metres regardless, so changing this can never alter a recorded
            number — only how it's shown and entered. Storing converted
            values would make every historical row ambiguous, and would break
            the progression rule, which compares weights across sessions.
        track_effort:
          type: boolean
          description: >
            Whether the clients collect RIR and RPE. On by default — the
            progression rule is built on them, and silently withholding its
            only input would make the app look broken rather than simple.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProfileCreate:
      type: object
      properties:
        display_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex:
          $ref: "#/components/schemas/Sex"

    ProfileUpdate:
      type: object
      description: Partial update — omitted fields are left unchanged.
      properties:
        display_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex:
          $ref: "#/components/schemas/Sex"
        unit_system:
          type: string
          enum: [metric, imperial]
          description: >
            Display units only. Training data is stored in kilograms and
            metres regardless, so changing this can never alter a recorded
            number — only how it's shown and entered. Storing converted
            values would make every historical row ambiguous, and would break
            the progression rule, which compares weights across sessions.
        track_effort:
          type: boolean
          description: >
            Whether the clients collect RIR and RPE. On by default — the
            progression rule is built on them, and silently withholding its
            only input would make the app look broken rather than simple.

    Flag:
      type: object
      description: >
        A server-controlled, global on/off switch — distinct from
        profile's per-user module toggles. Read-only for now; toggled
        via direct SQL until there's a write endpoint.
      required: [key, enabled, description, updated_at]
      properties:
        key:
          type: string
          example: new_recommendation_engine
        enabled:
          type: boolean
        description:
          type: string
        updated_at:
          type: string
          format: date-time

    ModuleList:
      type: object
      required: [modules]
      properties:
        modules:
          type: array
          items:
            $ref: "#/components/schemas/Module"

    Module:
      type: object
      required: [key, label, is_sport, default_on, enabled, capabilities]
      properties:
        key:
          type: string
          description: Stable identifier. Also the `sport` value when `is_sport` is true.
          example: bjj
        label:
          type: string
          description: >
            Display name. Carries the acronym — deriving it by capitalising the
            key yields "Bjj", which is why every client previously grew its own
            special case for exactly one value.
          example: BJJ
        is_sport:
          type: boolean
          description: >
            Whether this discipline can appear as a `sport` on an exercise,
            workout or session. False for nutrition, which is a module with no
            catalog, no session and no row — a toggle only.
        default_on:
          type: boolean
          description: What a user gets before expressing any preference.
        enabled:
          type: boolean
          description: This caller's setting, falling back to `default_on`.
        capabilities:
          $ref: "#/components/schemas/ModuleCapabilities"

    ModuleCapabilities:
      type: object
      required: [catalog, record_kinds]
      description: >
        What a discipline supports. Separate from `enabled` on purpose: "is BJJ
        on?" and "does BJJ have 1RM records?" are different questions, and
        collapsing them gives a BJJ-only athlete a Records screen whose record
        kinds are all lift- or run-shaped.


        These do NOT decide whether a metric is shown. Clients choose
        volume-vs-time from the data present, so an athlete who spent a month on
        the mat sees time rather than a flat zero volume line even with strength
        enabled.
      properties:
        catalog:
          type: string
          description: Content kind the Library shows — `exercises`, `techniques`, or empty.
          example: techniques
        facets:
          type: array
          nullable: true
          items:
            type: string
          description: Extra filter axes beyond the catalog's own. BJJ has `position` and `belt`.
        has_goals:
          type: boolean
          description: Gates the powerlifting/hypertrophy/endurance picker. Strength only.
        has_progression:
          type: boolean
          description: Gates the double-progression UI.
        record_kinds:
          type: array
          items:
            type: string
          description: >
            Personal-best kinds that mean anything here. Empty for BJJ — a
            discipline with none should not be offered a Records screen.

    FlagList:
      type: object
      required: [flags]
      properties:
        flags:
          type: array
          items:
            $ref: "#/components/schemas/Flag"

    Technique:
      type: object
      description: >
        One entry in the BJJ technique library. Deliberately not an Exercise:
        a technique isn't measured (you never log "3 sets of armbar"), and it
        lives in a graph — it comes from a position and is answered by
        counters. Reference content, identical for every user.
      required:
        [id, name, aliases, category, position, position_detail, gi_no_gi,
         typical_belt, description, when_to_use, setup_from,
         common_next_moves, common_counters, video_reference, source_notes,
         ibjjf_ruleset_id, created_at, updated_at]
      properties:
        id: { type: string, example: armbar-from-closed-guard }
        name: { type: string }
        aliases:
          type: array
          items: { type: string }
        category:
          type: string
          description: >
            Submission, Sweep, Pass, Escape, Takedown, Control/Pin, Transition,
            Guard Retention, Other. The colloquial label — what a coach says out
            loud. See `function` for the queryable axis.
          example: Submission
        function:
          type: string
          enum: [advance, reverse, escape, control, finish]
          description: >
            What the technique DOES, independent of where it happens. The five
            verbs of the taxonomy: advance (takedowns, passes, back takes),
            reverse (sweeps), escape (pin escapes, submission defence, guard
            retention), control (pins, rides, grip and frame systems), finish
            (submissions).

            Use this rather than `category` to ask "every way to X from here".
            `category` is colloquial and fuses two axes — "Takedown" means
            advance-at-standing and "Pass" means advance-at-guard-top — so
            "every way to advance" spans three categories while this is one
            value.

            ABSENT on a handful of movement fundamentals (breakfalls, grappling
            stance) which are library content rather than techniques and have no
            verb. Treat missing as "not applicable", not as an error.
          example: finish
        position:
          type: string
          description: Where it happens.
          example: Guard - Bottom
        position_detail: { type: string }
        gi_no_gi:
          type: string
          enum: [Both, "Gi Only", "No-Gi Only"]
        typical_belt:
          type: string
          example: White
          description: >
            The belt this is commonly taught from — an observation, NOT a
            recommendation and NOT a rule. It sits beside IBJJF legality and
            the two answer different questions: you may drill a technique long
            before you are allowed to compete it. Present it subordinate to
            `ibjjf`, never as a gate.
        description:
          type: string
          description: The mechanics — how the technique is performed.
        when_to_use:
          type: string
          description: >
            The decision — when the mechanics apply, and what has to be true
            first. Distinct from `description` on purpose; merging them
            produces a paragraph that answers neither question well.
        to_position:
          type: string
          description: >
            Where the technique LEAVES you. Closes the half of the graph
            `position` and `function` cannot express — where it starts and
            what it does, but not where it ends.


            SPARSE ON PURPOSE, and absent far more often than present. It is
            authored rather than derived: name parsing reaches 42% (mostly
            submissions, whose destination is the end of the exchange), and
            inverting `setup_from` infers a real position change for only 22
            of 466 — that edge links control-to-attack WITHIN a position.
            Populated where the destination is both knowable and useful
            (passes, sweeps, back takes, takedowns).


            ABSENT means NOT RECORDED, never "goes nowhere". A technique that
            genuinely leaves you where you started carries its own `position`
            value here, so "stays put" is a recorded fact rather than an
            absence. Do not infer a self-loop from a missing key.
          example: Side Control - Top
        setup_from:
          type: array
          description: >
            Graph edge — positions or techniques this is set up from. About 80%
            of entries name a real technique in the library.
          items: { type: string }
        common_next_moves:
          type: array
          description: >
            Graph edge — what commonly follows. Only ~29% of entries name a
            technique in the library; the rest is prose like "establish grips
            or inside ties". A client may link the ones that resolve but MUST
            render the others as plain text — a dead link is worse than text.
          items: { type: string }
        common_counters:
          type: array
          description: >
            Graph edge — what answers this technique. Only ~6% resolve to a
            library entry; treat as prose.
          items: { type: string }
        video_reference:
          type: string
          description: >
            Empty for every technique in the current library. Render nothing
            when blank rather than an empty section implying a missing video.
        source_notes: { type: string }
        ibjjf_ruleset_id:
          type: string
          description: >
            References an IBJJFRuleset. Empty if the technique predates the
            rulesets; treat that as "legality unknown", not "legal".
        ibjjf:
          allOf: [{ $ref: "#/components/schemas/IBJJFRuleset" }]
          description: >
            Resolved on the detail endpoint only, so a technique detail is one
            request. Absent from list responses — fetch /techniques/rulesets
            once and resolve `ibjjf_ruleset_id` locally.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TechniqueSummary:
      type: object
      description: >
        The list row. Carries what is needed to render, filter and search the
        library and nothing else — the prose fields are most of the library's
        bytes and a list needs none of them. Full rows would ship ~485 KB to
        draw a scrolling list of 466; this is ~175 KB — re-measured
        2026-08-03, having been written as ~70 KB and drifted 2.3x as the
        library grew and gained `function`, `setup_from` and `to_position`.
        Gzipped it is ~17 KB, though the API does not currently compress.

        Aliases ARE included: the client searches locally, and "kesa gatame"
        must find "Scarf Hold".


        `setup_from` is included too, which is what makes the library a
        GRAPH rather than 466 isolated entries. It names what a technique
        comes from; a client inverts it once over this list to get the far
        more useful direction — what FOLLOWS from here. Detail-only, that
        would cost one request per technique to walk a single hop. It adds
        ~21 KB (+14%).
      required:
        [id, name, aliases, category, position, position_detail, gi_no_gi,
         typical_belt, ibjjf_ruleset_id, setup_from]
      properties:
        id: { type: string }
        name: { type: string }
        aliases:
          type: array
          items: { type: string }
        category: { type: string }
        function:
          type: string
          enum: [advance, reverse, escape, control, finish]
          description: >
            What the technique DOES, independent of where it happens. The five
            verbs of the taxonomy: advance (takedowns, passes, back takes),
            reverse (sweeps), escape (pin escapes, submission defence, guard
            retention), control (pins, rides, grip and frame systems), finish
            (submissions).

            Use this rather than `category` to ask "every way to X from here".
            `category` is colloquial and fuses two axes — "Takedown" means
            advance-at-standing and "Pass" means advance-at-guard-top — so
            "every way to advance" spans three categories while this is one
            value.

            ABSENT on a handful of movement fundamentals (breakfalls, grappling
            stance) which are library content rather than techniques and have no
            verb. Treat missing as "not applicable", not as an error.
          example: finish
        position: { type: string }
        position_detail: { type: string }
        gi_no_gi:
          type: string
          enum: [Both, "Gi Only", "No-Gi Only"]
        typical_belt: { type: string }
        source:
          type: string
          enum: [seed, admin]
          description: >
            Where this technique came from: `seed` means the deploy owns it (the
            embedded JSON rewrites it on every release), `admin` means it was
            authored in the console and the database owns it. Read-only — the
            server sets it, so a client cannot promote its own row out of the
            deploy's reach or demote a seeded one into it.


            **Present only on `/admin/*` responses.** It is ABSENT from
            `GET /techniques/{techniqueID}`, which does not select the column —
            so do not derive ownership from it there. Its absence means "this
            endpoint does not report provenance", never "not admin-authored".
            Use membership of `GET /admin/techniques` instead.
        ibjjf_ruleset_id: { type: string }
        to_position:
          type: string
          description: >
            Where the technique LEAVES you. Declared here as well as on the
            detail schema because the LIST is where a graph consumer reads it
            — walking the transition map from 466 detail calls is not a thing
            anyone would do.


            SPARSE ON PURPOSE (149 of 466) and hand-authored: name parsing
            reaches 42%, and inverting `setup_from` infers a real position
            change for only 22 of 466, because that edge links
            control-to-attack WITHIN a position.


            ABSENT means NOT RECORDED, never "goes nowhere" — a technique
            that genuinely leaves you where you started carries its own
            `position` value here. Do not infer a self-loop from a missing
            key.
          example: Side Control - Top
        setup_from:
          type: array
          items: { type: string }
          description: >
            What this technique is commonly set up from, by NAME (matching
            `name` or an entry in `aliases`), not by id. ~80% resolve to a
            library entry; the rest name a concept the library has no node
            for yet — "Underhook", "Crossface" — so a client should count
            what it could not resolve rather than silently dropping it.
          example: [De La Riva Guard Control]

    IBJJFRuleset:
      type: object
      description: >
        One IBJJF competition ruling, shared by every technique it applies to.
        25 of these cover all 466 techniques — normalised because `age_scope`
        has one distinct value library-wide and the most common `notes` string
        repeats 359 times at ~200 characters.
      required:
        [id, age_scope, rule_class, gi_allowed_belts, gi_note,
         no_gi_allowed_belts, no_gi_note, is_restricted, notes, sources]
      properties:
        id: { type: string, example: brown-black-only-adult }
        age_scope: { type: string, example: "Adult (18+) — Gi and No-Gi separated" }
        rule_class: { type: string, example: "Brown/Black only — Adult" }
        gi_allowed_belts:
          type: array
          description: >
            EMPTY MEANS "this division does not apply" — a no-gi-only technique
            has no gi belts — NOT "allowed at no belt". The reason is in
            `gi_note`.
          items: { type: string }
        gi_note: { type: string, example: "N/A — no-gi-specific" }
        no_gi_allowed_belts:
          type: array
          items: { type: string }
        no_gi_note: { type: string }
        is_restricted:
          type: boolean
          description: >
            Whether this is a GENUINE restriction rather than the shape of
            IBJJF's divisions. Adult no-gi has no white belt division, so a
            no-gi list of "Blue, Purple, Brown, Black" is the BASELINE.
            Do NOT re-derive this by comparing belt lists — that marks ~130
            ordinary techniques (pummelling, sit-outs) as restricted when the
            true number is 20. Use this field; it is computed at import.
        notes: { type: string }
        sources:
          type: array
          items: { type: string, format: uri }

    TechniqueList:
      type: object
      required: [techniques]
      properties:
        techniques:
          type: array
          items: { $ref: "#/components/schemas/TechniqueSummary" }

    IBJJFRulesetList:
      type: object
      required: [rulesets]
      properties:
        rulesets:
          type: array
          items: { $ref: "#/components/schemas/IBJJFRuleset" }

    Position:
      type: object
      description: >
        One entry in the BJJ position glossary — the nodes of the graph the
        technique library forms. Techniques are the edges between positions;
        this is what the positions themselves are, written for someone who has
        never trained. Ten curated entries, read-only, the same for every user.
      required:
        [
          id,
          name,
          aliases,
          family,
          detail_includes,
          detail_excludes,
          order_index,
          description,
          priorities,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          description: Hand-authored and stable, unlike an IBJJFRuleset's content-addressed id.
          example: closed-guard
        name: { type: string, example: Closed Guard }
        aliases:
          type: array
          items: { type: string }
          description: What else the position is called — "full guard", "closed".
        family:
          type: string
          description: >
            The join key back to the library, and the FIRST of two filters —
            never sufficient alone. Match it against a TechniqueSummary's
            `position` BY PREFIX (`position === family ||
            position.startsWith(family + " - ")`) — the technique rows carry
            side-qualified values like "Guard - Bottom", so an equality check
            finds almost nothing. NOTE "Back", not "Back Control", for
            back_control.

            Then narrow with `detail_includes`/`detail_excludes`. Stopping here
            puts closed and open guard on the same 161 techniques.
          enum:
            [
              Standing,
              Guard,
              Half Guard,
              Side Control,
              Mount,
              North-South,
              Back,
              Turtle,
              Leg Entanglement,
            ]
          example: Guard
        detail_includes:
          type: array
          items: { type: string }
          description: >
            Narrows the family match using a TechniqueSummary's
            `position_detail`. When non-empty, ONLY techniques whose
            `position_detail` appears here belong to this position. Empty on
            most entries, meaning "the whole family".
          example: [Closed Guard, Rubber Guard]
        detail_excludes:
          type: array
          items: { type: string }
          description: >
            The opposite operation, applied after `detail_includes`: techniques
            whose `position_detail` appears here are dropped.

            A client MUST apply BOTH, or the two guard entries collapse back
            into one list. `family` cannot separate closed guard from open
            guard — the technique rows record only "Guard - Bottom" — so
            without these, Open Guard lists closed-guard techniques directly
            beneath a description saying the ankles are not locked. Closed
            guard whitelists the two details it wants; open guard blacklists
            the same two, because "everything else in the family" spans 26
            values that grow with the library.
          example: [Closed Guard, Rubber Guard]
        order_index:
          type: integer
          description: >
            Pedagogical reading order, not alphabetical — standing, then the
            guards, then the pins roughly as a beginner meets them. Already
            applied by the list endpoint; re-sorting by name undoes the point.
          example: 10
        description:
          type: string
          description: What the position is, and how you end up in it.
        priorities:
          type: string
          description: >
            What each player is trying to do while there. Covers both sides of
            the position in one field, separated by a blank line — every
            position is someone's good news and someone else's problem.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PositionList:
      type: object
      required: [positions]
      properties:
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }

    WorkoutItem:
      type: object
      description: >
        One entry in a workout's ordered contents. Every target is optional
        because which ones apply is decided by the exercise's own load_type —
        a plank has no reps, a run has no weight. `position` is assigned from
        array order on write, never trusted from the client.
      required: [exercise_id, position, notes]
      properties:
        exercise_id: { type: string, example: barbell-bench-press }
        position: { type: integer }
        target_sets: { type: integer, nullable: true }
        target_reps: { type: integer, nullable: true }
        target_weight_kg: { type: number, nullable: true }
        target_seconds: { type: integer, nullable: true }
        target_distance_m: { type: integer, nullable: true }
        notes: { type: string }

    Workout:
      type: object
      description: >
        A workout *template* — deliberately distinct from a logged session
        (see Activity). Keeping them separate is what preserves the gap
        between planned and actual, which is the adherence signal.
        One discipline per workout; mixing is not supported.
      required:
        [id, owner_user_id, name, sport, goal, notes, visibility, items,
         created_at, updated_at]
      properties:
        id:
          type: string
          description: Client-generated, so a workout can be created offline and synced idempotently.
        owner_user_id:
          type: string
          nullable: true
          description: Null for a VOLA-authored official template.
        name: { type: string, example: Push Day A }
        sport:
          type: string
          enum: [strength, running, bjj]
        goal:
          type: string
          nullable: true
          enum: [general, powerlifting, hypertrophy, endurance]
          description: >
            The training style, which is *not* a sport — powerlifting,
            hypertrophy and endurance are all done with the same barbell
            squat, so this belongs to the workout, not the exercise. Only
            meaningful for strength.
        notes: { type: string }
        visibility:
          type: string
          enum: [private, public]
          description: Defaults to private — sharing is always a deliberate act.
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkoutItem" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkoutList:
      type: object
      required: [workouts]
      properties:
        workouts:
          type: array
          items: { $ref: "#/components/schemas/Workout" }

    Plan:
      type: object
      description: >
        One intended session on one day — the third leg of a distinction the
        API already half-drew. A Workout is the template (what a session looks
        like), a Session is what happened, and a Plan is what was *meant* to
        happen and when. A template has no date and a session is the actual,
        so neither can say what Tuesday was for.

        A plan is an intention and is never reconciled against a session:
        a planned day can be trained twice, ignored, or trained with something
        else, and all three are ordinary. Adherence is therefore a query over
        both resources, computed when asked, not a status on this one.
      required: [id, user_id, day, sport, workout_id, notes, created_at, updated_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        day:
          type: string
          format: date
          description: >
            A calendar date, `YYYY-MM-DD` — never a timestamp. "Tuesday's
            session" is a claim about the athlete's own calendar, and an
            instant would slide the plan across a day boundary the moment they
            travel. A timestamp here is rejected rather than truncated.
          example: "2026-08-04"
        sport:
          type: string
          enum: [strength, running, bjj]
        workout_id:
          type: string
          nullable: true
          description: >
            The template this day is planned around, or null when the day is
            planned as a bare discipline — "Tuesday is BJJ" is a complete plan,
            and mat sessions have no template at all.

            Becomes null if the template is later deleted: the plan degrades to
            its discipline rather than disappearing.
        notes: { type: string, maxLength: 500 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PlanList:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items: { $ref: "#/components/schemas/Plan" }

    LoggedSet:
      type: object
      description: >
        One set actually performed. Every measure is optional because which
        ones apply is decided by the exercise's own load_type — a plank has
        no reps, a run has no weight.

        `rir` and `rpe` are two views of the same quantity (RPE 8 is roughly
        2 RIR). Both are stored because lifters are fluent in one or the
        other and rarely both, and asking for a conversion just after a hard
        set is the wrong moment for arithmetic.
      required: [exercise_id, position, set_type, notes]
      properties:
        exercise_id: { type: string, example: barbell-back-squat }
        position:
          type: integer
          description: Assigned from array order on write, never trusted from the client.
        set_type:
          type: string
          enum: [warmup, working, backoff, drop, amrap, failure]
          description: >
            Warm-ups count toward neither working sets nor tonnage — counting
            them would make a light day look like a hard one.
        reps: { type: integer, nullable: true }
        weight_kg: { type: number, nullable: true }
        seconds: { type: integer, nullable: true }
        distance_m: { type: integer, nullable: true }
        rir:
          type: integer
          nullable: true
          minimum: 0
          maximum: 20
          description: Reps in reserve. 0 is meaningful — nothing left in the tank.
        rpe:
          type: number
          nullable: true
          minimum: 1
          maximum: 10
          description: Rate of perceived exertion, half steps allowed.
        notes: { type: string }
        completed:
          type: boolean
          description: >
            Whether this set was actually performed. The volume summary
            counts only completed sets, so a session's numbers climb as it
            is performed rather than starting at the plan's total. A set
            built from a template starts false.

            Defaults to `false` when omitted on write — a set the client
            didn't explicitly mark done is treated as planned, not
            performed.

    Session:
      type: object
      description: >
        A training session that actually happened, and the sets in it —
        deliberately distinct from a Workout, which is the *plan*. Keeping
        them apart is what preserves the gap between prescribed and actual.
        A session may follow a template or be entirely freeform.
      required:
        [id, user_id, workout_id, sport, name, started_at, ended_at, notes,
         sets, created_at, updated_at]
      properties:
        id:
          type: string
          description: Client-generated, so a session survives an offline start and syncs idempotently.
        user_id: { type: string }
        workout_id:
          type: string
          nullable: true
          description: >
            The template followed, if any. Null for a freeform session, and
            also null once a followed template is deleted — history outlives
            the plan it came from.
        sport: { type: string, enum: [strength, running, bjj] }
        name: { type: string, example: Push Day A }
        started_at:
          type: string
          format: date-time
          description: Client-supplied — logging can happen well after the fact.
        ended_at:
          type: string
          format: date-time
          nullable: true
          description: Null while the session is still in progress.
        notes: { type: string }
        sets:
          type: array
          items: { $ref: "#/components/schemas/LoggedSet" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RepRange:
      type: object
      description: The rep window a lift progresses inside before load moves.
      required: [low, high]
      properties:
        low: { type: integer, example: 6 }
        high: { type: integer, example: 10 }

    Suggestion:
      type: object
      description: >
        What to load today for one exercise, and for how many reps, derived
        from what the caller actually did in their last few sessions.

        The scheme is **double progression, autoregulated by reported effort**:
        work inside a rep range, adding reps at the same load until every
        working set reaches the top of the range with reserve to spare, then
        add load and drop back to the bottom. Effort gates both halves — a set
        taken to failure is not evidence of room — and three sessions stuck at
        one load triggers a deload rather than another repeat.

        Deterministic and explainable by construction — no model, no hidden
        weighting. This is why RIR and RPE are collected at all: weight alone
        can't say whether a set was easy, since a lifter who grinds out five
        reps and one who leaves three in reserve log the identical row. When
        no effort was recorded the honest answer is "repeat it", not a guess.

        The evidence travels with every suggestion, including when the answer
        is to repeat — a number the athlete can check beats one they have to
        trust. Note that `last_weight_kg`, `last_reps`, `last_rir` and
        `last_rpe` all describe the **same single top set** and are only
        meaningful together; `last_min_reps` / `last_max_reps` are the spread
        across every working set and belong to the session, not to any one set.

        Branch on `code`; `reason` is prose and is not part of the contract.
      required: [exercise_id, code, reason, target_weight_kg, target_reps,
                 rep_range, last_performed_at, last_weight_kg, last_reps,
                 last_rir, last_rpe, last_min_reps, last_max_reps,
                 working_sets, sessions_at_load, hit_target_effort,
                 estimated_1rm_kg, best_1rm_kg]
      properties:
        exercise_id: { type: string, example: back-squat }
        target_weight_kg:
          type: number
          nullable: true
          description: >
            What to load. Equal to `last_weight_kg` whenever the answer is to
            repeat, about 10% below it on a deload; null when there's nothing
            to say (no history, or not measured in weight).


            Always lands on a loadable 1.25 kg step, and an increase is capped
            at 5% of what's on the bar — a fixed 2.5 kg is 1.8% of a 140 kg
            bench and 6% of a 40 kg one, and the second is a stall waiting to
            happen.
        target_reps:
          type: integer
          nullable: true
          description: >
            How many reps to aim for, always inside `rep_range` — clamped even
            on the "repeat what you did" codes, since the range belongs to the
            *current* workout's goal while the history may come from a block
            with a different one.


            This moves in most sessions and the load doesn't, so a client that
            fills in the weight but ignores this drops the half of the
            recommendation that actually changes.
        rep_range:
          allOf:
            - $ref: "#/components/schemas/RepRange"
          description: >
            Set by the `goal` query parameter, not by the exercise: the same
            squat is a 3-rep lift in a powerlifting block and a 10-rep lift in
            a hypertrophy one.
        last_performed_at:
          type: string
          format: date-time
          nullable: true
          description: When the most recent session containing it started.
        last_weight_kg: { type: number, nullable: true, description: The top set's load. }
        last_reps: { type: integer, nullable: true, description: The top set's own reps. }
        last_rir: { type: integer, nullable: true, description: The top set's reserve. }
        last_rpe: { type: number, nullable: true, description: The top set's RPE. }
        last_min_reps:
          type: integer
          nullable: true
          description: >
            Fewest reps on any working set last session. **This is what gates
            progression**, not the best set: a session opening at 10 and ending
            at 6 is not a 10-rep session, and adding load to it is how a lifter
            stalls inside a fortnight.
        last_max_reps: { type: integer, nullable: true }
        working_sets:
          type: integer
          description: How many working sets last session, warm-ups excluded.
        sessions_at_load:
          type: integer
          description: >
            Consecutive recent sessions at this same weight **without gaining a
            rep** — the stall signal.


            Both halves matter. Climbing 6 → 7 → 8 at a fixed weight *is* the
            first phase of double progression, so counting those as a stall
            would deload a lifter who is doing exactly what they were told.
            And consecutive, because a load returned to after a deload is a
            fresh attempt rather than a continuing plateau.
        hit_target_effort:
          type: boolean
          description: Every working set finished at or above 2 reps in reserve.
        estimated_1rm_kg:
          type: number
          nullable: true
          description: >
            One-rep max implied by the last top set, **with effort folded in**
            — a set of 5 with 3 RIR is evidence of an 8-rep max, not a 5-rep
            one, and ignoring that would read stopping short as a strength
            loss. Brzycki (`w × 36/(37−r)`), which returns the weight itself at
            one rep rather than inflating a true single.


            Null when the set can't support an estimate: no weight recorded,
            or more than 12 effective reps, past which every rep-max curve is
            fiction.
        best_1rm_kg:
          type: number
          nullable: true
          description: >
            The highest estimate anywhere in the caller's history for this
            exercise, so the current one reads as progress rather than as a
            bare number. Not simply the heaviest set — 5×100 estimates above a
            110 single.
        code:
          type: string
          enum: [add_reps, add_load, deload, hold, no_history, not_applicable,
                 repeat_hard, repeat_unknown_effort, repeat_stale]
          description: >
            The four progression outcomes:


            `add_reps` — reserve left but the range isn't finished, so the
            reps move and the load holds. Where most sessions land.
            `add_load` — every working set reached the top of the range with
            reserve to spare, the one condition that earns weight. Adds the
            movement's increment (5 kg squat/hinge/olympic, 2.5 kg
            push/pull/lunge, 1.25 kg isolation), capped at 5% of the bar.
            `deload` — three consecutive sessions at one load with no rep
            gained. Drops ~10% and rebuilds from the top of the range. Climbing
            reps at a fixed weight is not a stall; it is the scheme working.
            `hold` — at least one set was close to the limit; repeat until
            every set is comfortable.


            And the cases where the rule declines to advance:


            `repeat_hard` — a set at or near failure, meaning fewer than one
            rep left in reserve (RIR 0, or RPE above 9). Not evidence of room,
            whatever the reps said.
            `repeat_unknown_effort` — no RIR or RPE recorded anywhere in the
            session, so nothing says it was easy.
            `repeat_stale` — last performed over 28 days ago, which outranks
            effort: an old easy set is evidence about someone who has since
            detrained. `no_history` — never logged. `not_applicable` — not
            measured in weight.
        reason:
          type: string
          description: Human-readable, cites the evidence. Never pattern-match on it.
          example: Every set hit 10 with something left. Add weight and drop back to 6 reps.

    SuggestionList:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/Suggestion" }

    Volume:
      type: object
      description: >
        The derived working-volume summary, computed server-side so both
        clients report identical numbers rather than each rolling their own
        arithmetic. Warm-up sets are excluded.
      required: [working_sets, total_reps, tonnage_kg, hardest_rpe, exercise_ids]
      properties:
        working_sets: { type: integer }
        total_reps: { type: integer }
        tonnage_kg:
          type: number
          description: Sum of reps × weight over completed, non-warm-up sets.
        hardest_rpe:
          type: number
          description: >
            Highest RPE over the *completed working* sets; 0 when none
            carried one. A hard warm-up single shouldn't set the session's
            headline difficulty, and neither should a set that was planned
            but never performed.
        exercise_ids:
          type: array
          items: { type: string }

    SessionPage:
      type: object
      description: >
        One page of sessions plus the size of the whole matching set. `total`
        is counted with the identical predicate in the same request, so a
        "21-40 of 137" reading can never disagree with the rows beside it.
      required: [sessions, total, limit, offset]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/Session" }
        total:
          type: integer
          description: >
            Sessions matching the filter, ignoring limit/offset. Counted with
            the same predicate in the same request. Not the same snapshot —
            a session written between the count and the page can move it by
            one.
        limit: { type: integer }
        offset: { type: integer }

    PinnedExercises:
      type: object
      required: [exercise_ids]
      properties:
        exercise_ids:
          type: array
          maxItems: 12
          items: { type: string }
          description: Ordered by the athlete's own preference, not alphabetically.

    PersonalRecord:
      type: object
      description: >
        One best, and the set that produced it. The evidence travels with the
        number for the same reason it does on a suggestion — a record you can
        open and check beats one you have to trust, and it makes a wrong
        record self-diagnosing.
      required:
        [kind, value, reps, weight_kg, seconds, distance_m, rir, rpe,
         achieved_at, session_id, is_recent]
      properties:
        kind:
          type: string
          enum: [heaviest_weight, estimated_1rm, most_reps, longest_time, furthest_distance]
        value:
          type: number
          description: >
            In storage units — kilograms, reps, seconds or metres, according
            to `kind` — so a client formats it the way it formats everything
            else.
        reps: { type: integer, nullable: true }
        weight_kg: { type: number, nullable: true }
        seconds: { type: integer, nullable: true }
        distance_m: { type: integer, nullable: true }
        rir: { type: integer, nullable: true }
        rpe: { type: number, nullable: true }
        achieved_at: { type: string, format: date-time }
        session_id: { type: string }
        is_recent:
          type: boolean
          description: Set within the last two weeks — the only reason to treat one record differently from another.

    ExerciseRecords:
      type: object
      required: [exercise_id, records]
      properties:
        exercise_id: { type: string }
        records:
          type: array
          description: >
            Only the kinds this exercise can hold and has. An absent kind means
            no such record yet, not zero. Heaviest weight and estimated 1RM
            frequently cite *different sets* — 5×100 estimates above a 110
            single — which is why both are returned.
          items: { $ref: "#/components/schemas/PersonalRecord" }

    HistoryTotals:
      type: object
      description: A period's training in one line.
      required:
        [sessions, working_sets, total_reps, tonnage_kg, duration_seconds,
         exercises, active_days]
      properties:
        sessions: { type: integer }
        working_sets: { type: integer }
        total_reps: { type: integer }
        tonnage_kg:
          type: number
          description: Sum of reps × weight over completed, non-warm-up sets.
        duration_seconds:
          type: integer
          description: Total logged duration. Sessions still in progress contribute 0.
        exercises:
          type: integer
          description: >
            Distinct exercises across the whole period — benching on Monday
            and Thursday is one. Cannot be derived by summing the days.
        active_days:
          type: integer
          description: >
            Days on which anything was logged, in the caller's `tz`. Two
            sessions in one day is one active day.

    HistoryDay:
      type: object
      description: One calendar day's training, in the caller's timezone.
      required:
        [date, sessions, working_sets, total_reps, tonnage_kg,
         duration_seconds, sports]
      properties:
        date: { type: string, format: date }
        sessions: { type: integer }
        working_sets: { type: integer }
        total_reps: { type: integer }
        tonnage_kg: { type: number }
        duration_seconds: { type: integer }
        sports:
          type: array
          items: { type: string, enum: [strength, running, bjj] }

    SportCount:
      type: object
      required: [sport, sessions]
      properties:
        sport: { type: string, enum: [strength, running, bjj] }
        sessions: { type: integer }

    History:
      type: object
      required: [from, to, totals, previous, days, sports]
      properties:
        from: { type: string, format: date }
        to:
          type: string
          format: date
          description: The last day included, echoing what was asked for.
        totals: { $ref: "#/components/schemas/HistoryTotals" }
        previous:
          allOf:
            - $ref: "#/components/schemas/HistoryTotals"
            - description: >
                The window of the same length immediately before this one, so
                a total can be read as up or down. Honours the sport filter.
        days:
          type: array
          description: >
            Only days that had training, ascending. Days with none are absent
            rather than zero-filled — the range already says they exist.
          items: { $ref: "#/components/schemas/HistoryDay" }
        sports:
          type: array
          description: Every sport in range, ignoring the sport filter, so the chips show what switching would find.
          items: { $ref: "#/components/schemas/SportCount" }

    SessionWithVolume:
      type: object
      required: [session, volume]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        volume: { $ref: "#/components/schemas/Volume" }

    Media:
      type: object
      description: >
        One asset belonging to a catalog entry. `storage_key` is the path
        within the bucket; `url` is assembled from it at read time using the
        API's MEDIA_BASE_URL, so the bucket and CDN hostname are never stored
        per row. `url` is empty when no media origin is configured (local dev
        and CI) — clients should treat an empty url as "no image available"
        rather than attempting to load it.

        `url` carries a `?v=` cache-busting parameter derived from when the
        asset last changed. **Treat `url` as opaque and use it verbatim** —
        do not reconstruct it from `storage_key`, and do not strip the query
        string. Storage keys are stable, so a rebuilt URL would be the same
        string forever and every cache in the path would keep serving a
        replaced image indefinitely. A changed `url` for an unchanged
        `storage_key` means the picture was replaced and should be refetched.
      required: [kind, storage_key, url, content_type, width, height, position, is_default]
      properties:
        kind:
          type: string
          enum: [thumbnail, demo, start, end, demo_video]
        storage_key:
          type: string
          example: exercises/barbell-back-squat/start.webp
        url:
          type: string
          description: >
            Opaque, versioned URL. Use as-is; the `?v=` is what makes a
            replaced image reach clients rather than being masked by caches.
          example: https://media.vola.app/exercises/barbell-back-squat/start.webp?v=1785499200
        content_type:
          type: string
          example: image/webp
        width:
          type: integer
          nullable: true
          description: Intrinsic width, so a client can reserve layout space before load.
        height:
          type: integer
          nullable: true
        position:
          type: integer
        is_default:
          type: boolean
          description: >
            True when this is a sport-level placeholder standing in for an
            exercise with no photo of its own. Exposed rather than hidden so
            clients can present it differently and so catalog media coverage
            stays measurable — a placeholder indistinguishable from real
            content makes the gap invisible and therefore permanent.

    Exercise:
      type: object
      description: >
        One entry in the global exercise catalog. Operator-authored
        reference content shared by every user — there is no owner, so
        nothing here is user-scoped. Seeded from version-controlled JSON
        rather than written through the API.
      required:
        [id, name, sport, movement_pattern, primary_muscles,
         secondary_muscles, equipment, load_type, is_unilateral,
         instructions, media, movement_pattern_detail, created_at, updated_at]
      properties:
        id:
          type: string
          description: Stable slug, safe to store as a reference.
          example: barbell-back-squat
        name:
          type: string
          example: Barbell Back Squat
        sport:
          type: string
          example: strength
        movement_pattern:
          type: string
          description: >
            What the movement is structurally. This is the level the
            cross-sport rules reason at — "heavy hinge and squat work
            yesterday" is what makes hard sparring today worth flagging.
            Muscle lists alone are too granular to write rules against.
          example: squat
        movement_pattern_detail:
          type: string
          description: >
            The source catalog's own, far more granular pattern (75 distinct
            values, e.g. "Scapular Elevation"). For display and filtering;
            rules read `movement_pattern`.
          example: Hip Adduction
        source:
          type: string
          enum: [seed, admin]
          description: >
            Where this exercise came from: `seed` means the deploy owns it (the
            embedded JSON rewrites it on every release), `admin` means it was
            authored in the console and the database owns it. Read-only — the
            server sets it.


            **Present only on `/admin/*` responses.** Absent from `GET
            /exercises` and `GET /exercises/{exerciseID}`, which do not select
            the column — so its absence means "this endpoint does not report
            provenance", never "not admin-authored". Use membership of
            `GET /admin/exercises` instead.
        primary_muscles:
          type: array
          items: { type: string }
          example: [quadriceps, glutes]
        secondary_muscles:
          type: array
          items: { type: string }
        equipment:
          type: array
          items: { type: string }
          example: [barbell, squat_rack]
        load_type:
          type: string
          enum: [weight_reps, reps, time, distance, distance_time]
          description: >
            Which measurements a session of this exercise records, and
            therefore which inputs a client should render. Carried as data
            so logging stays one screen instead of a form per exercise
            type, and so adding an exercise never needs an app release.
        is_unilateral:
          type: boolean
          description: >
            Affects volume maths — 8 reps per side is not 8 reps.
        instructions:
          type: string
        media:
          type: array
          description: >
            Ordered semantically (thumbnail, demo, start, end, demo_video) rather
            than alphabetically, so a start/end pair reads in movement order.
            Always an array, never null. An exercise with no media of its own
            gets its sport's placeholder, flagged `is_default`.
          items:
            $ref: "#/components/schemas/Media"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ExerciseList:
      type: object
      required: [exercises]
      properties:
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"

    Activity:
      type: object
      description: >
        One entry in the unified activity envelope — id is client-generated
        (offline logging + idempotent sync), request_id/trace_id are
        stamped server-side from the request that created it, for
        correlating against the backend's structured logs.
      required:
        - id
        - user_id
        - kind
        - occurred_at
        - notes
        - request_id
        - trace_id
        - created_at
      properties:
        id:
          type: string
          example: a1b2c3d4e5f6a7b8
        user_id:
          type: string
        kind:
          type: string
          example: bjj_session
        occurred_at:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
          description: Freeform, kind-specific fields.
        request_id:
          type: string
        trace_id:
          type: string
        created_at:
          type: string
          format: date-time

    ActivityCreate:
      type: object
      required: [id, kind, occurred_at]
      properties:
        id:
          type: string
          description: Client-generated — the idempotency key for offline sync retries.
        kind:
          type: string
          example: bjj_session
        occurred_at:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        details:
          type: object
          nullable: true

    ActivityList:
      type: object
      required: [activities]
      properties:
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"

    AdminUserSummary:
      type: object
      description: >
        One account, as the admin console lists it. The counts come from
        `sessions` and `session_sets` — rows that already exist, so no new
        write path was added to produce them. Note "active" here means logged
        training, not opened the app: no read leaves a trace, so a daily
        browser who never logs is indistinguishable from a churned account.
        The previous `activity_count`/`last_activity_at` were removed: they
        read a table with no writer and were 0/null for every user.
      required:
        [user_id, display_name, session_count, last_session_at, set_count, modules, created_at]
      properties:
        user_id:
          type: string
        display_name:
          type: string
          nullable: true
          description: Null when the user never completed onboarding.
        session_count:
          type: integer
          description: Sessions logged, all time.
        last_session_at:
          type: string
          format: date-time
          nullable: true
        set_count:
          type: integer
          description: >
            Sets logged, all time — distinguishes someone who started two
            sessions and abandoned them from someone who trained twice.
        modules:
          type: array
          description: >
            Labels of the disciplines this user has enabled, resolved through
            the discipline registry: a user with no stored row for a module
            reads as that module's default rather than as "off".
          items:
            type: string
        created_at:
          type: string
          format: date-time
          nullable: true

    AdminSessionSummary:
      type: object
      description: >
        One session as the admin console shows it — deliberately without its
        sets. The question is "what did they do and did it finish", which
        needs a count, not every weight.
      required: [id, sport, name, started_at, ended_at, set_count]
      properties:
        id:
          type: string
        sport:
          type: string
        name:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
          description: Null means still in progress.
        set_count:
          type: integer

    AdminUserDetail:
      type: object
      required: [user, recent_sessions]
      properties:
        user:
          $ref: "#/components/schemas/AdminUserSummary"
        recent_sessions:
          type: array
          description: Newest first, capped at 50.
          items:
            $ref: "#/components/schemas/AdminSessionSummary"

    ClientErrorReport:
      type: object
      description: >
        A problem the client hit. The user is attributed from the token, so
        there is deliberately no user field here — a client that could name the
        user could file noise against someone else, and could not be trusted
        when reporting its own trouble.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [client_error, sync_blocked]
          description: >
            `sync_blocked` is the serious one: the client has given up pushing
            something, so the training exists only on that device.
        message:
          type: string
          maxLength: 500
          description: Human context. Bounded so the endpoint can't be used as storage.
        error_code:
          type: string
          maxLength: 64
        details:
          type: object
          additionalProperties: true
          description: >
            Shape-specific context — the entity id and attempt count for a
            blocked sync, say. Free-form so a new kind of report doesn't need a
            new column.

    HealthEvent:
      type: object
      description: >
        One notable thing that happened. Request fields are null for
        client-reported events, which have no request — absence rather than a
        zero that would read as a measurement.
      required: [id, occurred_at, source, kind]
      properties:
        id:
          type: integer
          format: int64
        occurred_at:
          type: string
          format: date-time
        source:
          type: string
          enum: [api, client]
          description: >
            `api` is the server observing itself — measured. `client` is an app
            reporting what the server cannot see — claimed. Kept distinct
            because their trustworthiness differs.
        kind:
          type: string
          enum: [server_error, slow_request, client_error, sync_blocked]
        user_id:
          type: string
          nullable: true
          description: Null for unauthenticated failures, which genuinely have no user.
        method: { type: string, nullable: true }
        path: { type: string, nullable: true }
        status: { type: integer, nullable: true }
        duration_ms: { type: integer, nullable: true }
        error_code: { type: string }
        message: { type: string }
        request_id:
          type: string
          description: Pivot from this row to the full request in the log stream.
        trace_id: { type: string }
        details:
          type: object
          additionalProperties: true
          nullable: true

    HealthSummary:
      type: object
      required: [since, total, by_kind, affected_users, slowest_paths_ms]
      properties:
        since: { type: string, format: date-time }
        total: { type: integer }
        by_kind:
          type: object
          additionalProperties: { type: integer }
        affected_users:
          type: integer
          description: >
            Distinct people, not events. Twenty rows from one athlete on a bad
            connection is a very different morning from twenty athletes hitting
            one broken endpoint, and a raw total cannot tell them apart.
        slowest_paths_ms:
          type: object
          additionalProperties: { type: integer }
          description: Worst observed latency per route, so a slow endpoint is named.

    HealthReport:
      type: object
      required: [summary, events]
      properties:
        summary:
          $ref: "#/components/schemas/HealthSummary"
        events:
          type: array
          items:
            $ref: "#/components/schemas/HealthEvent"

    AdminUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserSummary"

    Proficiency:
      type: object
      description: >
        One technique's accumulated evidence. Deliberately NOT a score — the
        design rules out self-assessment, so this is the facts (drilled twelve
        times, went for it three times, landed twice) and a reader forms the
        judgement.
      required: [technique_id, name, position, category, drilled, attempted, scored, conceded, sessions, last_seen]
      properties:
        technique_id: { type: string, example: americana-mount }
        name: { type: string, description: "From the shared library; falls back to the id.", example: Americana from Mount }
        position: { type: string, example: Mount - Top }
        category: { type: string, example: Submission }
        drilled: { type: integer, description: "Reps practised, not live." }
        attempted:
          type: integer
          description: >
            Went for it live and it did NOT land. Disjoint from `scored`, so
            `attempted + scored` is how often it was tried.
        scored: { type: integer, description: Landed it live. }
        conceded:
          type: integer
          description: >
            This technique done TO the athlete. No client can author one today;
            reported rather than dropped because the API accepts one.
        sessions:
          type: integer
          description: >
            How many separate sessions contributed — the honesty check on every
            count above. Twelve reps in one class is not twelve reps over six
            weeks.
        last_seen: { type: string, format: date-time }

    ProficiencySummary:
      type: object
      description: >
        The headline funnel, folded from the same rows in `techniques` so the
        two cannot disagree. These are COUNTS OF TECHNIQUES, not of reps.
      required: [techniques, drilled, tried_live, landed]
      properties:
        techniques: { type: integer, description: Distinct techniques with any evidence. }
        drilled: { type: integer, description: How many were ever drilled. }
        tried_live: { type: integer, description: How many were ever taken into a live round. }
        landed: { type: integer, description: How many ever worked live. }

    Focus:
      type: object
      description: >
        One technique the athlete is deliberately working on. The list is short
        by design (at most 5) and turns over every few weeks.
      required: [technique_id, name, position, category, started_on]
      properties:
        technique_id: { type: string, example: armbar-from-guard }
        name: { type: string, example: Armbar from Guard }
        position: { type: string, example: Guard - Bottom }
        category: { type: string, example: Submission }
        started_on:
          type: string
          format: date
          description: >
            When this technique JOINED the list. Preserved across re-saves, so
            reordering or adding an entry does not reset it — it is what makes
            "you have been on this five weeks, consider rotating" answerable.

    ExerciseWrite:
      type: object
      description: >
        The admin-writable surface. `id`, `source` and `media` are absent by
        design: the id is derived from the name and permanent, `source` is the
        server's, and media has no upload path — leaving it out is what
        guarantees an edit cannot clear media a deploy added.


        Every field is optional so PATCH can be partial. POST requires `name`,
        and the write is rejected unless `sport`, `movement_pattern` and
        `load_type` end up valid.
      properties:
        name: { type: string, maxLength: 200 }
        sport:
          type: string
          description: Must be a sport in the discipline registry — see GET /modules.
        movement_pattern:
          type: string
          description: Must be one of GET /admin/exercises/vocabularies.
        movement_pattern_detail: { type: string }
        primary_muscles: { type: array, items: { type: string } }
        secondary_muscles: { type: array, items: { type: string } }
        equipment: { type: array, items: { type: string } }
        load_type:
          type: string
          enum: [weight_reps, reps, time, distance, distance_time]
        is_unilateral: { type: boolean }
        instructions: { type: string }

    TechniqueWrite:
      type: object
      description: >
        The admin-writable surface. `id` and `source` are absent on purpose —
        the id is derived from the name at creation and immutable after, and
        the source is the server's.
      required: [name, category, position, gi_no_gi]
      properties:
        name: { type: string, example: São Paulo Pass }
        aliases: { type: array, items: { type: string } }
        category: { type: string, example: Pass }
        position:
          type: string
          description: Must be one of GET /admin/techniques/positions.
          example: Half Guard - Top
        position_detail: { type: string }
        gi_no_gi: { type: string, enum: [Both, Gi Only, No-Gi Only] }
        typical_belt: { type: string }
        description: { type: string }
        setup_from: { type: array, items: { type: string } }
        common_counters: { type: array, items: { type: string } }
        when_to_use: { type: string }
        common_next_moves: { type: array, items: { type: string } }
        video_reference: { type: string }
        source_notes: { type: string }
        ibjjf_ruleset_id: { type: string }
        function:
          type: string
          enum: [advance, reverse, escape, control, finish, ""]
        to_position:
          type: string
          description: Must be one of GET /admin/techniques/positions, or empty.

  headers:
    ETag:
      description: >
        Strong validator for this exact response body (a truncated SHA-256,
        base64url). Send it back as `If-None-Match` on the next request to get
        a 304 instead of the payload. Applied by response middleware, so it is
        present on every 200 from a GET, not just the ones listed here.
      schema: { type: string }
      example: '"9tK3xQwZ2sN4fRvB1cLmYg"'

  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >
        An `ETag` from a previous response. If it still matches, the server
        answers `304 Not Modified` with no body. Accepts a comma-separated
        list and `*`.
      schema: { type: string }

  responses:
    NotModified:
      description: >
        The representation is unchanged since the `ETag` in `If-None-Match`.
        No body, and deliberately no `Content-Length` or `Content-Type`.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"

    BadRequest:
      description: Malformed request body or a value that failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, malformed, or expired bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but the caller isn't an admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource doesn't exist for this caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The resource already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /healthz:
    get:
      summary: Liveness check
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: >
            The API is up. Deliberately NOT conditional: it sends
            `Cache-Control: no-store` and no `ETag`, so a liveness probe is
            always answered with a fresh 200 rather than a 304.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"

  /me:
    get:
      summary: Return the authenticated caller's verified identity
      operationId: getMe
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The verified caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /profile:
    get:
      summary: Get the authenticated caller's profile
      operationId: getProfile
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Create the authenticated caller's profile (onboarding)
      operationId: createProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileCreate"
      responses:
        "201":
          description: The newly created profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    patch:
      summary: Partially update the authenticated caller's profile
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /profile/exercise-units:
    get:
      summary: The caller's per-exercise unit overrides
      operationId: listExerciseUnits
      description: >
        A map of exercise id to unit system. A **missing key means "use the
        profile default"** — there is deliberately no third state, so
        clearing an override removes the key rather than storing a sentinel.

        Exists because a lifter who thinks in kilograms still faces a leg
        press marked in pounds, and converting in your head at the moment
        you're recording a number is exactly what this avoids.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Overrides only; exercises using the default are absent.
          content:
            application/json:
              schema:
                type: object
                required: [exercise_units]
                properties:
                  exercise_units:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [metric, imperial]
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profile/exercise-units/{exerciseID}:
    put:
      summary: Set or clear one exercise's unit override
      operationId: setExerciseUnit
      parameters:
        - name: exerciseID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                unit_system:
                  type: string
                  nullable: true
                  enum: [metric, imperial]
                  description: Null clears the override, falling back to the profile default.
      responses:
        "204": { description: "Stored, or cleared." }
        "400":
          description: An unknown exercise, or a unit outside metric/imperial.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /modules:
    get:
      summary: The discipline registry, merged with the caller's own toggles
      description: >
        Every discipline VOLA supports, in display order, each with its
        capabilities and whether this user has it enabled. The catalog and the
        user's choices arrive together because a client needs both before it can
        render navigation — splitting them would mean two requests before the
        nav bar can draw.


        A discipline the caller has never toggled reports its registry default,
        so adding a discipline requires no backfill.
      operationId: listModules
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: All modules with the caller's enablement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleList"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Toggle one or more modules for the caller
      description: >
        A sparse map — `{"bjj": false}` toggles one module and leaves the rest
        untouched, so two clients editing different toggles cannot clobber each
        other. Returns the full merged set, since the caller's next render needs
        all of it anyway.
      operationId: setModules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: boolean
              minProperties: 1
              example:
                bjj: false
      responses:
        "200":
          description: The full module set after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /flags:
    get:
      summary: List all server-controlled feature flags
      operationId: listFeatureFlags
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: All feature flags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagList"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /activities:
    get:
      summary: List the authenticated caller's own activities
      operationId: listActivities
      description: >
        The caller's own activity log, newest first. Capped at 500; there is no
        pagination, so older entries are simply not returned.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The caller's activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: >
        Create an activity for the authenticated caller. Idempotent on
        `id` — retrying a sync with the same id returns the original row,
        not an error.
      operationId: createActivity
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityCreate"
      responses:
        "200":
          description: The created (or, on a retried id, the original) activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exercises:
    get:
      summary: List the global exercise catalog
      operationId: listExercises
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: sport
          in: query
          required: false
          schema: { type: string }
          description: Exact-match filter, e.g. `strength` or `running`.
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match on the name.
      responses:
        "200":
          description: Matching catalog entries, ordered by sport then name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseList"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exercises/{exerciseID}:
    get:
      summary: Get one catalog entry by its slug
      operationId: getExercise
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: exerciseID
          in: path
          required: true
          schema: { type: string }
          example: barbell-back-squat
      responses:
        "200":
          description: The exercise.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /techniques:
    get:
      summary: List the BJJ technique library
      operationId: listTechniques
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: position
          in: query
          schema: { type: string }
          example: Guard - Bottom
        - name: category
          in: query
          schema: { type: string }
          example: Submission
        - name: gi
          in: query
          schema: { type: string, enum: [Both, "Gi Only", "No-Gi Only"] }
          description: >
            Asking for gi or no-gi also returns techniques marked `Both` —
            a filter that excluded them would hide most of the library.
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
          description: Case-insensitive substring of the name **or any alias** — "scarf hold" finds "Kesa-Gatame Escape".
      responses:
        "200":
          description: Matching techniques, ordered by position then category then name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechniqueList" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: Invalid filter value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /techniques/rulesets:
    get:
      summary: List IBJJF rulesets
      operationId: listIBJJFRulesets
      description: >
        All 25 IBJJF rulesets. Fetch once and cache: this is what turns a
        TechniqueSummary's `ibjjf_ruleset_id` into a legality badge without a
        request per row. They change with the IBJJF rulebook, not with the
        library.
      tags: [Techniques]
      security: [{ ClerkBearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Every ruleset, ordered by id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IBJJFRulesetList" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /techniques/positions:
    get:
      summary: List the BJJ position glossary
      operationId: listPositions
      description: >
        All ten positions, already in pedagogical reading order. Fetch once and
        cache, like the rulesets. There is no per-position technique endpoint on
        purpose: a client that already holds the library resolves "techniques
        from here" locally, by prefix-matching each summary's `position`
        against this entry's `family` AND then applying
        `detail_includes`/`detail_excludes` against its `position_detail`.
        Both steps are required — see those fields.
      tags: [Techniques]
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Every position, ordered by order_index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PositionList" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /techniques/positions/{positionID}:
    get:
      summary: Get one position
      operationId: getPosition
      tags: [Techniques]
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: positionID
          in: path
          required: true
          schema: { type: string }
          example: closed-guard
      responses:
        "200":
          description: The position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Position" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /techniques/{techniqueID}:
    get:
      summary: Get one technique
      operationId: getTechnique
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: techniqueID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The technique.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Technique" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bjj/standing:
    get:
      summary: The athlete's BJJ rank and promotion history
      description: >
        `current` is DERIVED from `promotions`, not stored — the highest rank
        recorded, which is well defined even when promotions were entered out
        of order or without dates. It is null when nothing has been recorded:
        a new account has no belt, and defaulting to white would put a rank on
        someone who has never trained.
      operationId: getBjjStanding
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Rank and history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BjjStanding" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bjj/promotions:
    post:
      summary: Record a promotion
      operationId: createBjjPromotion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BjjPromotionInput" }
      responses:
        "201":
          description: The recorded promotion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BjjPromotion" }
        "400":
          description: >
            Unknown belt, stripes outside 0-4, degree outside 0-6, a degree on
            a belt other than black, or `promoted_on` not in `YYYY-MM-DD`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bjj/promotions/{promotionID}:
    parameters:
      - name: promotionID
        in: path
        required: true
        schema: { type: string }
    patch:
      summary: Correct a recorded promotion
      description: >
        Replaces every field. A promotion belonging to another account
        answers 404, not 403 — the same non-disclosure the admin routes use.
      operationId: updateBjjPromotion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BjjPromotionInput" }
      responses:
        "200":
          description: The updated promotion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BjjPromotion" }
        "400":
          description: >
            Invalid rank, or `promoted_on` not in `YYYY-MM-DD`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Remove a recorded promotion
      description: >
        Removing the promotion that set the current rank lowers it, because
        rank is derived from what remains.
      operationId: deleteBjjPromotion
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bjj/focus:
    get:
      summary: The techniques the athlete is currently working on
      operationId: getBjjFocus
      description: >
        Read by the reflection wizard, which surfaces these as one-tap chips in
        the live grid so recording an outcome for one IS the grid row rather
        than a second row beside it. That is why the list exists: it collapses
        two capture paths for the same event into one.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The caller's focus list, in their own order.
          content:
            application/json:
              schema:
                type: object
                required: [focus]
                properties:
                  focus:
                    type: array
                    items:
                      $ref: "#/components/schemas/Focus"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: Replace the focus list
      operationId: setBjjFocus
      description: >
        Replaces the list wholesale, so a retry after a partial failure
        converges rather than duplicating. Array order is the athlete's own
        ranking and is preserved. An empty array clears the list, which is a
        normal thing to do at the end of a block. At most 5 techniques, no
        repeats; every id must exist in the library.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [technique_ids]
              properties:
                technique_ids:
                  type: array
                  maxItems: 5
                  items: { type: string }
                  example: [armbar-from-guard, triangle-from-guard]
      responses:
        "200":
          description: >
            The stored list, read back — it carries the library names and each
            entry's started_on, which the client cannot know.
          content:
            application/json:
              schema:
                type: object
                required: [focus]
                properties:
                  focus:
                    type: array
                    items:
                      $ref: "#/components/schemas/Focus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /bjj/proficiency:
    get:
      summary: The technique funnel across every session
      operationId: getBjjProficiency
      description: >
        Per-technique evidence for the caller, most-evidence first. Reads only
        technique-tagged rows: the same real event can also be recorded as an
        untagged category row by the live grid, so a technique-tagged row is
        the specific record and an untagged one the catch-all — summing both
        would count one submission twice. Capped at 500 with no pagination,
        which cannot bind in practice (the library holds 466 techniques).
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The caller's funnel, and the headline folded from it.
          content:
            application/json:
              schema:
                type: object
                required: [techniques, summary]
                properties:
                  techniques:
                    type: array
                    items:
                      $ref: "#/components/schemas/Proficiency"
                  summary:
                    $ref: "#/components/schemas/ProficiencySummary"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /bjj/sessions/{sessionID}:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Store the reflection for a BJJ session
      description: >
        Upserts the BJJ detail for a session the caller has already created
        through POST /v1/sessions, and replaces its tag set wholesale.


        PUT and upsert rather than POST and insert, for the same reason
        replacing a session's sets is a PUT: the client holds the desired
        state and re-sends it, so a retry after a failed push converges
        instead of duplicating. That is what lets the mobile outbox treat a
        BJJ reflection exactly like a set list.


        Ownership is checked explicitly against the session before anything
        is written. Three cases answer identically with 404 and are
        deliberately indistinguishable: no such session, a session belonging
        to somebody else, and a session that is not a BJJ session. Telling
        them apart would confirm which session ids are real.
      operationId: putBjjSessionDetail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BjjSessionDetail" }
      responses:
        "200":
          description: The stored detail.
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail: { $ref: "#/components/schemas/BjjSessionDetail" }
        "400":
          description: >
            Unknown kind, tag category or tag event; session_rpe outside
            1-10; rounds, round_minutes or a tag count below 1; or a
            technique_id naming no technique.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: Read a BJJ session's reflection
      operationId: getBjjSessionDetail
      description: >
        404 when the session has no BJJ detail — which includes a session of
        another sport, and a BJJ session logged as the three-tap floor before
        any reflection was added.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The stored detail.
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail: { $ref: "#/components/schemas/BjjSessionDetail" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workouts:
    get:
      summary: List workouts visible to the caller
      operationId: listWorkouts
      description: >
        Workouts visible to the caller — their own plus every public one, which
        is why this list grows with the platform rather than with one athlete's
        history. The caller's own workouts sort first, then by name; capped at
        500, with no pagination, so the cap falls on other people's content.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: scope
          in: query
          schema: { type: string, enum: [mine, shared] }
          description: Omit for both. `shared` excludes the caller's own.
        - name: sport
          in: query
          schema: { type: string, enum: [strength, running, bjj] }
        - name: goal
          in: query
          schema: { type: string, enum: [general, powerlifting, hypertrophy, endurance] }
      responses:
        "200":
          description: Workouts the caller owns and/or public ones, each with items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutList" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a workout
      operationId: createWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, sport]
              properties:
                id:
                  type: string
                  description: >
                    Client-generated, and required. Offline clients create a
                    workout locally and push it later, so the id must be the
                    one already stored on the device — a session created from
                    that workout references it, and a server-minted id would
                    orphan it.

                name: { type: string }
                sport: { type: string, enum: [strength, running, bjj] }
                goal: { type: string, enum: [general, powerlifting, hypertrophy, endurance] }
                notes: { type: string }
                visibility: { type: string, enum: [private, public] }
                items:
                  type: array
                  items: { $ref: "#/components/schemas/WorkoutItem" }
      responses:
        "200":
          description: >
            The created workout. Idempotent on `id` for the same owner — a
            retry returns the original rather than erroring.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400":
          description: >
            Invalid input — including an item whose exercise belongs to a
            different sport than the workout, since mixing is not supported.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The id already belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /plans:
    get:
      summary: List planned sessions in a day range
      operationId: listPlans
      description: >
        `from` and `to` are required and inclusive at both ends — the callers
        ask in whole weeks and whole months, and both name their last day.

        Deliberately not defaulted to "this week": a default would make the
        commonest client bug (forgetting the range) look like an empty calendar
        rather than a mistake, and the two are indistinguishable in the
        response.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          example: "2026-08-03"
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          example: "2026-08-09"
      responses:
        "200":
          description: The caller's plans, oldest first; insertion order within a day.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanList" }
        "400":
          description: >
            A missing or malformed date, a backwards range, or a range longer
            than 400 days counted inclusively (so 1 Jan to 4 Feb the following
            year is the widest accepted). A `day` carrying a time — a full
            RFC3339 timestamp — is rejected here rather than truncated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Plan a session on a day
      operationId: createPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, day, sport]
              properties:
                id:
                  type: string
                  description: >
                    Client-generated, and required — the same contract sessions
                    and activities use. It is what makes an offline plan
                    syncable idempotently: the device fixes the id before the
                    server sees the row, so a retried push conflicts rather
                    than creating a second plan.
                day: { type: string, format: date, example: "2026-08-04" }
                sport: { type: string, enum: [strength, running, bjj] }
                workout_id:
                  type: string
                  nullable: true
                  description: Omit or null to plan the day as a bare discipline.
                notes: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The created plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400":
          description: >
            A missing id, a `day` that is not a calendar date, an unknown
            sport, an unknown workout, or notes over 500 characters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The id is already in use.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /plans/{planID}:
    patch:
      summary: Change a planned session
      operationId: updatePlan
      description: >
        Partial — omitted fields are left alone. `workout_id` is three-state:
        omit it to leave the template, send an id to set it, and send an
        explicit `null` to clear it so the day becomes a bare discipline.
        Without that distinction, clearing a template would be
        indistinguishable from not mentioning it.
      parameters:
        - name: planID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                day: { type: string, format: date }
                sport: { type: string, enum: [strength, running, bjj] }
                workout_id: { type: string, nullable: true }
                notes: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The updated plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400":
          description: Invalid input.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Remove a planned session
      operationId: deletePlan
      description: >
        Clears the intention only — nothing logged is affected. A plan someone
        else owns is reported as 404 rather than 403: ids are client-generated
        and guessable, so another user's plan must be indistinguishable from
        one that does not exist.
      parameters:
        - name: planID
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workouts/{workoutID}:
    get:
      summary: Get one workout
      operationId: getWorkout
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: workoutID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The workout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Rename a workout (owner only)
      operationId: renameWorkout
      description: >
        Changes the name and nothing else. Its own verb rather than a field on
        PUT /items, because renaming and re-ordering happen at different
        moments — folded together, correcting a typo would mean resending the
        whole item list, and a client that got that list slightly wrong would
        silently rewrite the workout. A blank name is refused rather than
        stored: it renders as a gap in the template list with nothing to
        identify or tap, and every plan pointing at it loses its label too.
      parameters:
        - name: workoutID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: >
                    Counted in CHARACTERS (Unicode code points), not bytes —
                    the domain vocabulary here is Portuguese and Japanese, and
                    a byte cap would refuse a legal name at roughly a third of
                    this limit. Trimmed server-side; empty after trimming is
                    rejected. Says this in `description` rather than a YAML
                    comment because a comment reaches no generator, no SDK and
                    no rendered docs — the sibling session rename already
                    publishes the same facts this way.
                  example: Maestro Push Day
      responses:
        "200":
          description: The renamed workout, items untouched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400":
          description: Missing, blank or over-long name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Visible to you, but not yours to change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a workout (owner only)
      operationId: deleteWorkout
      parameters:
        - name: workoutID
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Visible to you, but not yours to change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workouts/{workoutID}/items:
    put:
      summary: Replace a workout's ordered contents (owner only)
      operationId: replaceWorkoutItems
      description: >
        Sends the whole list — the natural shape for both "add an exercise"
        and "reorder". Positions are reassigned from array order.
      parameters:
        - name: workoutID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/WorkoutItem" }
      responses:
        "200":
          description: The updated workout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400":
          description: Invalid input, including a sport mismatch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Visible to you, but not yours to change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions:
    get:
      summary: List the caller's sessions, newest first
      operationId: listSessions
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: sport
          in: query
          schema: { type: string, enum: [strength, running, bjj] }
        - name: exercise_id
          in: query
          schema: { type: string }
          description: Only sessions containing this exercise.
        - name: from
          in: query
          schema: { type: string, format: date }
          description: >
            Only sessions started on or after this calendar day, resolved in
            `tz`. Lets the history page list exactly the period its totals
            describe.
        - name: to
          in: query
          schema: { type: string, format: date }
          description: Inclusive of the day named — a session at 19:00 on `to` is returned.
        - name: tz
          in: query
          schema: { type: string, default: UTC }
          description: IANA name used to resolve `from`/`to` to instants. Defaults to UTC.
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
          description: >
            Free text matched case-insensitively anywhere in the session's
            name. LIKE wildcards in the term are escaped, so `50%` searches
            for those characters rather than matching everything.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: >
            Rows to skip. Ordering is a total order (`started_at DESC, id`), so
            paging is deterministic against an unchanging set. It is not stable
            across writes: a session added while you page shifts every later
            row down one, so a row can repeat. Use the date filters to pin a
            range if that matters.
      responses:
        "200":
          description: >
            One page of the caller's own sessions, each with its sets, plus how
            many the filter matched in total. Never anyone else's.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionPage" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: Invalid sport, limit, offset, date, timezone or search term.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Start (or record) a session
      operationId: createSession
      description: >
        Sets may be supplied up front — starting from a template pre-fills
        them with the prescribed numbers — or left empty and added later via
        the sets endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, sport]
              properties:
                id: { type: string }
                workout_id:
                  type: string
                  nullable: true
                  description: >
                    Must be a workout the caller can see (their own, public,
                    or a VOLA template) and of the same sport.
                sport: { type: string, enum: [strength, running, bjj] }
                name: { type: string }
                started_at:
                  type: string
                  format: date-time
                  description: Defaults to now when omitted.
                ended_at: { type: string, format: date-time, nullable: true }
                notes: { type: string }
                sets:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/LoggedSet" }
      responses:
        "200":
          description: >
            The created session and its volume summary. Idempotent on `id`
            for the same user — a retry returns the original rather than
            erroring, which is what makes an offline start safe to resend.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithVolume" }
        "400":
          description: >
            Invalid input — including a set whose exercise belongs to a
            different sport than the session, an out-of-range RIR/RPE, more
            than 500 sets, or a `workout_id` that doesn't exist or isn't
            visible to the caller. Those last two are deliberately the same
            error: workout IDs are client-generated and often guessable, so
            distinguishing them would let a caller enumerate other people's
            private templates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The id already belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /records:
    get:
      summary: Personal records the caller holds
      operationId: listRecords
      description: >
        Derived from the log on every read rather than stored. A kept record
        has to be *retracted* when the set behind it is corrected or its
        session deleted — and a stale one means congratulating someone for a
        lift they never made. Computed, a record is by construction exactly
        what the log says.


        Which kinds an exercise can hold follows from its `load_type`, so a
        plank never reports a weight and a run never reports reps. Warm-ups
        and sets never marked done never count.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: exercise_ids
          in: query
          schema: { type: string }
          description: Comma-separated. Overrides `scope`. At most 100.
        - name: scope
          in: query
          schema: { type: string, enum: [all] }
          description: >
            `all` returns every exercise the caller has actually trained,
            most-used first, capped at 200 — the desk view. Omitted, the API
            answers for their pinned shortlist, falling back to the exercises
            they train most so the view is never empty pending setup.
      responses:
        "200":
          description: The caller's own records only.
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items: { $ref: "#/components/schemas/ExerciseRecords" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: Too many exercise_ids.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /records/pinned:
    get:
      summary: The exercises whose records show on the caller's profile
      operationId: getPinnedExercises
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: In the caller's chosen order. Empty means "no explicit choice".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinnedExercises" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Replace the shortlist
      operationId: setPinnedExercises
      description: >
        Replaces the whole ordered list, like session sets — the client edits
        it as one thing, and reordering is most of the editing people do here.
        An empty list clears it and returns to the most-trained default.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinnedExercises" }
      responses:
        "200":
          description: The stored list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinnedExercises" }
        "400":
          description: More than 12 entries, a repeat, a blank, or an unknown exercise.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sessions/history:
    get:
      summary: Training history rolled up per day, with period totals
      operationId: getSessionHistory
      description: >
        The analytical surface behind the web history page: one entry per
        calendar day that had training, totals for the period, and the same
        totals for the window immediately before it so the numbers read as a
        direction rather than a quantity.


        Aggregated server-side on purpose. The working-set rule (completed,
        non-warm-up) lives in one place, and a client summing a truncated
        listing would quietly report the wrong total once history outgrows
        the page size.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          description: Inclusive of the day named. Range must be five years or less.
        - name: sport
          in: query
          schema: { type: string, enum: [strength, running, bjj] }
          description: >
            Narrows the totals *and* the comparison window, so BJJ is
            measured against BJJ. `sports` is always unfiltered.
        - name: tz
          in: query
          schema: { type: string, default: UTC }
          description: >
            IANA name deciding which calendar day a session belongs to.
            Training at 19:00 in New York is 23:00 UTC, so bucketing in UTC
            would file a Tuesday session under Wednesday.
      responses:
        "200":
          description: The caller's own training only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/History" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: Missing or malformed dates, unknown sport or timezone, or a range over five years.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /sessions/suggestions:
    get:
      summary: What to load today, per exercise, from the caller's own history
      operationId: listSessionSuggestions
      description: >
        One request for a whole workout rather than one per exercise. Each
        answer reads the **working sets of the last few sessions** containing
        that exercise — warm-ups excluded, since progressing off a warm-up
        would recommend a weight nobody worked at.

        Whole sessions rather than a single top set, because the rule gates on
        the weakest working set and on whether a load has repeated across
        sessions; neither question can be answered from one row.

        Scoped to the caller: this endpoint reads training history and returns
        only their own.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: exercise_ids
          in: query
          required: true
          schema: { type: string }
          description: Comma-separated, max 100.
        - name: goal
          in: query
          required: false
          schema:
            type: string
            example: hypertrophy
          description: >
            One of `general`, `powerlifting`, `hypertrophy`, `endurance`.
            Deliberately typed as a plain string rather than an enum, because
            an enum would make a request validator or generated client reject
            exactly the unrecognised values this endpoint promises to accept.

            The goal of the workout being performed, which picks the rep range
            the recommendation is expressed in: powerlifting 3–5, hypertrophy
            6–10, endurance 12–20, general (and anything unrecognised) 5–8.


            Deliberately not validated — an unknown value falls through to the
            general range rather than failing the request, since a goal the
            server doesn't recognise doesn't make the question invalid, it just
            fails to narrow it.
      responses:
        "200":
          description: >
            One entry per requested id, in the order requested. An exercise
            with no history still gets an entry, with `code: no_history`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuggestionList" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: Missing `exercise_ids`, or more than 100 of them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sessions/{sessionID}:
    get:
      summary: Get one session with its volume summary
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The session and its derived volume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithVolume" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            No such session, or it belongs to someone else — deliberately
            indistinguishable, since sessions are never shared and a 403
            would confirm that an id exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      summary: Rename a session
      description: >
        Changes the session's name and nothing else. PATCH rather than PUT
        because the body is one field, not the whole session — a PUT would
        imply that omitting `sets` should empty them.


        The name is the only field a client may change after the fact.
        `sport` decides which screen renders the session, the timestamps are
        what training history counts, and sets have their own replace
        endpoint.


        Not-yours and does-not-exist both answer 404, deliberately
        indistinguishable.
      operationId: renameSession
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: >
                    Counted in CHARACTERS, not bytes — the server uses
                    `utf8.RuneCountInString`, so "kesa gatame" and a Japanese
                    or Portuguese name all get the same 120 the contract
                    publishes.


                    Trimmed server-side. Empty after trimming is rejected — a
                    blank name renders as a gap in the history list with
                    nothing to identify or tap.
                  example: Tuesday no-gi open mat
      responses:
        "200":
          description: The renamed session, with its volume summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithVolume" }
        "400":
          description: >
            Name missing, blank after trimming, longer than 120 characters, a
            malformed body, or a body over 8 KB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such session for this caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Delete a session
      operationId: deleteSession
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{sessionID}/sets:
    put:
      summary: Replace a session's ordered sets
      operationId: replaceSessionSets
      description: >
        Sends the whole list — the natural shape for "log another set" and
        "fix a typo in set 2" alike. Positions are reassigned from array
        order. Clients write through on every edit rather than offering a
        save button, so a session survives the app being killed mid-workout.
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sets]
              properties:
                sets:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/LoggedSet" }
      responses:
        "200":
          description: The updated session and its recomputed volume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithVolume" }
        "400":
          description: Invalid input, including a sport mismatch or an out-of-range RIR/RPE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{sessionID}/finish:
    post:
      summary: Mark a session finished
      operationId: finishSession
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ended_at:
                  type: string
                  format: date-time
                  description: Defaults to now. An empty body is fine.
      responses:
        "200":
          description: The finished session and its final volume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithVolume" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /client-errors:
    post:
      summary: Report a problem the client hit that the server cannot observe
      operationId: reportClientError
      description: >
        For failures the API has no way to see: a push the device has given up
        retrying, a local write that failed. This is the class of problem that
        loses training data silently — the athlete's session sits on their
        phone, every server-side metric looks healthy, and nobody finds out.


        The user is taken from the verified token, never the body. `kind` is
        restricted to `client_error` and `sync_blocked`: a client cannot claim
        `server_error` or `slow_request`, because the value of the health record
        is that an operator can tell what was *measured* from what was
        *claimed*. Returns `202` — the report is accepted, not stored as a
        resource anyone reads back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientErrorReport"
      responses:
        "202":
          description: Report accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/health:
    get:
      summary: Recent operational problems, with a summary (admin-only)
      operationId: adminHealth
      description: >
        Answers "is anything wrong, and for whom?" without reading logs. The
        structured logs carry every request but go to stdout, so they are not
        queryable from the admin console and they expire; only notable events
        are persisted, and this is how they are read back.


        Summary and events come together in one response deliberately: the
        summary alone invites "12 errors" with no way to see them, and the list
        alone makes an operator count.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: hours
          in: query
          description: Window to look back over. Defaults to 24, capped at 720.
          schema:
            type: integer
            minimum: 1
        - name: kind
          in: query
          schema:
            type: string
            enum: [server_error, slow_request, client_error, sync_blocked]
        - name: user_id
          in: query
          description: Narrow to one athlete — "is this person having trouble?"
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Summary and the events behind it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/exercises:
    get:
      summary: List the exercises the console can edit
      operationId: listAuthoredExercises
      description: >
        Every exercise with `source: "admin"` — what the console owns and can
        edit — and deliberately not the whole catalog. `PATCH` refuses a seeded
        row, because the seed JSON owns those and an edit would be reverted by
        the next deploy.


        Unbounded, for the same reason as the technique equivalent: the set
        grows one row at a time, and `cmd/exportcontent` reads the same query.
        A `LIMIT` here would silently truncate the export rather than error.
      responses:
        "200":
          description: >
            The authored exercises, ordered by id. `[]` when nothing has been
            authored yet — an empty array, never null. `media` is always empty
            on this response; it is not part of the write path.
          content:
            application/json:
              schema:
                type: object
                required: [exercises]
                properties:
                  exercises:
                    type: array
                    items:
                      $ref: "#/components/schemas/Exercise"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create an exercise from the admin console
      operationId: createExercise
      description: >
        Authoring the catalog without a deploy. The row is written with
        `source: "admin"`, which the seeder cannot touch — so a release never
        reverts it. `cmd/exportcontent` carries admin-authored content back into
        the seed JSON, which is how it reaches another environment.


        The **id is derived from the name** and is not accepted from the client:
        it becomes a foreign key in workout items and logged sets, so it outlives
        every other field and can never be changed. "Zercher Squat" becomes
        `zercher-squat`.


        **Media cannot be authored here.** It lives in its own table with no
        upload path, so an exercise created this way has none — and, because
        `media` is not part of the request, an edit can never clear media a
        later deploy adds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseWrite"
      responses:
        "200":
          description: The stored exercise, including its generated id.
          content:
            application/json:
              schema:
                type: object
                required: [exercise]
                properties:
                  exercise:
                    $ref: "#/components/schemas/Exercise"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            The derived id is taken. Deliberately not an upsert — the id may
            already be a foreign key in somebody's training record, so rewriting
            the exercise behind it changes what their history says they did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/exercises/vocabularies:
    get:
      summary: The closed sets an exercise write must pick from
      operationId: exerciseVocabularies
      description: >
        Served rather than hardcoded in the client, so the editor's dropdowns
        and the validator cannot disagree. `movement_patterns` is the COARSE
        vocabulary the cross-sport rules are written against — an exercise filed
        outside it renders perfectly and is silently invisible to every rule,
        which is the one failure here that looks identical to success.
      responses:
        "200":
          description: The three vocabularies, each sorted.
          content:
            application/json:
              schema:
                type: object
                required: [sports, movement_patterns, load_types]
                properties:
                  sports:
                    type: array
                    items: { type: string }
                  movement_patterns:
                    type: array
                    items: { type: string }
                  load_types:
                    type: array
                    items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/exercises/{exerciseID}:
    patch:
      summary: Edit a console-authored exercise
      operationId: updateExercise
      description: >
        A PARTIAL update: an omitted field keeps its stored value, and a field
        sent as empty is cleared. The id comes from the path and is never moved,
        because renaming must not orphan the training records pointing at it.


        Refuses a **seeded** exercise with 409 rather than editing it: the seed
        JSON owns those, and a change here would be reverted on the next
        release. Edit `exercises.json` and deploy instead.
      parameters:
        - name: exerciseID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseWrite"
      responses:
        "200":
          description: The stored exercise.
          content:
            application/json:
              schema:
                type: object
                required: [exercise]
                properties:
                  exercise:
                    $ref: "#/components/schemas/Exercise"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: That exercise is seeded, so a deploy owns it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/techniques:
    get:
      summary: List the techniques the console can edit
      operationId: listAuthoredTechniques
      description: >
        Every technique with `source: "admin"` — what the console owns and can
        edit — and deliberately not the whole catalog. `PATCH` refuses a seeded
        row, because the seed JSON owns those and an edit would be reverted by
        the next deploy, so listing all of them would offer hundreds of rows of
        which a handful are actionable.


        This exists because the public `GET /techniques` cannot answer the
        question: its `Summary` carries no `source`, and adding one would put
        the string "seed" on every entry of every client's catalog to serve one
        admin screen.


        Unbounded. This set grows by hand, one technique at a time, and a
        console that silently truncated its own content would be worse than a
        slow one.
      responses:
        "200":
          description: >
            The authored techniques, ordered by id. `[]` when nothing has been
            authored yet — an empty array, never null.
          content:
            application/json:
              schema:
                type: object
                required: [techniques]
                properties:
                  techniques:
                    type: array
                    items:
                      $ref: "#/components/schemas/Technique"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create a technique from the admin console
      operationId: createTechnique
      description: >
        Authoring the catalog without a deploy. The row is written with
        `source: "admin"`, which the seeder cannot touch — so a release never
        reverts it. An export command carries admin-authored content back into
        the seed JSON, which is how it reaches another environment.


        The **id is derived from the name** and is not accepted from the client:
        it becomes a foreign key in athletes' training records, so it outlives
        every other field and can never be changed. "São Paulo Pass" becomes
        `sao-paulo-pass`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechniqueWrite"
      responses:
        "200":
          description: The stored technique, including its generated id.
          content:
            application/json:
              schema:
                type: object
                required: [technique]
                properties:
                  technique:
                    $ref: "#/components/schemas/Technique"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            The derived id is taken. Deliberately not an upsert — the id may
            already be referenced by somebody's training record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/techniques/positions:
    get:
      summary: The position vocabulary a technique may claim
      operationId: listTechniquePositions
      description: >
        Derived from the catalog rather than a constant, so the editor's picker
        and the validator cannot disagree. A position no client recognises is
        the worst data this table can hold: it writes, it renders, and it
        returns an empty list forever with nothing reporting a fault.
      responses:
        "200":
          description: Every distinct position currently in use.
          content:
            application/json:
              schema:
                type: object
                required: [positions]
                properties:
                  positions:
                    type: array
                    items: { type: string }
                    example: [Guard - Bottom, Half Guard - Top, Other]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/techniques/{techniqueID}:
    patch:
      summary: Edit an admin-authored technique
      operationId: updateTechnique
      description: >
        Only `source: "admin"` rows. A seeded technique belongs to the deploy —
        editing it here would be reverted by the next release's re-seed, so it
        is refused with a 409 explaining that `techniques.json` is the way to
        change it. The id comes from the path and is never moved.
      parameters:
        - name: techniqueID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechniqueWrite"
      responses:
        "200":
          description: The updated technique.
          content:
            application/json:
              schema:
                type: object
                required: [technique]
                properties:
                  technique:
                    $ref: "#/components/schemas/Technique"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The technique is seeded, so a deploy owns it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users:
    get:
      summary: List every user the API knows about (admin-only)
      description: >
        Users are enumerated from every table that records a user id —
        profiles, sessions and activities — not from `profiles` alone.
        Someone who signed up and trained but never finished onboarding has
        no profile row and would otherwise be invisible to support. Capped at
        500, most-recently-trained first.
      operationId: adminListUsers
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Known users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{userID}:
    get:
      summary: One user's admin view — summary plus recent sessions (admin-only)
      operationId: adminGetUser
      description: >
        Replaces the activities-only user detail. Returns 404 for an id that
        appears in no table, so a mistyped id reads as wrong rather than as an
        empty account.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: That user's summary and recent sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{userID}/activities:
    get:
      summary: List a specific user's activities (admin-only, legacy)
      operationId: adminListUserActivities
      description: >
        No longer what the admin console renders — see GET /admin/users/{userID}.
        Retained as the only read path for `activities` rows written before the
        in-app logging form was removed; nothing writes that table now. Newest
        first, capped at 500, with no pagination.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: That user's activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{userID}/bjj/standing:
    get:
      summary: A specific user's BJJ rank and promotion history (admin-only)
      operationId: adminGetBjjStanding
      description: >
        Same derivation as GET /bjj/standing, over the path user rather than
        the caller. Read-only — the admin console shows rank beside the
        athlete, it does not edit it. An id that matches no promotions answers
        200 with `current: null`, the same as a real account that has never
        recorded one; this endpoint does not distinguish "no such user" from
        "no rank yet".
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: That user's rank and history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BjjStanding"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
