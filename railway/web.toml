# Railway service config for `web`. Root directory should be the repo root
# (this is a pnpm workspace; `web` can't build standalone without the root
# lockfile), with Railway auto-detecting Node via Nixpacks.
[build]
builder = "NIXPACKS"
# Nixpacks force-installs `corepack@0.24.1`, which predates pnpm 10/11's
# bundle format and cannot load it: the build dies on
# ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING from inside corepack.cjs, naming
# neither corepack nor pnpm. Reproduced in isolation — Node 22 with corepack
# 0.24.1 fails, Node 22 with its *own* bundled corepack succeeds.
#
# Nixpacks' install phase is not settable here, so the service needs:
#
#     NIXPACKS_INSTALL_CMD="npm install -g pnpm@11.17.0 && npx --yes pnpm@11.17.0 install --frozen-lockfile"
#
# which skips corepack and installs the exact version `packageManager` pins.
#
# The Node version is a separate axis and is handled by the root
# package.json's `engines` field — without it Nixpacks picks Node 18, and pnpm 11.17 requires >=22.13. That
# was the first suspect here and was NOT the cause: the same failure occurs
# on Node 22. Both pins are needed, for different reasons.
#
# F31/#804: every pnpm invocation below is `npx --yes pnpm@11.17.0 ...`, not a
# bare `pnpm ...` — Nixpacks' own auto-detected build plan ALSO provisions its
# own pnpm via Nix (`pnpm-9_x`, visible in every build log's "setup" summary),
# and a bare `pnpm` resolves to whichever of the two wins on PATH. Confirmed
# live: it's the nix-provisioned 9.x, not the 11.17.0 this file explicitly
# installs — invisible until `pnpm-lock.yaml` gained its first
# `packageExtensionsChecksum` (F30/#791), which 9.x and 11.x compute
# differently, at which point every bare `pnpm install --frozen-lockfile`
# here started failing with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. `npx --yes
# pnpm@<version>` resolves and runs that exact version directly, bypassing
# PATH entirely, so it can't be shadowed regardless of what Nixpacks'
# autodetection provisions alongside it.
buildCommand = "npx --yes pnpm@11.17.0 install --frozen-lockfile && npx --yes pnpm@11.17.0 run build:web"

[deploy]
startCommand = "pnpm --filter web start"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
