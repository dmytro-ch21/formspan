openapi: 3.0.3
info:
  title: VOLA Public API
  version: "1.0.0"
  description: >
    Public API for the VOLA mobile and web clients. See
    docs/architecture/api-conventions.md for the conventions this spec
    follows (versioning, error shape, auth, status codes).
servers:
  - url: http://localhost:8080/v1
    description: Local development

security:
  - ClerkBearerAuth: []

components:
  securitySchemes:
    ClerkBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk-issued session token, verified server-side via Clerk's JWKS.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_input
                - unauthorized
                - forbidden
                - not_found
                - already_exists
                - internal
            message:
              type: string

    Healthz:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: api

    Me:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          example: user_3H8rAWz7wri5uEKGajnj4pLqWXz

    Sex:
      type: string
      nullable: true
      enum: [male, female]

    Profile:
      type: object
      required:
        - user_id
        - display_name
        - date_of_birth
        - sex
        - bjj_enabled
        - strength_enabled
        - nutrition_enabled
        - running_enabled
        - created_at
        - updated_at
      properties:
        user_id:
          type: string
        display_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex:
          $ref: "#/components/schemas/Sex"
        bjj_enabled:
          type: boolean
        strength_enabled:
          type: boolean
        nutrition_enabled:
          type: boolean
        running_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProfileCreate:
      type: object
      properties:
        display_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex:
          $ref: "#/components/schemas/Sex"

    ProfileUpdate:
      type: object
      description: Partial update — omitted fields are left unchanged.
      properties:
        display_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex:
          $ref: "#/components/schemas/Sex"
        bjj_enabled:
          type: boolean
        strength_enabled:
          type: boolean
        nutrition_enabled:
          type: boolean
        running_enabled:
          type: boolean

    Flag:
      type: object
      description: >
        A server-controlled, global on/off switch — distinct from
        profile's per-user module toggles. Read-only for now; toggled
        via direct SQL until there's a write endpoint.
      required: [key, enabled, description, updated_at]
      properties:
        key:
          type: string
          example: new_recommendation_engine
        enabled:
          type: boolean
        description:
          type: string
        updated_at:
          type: string
          format: date-time

    FlagList:
      type: object
      required: [flags]
      properties:
        flags:
          type: array
          items:
            $ref: "#/components/schemas/Flag"

    Activity:
      type: object
      description: >
        One entry in the unified activity envelope — id is client-generated
        (offline logging + idempotent sync), request_id/trace_id are
        stamped server-side from the request that created it, for
        correlating against the backend's structured logs.
      required:
        - id
        - user_id
        - kind
        - occurred_at
        - notes
        - request_id
        - trace_id
        - created_at
      properties:
        id:
          type: string
          example: a1b2c3d4e5f6a7b8
        user_id:
          type: string
        kind:
          type: string
          example: bjj_session
        occurred_at:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
          description: Freeform, kind-specific fields.
        request_id:
          type: string
        trace_id:
          type: string
        created_at:
          type: string
          format: date-time

    ActivityCreate:
      type: object
      required: [id, kind, occurred_at]
      properties:
        id:
          type: string
          description: Client-generated — the idempotency key for offline sync retries.
        kind:
          type: string
          example: bjj_session
        occurred_at:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        details:
          type: object
          nullable: true

    ActivityList:
      type: object
      required: [activities]
      properties:
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"

    AdminUserSummary:
      type: object
      required: [user_id, display_name, activity_count, last_activity_at]
      properties:
        user_id:
          type: string
        display_name:
          type: string
          nullable: true
        activity_count:
          type: integer
        last_activity_at:
          type: string
          format: date-time
          nullable: true

    AdminUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserSummary"

  responses:
    BadRequest:
      description: Malformed request body or a value that failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, malformed, or expired bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but the caller isn't an admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource doesn't exist for this caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The resource already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /healthz:
    get:
      summary: Liveness check
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"

  /me:
    get:
      summary: Return the authenticated caller's verified identity
      operationId: getMe
      responses:
        "200":
          description: The verified caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /profile:
    get:
      summary: Get the authenticated caller's profile
      operationId: getProfile
      responses:
        "200":
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Create the authenticated caller's profile (onboarding)
      operationId: createProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileCreate"
      responses:
        "201":
          description: The newly created profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    patch:
      summary: Partially update the authenticated caller's profile
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /flags:
    get:
      summary: List all server-controlled feature flags
      operationId: listFeatureFlags
      responses:
        "200":
          description: All feature flags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /activities:
    get:
      summary: List the authenticated caller's own activities
      operationId: listActivities
      responses:
        "200":
          description: The caller's activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: >
        Create an activity for the authenticated caller. Idempotent on
        `id` — retrying a sync with the same id returns the original row,
        not an error.
      operationId: createActivity
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityCreate"
      responses:
        "200":
          description: The created (or, on a retried id, the original) activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/users:
    get:
      summary: List every user who has completed onboarding (admin-only)
      operationId: adminListUsers
      responses:
        "200":
          description: Known users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{userID}/activities:
    get:
      summary: List a specific user's activities (admin-only)
      operationId: adminListUserActivities
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: That user's activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
