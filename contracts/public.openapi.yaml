openapi: 3.0.3
info:
  title: VOLA Public API
  version: "1.0.0"
  description: >
    Public API for the VOLA mobile and web clients. See
    docs/architecture/api-conventions.md for the conventions this spec
    follows (versioning, error shape, auth, status codes).
servers:
  - url: http://localhost:8080/v1
    description: Local development

security:
  - ClerkBearerAuth: []

components:
  securitySchemes:
    ClerkBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk-issued session token, verified server-side via Clerk's JWKS.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_input
                - unauthorized
                - forbidden
                - not_found
                - already_exists
                - internal
            message:
              type: string

    Healthz:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: api

    Me:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          example: user_3H8rAWz7wri5uEKGajnj4pLqWXz

    Sex:
      type: string
      nullable: true
      enum: [male, female]

    Profile:
      type: object
      required:
        - user_id
        - display_name
        - date_of_birth
        - sex
        - bjj_enabled
        - strength_enabled
        - nutrition_enabled
        - running_enabled
        - unit_system
        - track_effort
        - created_at
        - updated_at
      properties:
        user_id:
          type: string
        display_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex:
          $ref: "#/components/schemas/Sex"
        bjj_enabled:
          type: boolean
        strength_enabled:
          type: boolean
        nutrition_enabled:
          type: boolean
        running_enabled:
          type: boolean
        unit_system:
          type: string
          enum: [metric, imperial]
          description: >
            Display units only. Training data is stored in kilograms and
            metres regardless, so changing this can never alter a recorded
            number — only how it's shown and entered. Storing converted
            values would make every historical row ambiguous, and would break
            the progression rule, which compares weights across sessions.
        track_effort:
          type: boolean
          description: >
            Whether the clients collect RIR and RPE. On by default — the
            progression rule is built on them, and silently withholding its
            only input would make the app look broken rather than simple.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProfileCreate:
      type: object
      properties:
        display_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex:
          $ref: "#/components/schemas/Sex"

    ProfileUpdate:
      type: object
      description: Partial update — omitted fields are left unchanged.
      properties:
        display_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex:
          $ref: "#/components/schemas/Sex"
        bjj_enabled:
          type: boolean
        strength_enabled:
          type: boolean
        nutrition_enabled:
          type: boolean
        running_enabled:
          type: boolean
        unit_system:
          type: string
          enum: [metric, imperial]
          description: >
            Display units only. Training data is stored in kilograms and
            metres regardless, so changing this can never alter a recorded
            number — only how it's shown and entered. Storing converted
            values would make every historical row ambiguous, and would break
            the progression rule, which compares weights across sessions.
        track_effort:
          type: boolean
          description: >
            Whether the clients collect RIR and RPE. On by default — the
            progression rule is built on them, and silently withholding its
            only input would make the app look broken rather than simple.

    Flag:
      type: object
      description: >
        A server-controlled, global on/off switch — distinct from
        profile's per-user module toggles. Read-only for now; toggled
        via direct SQL until there's a write endpoint.
      required: [key, enabled, description, updated_at]
      properties:
        key:
          type: string
          example: new_recommendation_engine
        enabled:
          type: boolean
        description:
          type: string
        updated_at:
          type: string
          format: date-time

    FlagList:
      type: object
      required: [flags]
      properties:
        flags:
          type: array
          items:
            $ref: "#/components/schemas/Flag"

    Technique:
      type: object
      description: >
        One entry in the BJJ technique library. Deliberately not an Exercise:
        a technique isn't measured (you never log "3 sets of armbar"), and it
        lives in a graph — it comes from a position and is answered by
        counters. Reference content, identical for every user.
      required:
        [id, name, aliases, category, position, position_detail, gi_no_gi,
         typical_belt, description, setup_from, common_counters,
         created_at, updated_at]
      properties:
        id: { type: string, example: armbar-from-closed-guard }
        name: { type: string }
        aliases:
          type: array
          items: { type: string }
        category:
          type: string
          description: Submission, Sweep, Pass, Escape, Takedown, Control/Pin, Transition, Guard Retention, Other.
          example: Submission
        position:
          type: string
          description: Where it happens.
          example: Guard - Bottom
        position_detail: { type: string }
        gi_no_gi:
          type: string
          enum: [Both, "Gi Only", "No-Gi Only"]
        typical_belt: { type: string, example: White }
        description: { type: string }
        setup_from:
          type: array
          description: Graph edge — positions or techniques this is set up from.
          items: { type: string }
        common_counters:
          type: array
          description: Graph edge — what answers this technique.
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TechniqueList:
      type: object
      required: [techniques]
      properties:
        techniques:
          type: array
          items: { $ref: "#/components/schemas/Technique" }

    WorkoutItem:
      type: object
      description: >
        One entry in a workout's ordered contents. Every target is optional
        because which ones apply is decided by the exercise's own load_type —
        a plank has no reps, a run has no weight. `position` is assigned from
        array order on write, never trusted from the client.
      required: [exercise_id, position, notes]
      properties:
        exercise_id: { type: string, example: barbell-bench-press }
        position: { type: integer }
        target_sets: { type: integer, nullable: true }
        target_reps: { type: integer, nullable: true }
        target_weight_kg: { type: number, nullable: true }
        target_seconds: { type: integer, nullable: true }
        target_distance_m: { type: integer, nullable: true }
        notes: { type: string }

    Workout:
      type: object
      description: >
        A workout *template* — deliberately distinct from a logged session
        (see Activity). Keeping them separate is what preserves the gap
        between planned and actual, which is the adherence signal.
        One discipline per workout; mixing is not supported.
      required:
        [id, owner_user_id, name, sport, goal, notes, visibility, items,
         created_at, updated_at]
      properties:
        id:
          type: string
          description: Client-generated, so a workout can be created offline and synced idempotently.
        owner_user_id:
          type: string
          nullable: true
          description: Null for a VOLA-authored official template.
        name: { type: string, example: Push Day A }
        sport:
          type: string
          enum: [strength, running, bjj]
        goal:
          type: string
          nullable: true
          enum: [general, powerlifting, hypertrophy, endurance]
          description: >
            The training style, which is *not* a sport — powerlifting,
            hypertrophy and endurance are all done with the same barbell
            squat, so this belongs to the workout, not the exercise. Only
            meaningful for strength.
        notes: { type: string }
        visibility:
          type: string
          enum: [private, public]
          description: Defaults to private — sharing is always a deliberate act.
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkoutItem" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkoutList:
      type: object
      required: [workouts]
      properties:
        workouts:
          type: array
          items: { $ref: "#/components/schemas/Workout" }

    LoggedSet:
      type: object
      description: >
        One set actually performed. Every measure is optional because which
        ones apply is decided by the exercise's own load_type — a plank has
        no reps, a run has no weight.

        `rir` and `rpe` are two views of the same quantity (RPE 8 is roughly
        2 RIR). Both are stored because lifters are fluent in one or the
        other and rarely both, and asking for a conversion just after a hard
        set is the wrong moment for arithmetic.
      required: [exercise_id, position, set_type, notes]
      properties:
        exercise_id: { type: string, example: barbell-back-squat }
        position:
          type: integer
          description: Assigned from array order on write, never trusted from the client.
        set_type:
          type: string
          enum: [warmup, working, backoff, drop, amrap, failure]
          description: >
            Warm-ups count toward neither working sets nor tonnage — counting
            them would make a light day look like a hard one.
        reps: { type: integer, nullable: true }
        weight_kg: { type: number, nullable: true }
        seconds: { type: integer, nullable: true }
        distance_m: { type: integer, nullable: true }
        rir:
          type: integer
          nullable: true
          minimum: 0
          maximum: 20
          description: Reps in reserve. 0 is meaningful — nothing left in the tank.
        rpe:
          type: number
          nullable: true
          minimum: 1
          maximum: 10
          description: Rate of perceived exertion, half steps allowed.
        notes: { type: string }
        completed:
          type: boolean
          description: >
            Whether this set was actually performed. The volume summary
            counts only completed sets, so a session's numbers climb as it
            is performed rather than starting at the plan's total. A set
            built from a template starts false.

            Defaults to `false` when omitted on write — a set the client
            didn't explicitly mark done is treated as planned, not
            performed.

    Session:
      type: object
      description: >
        A training session that actually happened, and the sets in it —
        deliberately distinct from a Workout, which is the *plan*. Keeping
        them apart is what preserves the gap between prescribed and actual.
        A session may follow a template or be entirely freeform.
      required:
        [id, user_id, workout_id, sport, name, started_at, ended_at, notes,
         sets, created_at, updated_at]
      properties:
        id:
          type: string
          description: Client-generated, so a session survives an offline start and syncs idempotently.
        user_id: { type: string }
        workout_id:
          type: string
          nullable: true
          description: >
            The template followed, if any. Null for a freeform session, and
            also null once a followed template is deleted — history outlives
            the plan it came from.
        sport: { type: string, enum: [strength, running, bjj] }
        name: { type: string, example: Push Day A }
        started_at:
          type: string
          format: date-time
          description: Client-supplied — logging can happen well after the fact.
        ended_at:
          type: string
          format: date-time
          nullable: true
          description: Null while the session is still in progress.
        notes: { type: string }
        sets:
          type: array
          items: { $ref: "#/components/schemas/LoggedSet" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Suggestion:
      type: object
      description: >
        What to load today for one exercise, derived from what the caller
        actually did last time.

        Deterministic and explainable by construction — no model, no hidden
        weighting. The rule is effort-driven, which is why RIR and RPE are
        collected at all: weight alone can't say whether a set was easy, since
        a lifter who grinds out five reps and one who leaves three in reserve
        log the identical row. When no effort was recorded the honest answer
        is "repeat it", not a guess.

        The evidence (`last_*`) travels with every suggestion, including when
        the answer is to repeat — a number the athlete can check beats one
        they have to trust.

        Branch on `code`; `reason` is prose and is not part of the contract.
      required: [exercise_id, last_performed_at, last_reps, last_weight_kg,
                 last_rir, last_rpe, suggested_weight_kg, code, reason,
                 estimated_1rm_kg, best_1rm_kg]
      properties:
        exercise_id: { type: string, example: back-squat }
        last_performed_at:
          type: string
          format: date-time
          nullable: true
          description: When the most recent session containing it started.
        last_reps: { type: integer, nullable: true }
        last_weight_kg: { type: number, nullable: true }
        last_rir: { type: integer, nullable: true }
        last_rpe: { type: number, nullable: true }
        estimated_1rm_kg:
          type: number
          nullable: true
          description: >
            One-rep max implied by the last working set, **with effort folded
            in** — a set of 5 with 3 RIR is evidence of an 8-rep max, not a
            5-rep one, and ignoring that would read stopping short as a
            strength loss. Brzycki (`w × 36/(37−r)`), which returns the weight
            itself at one rep rather than inflating a true single.


            Null when the set can't support an estimate: no weight recorded,
            or more than 12 effective reps, past which every rep-max curve is
            fiction.
        best_1rm_kg:
          type: number
          nullable: true
          description: >
            The highest estimate anywhere in the caller's history for this
            exercise, so the current one reads as progress rather than as a
            bare number. Not simply the heaviest set — 5×100 estimates above a
            110 single.
        suggested_weight_kg:
          type: number
          nullable: true
          description: >
            What to load. Equal to `last_weight_kg` whenever the answer is to
            repeat; null when there's nothing to say (no history, or not
            measured in weight).
        code:
          type: string
          enum: [no_history, not_applicable, increase, repeat_hard,
                 repeat_unknown_effort, repeat_stale, repeat_consolidate]
          description: >
            `increase` — 2+ reps in reserve (or RPE ≤ 8), so add the
            movement's increment: 5 kg for squat/hinge/olympic, 2.5 kg for
            push/pull/lunge, 1.25 kg for isolation and everything else.
            Scaled to muscle mass, because "add 2.5 kg" is trivial on a squat
            and a fortnight of progress on a lateral raise.

            `repeat_hard` — RIR 0 or RPE ≥ 9.5. `repeat_consolidate` — RIR 1,
            or RPE between 8 and 9.5: real work, but not room.
            `repeat_unknown_effort` — no RIR or RPE recorded.
            `repeat_stale` — last performed over 28 days ago, which outranks
            effort: an old easy set is evidence about someone who has since
            detrained. `not_applicable` — not measured in weight.
        reason:
          type: string
          description: Human-readable, cites the evidence. Never pattern-match on it.
          example: You had 3 reps left last time — add 5 kg.

    SuggestionList:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/Suggestion" }

    Volume:
      type: object
      description: >
        The derived working-volume summary, computed server-side so both
        clients report identical numbers rather than each rolling their own
        arithmetic. Warm-up sets are excluded.
      required: [working_sets, total_reps, tonnage_kg, hardest_rpe, exercise_ids]
      properties:
        working_sets: { type: integer }
        total_reps: { type: integer }
        tonnage_kg:
          type: number
          description: Sum of reps × weight over completed, non-warm-up sets.
        hardest_rpe:
          type: number
          description: >
            Highest RPE over the *completed working* sets; 0 when none
            carried one. A hard warm-up single shouldn't set the session's
            headline difficulty, and neither should a set that was planned
            but never performed.
        exercise_ids:
          type: array
          items: { type: string }

    SessionPage:
      type: object
      description: >
        One page of sessions plus the size of the whole matching set. `total`
        is counted with the identical predicate in the same request, so a
        "21-40 of 137" reading can never disagree with the rows beside it.
      required: [sessions, total, limit, offset]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/Session" }
        total:
          type: integer
          description: >
            Sessions matching the filter, ignoring limit/offset. Counted with
            the same predicate in the same request. Not the same snapshot —
            a session written between the count and the page can move it by
            one.
        limit: { type: integer }
        offset: { type: integer }

    HistoryTotals:
      type: object
      description: A period's training in one line.
      required:
        [sessions, working_sets, total_reps, tonnage_kg, duration_seconds,
         exercises, active_days]
      properties:
        sessions: { type: integer }
        working_sets: { type: integer }
        total_reps: { type: integer }
        tonnage_kg:
          type: number
          description: Sum of reps × weight over completed, non-warm-up sets.
        duration_seconds:
          type: integer
          description: Total logged duration. Sessions still in progress contribute 0.
        exercises:
          type: integer
          description: >
            Distinct exercises across the whole period — benching on Monday
            and Thursday is one. Cannot be derived by summing the days.
        active_days:
          type: integer
          description: >
            Days on which anything was logged, in the caller's `tz`. Two
            sessions in one day is one active day.

    HistoryDay:
      type: object
      description: One calendar day's training, in the caller's timezone.
      required:
        [date, sessions, working_sets, total_reps, tonnage_kg,
         duration_seconds, sports]
      properties:
        date: { type: string, format: date }
        sessions: { type: integer }
        working_sets: { type: integer }
        total_reps: { type: integer }
        tonnage_kg: { type: number }
        duration_seconds: { type: integer }
        sports:
          type: array
          items: { type: string, enum: [strength, running, bjj] }

    SportCount:
      type: object
      required: [sport, sessions]
      properties:
        sport: { type: string, enum: [strength, running, bjj] }
        sessions: { type: integer }

    History:
      type: object
      required: [from, to, totals, previous, days, sports]
      properties:
        from: { type: string, format: date }
        to:
          type: string
          format: date
          description: The last day included, echoing what was asked for.
        totals: { $ref: "#/components/schemas/HistoryTotals" }
        previous:
          allOf:
            - $ref: "#/components/schemas/HistoryTotals"
            - description: >
                The window of the same length immediately before this one, so
                a total can be read as up or down. Honours the sport filter.
        days:
          type: array
          description: >
            Only days that had training, ascending. Days with none are absent
            rather than zero-filled — the range already says they exist.
          items: { $ref: "#/components/schemas/HistoryDay" }
        sports:
          type: array
          description: Every sport in range, ignoring the sport filter, so the chips show what switching would find.
          items: { $ref: "#/components/schemas/SportCount" }

    SessionWithVolume:
      type: object
      required: [session, volume]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        volume: { $ref: "#/components/schemas/Volume" }

    Media:
      type: object
      description: >
        One asset belonging to a catalog entry. `storage_key` is the path
        within the bucket; `url` is assembled from it at read time using the
        API's MEDIA_BASE_URL, so the bucket and CDN hostname are never stored
        per row. `url` is empty when no media origin is configured (local dev
        and CI) — clients should treat an empty url as "no image available"
        rather than attempting to load it.
      required: [kind, storage_key, url, content_type, width, height, position, is_default]
      properties:
        kind:
          type: string
          enum: [thumbnail, demo, start, end, demo_video]
        storage_key:
          type: string
          example: exercises/barbell-back-squat/start.webp
        url:
          type: string
          example: https://media.vola.app/exercises/barbell-back-squat/start.webp
        content_type:
          type: string
          example: image/webp
        width:
          type: integer
          nullable: true
          description: Intrinsic width, so a client can reserve layout space before load.
        height:
          type: integer
          nullable: true
        position:
          type: integer
        is_default:
          type: boolean
          description: >
            True when this is a sport-level placeholder standing in for an
            exercise with no photo of its own. Exposed rather than hidden so
            clients can present it differently and so catalog media coverage
            stays measurable — a placeholder indistinguishable from real
            content makes the gap invisible and therefore permanent.

    Exercise:
      type: object
      description: >
        One entry in the global exercise catalog. Operator-authored
        reference content shared by every user — there is no owner, so
        nothing here is user-scoped. Seeded from version-controlled JSON
        rather than written through the API.
      required:
        [id, name, sport, movement_pattern, primary_muscles,
         secondary_muscles, equipment, load_type, is_unilateral,
         instructions, media, movement_pattern_detail, created_at, updated_at]
      properties:
        id:
          type: string
          description: Stable slug, safe to store as a reference.
          example: barbell-back-squat
        name:
          type: string
          example: Barbell Back Squat
        sport:
          type: string
          example: strength
        movement_pattern:
          type: string
          description: >
            What the movement is structurally. This is the level the
            cross-sport rules reason at — "heavy hinge and squat work
            yesterday" is what makes hard sparring today worth flagging.
            Muscle lists alone are too granular to write rules against.
          example: squat
        movement_pattern_detail:
          type: string
          description: >
            The source catalog's own, far more granular pattern (75 distinct
            values, e.g. "Scapular Elevation"). For display and filtering;
            rules read `movement_pattern`.
          example: Hip Adduction
        primary_muscles:
          type: array
          items: { type: string }
          example: [quadriceps, glutes]
        secondary_muscles:
          type: array
          items: { type: string }
        equipment:
          type: array
          items: { type: string }
          example: [barbell, squat_rack]
        load_type:
          type: string
          enum: [weight_reps, reps, time, distance, distance_time]
          description: >
            Which measurements a session of this exercise records, and
            therefore which inputs a client should render. Carried as data
            so logging stays one screen instead of a form per exercise
            type, and so adding an exercise never needs an app release.
        is_unilateral:
          type: boolean
          description: >
            Affects volume maths — 8 reps per side is not 8 reps.
        instructions:
          type: string
        media:
          type: array
          description: >
            Ordered semantically (thumbnail, demo, start, end, demo_video) rather
            than alphabetically, so a start/end pair reads in movement order.
            Always an array, never null. An exercise with no media of its own
            gets its sport's placeholder, flagged `is_default`.
          items:
            $ref: "#/components/schemas/Media"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ExerciseList:
      type: object
      required: [exercises]
      properties:
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"

    Activity:
      type: object
      description: >
        One entry in the unified activity envelope — id is client-generated
        (offline logging + idempotent sync), request_id/trace_id are
        stamped server-side from the request that created it, for
        correlating against the backend's structured logs.
      required:
        - id
        - user_id
        - kind
        - occurred_at
        - notes
        - request_id
        - trace_id
        - created_at
      properties:
        id:
          type: string
          example: a1b2c3d4e5f6a7b8
        user_id:
          type: string
        kind:
          type: string
          example: bjj_session
        occurred_at:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
          description: Freeform, kind-specific fields.
        request_id:
          type: string
        trace_id:
          type: string
        created_at:
          type: string
          format: date-time

    ActivityCreate:
      type: object
      required: [id, kind, occurred_at]
      properties:
        id:
          type: string
          description: Client-generated — the idempotency key for offline sync retries.
        kind:
          type: string
          example: bjj_session
        occurred_at:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        details:
          type: object
          nullable: true

    ActivityList:
      type: object
      required: [activities]
      properties:
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"

    AdminUserSummary:
      type: object
      required: [user_id, display_name, activity_count, last_activity_at]
      properties:
        user_id:
          type: string
        display_name:
          type: string
          nullable: true
        activity_count:
          type: integer
        last_activity_at:
          type: string
          format: date-time
          nullable: true

    AdminUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserSummary"

  responses:
    BadRequest:
      description: Malformed request body or a value that failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, malformed, or expired bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but the caller isn't an admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource doesn't exist for this caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The resource already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /healthz:
    get:
      summary: Liveness check
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"

  /me:
    get:
      summary: Return the authenticated caller's verified identity
      operationId: getMe
      responses:
        "200":
          description: The verified caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /profile:
    get:
      summary: Get the authenticated caller's profile
      operationId: getProfile
      responses:
        "200":
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Create the authenticated caller's profile (onboarding)
      operationId: createProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileCreate"
      responses:
        "201":
          description: The newly created profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    patch:
      summary: Partially update the authenticated caller's profile
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /profile/exercise-units:
    get:
      summary: The caller's per-exercise unit overrides
      operationId: listExerciseUnits
      description: >
        A map of exercise id to unit system. A **missing key means "use the
        profile default"** — there is deliberately no third state, so
        clearing an override removes the key rather than storing a sentinel.

        Exists because a lifter who thinks in kilograms still faces a leg
        press marked in pounds, and converting in your head at the moment
        you're recording a number is exactly what this avoids.
      responses:
        "200":
          description: Overrides only; exercises using the default are absent.
          content:
            application/json:
              schema:
                type: object
                required: [exercise_units]
                properties:
                  exercise_units:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [metric, imperial]
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profile/exercise-units/{exerciseID}:
    put:
      summary: Set or clear one exercise's unit override
      operationId: setExerciseUnit
      parameters:
        - name: exerciseID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                unit_system:
                  type: string
                  nullable: true
                  enum: [metric, imperial]
                  description: Null clears the override, falling back to the profile default.
      responses:
        "204": { description: Stored, or cleared. }
        "400":
          description: An unknown exercise, or a unit outside metric/imperial.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /flags:
    get:
      summary: List all server-controlled feature flags
      operationId: listFeatureFlags
      responses:
        "200":
          description: All feature flags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /activities:
    get:
      summary: List the authenticated caller's own activities
      operationId: listActivities
      responses:
        "200":
          description: The caller's activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: >
        Create an activity for the authenticated caller. Idempotent on
        `id` — retrying a sync with the same id returns the original row,
        not an error.
      operationId: createActivity
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityCreate"
      responses:
        "200":
          description: The created (or, on a retried id, the original) activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exercises:
    get:
      summary: List the global exercise catalog
      operationId: listExercises
      parameters:
        - name: sport
          in: query
          required: false
          schema: { type: string }
          description: Exact-match filter, e.g. `strength` or `bjj`.
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match on the name.
      responses:
        "200":
          description: Matching catalog entries, ordered by sport then name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exercises/{exerciseID}:
    get:
      summary: Get one catalog entry by its slug
      operationId: getExercise
      parameters:
        - name: exerciseID
          in: path
          required: true
          schema: { type: string }
          example: barbell-back-squat
      responses:
        "200":
          description: The exercise.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /techniques:
    get:
      summary: List the BJJ technique library
      operationId: listTechniques
      parameters:
        - name: position
          in: query
          schema: { type: string }
          example: Guard - Bottom
        - name: category
          in: query
          schema: { type: string }
          example: Submission
        - name: gi
          in: query
          schema: { type: string, enum: [Both, "Gi Only", "No-Gi Only"] }
          description: >
            Asking for gi or no-gi also returns techniques marked `Both` —
            a filter that excluded them would hide most of the library.
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
          description: Case-insensitive substring of the name.
      responses:
        "200":
          description: Matching techniques, ordered by position then category then name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechniqueList" }
        "400":
          description: Invalid filter value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /techniques/{techniqueID}:
    get:
      summary: Get one technique
      operationId: getTechnique
      parameters:
        - name: techniqueID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The technique.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Technique" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workouts:
    get:
      summary: List workouts visible to the caller
      operationId: listWorkouts
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [mine, shared] }
          description: Omit for both. `shared` excludes the caller's own.
        - name: sport
          in: query
          schema: { type: string, enum: [strength, running, bjj] }
        - name: goal
          in: query
          schema: { type: string, enum: [general, powerlifting, hypertrophy, endurance] }
      responses:
        "200":
          description: Workouts the caller owns and/or public ones, each with items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a workout
      operationId: createWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, sport]
              properties:
                id: { type: string }
                name: { type: string }
                sport: { type: string, enum: [strength, running, bjj] }
                goal: { type: string, enum: [general, powerlifting, hypertrophy, endurance] }
                notes: { type: string }
                visibility: { type: string, enum: [private, public] }
                items:
                  type: array
                  items: { $ref: "#/components/schemas/WorkoutItem" }
      responses:
        "200":
          description: >
            The created workout. Idempotent on `id` for the same owner — a
            retry returns the original rather than erroring.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400":
          description: >
            Invalid input — including an item whose exercise belongs to a
            different sport than the workout, since mixing is not supported.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The id already belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /workouts/{workoutID}:
    get:
      summary: Get one workout
      operationId: getWorkout
      parameters:
        - name: workoutID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The workout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a workout (owner only)
      operationId: deleteWorkout
      parameters:
        - name: workoutID
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Visible to you, but not yours to change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workouts/{workoutID}/items:
    put:
      summary: Replace a workout's ordered contents (owner only)
      operationId: replaceWorkoutItems
      description: >
        Sends the whole list — the natural shape for both "add an exercise"
        and "reorder". Positions are reassigned from array order.
      parameters:
        - name: workoutID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/WorkoutItem" }
      responses:
        "200":
          description: The updated workout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400":
          description: Invalid input, including a sport mismatch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Visible to you, but not yours to change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions:
    get:
      summary: List the caller's sessions, newest first
      operationId: listSessions
      parameters:
        - name: sport
          in: query
          schema: { type: string, enum: [strength, running, bjj] }
        - name: exercise_id
          in: query
          schema: { type: string }
          description: Only sessions containing this exercise.
        - name: from
          in: query
          schema: { type: string, format: date }
          description: >
            Only sessions started on or after this calendar day, resolved in
            `tz`. Lets the history page list exactly the period its totals
            describe.
        - name: to
          in: query
          schema: { type: string, format: date }
          description: Inclusive of the day named — a session at 19:00 on `to` is returned.
        - name: tz
          in: query
          schema: { type: string, default: UTC }
          description: IANA name used to resolve `from`/`to` to instants. Defaults to UTC.
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
          description: >
            Free text matched case-insensitively anywhere in the session's
            name. LIKE wildcards in the term are escaped, so `50%` searches
            for those characters rather than matching everything.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: >
            Rows to skip. Ordering is a total order (`started_at DESC, id`), so
            paging is deterministic against an unchanging set. It is not stable
            across writes: a session added while you page shifts every later
            row down one, so a row can repeat. Use the date filters to pin a
            range if that matters.
      responses:
        "200":
          description: >
            One page of the caller's own sessions, each with its sets, plus how
            many the filter matched in total. Never anyone else's.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionPage" }
        "400":
          description: Invalid sport, limit, offset, date, timezone or search term.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Start (or record) a session
      operationId: createSession
      description: >
        Sets may be supplied up front — starting from a template pre-fills
        them with the prescribed numbers — or left empty and added later via
        the sets endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, sport]
              properties:
                id: { type: string }
                workout_id:
                  type: string
                  nullable: true
                  description: >
                    Must be a workout the caller can see (their own, public,
                    or a VOLA template) and of the same sport.
                sport: { type: string, enum: [strength, running, bjj] }
                name: { type: string }
                started_at:
                  type: string
                  format: date-time
                  description: Defaults to now when omitted.
                ended_at: { type: string, format: date-time, nullable: true }
                notes: { type: string }
                sets:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/LoggedSet" }
      responses:
        "200":
          description: >
            The created session and its volume summary. Idempotent on `id`
            for the same user — a retry returns the original rather than
            erroring, which is what makes an offline start safe to resend.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithVolume" }
        "400":
          description: >
            Invalid input — including a set whose exercise belongs to a
            different sport than the session, an out-of-range RIR/RPE, more
            than 500 sets, or a `workout_id` that doesn't exist or isn't
            visible to the caller. Those last two are deliberately the same
            error: workout IDs are client-generated and often guessable, so
            distinguishing them would let a caller enumerate other people's
            private templates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The id already belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sessions/history:
    get:
      summary: Training history rolled up per day, with period totals
      operationId: getSessionHistory
      description: >
        The analytical surface behind the web history page: one entry per
        calendar day that had training, totals for the period, and the same
        totals for the window immediately before it so the numbers read as a
        direction rather than a quantity.


        Aggregated server-side on purpose. The working-set rule (completed,
        non-warm-up) lives in one place, and a client summing a truncated
        listing would quietly report the wrong total once history outgrows
        the page size.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          description: Inclusive of the day named. Range must be five years or less.
        - name: sport
          in: query
          schema: { type: string, enum: [strength, running, bjj] }
          description: >
            Narrows the totals *and* the comparison window, so BJJ is
            measured against BJJ. `sports` is always unfiltered.
        - name: tz
          in: query
          schema: { type: string, default: UTC }
          description: >
            IANA name deciding which calendar day a session belongs to.
            Training at 19:00 in New York is 23:00 UTC, so bucketing in UTC
            would file a Tuesday session under Wednesday.
      responses:
        "200":
          description: The caller's own training only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/History" }
        "400":
          description: Missing or malformed dates, unknown sport or timezone, or a range over five years.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /sessions/suggestions:
    get:
      summary: What to load today, per exercise, from the caller's own history
      operationId: listSessionSuggestions
      description: >
        One request for a whole workout rather than one per exercise. Each
        answer is computed from the **top working set of the most recent
        session** containing that exercise — warm-ups excluded, since
        progressing off a warm-up would recommend a weight nobody worked at.

        Scoped to the caller: this endpoint reads training history and returns
        only their own.
      parameters:
        - name: exercise_ids
          in: query
          required: true
          schema: { type: string }
          description: Comma-separated, max 100.
      responses:
        "200":
          description: >
            One entry per requested id, in the order requested. An exercise
            with no history still gets an entry, with `code: no_history`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuggestionList" }
        "400":
          description: Missing `exercise_ids`, or more than 100 of them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sessions/{sessionID}:
    get:
      summary: Get one session with its volume summary
      operationId: getSession
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The session and its derived volume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithVolume" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            No such session, or it belongs to someone else — deliberately
            indistinguishable, since sessions are never shared and a 403
            would confirm that an id exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Delete a session
      operationId: deleteSession
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{sessionID}/sets:
    put:
      summary: Replace a session's ordered sets
      operationId: replaceSessionSets
      description: >
        Sends the whole list — the natural shape for "log another set" and
        "fix a typo in set 2" alike. Positions are reassigned from array
        order. Clients write through on every edit rather than offering a
        save button, so a session survives the app being killed mid-workout.
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sets]
              properties:
                sets:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/LoggedSet" }
      responses:
        "200":
          description: The updated session and its recomputed volume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithVolume" }
        "400":
          description: Invalid input, including a sport mismatch or an out-of-range RIR/RPE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{sessionID}/finish:
    post:
      summary: Mark a session finished
      operationId: finishSession
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ended_at:
                  type: string
                  format: date-time
                  description: Defaults to now. An empty body is fine.
      responses:
        "200":
          description: The finished session and its final volume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionWithVolume" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users:
    get:
      summary: List every user who has completed onboarding (admin-only)
      operationId: adminListUsers
      responses:
        "200":
          description: Known users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{userID}/activities:
    get:
      summary: List a specific user's activities (admin-only)
      operationId: adminListUserActivities
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: That user's activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
