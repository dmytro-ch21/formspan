packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # pnpm blocks native/postinstall build scripts by default and requires an
  # explicit decision per package. Everything set to `false` below is a
  # postinstall we genuinely don't need at runtime:
  #   @clerk/shared, browser-tabs-lock — browser-oriented; unused under RN.
  #   bufferutil, utf-8-validate      — optional native speedups for `ws`.
  #   core-js                         — postinstall is just a funding notice.
  '@clerk/shared': false
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  utf-8-validate: false
  #   dtrace-provider, protobufjs — pulled in transitively by eas-cli (N582).
  #   dtrace-provider builds a native DTrace binding used only for bunyan
  #   logging on Solaris/macOS dtrace; protobufjs's postinstall only prints a
  #   funding/CLI notice. Neither is needed to run `eas build`/`eas submit`,
  #   and leaving them merely "ignored" makes every install print a warning
  #   that trains people to ignore install warnings.
  dtrace-provider: false
  protobufjs: false
  sharp: true
  unrs-resolver: true
overrides:
  # N582 (#1260). `eas-cli@24.8.0` pulls in `joi@17.11.0` transitively (via
  # @expo/eas-json), and that version carries two HIGH-severity advisories:
  #   GHSA-6h2x-m376-mqjq — quadratic backtracking in Joi.string().isoDate()
  #   GHSA-4528-x5fx-h6hg — quadratic-time split in string().email({multiple:true})
  # `.github/workflows/dependency-review.yml` has fail-on-severity: high, so
  # adding eas-cli turned that gate red. Found by pre-merge-checker; NO `verify`
  # link can see it, because dependency review is a CI-only workflow and
  # `check:verify-chain` only asserts that package.json gates are in `verify`.
  #
  # 17.13.8 is already resolved in this tree for another dependent, so this
  # pins the vulnerable copy up to a version already proven to install here
  # rather than introducing a new one.
  joi: ^17.13.8
packageExtensions:
  # react-native-maps' Expo config plugin requires() @expo/config-plugins at
  # prebuild time, but the package only declares it as a devDependency. Under
  # npm/yarn's flat node_modules this accidentally works via hoisting; under
  # pnpm's strict node_modules it doesn't, and every native iOS build fails
  # in the "[CP-User] Generate app.config" phase with "Cannot find module
  # '@expo/config-plugins/build/plugins/ios-plugins'". Promote it to a real
  # dependency of react-native-maps so pnpm actually exposes it. See F30.
  react-native-maps:
    dependencies:
      '@expo/config-plugins': '*'
